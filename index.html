gn Patterns","ar":"أنماط التصميم","ard":"حلول قابلة لإعادة الاستخدام لمشكلات شائعة في تصميم البرمجيات.","d":"Reusable solutions to common software design problems."},{"t":"Framework","ar":"الإطار","ard":"أساس برمجي جاهز يستخدمه المطورون لبناء التطبيقات وتنظيمها.","d":"A pre-built software foundation that developers use to build and structure applications."},{"t":"Repository","ar":"المستودع","ard":"مكان مركزي تُخزَّن فيه الشيفرة والمكتبات والتوثيق وتُدار.","d":"A central place where code, libraries, and documentation are stored and maintained."},{"t":"AI Debugging","ar":"تصحيح الأخطاء باستخدام الذكاء الاصطناعي","ard":"استخدام أدوات الذكاء الاصطناعي لتحديد الأخطاء البرمجية وإصلاحها تلقائيًا.","d":"The use of AI tools to identify and fix bugs automatically."},{"t":"Maintainable Code","ar":"الشيفرة القابلة للصيانة","ard":"شيفرة يسهل قراءتها وتحديثها وتوسيعها.","d":"Code that is easy to read, update, and extend."}],"A02":[{"t":"Mobile Phone","ar":"الهاتف المحمول","ard":"جهاز محمول يدعم الاتصال الصوتي ونقل البيانات عبر الشبكات الخلوية.","d":"A portable device that supports voice and data communication through cellular networks."},{"t":"Tablet Device","ar":"الجهاز اللوحي","ard":"جهاز محمول بشاشة لمس أكبر من الهاتف، يُستخدم لتصفح الويب ومشاهدة الوسائط وتشغيل التطبيقات.","d":"A portable touchscreen device larger than a phone, used for web browsing, media consumption, and mobile apps."},{"t":"Operating System (OS)","ar":"نظام التشغيل","ard":"البرنامج الأساسي الذي يدير العتاد ويتيح تشغيل تطبيقات الهاتف (مثل Android و iOS).","d":"The core software that manages hardware and allows mobile apps to run (e.g., Android, iOS)."},{"t":"Android Studio","ar":"أندرويد ستوديو","ard":"بيئة التطوير المتكاملة الرسمية لتطوير تطبيقات أندرويد، وتوفر أدوات مثل محرر الشيفرة والمحاكي وأدوات البناء.","d":"An official IDE for Android app development, offering tools like code editor, emulator, and build tools."},{"t":"Eclipse","ar":"إكليبس","ard":"بيئة تطوير متكاملة مبنية على جافا تُستخدم لتطوير تطبيقات أندرويد ومشاريع برمجية أخرى.","d":"A Java-based IDE used for Android and other software development projects."},{"t":"Xcode","ar":"إكس كود","ard":"بيئة التطوير المتكاملة الرسمية من Apple لتطوير التطبيقات لأنظمة iOS و macOS ومنصات Apple الأخرى.","d":"Apple’s official IDE for developing apps for iOS, macOS, and other Apple platforms."},{"t":"Development Environment","ar":"بيئة التطوير","ard":"مجموعة برمجيات تتيح للمطورين بناء التطبيقات واختبارها ونشرها.","d":"A software suite that allows developers to build, test, and deploy applications."},{"t":"Wi-Fi","ar":"واي فاي","ard":"تقنية شبكات لاسلكية تتيح للأجهزة الاتصال بالإنترنت أو ببعضها.","d":"A wireless networking technology that allows devices to connect to the internet or each other."},{"t":"Wi-Fi Standards","ar":"معايير الواي فاي","ard":"بروتوكولات محددة (مثل 802.11n و 802.11ac) تنظّم طريقة اتصال أجهزة الواي فاي لاسلكيًا.","d":"Defined protocols (like 802.11n, 802.11ac) governing how Wi-Fi devices communicate wirelessly."},{"t":"3G","ar":"الجيل الثالث","ard":"تقنية الاتصالات المتنقلة من الجيل الثالث، توفر معدلات أفضل لنقل البيانات واستخدام الإنترنت.","d":"Third-generation mobile communication technology enabling better data transfer rates and internet use."},{"t":"4G","ar":"الجيل الرابع","ard":"معيار الاتصال اللاسلكي من الجيل الرابع، يوفر سرعات إنترنت أعلى وأداءً أفضل من الجيل الثالث.","d":"Fourth-generation wireless standard offering faster internet speeds and improved performance over 3G."},{"t":"Mobile Connectivity","ar":"الاتصال المحمول","ard":"قدرة الأجهزة المحمولة على الوصول إلى خدمات الشبكة مثل 3G و 4G والواي فاي والبلوتوث.","d":"The ability of mobile devices to access network services like 3G, 4G, Wi-Fi, and Bluetooth."},{"t":"Screen Orientation","ar":"اتجاه الشاشة","ard":"وضع عرض شاشة الجهاز، إما رأسيًا أو أفقيًا.","d":"The alignment of a device’s display—either portrait or landscape mode."},{"t":"Resolution","ar":"الدقة","ard":"عدد البكسلات المعروضة على الشاشة، ويحدد وضوح الصورة وجودتها.","d":"The number of pixels displayed on the screen; determines clarity and quality."},{"t":"User Interface (UI)","ar":"واجهة المستخدم","ard":"المساحة التي يحدث فيها التفاعل بين المستخدم والجهاز الرقمي.","d":"The space where interactions between users and digital devices occur."},{"t":"Navigation Techniques","ar":"تقنيات التنقل","ard":"أساليب لتوجيه المستخدم داخل تطبيق الهاتف، مثل علامات التبويب أو القوائم الجانبية.","d":"Methods used to guide users through a mobile application, such as tabs or drawers."},{"t":"Input Techniques","ar":"تقنيات الإدخال","ard":"طرق تفاعل المستخدم مع تطبيقات الهاتف، مثل اللمس ولوحة المفاتيح والصوت.","d":"Ways in which users interact with mobile apps, e.g., touch, keyboard, voice."},{"t":"App Personalization","ar":"تخصيص التطبيق","ard":"إتاحة تخصيص إعدادات التطبيق للمستخدم، مثل حجم الخط أو السمات أو المخرجات.","d":"Allowing users to customize app settings such as font size, themes, or output."},{"t":"Binding","ar":"الربط","ard":"ربط عنصر في واجهة المستخدم بمصدر بيانات أو بمنطق معين.","d":"Connecting a user interface element to a data source or logic."},{"t":"Web Services","ar":"خدمات الويب","ard":"واجهات برمجة تتيح للتطبيقات التواصل مع خوادم بعيدة عبر الإنترنت.","d":"APIs that allow apps to communicate with remote servers over the internet."},{"t":"Social Media Integration","ar":"دمج وسائل التواصل الاجتماعي","ard":"تمكين التطبيقات من الاتصال بمنصات مثل فيسبوك أو تويتر أو إنستغرام.","d":"Enabling apps to connect with platforms like Facebook, Twitter, or Instagram."},{"t":"Deployment","ar":"النشر","ard":"عملية إطلاق التطبيق للمستخدمين أو نشره في متجر التطبيقات.","d":"The process of releasing an application to users or a public app store."},{"t":"Debugging","ar":"تصحيح الأخطاء","ard":"عملية العثور على المشكلات أو الأخطاء في شيفرة التطبيق وإصلاحها.","d":"The process of finding and fixing issues or errors in an application’s code."},{"t":"Emulator","ar":"المحاكي","ard":"جهاز افتراضي يحاكي عتاد الهاتف الحقيقي لاختبار التطبيقات.","d":"A virtual device that mimics real mobile hardware for testing applications."},{"t":"Mobile Platform","ar":"منصة الهاتف المحمول","ard":"بيئة التشغيل الخاصة بالأجهزة المحمولة (مثل Android و iOS).","d":"The operating environment for mobile devices (e.g., Android, iOS)."},{"t":"Virtual Machine","ar":"الآلة الافتراضية","ard":"محاكاة برمجية لجهاز تتيح تشغيل التطبيقات في بيئة معزولة.","d":"A software emulation of a device that allows apps to run in an isolated environment."},{"t":"App Store","ar":"متجر التطبيقات","ard":"سوق إلكتروني يمكن للمستخدمين منه تنزيل تطبيقات الهاتف وتثبيتها.","d":"An online marketplace where users can download and install mobile apps."}],"A03":[{"t":"JAR (Java ARchive)","ar":"ملف أرشيف جافا","ard":"صيغة ملف حزمة تجمع ملفات فئات جافا والبيانات الوصفية والموارد في ملف واحد للنشر.","d":"A package file format used to aggregate Java class files, metadata, and resources into one file for deployment."},{"t":"Java WebStart","ar":"تشغيل تطبيقات جافا عبر الويب","ard":"تقنية تتيح تشغيل تطبيقات جافا مباشرة من الإنترنت عبر المتصفح.","d":"A technology that allows launching Java applications directly from the internet using a browser."},{"t":"Launch Script","ar":"برنامج تشغيل نصي","ard":"نص برمجي (Batch أو Shell أو PowerShell) يُستخدم لأتمتة تشغيل التطبيقات.","d":"A script (batch, shell, or PowerShell) used to automate starting applications."},{"t":"ClickOnce","ar":"النشر بنقرة واحدة","ard":"تقنية نشر من مايكروسوفت تتيح للمستخدمين تثبيت تطبيقات Windows وتشغيلها بأقل جهد.","d":"A Microsoft deployment technology that allows users to install and run a Windows-based smart client application with minimal effort."},{"t":"MSI (Microsoft Installer)","ar":"مثبت مايكروسوفت","ard":"صيغة حزمة تثبيت في Windows لتثبيت البرامج وصيانتها وإزالتها.","d":"A Windows installer package format for installing, maintaining, and removing software."},{"t":"Xcopy Deployment","ar":"النسخ باستخدام Xcopy","ard":"طريقة نشر بسيطة تنسخ ملفات التطبيق مباشرة إلى المجلد الهدف باستخدام الأمر Xcopy.","d":"A simple deployment method that copies application files directly to the target folder using the Xcopy command."},{"t":"FTP (File Transfer Protocol)","ar":"بروتوكول نقل الملفات","ard":"بروتوكول قياسي لنقل الملفات بين العميل والخادم عبر الشبكة.","d":"A standard protocol for transferring files between client and server on a network."},{"t":"SFTP (Secure File Transfer Protocol)","ar":"بروتوكول نقل الملفات الآمن","ard":"نسخة مشفّرة من FTP تستخدم SSH لضمان نقل الملفات بأمان.","d":"An encrypted version of FTP that uses SSH to ensure secure transfer of files."},{"t":"Hosting","ar":"الاستضافة","ard":"عملية تشغيل التطبيق وتقديمه للمستخدمين على خادم أو في بيئة سحابية.","d":"The process of running and serving an application on a server or cloud environment for end users."},{"t":"Authentication","ar":"التحقق من الهوية","ard":"عملية التحقق من هوية المستخدم أو النظام (مثل اسم المستخدم وكلمة المرور أو البصمة).","d":"The process of verifying the identity of a user or system (e.g., username/password, biometrics)."},{"t":"Authorization","ar":"التفويض","ard":"عملية تحديد حقوق الوصول والصلاحيات الممنوحة للمستخدم بعد التحقق من هويته.","d":"The process of determining the access rights and permissions granted to an authenticated user."},{"t":"Exception Handling","ar":"معالجة الاستثناءات","ard":"أسلوب برمجي لإدارة أخطاء وقت التشغيل لضمان استقرار التطبيق وسلاسة عمله.","d":"The programming technique of managing runtime errors to ensure stability and smooth application execution."},{"t":"Rollback","ar":"التراجع","ard":"عملية تعيد النظام إلى حالته السابقة السليمة بعد فشل التثبيت أو التحديث.","d":"A process that restores a system to its previous working state after a failed installation or update."},{"t":"SDLC (Software Development Life Cycle)","ar":"دورة حياة تطوير البرمجيات","ard":"عملية منظمة لتطوير البرمجيات تشمل مراحل مثل التخطيط والتطوير والاختبار والنشر والصيانة.","d":"A structured process for developing software that includes phases such as planning, development, testing, deployment, and maintenance."},{"t":"Organizational Policies","ar":"السياسات المؤسسية","ard":"القواعد والإرشادات الداخلية التي تفرضها المؤسسة لضمان الأمان والامتثال والنشر السليم للبرمجيات.","d":"The internal rules and guidelines an organization enforces to ensure security, compliance, and proper software deployment."},{"t":"Standards","ar":"المعايير","ard":"قواعد أو مواصفات متفق عليها تضمن الجودة والتوافق والاتساق في النشر.","d":"Agreed-upon rules or specifications that ensure quality, interoperability, and consistency in deployment."},{"t":"CI/CD (Continuous Integration/Continuous Deployment)","ar":"التكامل المستمر / النشر المستمر","ard":"مجموعة ممارسات تؤتمت بناء البرمجيات واختبارها ونشرها.","d":"A set of practices that automate building, testing, and deploying software."},{"t":"PowerShell","ar":"باورشيل","ard":"إطار عمل من مايكروسوفت لأتمتة المهام وإدارة الإعدادات، يُستخدم غالبًا لأتمتة النشر.","d":"A task automation and configuration management framework from Microsoft, often used for deployment automation."},{"t":"Gradle","ar":"جرادل","ard":"أداة لأتمتة البناء تُستخدم على نطاق واسع في مشاريع جافا لترجمة التطبيقات واختبارها وتحزيمها.","d":"A build automation tool widely used in Java projects to compile, test, and package applications."},{"t":"APK (Android Package)","ar":"حزمة تطبيق أندرويد","ard":"صيغة الملف المستخدمة لتوزيع التطبيقات وتثبيتها على أجهزة أندرويد.","d":"The file format used for distributing and installing applications on Android devices."},{"t":"Policy-as-Code","ar":"السياسة كرمز","ard":"ممارسة كتابة السياسات المؤسسية على شكل شيفرة يقرؤها الحاسوب ويطبقها تلقائيًا.","d":"The practice of writing organizational policies as machine-readable code that can be automatically enforced in systems."},{"t":"RACI Matrix","ar":"مصفوفة RACI","ard":"مخطط لتوزيع المسؤوليات يحدد الأدوار في المشروع: المسؤول عن التنفيذ، والمساءَل، والمستشار، والمُبلَّغ.","d":"A responsibility assignment chart that defines roles as Responsible, Accountable, Consulted, and Informed in a project."}]};
const UNITS={"18":"Design user interfaces","19":"Analyze software requirements","20":"Identify, evaluate and apply current technologies","21":"Document applications","22":"Provide technical instruction","23":"Understand and apply programming methods","24":"Use software libraries and components","25":"Test and debug applications","26":"Develop databases","27":"Develop data-driven applications","28":"Manage software change requests","A01":"Develop applications","A02":"Develop mobile applications","A03":"Deploy an application to a production environment"};
const SPEC={"18":6,"19":5,"20":4,"21":4,"22":4,"23":4,"24":2,"25":4,"26":3,"27":8,"28":2,"A01":5,"A02":4,"A03":5};
const UL=Object.keys(UNITS);
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const KEY='itusd124-trainer-v1';
let S=load();
/* CBT countdown: the exam is in the first week of January; exact date not announced yet */
function cbtWeeks(){const now=new Date();let y=now.getMonth()===0&&now.getDate()<=7?now.getFullYear():now.getFullYear()+1;
  const jan1=new Date(y,0,1),start=new Date(y,0,1-jan1.getDay()+(jan1.getDay()>=4?7:0)); // Sunday that starts the first week of January
  const days=Math.ceil((start-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);return{days,weeks:Math.floor(days/7),y}}
function load(){let d={items:{},attempts:[],settings:{target:70}};try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);d={...d,...p,settings:{...d.settings,...(p.settings||{})}}}}catch(e){}return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const app=$('#app'),barExtra=$('#bar-extra');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const FIXED=/of the answers|of the above|^both$|^neither$|^none of|^all of|mentioned options/i;
function optOrder(q,keep){if(keep||q.o.some(t=>FIXED.test(t.trim())))return[0,1,2,3];return shuffle([0,1,2,3])}
function pool(u){return BANK.filter(q=>q.u===u&&true)}
function rec(id){return S.items[id]||(S.items[id]={n:0,c:0,box:0,last:null})}
function record(id,ok){const r=rec(id);r.n++;if(ok)r.c++;r.last=ok?1:0;if(!ok)r.box=1;else if(r.box>0){r.box++;if(r.box>2)r.box=0}r.t=Date.now()}
function unitStats(u){const qs=pool(u);let seen=0,ok=0;qs.forEach(q=>{const r=S.items[q.id];if(r&&r.n){seen++;if(r.last)ok++}});return{total:qs.length,seen,ok,acc:seen?ok/seen:null}}
const deck=()=>BANK.filter(q=>S.items[q.id]&&S.items[q.id].box>0&&true);
function pickUnit(u,n){const qs=shuffle(pool(u));const sc=q=>{const r=S.items[q.id];if(!r||!r.n)return 0;return r.last?2:1};const srt=qs.sort((a,b)=>sc(a)-sc(b));
  // aim for about half sample-paper items, as in the real paper's style
  const ex=srt.filter(q=>q.s==='sample'),k=Math.min(ex.length,Math.ceil(n/2)),pick=ex.slice(0,k);return pick.concat(srt.filter(q=>!pick.includes(q)).slice(0,n-k))}
function blueprint(scale){const out=[];UL.forEach(u=>{const n=scale===1?SPEC[u]:Math.max(1,Math.round(SPEC[u]*scale));out.push(...pickUnit(u,n))});return out}
function weightedMix(n){const w={};UL.forEach(u=>{const st=unitStats(u);w[u]=SPEC[u]*(1.25-(st.acc==null?0.5:st.acc))});const tot=Object.values(w).reduce((a,b)=>a+b,0);const res=[];
  Object.keys(w).forEach(u=>res.push(...pickUnit(u,Math.round(n*w[u]/tot))));
  if(res.length<n){const have=new Set(res.map(q=>q.id));res.push(...shuffle(BANK.filter(q=>!have.has(q.id))).slice(0,n-res.length))}
  return shuffle(res).slice(0,n)}

/* ---------- views ---------- */
let T=null,timerId=null;
function setBar(h){barExtra.innerHTML=h||''}
function home(){stopTimer();T=null;setBar('');window.scrollTo(0,0);
  const sum=UL.map(u=>({u,...unitStats(u)}));
  const readiness=(()=>{let w=0,s=0;sum.forEach(x=>{w+=SPEC[x.u];s+=SPEC[x.u]*(x.acc==null?0:x.acc)*Math.min(1,x.seen/Math.max(6,Math.min(x.total,15)))});return Math.round(100*s/w)})();
  const last=S.attempts.filter(a=>a.mode==='Full mock').slice(-1)[0];
  const dk=deck().length,nSample=BANK.filter(q=>q.s==='sample').length;
  app.innerHTML=`
  <section class="panel" style="display:grid;gap:14px">
    <div><p class="eyebrow">ITUSD-1-2-4 · Application Development pathway</p><h1>Diploma CBT Exam Trainer</h1>
    <p class="muted" style="margin-top:6px;max-width:70ch">The real test is <b>60 questions in 2 hours</b>, spread across 14 units as shown below. This trainer has ${BANK.length} questions, including all ${nSample} Mock Sample Questions.</p></div>
    <div class="kv">${(()=>{const c=cbtWeeks();if(c.days>200)return '';return `<div><span class="eyebrow">CBT exam</span><b>${c.weeks>=1?c.weeks+(c.weeks===1?' week':' weeks'):c.days>0?c.days+(c.days===1?' day':' days'):'This week'}</b><span class="hint">First week of Jan ${c.y}</span></div>`})()}<div><span class="eyebrow">Readiness</span><b>${readiness}%</b></div><div><span class="eyebrow">Last full mock</span><b>${last?last.pct+'%':'–'}</b></div><div><span class="eyebrow">Questions answered</span><b>${Object.values(S.items).filter(r=>r.n).length}/${BANK.length}</b></div><div><span class="eyebrow">Mistakes to fix</span><b>${dk}</b></div></div>
  </section>
  <section class="grid2">
    <button class="mode primary" data-go="full"><span class="t">Full mock exam <span>60 Q · 2:00:00</span></span><span class="muted">Same blueprint and time as the real CBT. Results only at the end.</span></button>
    <button class="mode" data-go="sample"><span class="t">Mock Sample Questions <span>${nSample} Q · 2:00:00</span></span><span class="muted">The Mock Sample Questions in their original order, under exam conditions.</span></button>
    <button class="mode" data-go="half"><span class="t">Half mock <span>${UL.reduce((a,u)=>a+Math.max(1,Math.round(SPEC[u]*.5)),0)} Q · 1:00:00</span></span><span class="muted">Same mix at half the size, for when you have an hour.</span></button>
    <button class="mode" data-go="quick"><span class="t">Quick practice <span>15 Q</span></span><span class="muted">Mixed units, weighted to your weakest areas. Answers as you go.</span></button>
    <button class="mode" data-go="gloss"><span class="t">Glossary <span>${Object.values(GLOSS).reduce((a,x)=>a+x.length,0)} terms</span></span><span class="muted">Key terms for every unit with English definitions and Arabic meanings. Searchable.</span></button>
    <button class="mode" data-go="deck" ${dk?'':'disabled style="opacity:.55;cursor:default"'}><span class="t">Fix my mistakes <span>${dk} Q</span></span><span class="muted">Questions you got wrong. Answer each correctly twice in a row to clear it.</span></button>
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Exam blueprint and your progress</h2><span class="hint">Read a unit's study notes, then practice it</span></div>
    <div class="tw"><table class="bp"><thead><tr><th>Unit</th><th class="n">Exam Qs</th><th class="n">Questions</th><th class="n">Seen</th><th class="mcol" style="min-width:120px">Accuracy</th><th></th></tr></thead><tbody>
    ${sum.map(x=>{const a=x.acc==null?null:Math.round(100*x.acc);return `<tr><td class="c-u"><b>${x.u}</b> <span class="muted">${esc(UNITS[x.u])}</span></td><td class="n c-e">${SPEC[x.u]} <span class="muted">(${(100*SPEC[x.u]/60).toFixed(1)}%)</span></td><td class="n c-q">${x.total}</td><td class="n c-s">${x.seen}</td><td class="c-a">${a==null?'<span class="muted">–</span>':`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="meter" style="flex:1"><i class="${a>=75?'g':a>=55?'w':'b'}" style="width:${a}%"></i></div><span class="kbd">${a}%</span></div>`}</td><td class="c-b" style="white-space:nowrap">${NOTES[x.u]?`<button class="btn" data-notes="${x.u}" style="padding:5px 12px">Notes</button> `:''}${GLOSS[x.u]?`<button class="btn" data-gl="${x.u}" style="padding:5px 12px">Terms</button> `:''}<button class="btn" data-unit="${x.u}" style="padding:5px 12px">Practice</button></td></tr>`}).join('')}
    </tbody></table></div>
  </section>
  ${S.attempts.length?`<section class="panel"><h2 style="margin-bottom:8px">Recent attempts</h2><div class="tw"><table><thead><tr><th>Date</th><th>Mode</th><th class="n">Score</th><th>Weakest unit</th></tr></thead><tbody>${S.attempts.slice(-8).reverse().map(a=>{const w=Object.entries(a.units||{}).filter(([u,v])=>v[1]>=2).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1])[0];return `<tr><td>${new Date(a.t).toLocaleDateString()}</td><td>${esc(a.mode)}</td><td class="n">${a.score}/${a.n} (${a.pct}%)</td><td>${w?`${w[0]} <span class="muted">${w[1][0]}/${w[1][1]}</span>`:'–'}</td></tr>`}).join('')}</tbody></table></div></section>`:''}
  <section class="panel" style="display:grid;gap:12px">
    <h2>Settings</h2>
    <label class="row">Target score <input type="number" id="st-target" min="40" max="100" step="5" value="${S.settings.target}" style="width:80px">%<span class="hint">The test specification does not state a pass mark. Set the target your center uses.</span></label>
    <div class="row"><button class="btn" id="exp">Copy progress code</button><button class="btn" id="imp">Load progress code</button><button class="btn" id="rst">Reset progress</button><span class="hint">Progress is saved in this browser only. Use a progress code to move it to another device.</span></div>
  </section>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;
    if(g==='full')startExam('Full mock',blueprint(1),120);
    if(g==='half')startExam('Half mock',blueprint(.5),60);
    if(g==='sample')startExam('Mock Sample Questions',BANK.filter(q=>q.p).sort((a,b)=>a.p-b.p),120,true);
    if(g==='gloss')glossary();
    if(g==='quick')startPractice('Quick practice',weightedMix(15));
    if(g==='deck'&&dk)startPractice('Fix my mistakes',shuffle(deck()).slice(0,25))});
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unitPick(b.dataset.unit));
  app.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>studyNotes(b.dataset.notes));
  app.querySelectorAll('[data-gl]').forEach(b=>b.onclick=()=>glossary(b.dataset.gl));
  $('#st-target').onchange=e=>{S.settings.target=Math.min(100,Math.max(40,+e.target.value||70));save()};
  $('#exp').onclick=exportCode;$('#imp').onclick=importCode;
  $('#rst').onclick=()=>modal(`<h2>Reset all progress?</h2><p class="muted">This clears your answers, mistakes and attempt history in this browser.</p><div class="row"><button class="btn bad" id="y">Reset</button><button class="btn" id="n">Cancel</button></div>`,()=>{$('#y').onclick=()=>{S={items:{},attempts:[],settings:S.settings};save();closeModal();home()};$('#n').onclick=closeModal});
}
function unitPick(u){const st=unitStats(u);modal(`<p class="eyebrow">Unit ${u}</p><h2>${esc(UNITS[u])}</h2><p class="muted">${st.total} questions · ${SPEC[u]} in the real exam</p>
  <div class="row"><button class="btn pri" data-n="10">10 questions</button><button class="btn" data-n="20">20</button><button class="btn" data-n="999">All ${st.total}</button><button class="btn" id="cl">Cancel</button></div>`,()=>{
  document.querySelectorAll('.modal [data-n]').forEach(b=>b.onclick=()=>{closeModal();startPractice('Unit '+u,shuffle(pickUnit(u,Math.min(+b.dataset.n,st.total))))});$('#cl').onclick=closeModal})}
function tags(q){return q.s==='sample'?`<span class="chip booklet">Mock Sample Q${q.p}</span>`:''}
function qBody(q){return `<p class="qtext">${esc(q.q)}</p>${q.c?`<pre class="svgbox" style="font-family:var(--f-mono);font-size:.92rem;margin:0 0 16px;white-space:pre">${esc(q.c)}</pre>`:''}`}

/* ---------- exam ---------- */
function startExam(mode,qs,mins,keepOrder){T={mode,exam:true,i:0,qs:qs.map(q=>({id:q.id,ord:optOrder(q,keepOrder),ans:null,flag:false})),end:Date.now()+mins*60000,mins};
  if(!keepOrder)T.qs=shuffle(T.qs);startTimer();renderExam()}
function startTimer(){stopTimer();timerId=setInterval(tick,1000);tick()}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
function tick(){if(!T||!T.exam||T.done)return;const ms=T.end-Date.now();const el=$('#timer');if(ms<=0){finishExam(true);return}
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;if(el){el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;el.classList.toggle('low',ms<5*60000)}}
function renderExam(){const t=T,item=t.qs[t.i],q=byId[item.id],answered=t.qs.filter(x=>x.ans!=null).length;if(t._shown!==t.i){t._shown=t.i;window.scrollTo(0,0)}
  setBar(`<span class="timer" id="timer" role="timer" aria-label="Time remaining"></span>`);tick();
  app.innerHTML=`<div class="exam"><section class="panel">
    <div class="qhead"><span class="qnum">Question ${t.i+1} of ${t.qs.length}</span><span class="row" style="gap:8px"><button class="btn flag ${item.flag?'on':''}" id="flag" style="padding:5px 12px">${item.flag?'Flagged':'Flag for review'}</button></span></div>
    ${qBody(q)}
    <div class="opts">${item.ord.map((oi,k)=>`<button class="opt ${item.ans===oi?'sel':''}" data-o="${oi}"><span class="l">${'ABCD'[k]}</span><span class="x">${esc(q.o[oi])}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn" id="prev" ${t.i?'':'disabled'}>Previous</button><span class="hint kh">Keys: A–D to answer, ← → to move, F to flag</span>${t.i<t.qs.length-1?'<button class="btn pri" id="next">Next</button>':'<button class="btn pri" id="end">Review and submit</button>'}</div>
  </section>
  <aside class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>${esc(t.mode)}</h3><span class="kbd">${answered}/${t.qs.length}</span></div>
    <div class="nav">${t.qs.map((x,k)=>`<button data-k="${k}" class="${x.ans!=null?'a':''} ${x.flag?'f':''} ${k===t.i?'cur':''}" aria-label="Question ${k+1}${x.ans!=null?', answered':''}${x.flag?', flagged':''}">${k+1}</button>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>Flagged</span></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="end2" style="width:100%">Review and submit</button><button class="btn" id="quit" style="width:100%">Quit without saving</button></div>
  </aside></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{item.ans=+b.dataset.o;renderExam()});
  app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{t.i=+b.dataset.k;renderExam()});
  $('#flag').onclick=()=>{item.flag=!item.flag;renderExam()};
  $('#prev').onclick=()=>{if(t.i){t.i--;renderExam()}};
  if($('#next'))$('#next').onclick=()=>{t.i++;renderExam()};
  if($('#end'))$('#end').onclick=reviewScreen;$('#end2').onclick=reviewScreen;
  $('#quit').onclick=()=>modal(`<h2>Quit this exam?</h2><p class="muted">Your answers will not be saved.</p><div class="row"><button class="btn bad" id="y">Quit</button><button class="btn" id="n">Keep going</button></div>`,()=>{$('#y').onclick=()=>{closeModal();home()};$('#n').onclick=closeModal});
}
function reviewScreen(){const t=T;const un=t.qs.map((x,k)=>x.ans==null?k:-1).filter(k=>k>=0),fl=t.qs.map((x,k)=>x.flag?k:-1).filter(k=>k>=0);
  const lk=a=>a.map(k=>`<button class="btn" data-k="${k}" style="padding:3px 10px">${k+1}</button>`).join(' ');
  modal(`<h2>Submit your exam?</h2>${un.length?`<p><b>${un.length} unanswered:</b></p><div class="row">${lk(un)}</div>`:'<p>All questions are answered.</p>'}${fl.length?`<p><b>${fl.length} flagged:</b></p><div class="row">${lk(fl)}</div>`:''}<div class="row"><button class="btn pri" id="y">Submit</button><button class="btn" id="n">Back to exam</button></div>`,()=>{
    document.querySelectorAll('.modal [data-k]').forEach(b=>b.onclick=()=>{t.i=+b.dataset.k;closeModal();renderExam()});$('#y').onclick=()=>{closeModal();finishExam(false)};$('#n').onclick=closeModal})}
function finishExam(timeout){const t=T;if(t.done)return;t.done=true;stopTimer();closeModal();
  const res=t.qs.map(x=>({...x,ok:x.ans===byId[x.id].a}));res.forEach(r=>record(r.id,r.ok));saveAttempt(t.mode,res);save();results(t.mode,res,timeout)}
function saveAttempt(mode,res){const units={};res.forEach(r=>{const u=byId[r.id].u;units[u]=units[u]||[0,0];units[u][1]++;if(r.ok)units[u][0]++});
  const score=res.filter(r=>r.ok).length;S.attempts.push({t:Date.now(),mode,n:res.length,score,pct:Math.round(100*score/res.length),units});if(S.attempts.length>60)S.attempts=S.attempts.slice(-60)}
function results(mode,res,timeout){setBar('');window.scrollTo(0,0);const score=res.filter(r=>r.ok).length,pct=Math.round(100*score/res.length),tg=S.settings.target,pass=pct>=tg;
  const units={};res.forEach(r=>{const u=byId[r.id].u;units[u]=units[u]||[0,0];units[u][1]++;if(r.ok)units[u][0]++});
  let filter='wrong';
  const draw=()=>{const list=res.map((r,k)=>[r,k]).filter(([r])=>filter==='all'||!r.ok);$('#rv').innerHTML=list.length?list.map(([r,k])=>reviewItem(r,k)).join(''):'<p class="muted" style="padding:14px 0">Nothing to show. Every answer was correct.</p>';
    app.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===filter))};
  app.innerHTML=`<section class="panel" style="display:grid;gap:16px">
    <div><p class="eyebrow">${esc(mode)}${timeout?' · time ran out':''}</p><div class="row" style="gap:18px;align-items:flex-end"><span class="score" style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</span><span style="padding-bottom:6px"><b>${score} of ${res.length}</b> correct<br><span class="muted">${pass?'At or above':'Below'} your ${tg}% target</span></span></div></div>
    <div class="tw"><table><thead><tr><th>Unit</th><th class="n">Score</th><th class="mcol" style="min-width:120px"></th><th></th></tr></thead><tbody>
    ${UL.filter(u=>units[u]).map(u=>{const [c,n]=units[u],a=Math.round(100*c/n);return `<tr><td><b>${u}</b> <span class="muted">${esc(UNITS[u])}</span></td><td class="n">${c}/${n}</td><td class="mcol"><div class="meter"><i class="${a>=75?'g':a>=55?'w':'b'}" style="width:${a}%"></i></div></td><td>${c<n?`<button class="btn" data-unit="${u}" style="padding:4px 10px">Practice</button>`:''}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn pri" id="hm">Back to dashboard</button>${res.some(r=>!r.ok)?'<button class="btn" id="fix">Practice the ones I missed</button>':''}</div>
  </section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>Answer review</h2><div class="conf"><button data-f="wrong">Wrong and unanswered</button><button data-f="all">All questions</button></div></div><div id="rv"></div></section>`;
  $('#hm').onclick=home;if($('#fix'))$('#fix').onclick=()=>startPractice('Missed from '+mode,shuffle(res.filter(r=>!r.ok).map(r=>byId[r.id])));
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unitPick(b.dataset.unit));
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});draw()}
function reviewItem(r,k){const q=byId[r.id],ord=r.ord||[0,1,2,3];return `<div class="review-item"><div class="row" style="justify-content:space-between"><span class="qnum" style="font-size:.95rem">Q${k+1} · Unit ${q.u}</span><span>${tags(q)}${r.ans==null?' <span class="chip warn">not answered</span>':''}</span></div>
  ${qBody(q).replace('class="qtext"','class="qtext" style="margin:0;font-size:1rem"')}
  <div class="opts">${ord.map((oi,j)=>`<div class="opt ${oi===q.a?'ok':r.ans===oi?'no':''}"><span class="l">${'ABCD'[j]}</span><span class="x">${esc(q.o[oi])}</span></div>`).join('')}</div>
  ${expl(q)}</div>`}
function expl(q){const tp=q.tp!=null&&NOTES[q.u]?NOTES[q.u][q.tp]:null;return `${q.e?`<div class="hint" style="color:var(--fg)"><b>Why:</b> ${esc(q.e)}</div>`:''}${q.f?`<div class="hint" style="border-left:3px solid var(--flag);padding-left:10px"><b style="color:var(--flag)">Note:</b> ${esc(q.f)}</div>`:''}${tp?`<div class="hint"><button class="linkbtn" data-study="${q.u}|${q.tp}">Study: ${esc(tp.ref)} · ${esc(tp.t)}</button></div>`:''}`}

/* ---------- practice ---------- */
function startPractice(mode,qs){if(!qs.length){home();return}T={mode,exam:false,i:0,qs:qs.map(q=>({id:q.id,ord:optOrder(q),ans:null,shown:false}))};renderPractice()}
function renderPractice(){const t=T,item=t.qs[t.i],q=byId[item.id];if(t._shown!==t.i){t._shown=t.i;window.scrollTo(0,0)}const done=t.qs.filter(x=>x.shown).length,ok=t.qs.filter(x=>x.shown&&x.ans===byId[x.id].a).length;
  setBar(`<span class="kbd" style="background:rgba(255,255,255,.08);border-color:transparent;color:inherit;padding:4px 10px">${ok}/${done} correct</span>`);
  const sh=item.shown;
  app.innerHTML=`<section class="panel" style="max-width:820px;width:100%;justify-self:center">
    <div class="qhead"><span class="qnum">${esc(t.mode)} · ${t.i+1} of ${t.qs.length}</span><span>${tags(q)} <span class="muted" style="font-size:.85rem">Unit ${q.u}</span></span></div>
    ${qBody(q)}
    <div class="opts">${item.ord.map((oi,k)=>{let c='';if(sh){if(oi===q.a)c='ok';else if(oi===item.ans)c='no'}else if(item.ans===oi)c='sel';return `<button class="opt ${c}" data-o="${oi}" ${sh?'disabled':''}><span class="l">${'ABCD'[k]}</span><span class="x">${esc(q.o[oi])}</span></button>`}).join('')}</div>
    ${sh?`<div class="feedback ${item.ans===q.a?'ok':'no'}" style="display:grid;gap:8px"><b>${item.ans===q.a?'Correct':'Not quite. The answer is '+'ABCD'[item.ord.indexOf(q.a)]}</b>${expl(q)}</div>`:''}
    <div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn" id="quit">End session</button><span class="hint kh">A–D to choose, Enter to check or continue</span>${sh?(t.i<t.qs.length-1?'<button class="btn pri" id="next">Next question</button>':'<button class="btn pri" id="fin">See summary</button>'):`<button class="btn pri" id="chk" ${item.ans==null?'disabled':''}>Check answer</button>`}</div>
  </section>`;
  if(!sh)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{item.ans=+b.dataset.o;renderPractice()});
  if($('#chk'))$('#chk').onclick=checkPractice;if($('#next'))$('#next').onclick=()=>{t.i++;renderPractice();window.scrollTo(0,0)};if($('#fin'))$('#fin').onclick=finishPractice;
  $('#quit').onclick=finishPractice}
function checkPractice(){const item=T.qs[T.i],q=byId[item.id];if(item.ans==null||item.shown)return;item.shown=true;record(item.id,item.ans===q.a);save();renderPractice()}
function finishPractice(){const t=T;const res=t.qs.filter(x=>x.shown).map(x=>({...x,ok:x.ans===byId[x.id].a}));if(!res.length){home();return}saveAttempt(t.mode,res);save();results(t.mode,res,false)}

/* ---------- study notes ---------- */
function studyNotes(u,focus){const back=T;stopTimer();T=null;setBar('');const ns=NOTES[u];
  app.innerHTML=`<section class="panel" style="display:grid;gap:18px;max-width:860px;width:100%;justify-self:center">
    <div><p class="eyebrow">Unit ${u} · study notes</p><h1>${esc(UNITS[u])}</h1><p class="muted" style="margin-top:6px">Key facts from the Unit ${u} student book and slides. ${SPEC[u]} of the 60 exam questions come from this unit.</p></div>
    ${ns.map((n,i)=>`<div class="week ${i===focus?'now':''}" id="tp${i}"><div class="row" style="justify-content:space-between"><h3>${esc(n.t)}</h3><span class="chip none">${esc(n.ref)}</span></div><ul style="margin:0;padding-left:20px;display:grid;gap:6px">${n.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
    <div class="row"><button class="btn pri" id="pr">Practice Unit ${u}</button>${GLOSS[u]?`<button class="btn" id="gl">Unit ${u} glossary</button>`:''}<button class="btn" id="hm">Back to dashboard</button></div>
  </section>`;
  $('#pr').onclick=()=>unitPick(u);$('#hm').onclick=home;if($('#gl'))$('#gl').onclick=()=>glossary(u);
  if(focus!=null){const el=$('#tp'+focus);el&&el.scrollIntoView({block:'start'})}else window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-study]');if(!b)return;const [u,i]=b.dataset.study.split('|');
  if(T&&!T.done&&T.exam)return;
  const inPractice=T&&!T.exam;const go=()=>studyNotes(u,+i);
  if(inPractice){modal(`<h2>Open the study notes?</h2><p class="muted">This ends the current practice session. Answers you have checked are saved.</p><div class="row"><button class="btn pri" id="y">Open notes</button><button class="btn" id="n">Stay</button></div>`,()=>{$('#y').onclick=()=>{closeModal();const t=T;const res=t.qs.filter(x=>x.shown).map(x=>({...x,ok:x.ans===byId[x.id].a}));if(res.length){saveAttempt(t.mode,res);save()}go()};$('#n').onclick=closeModal})}else go()});

/* ---------- glossary ---------- */
function glossary(unit){stopTimer();T=null;setBar('');window.scrollTo(0,0);let u=unit||'all',qy='';
  const units=UL.filter(x=>GLOSS[x]);
  app.innerHTML=`<section class="panel" style="display:grid;gap:14px;max-width:900px;width:100%;justify-self:center">
    <div><p class="eyebrow">Glossary</p><h1>Key terms</h1><p class="muted" style="margin-top:6px">Terms from each unit's glossary, with English definitions and Arabic meanings.</p></div>
    <input type="search" id="gq" placeholder="Search terms or definitions (English or Arabic)" aria-label="Search glossary" style="font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);width:100%">
    <div class="conf" id="gu" style="margin:0"><button data-u="all">All units</button>${units.map(x=>`<button data-u="${x}">${x}</button>`).join('')}</div>
    <p class="hint" id="gc"></p><div id="gl" style="display:grid;gap:0"></div>
    <div class="row"><button class="btn" id="hm">Back to dashboard</button></div></section>`;
  const draw=()=>{const q=qy.trim().toLowerCase();const list=[];(u==='all'?units:[u]).forEach(x=>GLOSS[x].forEach(g=>{if(!q||(g.t+' '+g.d+' '+g.ar+' '+g.ard).toLowerCase().includes(q))list.push([x,g])}));
    $('#gc').textContent=`${list.length} term${list.length===1?'':'s'}${u==='all'?'':' in Unit '+u}`;
    $('#gl').innerHTML=list.map(([x,g])=>`<div class="review-item" style="gap:4px"><div class="row" style="justify-content:space-between;gap:8px"><h3>${esc(g.t)}</h3>${u==='all'?`<span class="chip none">Unit ${x}</span>`:''}</div>
      <p>${esc(g.d)}</p>${g.ar||g.ard?`<p dir="rtl" lang="ar" class="ar">${g.ar?`<b>${esc(g.ar)}</b>`:''}${g.ar&&g.ard?' — ':''}${g.ard?esc(g.ard):''}</p>`:''}</div>`).join('')||'<p class="muted">No matching terms.</p>';
    app.querySelectorAll('#gu button').forEach(b=>b.classList.toggle('on',b.dataset.u===u))};
  $('#gq').oninput=e=>{qy=e.target.value;draw()};
  app.querySelectorAll('#gu button').forEach(b=>b.onclick=()=>{u=b.dataset.u;draw()});
  $('#hm').onclick=home;draw()}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(!T||$('.modal')||e.target.matches('input,textarea'))return;const k=e.key.toLowerCase();const item=T.qs[T.i];if(!item||T.done)return;
  const li='abcd'.indexOf(k),ni='1234'.indexOf(k),idx=li>=0?li:ni;
  if(idx>=0&&!(item.shown)){item.ans=item.ord[idx];T.exam?renderExam():renderPractice();return}
  if(T.exam){if(k==='arrowright'&&T.i<T.qs.length-1){T.i++;renderExam()}else if(k==='arrowleft'&&T.i){T.i--;renderExam()}else if(k==='f'){item.flag=!item.flag;renderExam()}}
  else if(k==='enter'){e.preventDefault();if(!item.shown)checkPractice();else if(T.i<T.qs.length-1){T.i++;renderPractice()}else finishPractice()}});

/* ---------- modal & progress code ---------- */
function modal(html,after){$('#modal-root').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="panel">${html}</div></div>`;after&&after()}
function closeModal(){$('#modal-root').innerHTML=''}
function exportCode(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  modal(`<h2>Your progress code</h2><p class="muted">Copy this code and paste it into "Load progress code" on another device.</p><textarea readonly id="code">${code}</textarea><div class="row"><button class="btn pri" id="cp">Copy</button><button class="btn" id="cl">Close</button><span id="msg" class="hint"></span></div>`,()=>{
  $('#cp').onclick=()=>{const ta=$('#code');ta.select();try{navigator.clipboard.writeText(code).then(()=>$('#msg').textContent='Copied',()=>{document.execCommand('copy');$('#msg').textContent='Copied'})}catch(e){document.execCommand('copy');$('#msg').textContent='Copied'}};$('#cl').onclick=closeModal})}
function importCode(){modal(`<h2>Load progress code</h2><p class="muted">This replaces the progress saved in this browser.</p><textarea id="code" placeholder="Paste your code here"></textarea><div class="row"><button class="btn pri" id="ld">Load</button><button class="btn" id="cl">Cancel</button><span id="msg" class="hint"></span></div>`,()=>{
  $('#ld').onclick=()=>{try{const p=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));if(!p.items)throw 0;S={...S,...p};save();closeModal();home()}catch(e){$('#msg').textContent='That code is not valid.'}};$('#cl').onclick=closeModal})}
$('#home-btn').onclick=()=>{if(T&&T.exam&&!T.done){modal(`<h2>Leave this exam?</h2><p class="muted">Your answers will not be saved.</p><div class="row"><button class="btn bad" id="y">Leave</button><button class="btn" id="n">Stay</button></div>`,()=>{$('#y').onclick=()=>{closeModal();home()};$('#n').onclick=closeModal})}else home()};
home();

</script></body></html>
