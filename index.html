,"Environment.","Library."],"a":3,"e":"The Java API is the Java class library: ready-made classes you call from your code.","s":"bank","tp":1},{"id":"24-8","u":"24","q":"A collection of tools used with a particular programming language to develop and test software programs is referred to as :","o":["IDE.","STD.","PDP.","Compiler."],"a":0,"e":"An IDE (Integrated Development Environment) bundles the tools for writing, building and testing code.","s":"bank","tp":0},{"id":"24-9","u":"24","q":"In software development, an editor is:","o":["A collection of tools used with a particular programming language to develop and test software programs","A language translator that converts an entire program into machine language before executing it.","A language translator that converts program statements line-by-line into machine language, immediately executing each statement.","An individual whose job is to edit books and journals before they are  published."],"a":0,"e":"An editor is the tool for writing and changing source code. Of the options given, 'a collection of tools … to develop and test software programs' is the closest description.","s":"bank","f":"Don't confuse the two: an editor edits code, while an IDE bundles an editor, compiler and debugger.","tp":0},{"id":"24-10","u":"24","q":"Which one of the following describes the use of a repository tool?","o":["Creating new compiled languages.","Storing data that will need to be re-used.","Storing guidance for behavior and languages.","Creating programming code used to develop programs."],"a":1,"e":"A repository stores code and data so it can be found and re-used.","s":"bank","tp":2},{"id":"24-11","u":"24","q":"What is a purpose of using design patterns for developing applications?","o":["To provide a template for solving software problems.","To serve a complete model of the system.","To transform a completed plan directly into code.","To generate a software development plan."],"a":0,"e":"Design patterns are reusable templates for solving common design problems.","s":"bank","tp":0},{"id":"24-12","u":"24","q":"We use the Scanner library in Java for which of the following reasons?","o":["Give permissions to the user","Correcting software errors","Allows user to read data","Allows the user to enter data"],"a":2,"e":"java.util.Scanner reads input data, e.g. from the keyboard or a file.","s":"bank","tp":1},{"id":"24-13","u":"24","q":"The Java Development Kit (JDK) includes all of the following EXCEPT:","o":["A debugger","Class libraries","A compiler","Visual GUI builder tools"],"a":3,"e":"The JDK includes development tools such as the compiler (javac) and debugger (jdb), plus the Java class libraries. Visual GUI builder tools come with IDEs, not the JDK.","s":"bank","tp":0},{"id":"25-1","u":"25","q":"What is tracing mostly used for in software development?","o":["To keep tracing messages separate from other resources.","To simulate events in real time.","To record the product's source code.","To record information when running a program."],"a":3,"e":"Tracing records information about a program's execution while it runs.","s":"bank","tp":0},{"id":"25-2","u":"A01","q":"Which one of the following is a way of measuring the number of errors when developing applications?","o":["Tracing.","Counting.","Queries.","Testing."],"a":0,"e":"Tracing records execution details, which helps find and count errors during development.","s":"sample","p":50,"tp":3},{"id":"25-3","u":"25","q":"Which of the following best describes the process of Tracing?","o":["Specialized use of logging to record information about a program's execution.","Stopping or pausing place in a program put in place for debugging purposes.","A file that records events that occur in an operating system or other software.","Act of keeping a log."],"a":0,"e":"Tracing is a specialized kind of logging that records details of a program's execution.","s":"bank","tp":0},{"id":"25-5","u":"25","q":"When debugging a program, why is a break point set?","o":["To step into each procedure.","To simulate events in real time.","To isolate program elements.","To check for valid parameters."],"a":2,"e":"A breakpoint pauses execution at a chosen line so you can isolate and inspect that part of the program.","s":"sample","p":30,"tp":0},{"id":"25-6","u":"25","q":"What allows developers to isolate program elements when debugging?","o":["Setting breakpoints.","Compiler tools.","Tracing tools.","Logging frameworks."],"a":0,"e":"Setting breakpoints lets developers isolate program elements when debugging.","s":"bank","tp":0},{"id":"25-7","u":"25","q":"Internal Acceptance Testing is another name of ____________ testing?","o":["Unit","Alpha","Beta","System"],"a":1,"e":"Alpha testing is internal acceptance testing, done in-house before beta release.","s":"bank","tp":1},{"id":"25-8","u":"25","q":"At which stage does alpha testing take place?","o":["When the software is fully operational.","When the software is first able to run.","When the software is on sale to customers.","When later versions of the code are functional."],"a":1,"e":"Alpha testing begins as soon as the software can first run, and it is done inside the development organization.","s":"bank","tp":1},{"id":"25-9","u":"25","q":"What is component testing sometimes called?","o":["Performance testing.","Unit testing.","Usability testing.","Alpha testing."],"a":1,"e":"Component testing is also called unit testing.","s":"bank","tp":1},{"id":"25-10","u":"25","q":"What is the main reason for using alpha testing?","o":["To enable the testing to be carried out by independent users.","To confirm the program is as near to correct as possible.","To find errors that can only be found in operational use.","To enable the highest level of testing."],"a":2,"e":"Alpha testing simulates real use to find errors that only appear in operational use.","s":"bank","tp":1},{"id":"25-11","u":"25","q":"What best describes Integration Testing?","o":["To verify interfaces between components of a software design.","To check the handling of data passed between various units.","To verify that a completely integrated system meets its requirements.","To check the functionality of a specific section of code."],"a":0,"e":"Integration testing checks the interfaces between components as they are combined.","s":"bank","tp":1},{"id":"25-12","u":"25","q":"What best describes System Testing?","o":["To check the handling of data passed between various units.","To examine functionality without knowledge of internal implementation.","To verify that an integrated system meets its requirements.","To verify interfaces between components of a software design."],"a":2,"e":"System testing checks that the complete, integrated system meets its requirements.","s":"sample","p":31,"tp":1},{"id":"25-13","u":"25","q":"Which is the best use of a test fixture?","o":["To load a database with a non-specific set of data.","To use in the preparation of mock objects.","To copy a specific known set of files.","To install a different operating system."],"a":2,"e":"A test fixture sets up a fixed, known state (e.g. a known set of files) so tests are repeatable.","s":"bank","tp":1},{"id":"25-14","u":"25","q":"What type of testing uses test stubs?","o":["Bottom-up approach integration testing.","Function testing.","Performance testing.","Top-down approach incremental testing."],"a":3,"e":"Top-down incremental testing uses stubs to stand in for lower-level modules not yet built. Bottom-up uses drivers.","s":"bank","tp":1},{"id":"25-15","u":"25","q":"Test stubs are used for which one of the following?","o":["Incremental testing.","Functional testing.","Creating a test class in Java.","Performance testing."],"a":0,"e":"Stubs replace missing modules during incremental testing.","s":"sample","p":32,"tp":1},{"id":"25-16","u":"25","q":"In unit testing, why are mock objects created?","o":["To simulate components in a program.","To identify the behavior of simulated objects.","To simulate the behavior of real objects.","To identify components in the program."],"a":2,"e":"Mock objects simulate the behavior of real objects so a unit can be tested in isolation.","s":"bank","tp":1},{"id":"25-17","u":"25","q":"What best describes the term 'Validation' when applied to software testing?","o":["To decide if the team is using the right processes.","To decide if the team is building the correct product.","To evaluate software during the development process.","To evaluate software at the end of the development process."],"a":1,"e":"Validation asks 'Are we building the right product?', i.e. does it meet the user's needs.","s":"bank","tp":2},{"id":"25-18","u":"25","q":"What best describes the term 'Verification' when applied to software testing?","o":["To evaluate software during the development process.","To decide if the team is building the correct product.","To evaluate software at the end of the development process.","To decide if the team is building the product in the right way."],"a":3,"e":"Verification asks 'Are we building the product right?', i.e. does it follow the specification.","s":"sample","p":33,"tp":2},{"id":"25-19","u":"25","q":"What best describes the purpose of verification?","o":["To show the program is within budget.","To show the presence of faults.","To show dynamic testing outcomes.","To show conformance with the specification."],"a":3,"e":"Verification shows the software conforms to its specification.","s":"bank","tp":2},{"id":"25-21","u":"25","q":"What process ensures that software is fit for purpose?","o":["Validation.","Testing.","Risk management.","Programming."],"a":0,"e":"Validation checks that the software meets users' needs, so it confirms the software is fit for purpose. Verification checks it against the specification.","s":"bank","tp":2},{"id":"26-1","u":"26","q":"Which one of the following best describes a relational database?","o":["Each entity in an entity-relationship (ER) diagram converts to a table.","Key values must be null before the entity relationship is defined.","Primary keys must be joined in a one to many entity relationship.","Entities are defined by a list of unique attributes."],"a":0,"e":"In relational design, each entity in an ER diagram becomes a table.","s":"bank","tp":0},{"id":"26-2","u":"26","q":"What are relational databases comprised of?","o":["Fields that store objects rather than data.","Many single-value fields connected in a tree-like structure.","One single table of data stored in a central location.","Multiple tables linked by key fields."],"a":3,"e":"A relational database is multiple tables linked by key fields.","s":"bank","tp":0},{"id":"26-3","u":"26","q":"Which one of the following is needed for a database to be in first normal form (1NF)?","o":["Remove attributes that are dependent on non-key fields.","Remove repeating groups.","Generate more than one primary key.","Every determinant in the relation is a candidate key."],"a":1,"e":"1NF requires atomic values with no repeating groups.","s":"sample","p":34,"tp":0},{"id":"26-4","u":"26","q":"Which of these is an example of an integrity constraint in SQL?","o":["ALIAS.","NULL.","UNIQUE.","FLOAT."],"a":2,"e":"UNIQUE is an integrity constraint: no two rows can share that value.","s":"bank","tp":0},{"id":"26-5","u":"26","q":"In SQL, what is UNIQUE an example of?","o":["A validation technique.","A fault analysis technique.","A verification constraint.","An integrity constraint."],"a":3,"e":"UNIQUE is an integrity constraint.","s":"bank","tp":0},{"id":"26-6","u":"26","q":"What specifies that all fields in relational databases must be declared?","o":["Domain integrity.","Referential integrity.","User-defined integrity.","Entity integrity."],"a":0,"e":"Domain integrity requires each field to be declared with a defined type and set of valid values.","s":"bank","tp":0},{"id":"26-7","u":"26","q":"Which of these SQL statements is an example of a DDL command?","o":["SELECT","CREATE","GRANT","REVOKE"],"a":1,"e":"CREATE defines structure, so it is DDL. SELECT is DML and GRANT/REVOKE are DCL.","s":"sample","p":36,"tp":1},{"id":"26-8","u":"26","q":"Which SQL command is used to remove a table from a database?","o":["DELETE.","DROP.","ALTER.","EXTRACT."],"a":1,"e":"DROP TABLE removes the whole table. DELETE only removes rows.","s":"bank","tp":1},{"id":"26-9","u":"26","q":"Which one of the following segments of SQL code adds a new column for enddate to the courses table?","o":["ALTER TABLE enddate INTO courses","ALTER TABLE courses ADD (enddate (DATE))","ALTER TABLE courses ADD (enddate DATE)","ALTER TABLE course ADD (enddate DATE)"],"a":2,"e":"Correct syntax: ALTER TABLE <table> ADD (<column> <type>). The table is 'courses'.","s":"sample","p":35,"tp":1},{"id":"26-10","u":"26","q":"What is the result of the following SQL query? SELECT name FROM customer UNION SELECT name FROM supplier;","o":["The result lists all the names from the customer and supplier tables.","The result lists all the distinct names from the customer and supplier tables.","The result lists all the names from the customer table that also appear in the supplier table.","The result lists all the names from the supplier table that also appear in the customer table."],"a":1,"e":"UNION combines both results and removes duplicates. UNION ALL keeps them.","s":"bank","tp":1},{"id":"26-11","u":"26","q":"What is the outcome of the following SQL command? UPDATE employee SET salary = salary * 1.05 WHERE salary > 10000","o":["Salary is set at 10500 for all employees.","Salaries over 10000 are increased by 5%.","Salaries over 10000 are increased by 5000.","Salary is increased by 5% for all employees."],"a":1,"e":"salary * 1.05 adds 5%, applied only WHERE salary > 10000.","s":"bank","tp":1},{"id":"26-12","u":"26","q":"What is the outcome of the following SQL command? UPDATE employee SET salary = salary + 5000 WHERE salary > 70000","o":["Salaries over 70000 are increased by 5000.","Salaries over 70000 are increased by 5%.","Salaries are increased by 5% for all employees.","Salary is decreased by 5% for all employees."],"a":0,"e":"salary + 5000 adds 5000, only for salaries over 70000.","s":"bank","tp":1},{"id":"26-13","u":"26","q":"What is the outcome of the following SQL command? SELECT salary FROM employees WHERE salary BETWEEN 10000 AND 20000;","o":["It displays all employees whose salary is below 10,000.","It displays the salaries between 10,000 and 20,000, inclusive.","It changes all salaries between 10,000 and 20,000.","It displays the names of employees earning between 10,000 and 20,000."],"a":1,"e":"BETWEEN is inclusive. Only the salary column is selected, not names.","s":"bank","tp":1},{"id":"26-14","u":"26","q":"Which term is used to search for patterns in the target string?","o":["BETWEEN","IN","LIKE","OUT"],"a":2,"e":"LIKE matches patterns using wildcards such as % and _.","s":"bank","tp":1},{"id":"26-15","u":"26","q":"Which feature of a relational database management system controls data access speed?","o":["Data dictionary management.","Data integrity management.","Data security management.","Data storage management."],"a":3,"e":"Storage management (how data is physically stored and indexed) controls access speed.","s":"bank","tp":0},{"id":"26-16","u":"26","q":"What best describes a data dictionary?","o":["A set of files that contain the metadata for a database.","A definition of the relationships used in a database.","A set of SQL statements to create a database.","A glossary of terms used in the database structure."],"a":0,"e":"A data dictionary holds the metadata: definitions of tables, fields, types and constraints.","s":"bank","tp":0},{"id":"26-17","u":"26","q":"What is the purpose of an API (Application Programming Interface) when communicating with a database?","o":["To improve database transmission speed and capacity.","To synchronize replicated data with the original.","To allow access to data in any compliant database.","To reduce network traffic in distributed databases."],"a":2,"e":"A standard API (e.g. ODBC/JDBC) lets code access data in any compliant database.","s":"bank","tp":2},{"id":"26-18","u":"26","q":"Which SQL statement is used to return only different values?","o":["SELECT DIFFERENT","SELECT UNIQUE","SELECT DISTINCT","SELECT DISTINCTS"],"a":2,"e":"SELECT DISTINCT returns only different (non-duplicate) values.","s":"bank","tp":1},{"id":"26-19","u":"26","q":"What does SQL stand for?","o":["Structured Question Language","Strong Question Language","Structured Query Language","Structured Query Layout"],"a":2,"e":"SQL stands for Structured Query Language.","s":"bank","tp":1},{"id":"26-20","u":"26","q":"Which operator is used to search for a specified pattern in a column?","o":["IN","LIKE","BETWEEN","EXISTS"],"a":1,"e":"LIKE searches a column for a pattern.","s":"bank","tp":1},{"id":"26-21","u":"26","q":"All the statements in SQL end with:","o":["Coma (,).","Semicolon (;)","Dot (.).","slash (/)."],"a":1,"e":"SQL statements end with a semicolon.","s":"bank","tp":1},{"id":"26-22","u":"26","q":"SELECT SQL Query is used to:","o":["to extract data from the database according to the user’s request.","To update data from the database according to the user’s request.","To delete data from the database according to the user’s request.","To insert data into the database according to the user’s request."],"a":0,"e":"SELECT retrieves (extracts) data.","s":"bank","tp":1},{"id":"26-23","u":"26","q":"Unified Modeling Language is intended to:","o":["Check the users in the database.","provide a standard way to visualize the design of a system.","provide a standard way to execute the query in the database.","Check the connection between the database and the webpage."],"a":1,"e":"UML is a standard way to visualize a system's design.","s":"bank","tp":2},{"id":"26-24","u":"26","q":"With SQL, how do you select a column named “FirstName” from a table named “Persons”?","o":["SELECT Persons.FirstName","EXTRACT FirstName FROM Persons","SELECT FirstName FROM Persons","SELECT ONLY FirstName FROM Persons"],"a":2,"e":"To select one column, write SELECT followed by the column name, then FROM and the table name: SELECT FirstName FROM Persons.","s":"bank","tp":1},{"id":"26-25","u":"26","q":"With SQL, how do you select all the columns from a table named “Persons”?","o":["SELECT Persons","SELECT [all] FROM Persons","SELECT * FROM Persons","SELECT *.Persons"],"a":2,"e":"The asterisk (*) means all columns, so SELECT * FROM Persons returns every column in the table.","s":"bank","tp":1},{"id":"27-1","u":"27","q":"What best defines a data access layer?","o":["The layer where humans interact with machines.","The layer that provides access to data in storage.","The layer that provides access to the user interface components.","The layer that encodes data to be created, displayed and changed."],"a":1,"e":"The data access layer provides access to data held in storage.","s":"bank","tp":0},{"id":"27-3","u":"27","q":"Which layer encodes data to be created, displayed, stored and changed?","o":["Data-access.","Business logic.","User interface.","Multi-layer."],"a":1,"e":"The business logic layer encodes the rules for how data is created, displayed, stored and changed.","s":"bank","tp":0},{"id":"27-4","u":"27","q":"Which one of the following defines the Business Logic Layer?","o":["The layer that is concerned with managing database organization.","The layer that creates, stores, displays and changes the user interface.","The layer that sends data between the client and the server over the network.","The decision-making layer that connects various parts of the program."],"a":3,"e":"The business logic layer is the decision-making layer: it applies the business rules and connects the user interface with the data-access layer.","s":"sample","f":"It also encodes how data is created, displayed, stored and changed (see the related question on the business logic layer).","p":37,"tp":0},{"id":"27-5","u":"27","q":"Where must validation take place in SQL databases?","o":["In the business logic layer.","In the data-access layer.","In the user interface layer.","In the decision-making layer."],"a":0,"e":"Validation rules belong in the business logic layer.","s":"bank","tp":0},{"id":"27-6","u":"27","q":"What is the full form of API?","o":["Application Programming Interface","Application Platform Interface","Applied Programming Interface","Applied Programming Internetworks."],"a":0,"e":"API stands for Application Programming Interface: a set of rules and functions that lets programs communicate with each other.","s":"bank","tp":1},{"id":"27-7","u":"27","q":"____________ is an application programming interface (API) for the programming language Java, which defines how a client may access a database.","o":["Java Applet","JDBC","ODBC","MySQL Server"],"a":1,"e":"JDBC is the Java API that defines how a client accesses a database.","s":"bank","tp":1},{"id":"27-8","u":"27","q":"What best describes Java database connectivity?","o":["To load Java packages.","To provide application portability.","To compile Java programs into byte code.","It uses Java programming language to access data."],"a":3,"e":"JDBC (Java Database Connectivity) is the Java API that lets Java programs connect to databases and access data.","s":"sample","p":38,"tp":1},{"id":"27-9","u":"27","q":"What do JDBC connections support?","o":["Creating and executing statements.","Creating execution paths.","Creating queries.","Creating objects."],"a":0,"e":"A JDBC Connection is used to create and execute statements.","s":"bank","tp":1},{"id":"27-10","u":"27","q":"What is the main purpose of using APIs in a JDBC library?","o":["To record SQL or MySQL statements.","To test MySQL statements.","To execute SQL statements.","To create SQL or MySQL statements."],"a":2,"e":"JDBC APIs are used to execute SQL statements.","s":"bank","tp":1},{"id":"27-11","u":"27","q":"How does LINQ extend the programming structure for the Microsoft .NET Framework?","o":["By adding query expressions","By using SQL Statements","By implementing RBMS","By using XML documents"],"a":0,"e":"LINQ adds query expressions directly into .NET languages such as C#.","s":"bank","tp":1},{"id":"27-12","u":"27","q":"What is LINQ?","o":["Language Independent Query","Language Interdependent Query","Language Integrated Query","Language Interconnected Query"],"a":2,"e":"LINQ stands for Language Integrated Query: it lets you write queries directly inside .NET languages such as C#.","s":"bank","tp":1},{"id":"27-13","u":"27","q":"What is the purpose of language integration?","o":["To enable querying of relational tables.","To develop active data objects.","To add multi-layer applications.","To connect a database to a server."],"a":0,"e":"Language-integrated query lets code query relational tables directly.","s":"bank","tp":1},{"id":"27-14","u":"27","q":"Why is Data Integrity important?","o":["It is maintaining and assuring the accuracy and consistency of data over its entire life-cycle.","It is a set of clearly defined methods of communication among various components.","It makes it easier to develop a computer program by providing all the building blocks, which are then put together by the programmer.","It stores data in several locations at once to save space."],"a":0,"e":"Data integrity keeps data accurate and consistent over its whole life-cycle.","s":"bank","tp":2},{"id":"27-15","u":"27","q":"Data Integrity provides which one of the following?","o":["Quality assurance.","Accuracy of data.","Data security.","Data privacy."],"a":1,"e":"Data integrity provides accuracy of data.","s":"sample","p":39,"tp":2},{"id":"27-16","u":"27","q":"What is the most important reason for ensuring Data Integrity?","o":["To ensure accuracy and consistency.","To ensure consistency and accessibility.","To ensure completeness and validity.","To ensure security and accessibility."],"a":0,"e":"The goal is accuracy and consistency.","s":"bank","tp":2},{"id":"27-17","u":"27","q":"What is the purpose of data integrity in databases?","o":["To provide guidelines for data security.","To provide guidelines for data accessibility.","To provide guidelines for data validity.","To provide guidelines for data retention."],"a":2,"e":"Data integrity rules are guidelines for keeping data valid.","s":"bank","tp":2},{"id":"27-19","u":"27","q":"Which one of the following is a Database management environment?","o":["NoSQL","ODBC","XSD","ERD"],"a":0,"e":"NoSQL is a family of database management environments (MongoDB, Cassandra…). ODBC is an access API.","s":"sample","p":40,"tp":3},{"id":"27-21","u":"27","q":"Which of these is a relational database management system?","o":["MySQL.","IDE.","DTD.","ODBC."],"a":0,"e":"MySQL is a relational DBMS.","s":"bank","tp":3},{"id":"27-22","u":"27","q":"Which one of the following is used to access database management systems?","o":["ODBC.","XML.","Fat File.","Object data sources."],"a":0,"e":"ODBC (Open Database Connectivity) is a standard API for accessing DBMSs.","s":"sample","p":41,"tp":3},{"id":"27-23","u":"27","q":"What best describes a flat-file database (written \"fat-file\" in some materials)?","o":["A simple file, such as CSV, that stores records without relationships between tables","A file allocation table used by a disk's file system","A database made of many linked tables on a server","An XML schema that validates documents"],"a":0,"e":"A flat-file database stores records in a simple file, such as CSV, with no relationships between tables.","s":"bank","f":"Don't confuse it with FAT (File Allocation Table), which is part of a disk's file system.","tp":3},{"id":"27-24","u":"27","q":"What is normally used with document-oriented databases?","o":["An ODBC database.","An XML database.","A Fat-file database.","An Internal database."],"a":1,"e":"Document-oriented databases typically store XML (or JSON) documents.","s":"bank","tp":3},{"id":"27-26","u":"27","q":"What best defines internal data?","o":["Information created by the operation of an organization.","Information created by an independent study.","Information held within the system.","Information held within a database."],"a":0,"e":"Internal data is information created by the organization's own operations (sales, staff, stock).","s":"bank","tp":3},{"id":"27-27","u":"27","q":"What enables querying of relational tables?","o":["Working relationships.","Active data objects.","Java database connectivity.","Multi-layer applications."],"a":2,"e":"JDBC lets Java programs send queries to relational tables.","s":"bank","tp":1},{"id":"27-28","u":"27","q":"What best describes Active Data Objects?","o":["Objects used for accessing data sources.","Objects that are logical clusters of tables in a data set.","Objects in the main data type in JavaScript.","Objects that have an unordered collection of properties."],"a":0,"e":"ActiveX Data Objects (ADO) are objects used to access data sources.","s":"bank","tp":1},{"id":"27-29","u":"27","q":"A Root element is a structural element for which programming language?","o":["XML","XP","C#","UML"],"a":0,"e":"Every XML document has exactly one root element.","s":"sample","p":42,"tp":4},{"id":"27-30","u":"27","q":"What best defines root elements in XML?","o":["A container to organize information.","A container for files.","A container for child elements.","A container for all elements."],"a":3,"e":"The root element contains all other elements.","s":"bank","tp":4},{"id":"27-31","u":"27","q":"Which of the following is a schema validator for XML?","o":["UDDI","SOAP","DTD","XSD"],"a":3,"e":"XSD (XML Schema Definition) validates XML structure. DTD is an older alternative.","s":"sample","p":43,"tp":4},{"id":"27-32","u":"27","q":"What best defines the purpose of XSD?","o":["To use traditional schema language.","To collect a batch of information.","To define elements in XML documents.","To express a set of conditions for XML documents."],"a":2,"e":"XSD defines which elements (and attributes) are allowed in an XML document.","s":"bank","tp":4},{"id":"27-34","u":"27","q":"What defines elements in XML documents?","o":["UDDI.","ODBC.","XSD.","XDS."],"a":2,"e":"XSD defines the elements in XML documents.","s":"bank","tp":4},{"id":"27-35","u":"27","q":"Web service definition language (WSDL) is a standard based on which one of the following?","o":["XML","UDDI","SOAP","OCL"],"a":0,"e":"WSDL is an XML-based language.","s":"sample","p":44,"tp":4},{"id":"27-36","u":"27","q":"Which of these is an XML language used to describe web services?","o":["WSDL.","ODBC.","UDDI.","DTD."],"a":0,"e":"WSDL (Web Services Description Language) describes web services in XML.","s":"bank","tp":4},{"id":"A03-1","u":"A03","q":"What is the main reason for using Xcopy?","o":["So that assemblies do not have to be registered.","So that the user session state is maintained on deployment.","So that unsuccessful installations are rolled back.","So that desktop shortcuts are created automatically."],"a":0,"e":"Xcopy deployment just copies files. .NET assemblies do not need registering.","s":"bank","tp":1},{"id":"A03-2","u":"A03","q":"What is the benefit of an Xcopy deployment rather than using MSI?","o":["Special installation files guarantee security.","No alteration is made to the registry.","Large applications can be deployed in real-time.","User session state is maintained on deployment."],"a":1,"e":"Xcopy deployment makes no changes to the Windows registry.","s":"bank","tp":1},{"id":"A03-3","u":"A03","q":"What is another command on Windows which can copy files from one directory to another, but does not work for copying directories?","o":["Xcopy","Copy","Both","Neither"],"a":1,"e":"COPY copies files but not directory trees. XCOPY can copy directories.","s":"bank","tp":1},{"id":"A03-4","u":"A03","q":"What is the first entry in a JAR zip file?","o":["The applet.","The manifest.","The index.","The configuration."],"a":1,"e":"The first entry in a JAR is META-INF/MANIFEST.MF, the manifest.","s":"bank","tp":0},{"id":"A03-5","u":"A03","q":"What is the purpose of creating a JAR file?","o":["To archive redundant applets.","To decrease applet download time.","To automate applet documentation.","To create Web Start applications."],"a":1,"e":"A JAR bundles and compresses classes into one download, which reduces applet download time.","s":"sample","p":56,"tp":0},{"id":"A03-6","u":"A03","q":"What are launch scripts?","o":["They launch input.","A sequence of operating system commands.","They only work on Android.","They do not have a sequence."],"a":1,"e":"Launch scripts are sequences of OS commands that start an application.","s":"bank","tp":0},{"id":"A03-7","u":"A03","q":"Which protocol in the application layer transfers files between network nodes?","o":["HTTP.","RTP.","SIP.","FTP."],"a":3,"e":"FTP (File Transfer Protocol) transfers files between nodes.","s":"bank","tp":2},{"id":"A03-8","u":"A03","q":"Which port is used by the FTP server to listen for incoming calls?","o":["20","21","22","23"],"a":1,"e":"The FTP server listens on port 21 for control. Port 20 carries data.","s":"bank","tp":2},{"id":"A03-9","u":"A03","q":"Which one of the following best describes the File Transfer Protocol?","o":["The client encrypts the data structures before sending to the host.","It uses separate control and data structures between client and host.","The client sends the data structure directly to the host.","The host requests the data structure from the client."],"a":1,"e":"FTP uses separate control and data connections.","s":"sample","p":57,"tp":2},{"id":"A03-10","u":"A03","q":"In which layer is the transmission control protocol (TCP) found?","o":["Physical layer.","Transfer layer.","Transport layer.","Datalink layer."],"a":2,"e":"TCP is a Transport layer protocol.","s":"bank","tp":2},{"id":"A03-11","u":"A03","q":"What is the first line of an HTTP response called?","o":["The body line.","The header line.","The session line.","The status line."],"a":3,"e":"The first line of an HTTP response is the status line, e.g. HTTP/1.1 200 OK.","s":"bank","tp":2},{"id":"A03-12","u":"A03","q":"What provides secure network access to users and networking devices?","o":["Interception.","Authorization.","Certification.","Authentication."],"a":3,"e":"Authentication verifies identity before access is given.","s":"bank","tp":3},{"id":"A03-13","u":"A03","q":"What process is used to specify access rights relating to information security?","o":["Authentication.","Authorization.","Validation.","Verification."],"a":1,"e":"Authorization specifies what an authenticated user may access.","s":"bank","tp":3},{"id":"A03-14","u":"A03","q":"Which one of the following terms describes how access rights are used to grant or deny access to a system?","o":["Authentication.","Accreditation.","Authorization.","Approval."],"a":2,"e":"Authorization uses access rights to grant or deny access.","s":"sample","p":58,"tp":3},{"id":"A03-15","u":"A03","q":"A flight attendant must check your boarding pass before you board the flight, to allow you to access the inside of the plane and its resources. What is this process referred to as?","o":["Authentication","Authorization","Both","None of the answers."],"a":1,"e":"The boarding pass shows you are permitted to board: authorization. Checking your passport would be authentication.","s":"bank","tp":3},{"id":"A03-16","u":"A03","q":"If you were to construct an application that allowed users to also enter a PIN or code sent to their phone number, which of the following would you use?","o":["One-step authentication.","Two-step authentication.","Multi-step authentication.","None of the answers."],"a":1,"e":"Password plus a code sent to your phone is two-step authentication.","s":"bank","tp":3},{"id":"A03-17","u":"A03","q":"When designing and developing installation procedures, which factor is a major challenge?","o":["Audience.","Browser windows.","Network speed.","Consistency."],"a":2,"e":"Network speed varies widely between sites and is a major challenge for installation.","s":"bank","tp":4},{"id":"A03-18","u":"A03","q":"Which is best used to provide cross-platform functionality?","o":["Browser-based application.","Hybrid application.","Native application.","Browser specific application."],"a":0,"e":"Browser-based applications run on any platform that has a browser.","s":"bank","tp":4},{"id":"A03-19","u":"A03","q":"What term describes when a new system is introduced in one department first before release in all departments?","o":["Direct changeover.","Parallel running.","Phased implementation.","Successive running."],"a":2,"e":"Phased implementation introduces a new system in stages, for example one department first and then the others.","s":"sample","f":"A pilot is similar: a small group tries the new system first. The other changeover methods are direct changeover (all at once) and parallel running (old and new together).","p":59,"tp":4},{"id":"A03-21","u":"A03","q":"Which security protocol assures only authorized users can modify sensitive information?","o":["Confidentiality.","Integrity.","Consistency.","Certification."],"a":1,"e":"Integrity means only authorized users can modify information.","s":"bank","tp":3},{"id":"A03-22","u":"A03","q":"What is the primary use of the DNS system?","o":["To use the IP address to find the MAC address of a host.","To use the MAC address to find the IP address of a host.","To translate domain names into IP addresses.","To create a gateway between an IP and a MAC address."],"a":2,"e":"DNS (Domain Name System) translates domain names, such as example.com, into IP addresses.","s":"sample","f":"Finding the MAC address for an IP address is done by ARP, not DNS.","p":60,"tp":2},{"id":"S45","u":"28","q":"Which one of the following best describes how alterations to the scope of a project are introduced and approved?","o":["Configuration Management.","Change Management.","Events Management.","Requirements Management."],"a":1,"e":"Change management is the formal process for introducing and approving changes to a project's scope.","s":"sample","p":45,"tp":2},{"id":"S46","u":"28","q":"Which one of the following best defines Version Management?","o":["To reduce the storage space for versions of components.","To specify baselines using a configuration language.","To manage codelines and baselines.","To manage components for editing."],"a":2,"e":"Version management handles codelines (sequences of versions) and baselines (agreed configurations).","s":"sample","p":46,"tp":3},{"id":"S48","u":"A01","q":"Which small programs are executed on the client’s machine by a Java Enabled Web Browser?","o":["Applets.","Billets.","Extranets.","Servlets."],"a":0,"e":"Applets were small Java programs downloaded and run inside a Java-enabled web browser on the client. Servlets run on the server.","s":"sample","p":48,"tp":2},{"id":"S49","u":"A01","q":"Which one of the following is a current design methodology?","o":["Socio-technical approach.","Rapid Application Development.","Structured Systems Design.","ETHICS."],"a":1,"e":"Rapid Application Development (RAD) is a current, iterative methodology that uses prototyping. The others are older approaches.","s":"sample","p":49,"tp":3},{"id":"S52","u":"A02","q":"Which feature of a mobile device is most important for video streaming?","o":["The screen resolution.","The strength of phone signal.","The processing power.","The camera specification."],"a":1,"e":"Streaming video depends mostly on the network: a strong mobile signal (or Wi-Fi connection) keeps the video playing without buffering.","s":"sample","p":52,"tp":2},{"id":"S53","u":"A02","q":"Which of these features of an operating system is only applicable to mobile systems?","o":["Printer support.","Screen orientation.","Voice recognition.","Video playback."],"a":1,"e":"Screen orientation (portrait or landscape rotation) applies to mobile devices only.","s":"sample","p":53,"tp":0},{"id":"S54","u":"A02","q":"Which of these statements is true?","o":["All smartphones have both Wi-Fi and mobile-data connectivity.","All tablets have both Wi-Fi and mobile-data connectivity.","All mobile phones have both Wi-Fi and mobile-data connectivity.","All laptops have both Wi-Fi and mobile-data connectivity."],"a":0,"e":"Smartphones connect to the internet through both Wi-Fi and mobile data (3G, 4G or 5G). Tablets and laptops are often Wi-Fi only, and basic phones may have no Wi-Fi.","s":"sample","p":54,"tp":2},{"id":"S55","u":"A02","q":"Which one of the following is used for mobile app development specifically for the iOS?","o":["Xcode.","Eclipse.","Android studio.","NetBeans."],"a":0,"e":"Xcode is Apple's IDE for building iOS apps.","s":"sample","p":55,"tp":3},{"id":"T23-1","u":"23","q":"Which programming construct executes one block of code when a condition is true and a different block when it is false?","o":["Fixed loop","While do","If then else","Repeat until"],"a":2,"e":"IF…THEN…ELSE runs one block when the condition is true and another block when it is false.","s":"bank","src":"Unit 23 row 2","tp":0},{"id":"T23-2","u":"23","q":"What is displayed by the following pseudocode when mark = 45?","o":["Pass","Nothing is displayed","Pass Fail","Fail"],"a":3,"e":"45 is not 50 or more, so the condition is false and the ELSE branch displays \"Fail\".","s":"bank","src":"Unit 23 row 3","c":"IF mark >= 50 THEN\n    display \"Pass\"\nELSE\n    display \"Fail\"\nEND IF","tp":0},{"id":"T23-3","u":"23","q":"In an IF ... THEN ... ELSE statement, when is the ELSE block executed?","o":["Only when the condition evaluates to true","Only when the condition causes an error","Only when the condition evaluates to false","Every time, after the THEN block"],"a":2,"e":"The ELSE block runs only when the condition is false.","s":"bank","src":"Unit 23 row 4","tp":0},{"id":"T23-4","u":"23","q":"A nested IF statement is best described as:","o":["An IF statement placed inside another IF statement","An IF statement that calls a function","An IF statement that repeats until a condition is met","An IF statement that has no ELSE part"],"a":0,"e":"A nested IF is an IF statement placed inside another IF statement.","s":"bank","src":"Unit 23 row 5","tp":0},{"id":"T23-5","u":"23","q":"Which construct is most suitable for choosing one action from many possible values of a single variable (for example a menu choice 1-6)?","o":["Repeat until","CASE (select / switch)","Fixed loop","While do"],"a":1,"e":"CASE (switch) chooses one action from many possible values of a single variable.","s":"bank","src":"Unit 23 row 6","tp":0},{"id":"T23-6","u":"23","q":"In a CASE statement, what is the purpose of the OTHERWISE (default) option?","o":["To declare the variable being tested","To repeat the CASE statement","To end the program immediately","To handle any value that does not match the listed cases"],"a":3,"e":"OTHERWISE (default) handles any value that matches none of the listed cases.","s":"bank","src":"Unit 23 row 7","tp":0},{"id":"T23-7","u":"23","q":"What is the main advantage of using a CASE statement instead of many nested IF statements?","o":["It runs the loop more times","It allows the program to run without a compiler","The code is easier to read and maintain","It removes the need for variables"],"a":2,"e":"A CASE statement is easier to read and maintain than a long chain of nested IFs.","s":"bank","src":"Unit 23 row 8","tp":0},{"id":"T23-8","u":"23","q":"In Java, which keyword is used to implement the CASE construct?","o":["repeat","loop","select-for","switch"],"a":3,"e":"Java uses the switch keyword for the CASE construct.","s":"bank","src":"Unit 23 row 9","tp":0},{"id":"T23-9","u":"23","q":"A WHILE ... DO loop checks its condition:","o":["After each iteration of the loop body","Only when the loop ends","Only once when the program starts","Before each iteration of the loop body"],"a":3,"e":"A WHILE loop tests its condition before each pass through the loop body.","s":"bank","src":"Unit 23 row 10","tp":3},{"id":"T23-10","u":"23","q":"What is the minimum number of times the body of a WHILE ... DO loop can execute?","o":["It always runs at least once","Zero","Two","One"],"a":1,"e":"If the condition is false at the start, a WHILE loop's body never runs, so the minimum is zero.","s":"bank","src":"Unit 23 row 11","tp":3},{"id":"T23-11","u":"23","q":"What is the output of the following pseudocode?","o":["1 2 3 4","1 2 3","2 3 4","0 1 2 3"],"a":1,"e":"count starts at 1 and the loop runs while count < 4, so it displays 1, 2 and 3.","s":"bank","src":"Unit 23 row 12","c":"count = 1\nWHILE count < 4 DO\n    display count\n    count = count + 1\nEND WHILE","tp":3},{"id":"T23-12","u":"23","q":"Which situation will cause a WHILE loop to become an infinite loop?","o":["The loop contains an IF statement","The loop variable is increased by 1 each time","The loop variable is never changed inside the loop, so the condition always stays true","The condition is false at the start"],"a":2,"e":"If the loop variable never changes, the condition stays true and the loop never ends.","s":"bank","src":"Unit 23 row 13","tp":3},{"id":"T23-13","u":"23","q":"A REPEAT ... UNTIL loop is guaranteed to execute its body at least:","o":["Zero times","Twice","Ten times","Once"],"a":3,"e":"REPEAT…UNTIL tests the condition after the body, so the body always runs at least once.","s":"bank","src":"Unit 23 row 14","tp":3},{"id":"T23-14","u":"23","q":"In a REPEAT ... UNTIL loop the loop stops when:","o":["An ELSE statement is reached","The counter reaches zero only","The condition becomes false","The condition becomes true"],"a":3,"e":"REPEAT…UNTIL keeps looping until the condition becomes true.","s":"bank","src":"Unit 23 row 15","tp":0},{"id":"T23-15","u":"23","q":"Which task is best suited to a REPEAT ... UNTIL loop?","o":["Choosing an option from a menu of five items","Declaring a global variable","Asking the user to enter a password until a correct one is entered","Printing the numbers 1 to 10 exactly"],"a":2,"e":"A password prompt must run at least once and repeat until the input is correct, so REPEAT…UNTIL suits it.","s":"bank","src":"Unit 23 row 16","tp":1},{"id":"T23-16","u":"23","q":"What is the main difference between WHILE ... DO and REPEAT ... UNTIL?","o":["WHILE tests the condition before the body; REPEAT tests it after the body","There is no difference","WHILE can only count; REPEAT can only compare text","WHILE tests the condition after the body; REPEAT tests it before the body"],"a":0,"e":"WHILE tests the condition before the body. REPEAT tests it after the body.","s":"bank","src":"Unit 23 row 17","tp":3},{"id":"T23-17","u":"23","q":"In service-oriented event-driven programming, an event is typically:","o":["A request or message arriving from another program or service","A variable declared as global","A syntax error found by the compiler","A loop that counts from 1 to 10"],"a":0,"e":"In service-oriented programming, an event is a request or message from another program or service.","s":"bank","src":"Unit 23 row 18","tp":1},{"id":"T23-18","u":"23","q":"Which is an example of service-oriented event-driven processing?","o":["A web service that runs a routine each time a client sends it a request","A loop that adds numbers in an array","A program that prints a fixed report and then ends","A compiler converting source code into machine code"],"a":0,"e":"A web service runs its routine whenever a client request arrives. That request is the event.","s":"bank","src":"Unit 23 row 19","tp":1},{"id":"T23-19","u":"23","q":"A program that runs in the background waiting for requests from other applications is known as a:","o":["Service","Editor","Constant","Compiler"],"a":0,"e":"A service runs in the background, waiting for requests from other applications.","s":"bank","src":"Unit 23 row 20","tp":3},{"id":"T23-20","u":"23","q":"Time-driven event programming means that code is triggered by:","o":["A keyboard key press only","A mouse click only","A timer or a specific time/interval","A syntax error"],"a":2,"e":"In time-driven programming, a timer or a set time triggers the code.","s":"bank","src":"Unit 23 row 21","tp":1},{"id":"T23-21","u":"23","q":"Which is an example of a time-driven event?","o":["A user clicking a Submit button","An automatic backup that runs every night at 2:00 am","A user typing their name into a text box","A user moving the mouse over an image"],"a":1,"e":"A nightly backup at 2:00 am is triggered by the clock, so it is a time-driven event.","s":"bank","src":"Unit 23 row 22","tp":1},{"id":"T23-22","u":"23","q":"A screen saver that appears after 10 minutes of no activity is an example of which type of event-driven programming?","o":["Service oriented","Procedural","Time driven","Form based"],"a":2,"e":"The screen saver starts after a set time with no activity, so it is time-driven.","s":"bank","src":"Unit 23 row 23","tp":1},{"id":"T23-23","u":"23","q":"What is an event handler?","o":["A variable that stores the value of an event","A routine (method) that runs in response to a specific event","A tool used to compile the program","A loop that never stops"],"a":1,"e":"An event handler is a routine that runs in response to a particular event.","s":"bank","src":"Unit 23 row 24","tp":1},{"id":"T23-24","u":"23","q":"In a GUI program, the code that runs when the user clicks the \"Save\" button is called the button's:","o":["Event handler","Constructor","Compiler","Global variable"],"a":0,"e":"The code that runs when the Save button is clicked is that button's event handler.","s":"bank","src":"Unit 23 row 25","tp":1},{"id":"T23-25","u":"23","q":"In Java, which interface is commonly implemented to handle a button click event?","o":["Serializable","Runnable","ActionListener","Comparable"],"a":2,"e":"In Java, button clicks are handled by implementing ActionListener.","s":"bank","src":"Unit 23 row 26","tp":1},{"id":"T23-26","u":"23","q":"A trigger function is best described as:","o":["Code that runs automatically when a specified event or condition occurs","A loop that runs a fixed number of times","A function that must be called manually by the user every time","A function that converts byte code into machine code"],"a":0,"e":"A trigger function runs automatically when a specified event or condition occurs.","s":"bank","src":"Unit 23 row 27","tp":1},{"id":"T23-27","u":"23","q":"In a database, a trigger that automatically updates stock levels when a new sale is inserted is an example of:","o":["A class library","A fixed loop","A global variable","A trigger function"],"a":3,"e":"Code that runs automatically when a new sale is inserted is a trigger function.","s":"bank","src":"Unit 23 row 28","tp":1},{"id":"T23-28","u":"23","q":"What is the relationship between an event and a trigger function?","o":["The trigger function must finish before any event can occur","The event occurs and the trigger function is fired in response","They are unrelated concepts","An event is a type of variable used inside a trigger"],"a":1,"e":"First the event happens, then the trigger function fires in response.","s":"bank","src":"Unit 23 row 29","tp":1},{"id":"T23-29","u":"23","q":"Which of the following is a mouse event?","o":["onload","onsubmit","onclick","onkeypress"],"a":2,"e":"onclick is a mouse event. onload, onsubmit and onkeypress are not mouse events.","s":"bank","src":"Unit 23 row 30","tp":1},{"id":"T23-30","u":"23","q":"The event fired when the pointer moves onto an element is:","o":["mouseover","submit","keydown","change"],"a":0,"e":"mouseover fires when the pointer moves onto an element.","s":"bank","src":"Unit 23 row 31","tp":1},{"id":"T23-31","u":"23","q":"Which mouse event is commonly used to open an item when the user clicks twice quickly?","o":["Double-click (dblclick)","reset","blur","keyup"],"a":0,"e":"dblclick (double-click) fires when the user clicks twice quickly.","s":"bank","src":"Unit 23 row 32","tp":1},{"id":"T23-32","u":"23","q":"Which event occurs when a user presses a key down on the keyboard?","o":["mouseup","keydown","onload","submit"],"a":1,"e":"keydown fires when a key is pressed down.","s":"bank","src":"Unit 23 row 33","tp":1},{"id":"T23-33","u":"23","q":"Which is the correct order of keyboard events when a key is pressed and released?","o":["submit, then keyup","keyup, then keydown","keydown, then keyup","mouseover, then keydown"],"a":2,"e":"keydown fires first when the key is pressed, then keyup when it is released.","s":"bank","src":"Unit 23 row 34","tp":1},{"id":"T23-34","u":"23","q":"A program that moves a game character when the arrow keys are pressed is responding to:","o":["Time-driven events","Mouse events","Form reset events","Keyboard events"],"a":3,"e":"Pressing arrow keys produces keyboard events.","s":"bank","src":"Unit 23 row 35","tp":1},{"id":"T23-35","u":"23","q":"The HTML event that fires when a web page has finished loading is:","o":["onload","onmouseout","onclick","onkeydown"],"a":0,"e":"onload fires when the page has finished loading.","s":"bank","src":"Unit 23 row 36","tp":1},{"id":"T23-36","u":"23","q":"An HTML object event that occurs when an image fails to load is:","o":["onerror","onfocus","onkeypress","onsubmit"],"a":0,"e":"onerror fires when something, such as an image, fails to load.","s":"bank","src":"Unit 23 row 37","tp":1},{"id":"T23-37","u":"23","q":"Which HTML event is triggered when the browser window is resized?","o":["onclick","onresize","onselect","onchange"],"a":1,"e":"onresize fires when the browser window is resized.","s":"bank","src":"Unit 23 row 38","tp":1},{"id":"T23-38","u":"23","q":"Which event occurs when a user sends a completed form to the server?","o":["onsubmit","onmouseover","onload","onkeyup"],"a":0,"e":"onsubmit fires when a form is sent.","s":"bank","src":"Unit 23 row 39","tp":1},{"id":"T23-39","u":"23","q":"The form event that fires when the value of a drop-down list is changed is:","o":["onresize","onunload","onchange","onclick"],"a":2,"e":"onchange fires when the selected value of a drop-down list changes.","s":"bank","src":"Unit 23 row 40","tp":1},{"id":"T23-40","u":"23","q":"Which form event fires when an input field receives the cursor (becomes active)?","o":["onfocus","onblur","onsubmit","onerror"],"a":0,"e":"onfocus fires when an input field becomes active.","s":"bank","src":"Unit 23 row 41","tp":1},{"id":"T23-41","u":"23","q":"Which of the following is a user interface event?","o":["A window being scrolled","A database backup at midnight","A variable going out of scope","A compiler optimizing code"],"a":0,"e":"Scrolling a window is something the user does in the interface, so it is a user interface event.","s":"bank","src":"Unit 23 row 42","tp":1},{"id":"T23-42","u":"23","q":"The event raised when a user leaves (moves away from) a text box is:","o":["focus","submit","blur","load"],"a":2,"e":"blur fires when the user leaves a field. It is the opposite of focus.","s":"bank","src":"Unit 23 row 43","tp":1},{"id":"T23-43","u":"23","q":"Selecting a different tab in an application window generates a:","o":["Compiler event","User interface event","Service request event","Time-driven event"],"a":1,"e":"Selecting a tab is an action on the interface, so it generates a user interface event.","s":"bank","src":"Unit 23 row 44","tp":1},{"id":"T23-44","u":"23","q":"What is the role of an event loop in an event-driven program?","o":["To continuously wait for events and dispatch them to the correct handler","To store all global variables","To count the number of lines in the program","To compile the program before it runs"],"a":0,"e":"The event loop keeps waiting for events and sends each one to its handler.","s":"bank","src":"Unit 23 row 45","tp":1},{"id":"T23-45","u":"23","q":"In an event-driven program, events waiting to be processed are usually held in an:","o":["Class library","Event queue","Byte code file","Array of constants"],"a":1,"e":"Events waiting to be processed are held in an event queue.","s":"bank","src":"Unit 23 row 46","tp":1},{"id":"T23-46","u":"23","q":"When does the main event loop of a GUI application normally end?","o":["After the first event is handled","When the application is closed","When a variable is declared","After exactly 100 iterations"],"a":1,"e":"The main event loop runs until the application is closed.","s":"bank","src":"Unit 23 row 47","tp":1},{"id":"T23-47","u":"23","q":"Event-driven programs are considered flexible because:","o":["They only run on one operating system","The program always runs in a fixed order from top to bottom","They cannot be changed once written","The user decides the order in which actions happen"],"a":3,"e":"Event-driven programs are flexible because the user chooses the order of actions.","s":"bank","src":"Unit 23 row 48","tp":1},{"id":"T23-48","u":"23","q":"Which feature of event-driven programming allows new buttons and handlers to be added without rewriting the whole program?","o":["Fixed loops","Global variables","Flexibility","Byte code"],"a":2,"e":"Event-driven programs are flexible: new controls and handlers can be added without rewriting everything.","s":"bank","src":"Unit 23 row 49","tp":1},{"id":"T23-49","u":"23","q":"Why is event-driven programming well suited to graphical user interfaces (GUIs)?","o":["GUIs do not need any input from the user","GUIs only run batch processes","GUIs respond to user actions such as clicks and key presses, which are events","GUIs cannot use loops"],"a":2,"e":"GUIs respond to user actions such as clicks and key presses, and these are events.","s":"bank","src":"Unit 23 row 50","tp":1},{"id":"T23-50","u":"23","q":"Which type of application is the BEST example of event-driven programming?","o":["A script that calculates a fixed formula once","A word processor with menus, toolbars and buttons","A compiler converting code","A batch program that prints payslips overnight"],"a":1,"e":"A word processor waits for the user to choose menus, toolbars and buttons, so it is event-driven.","s":"bank","src":"Unit 23 row 51","tp":1},{"id":"T23-51","u":"23","q":"How does event-driven programming make programming simpler?","o":["It removes the need to test the program","All code must be written in a single long procedure","It does not require any variables","Each event handler is a small, separate piece of code dealing with one action"],"a":3,"e":"Each event handler is a small, separate piece of code, which makes programming simpler.","s":"bank","src":"Unit 23 row 52","tp":1},{"id":"T23-52","u":"23","q":"Visual development tools that let you drag controls onto a form and then write code for each control's events mainly support which feature?","o":["Parameter passing","Post-check loops","Data abstraction","Simplicity of programming"],"a":3,"e":"Drag-and-drop form designers make event-driven programs simpler to create.","s":"bank","src":"Unit 23 row 53","tp":1},{"id":"T23-53","u":"23","q":"Which feature of event-driven programming is supported by IDEs that automatically generate the code skeleton for event handlers?","o":["Fixed loops","Global variables","Message passing","Ease of development"],"a":3,"e":"IDEs that generate handler skeletons make development easier and faster.","s":"bank","src":"Unit 23 row 54","tp":1},{"id":"T23-54","u":"23","q":"Event-driven development is considered fast because:","o":["All events are handled by one large loop written by the developer","Programs are always written in machine code","There is no need for a user interface","Pre-built controls and generated handler templates reduce the code a developer must write"],"a":3,"e":"Ready-made controls and generated handler templates mean less code to write.","s":"bank","src":"Unit 23 row 55","tp":1},{"id":"T23-55","u":"23","q":"In OOP, objects being 'discrete' means:","o":["Objects can only exist inside loops","Each object is a separate, self-contained unit with its own data and behavior","Objects cannot interact with each other","All objects share the same single set of data"],"a":1,"e":"Discrete means each object is a separate unit with its own data and behavior.","s":"bank","src":"Unit 23 row 56","tp":2},{"id":"T23-56","u":"23","q":"Two Car objects created from the same class have different colors. This shows that objects are:","o":["Procedures","Discrete - each holds its own state","Global variables","Constants"],"a":1,"e":"Each Car object stores its own state, such as its color, so objects are discrete.","s":"bank","src":"Unit 23 row 57","tp":2},{"id":"T23-57","u":"23","q":"Which OOP feature allows a well-tested class to be used again in a new program?","o":["Global variables","Break-points","Fixed loops","Reusable units"],"a":3,"e":"A well-tested class is a reusable unit that can be used again in new programs.","s":"bank","src":"Unit 23 row 58","tp":2},{"id":"T23-58","u":"23","q":"What is a main benefit of reusable units in object-oriented programming?","o":["Programs need less memory","Reduced development time and fewer errors","Classes no longer need testing","Programs no longer need documentation"],"a":1,"e":"Reusing tested classes saves development time and reduces errors.","s":"bank","src":"Unit 23 row 59","tp":2},{"id":"T23-59","u":"23","q":"In the analysis stage of OOP, nouns in a problem description (e.g. Customer, Order, Product) are usually used to:","o":["Identify the loops","Identify the compiler","Identify the global variables","Identify the objects/classes"],"a":3,"e":"Nouns in a problem description usually become the objects or classes.","s":"bank","src":"Unit 23 row 60","tp":2},{"id":"T23-60","u":"23","q":"In a library system, which of the following would MOST likely be identified as an object?","o":["Seven","Quickly","Borrow","Book"],"a":3,"e":"Book is a thing (a noun), so it is an object. Borrow is an action and would be a method.","s":"bank","src":"Unit 23 row 61","tp":1},{"id":"T23-61","u":"23","q":"Data abstraction in OOP means:","o":["Deleting unused data","Showing only the essential features of an object and hiding the internal details","Storing all data in global variables","Copying data from one object to another"],"a":1,"e":"Data abstraction shows only an object's essential features and hides the internal details.","s":"bank","src":"Unit 23 row 62","tp":2},{"id":"T23-62","u":"23","q":"A driver uses a car's steering wheel and pedals without knowing how the engine works. This is an example of:","o":["Parameter passing","Inheritance","Abstraction","A fixed loop"],"a":2,"e":"The driver uses the controls without knowing how the engine works. That is abstraction.","s":"bank","src":"Unit 23 row 63","tp":0},{"id":"T23-63","u":"23","q":"In OOP, modularity means:","o":["A program is divided into separate classes that can be developed and tested independently","The whole program is written in one file with no structure","Objects cannot communicate","Every variable is global"],"a":0,"e":"Modularity divides a program into separate classes that can be developed and tested independently.","s":"bank","src":"Unit 23 row 64","tp":1},{"id":"T23-64","u":"23","q":"Which is a benefit of modularity?","o":["The program no longer needs documentation","All variables can be shared globally","The program always runs faster","Different developers can work on different classes at the same time"],"a":3,"e":"With separate modules, different developers can work on different classes at the same time.","s":"bank","src":"Unit 23 row 65","tp":1},{"id":"T23-65","u":"23","q":"Classification in OOP refers to:","o":["Sorting numbers into ascending order","Hiding variables from other classes","Grouping objects with common attributes and behaviors into classes","Converting source code into byte code"],"a":2,"e":"Classification groups objects with shared attributes and behaviors into classes.","s":"bank","src":"Unit 23 row 66","tp":2},{"id":"T23-66","u":"23","q":"Dog, Cat and Horse objects are all grouped under the class Animal. This is an example of:","o":["A Boolean operator","A post-check loop","Classification","Message passing"],"a":2,"e":"Grouping Dog, Cat and Horse under Animal is classification.","s":"bank","src":"Unit 23 row 67","tp":2},{"id":"T23-68","u":"23","q":"In Java, which keyword is used to make one class inherit from another?","o":["super-class","extends","implements","inherits"],"a":1,"e":"In Java, extends makes one class inherit from another.","s":"bank","src":"Unit 23 row 69","tp":2},{"id":"T23-69","u":"23","q":"If class SavingsAccount inherits from class Account, then Account is called the:","o":["Subclass (child class)","Interface","Object","Superclass (parent class)"],"a":3,"e":"Account is the superclass (parent). SavingsAccount is the subclass (child).","s":"bank","src":"Unit 23 row 70","tp":2},{"id":"T23-70","u":"23","q":"A class is best described as:","o":["A type of loop","An error that stops the program","A single value stored in memory","A blueprint or template from which objects are created"],"a":3,"e":"A class is a blueprint (template) for creating objects.","s":"bank","src":"Unit 23 row 71","tp":2},{"id":"T23-71","u":"23","q":"An object is:","o":["A keyword for loops","An instance of a class","A type of comment","A copy of the compiler"],"a":1,"e":"An object is one instance of a class.","s":"bank","src":"Unit 23 row 72","tp":2},{"id":"T23-72","u":"23","q":"Which Java keyword creates a new object from a class?","o":["static","new","create","class"],"a":1,"e":"The new keyword creates an object from a class.","s":"bank","src":"Unit 23 row 73","tp":2},{"id":"T23-73","u":"23","q":"In OOP, a method is:","o":["A function defined inside a class that describes an object's behavior","A variable that stores text","A type of loop","A file that stores byte code"],"a":0,"e":"A method is a function inside a class that defines what its objects can do.","s":"bank","src":"Unit 23 row 74","tp":2},{"id":"T23-74","u":"23","q":"In the statement account.deposit(500); what is deposit?","o":["A package","A method","A class","An attribute"],"a":1,"e":"deposit(500) is a call to the deposit method of the account object.","s":"bank","src":"Unit 23 row 75","tp":2},{"id":"T23-75","u":"23","q":"A special method that is called automatically when an object is created is a:","o":["Constructor","Break-point","Trigger","Destructor loop"],"a":0,"e":"A constructor runs automatically when an object is created.","s":"bank","src":"Unit 23 row 76","tp":2},{"id":"T23-76","u":"23","q":"In OOP, message passing means:","o":["Objects communicate by calling each other's methods","Printing messages on the screen only","Copying files between computers","Sending emails from a program"],"a":0,"e":"In message passing, objects communicate by calling each other's methods.","s":"bank","src":"Unit 23 row 77","tp":2},{"id":"T23-77","u":"23","q":"When object A calls printer.print(document), object A is:","o":["Declaring a global variable","Inheriting from the printer object","Sending a message to the printer object","Creating a fixed loop"],"a":2,"e":"Calling printer.print(document) sends a message to the printer object.","s":"bank","src":"Unit 23 row 78","tp":1},{"id":"T23-78","u":"23","q":"In procedural programming, a procedure is:","o":["A type of loop","A variable that cannot change","A named block of code that performs a task and does not have to return a value","A block of code that must always return a value"],"a":2,"e":"A procedure is a named block of code that performs a task. It doesn't have to return a value.","s":"bank","src":"Unit 23 row 79","tp":3},{"id":"T23-79","u":"23","q":"Which statement about procedures is correct?","o":["A procedure must be written in machine code","A procedure can only be used once","A procedure cannot accept parameters","A procedure can be called many times from different parts of a program"],"a":3,"e":"A procedure can be called many times from different parts of a program.","s":"bank","src":"Unit 23 row 80","tp":0},{"id":"T23-80","u":"23","q":"What is the main difference between a function and a procedure?","o":["A procedure returns a value; a function does not","A function cannot accept parameters","There is no difference","A function returns a value; a procedure does not need to"],"a":3,"e":"A function returns a value. A procedure does not need to.","s":"bank","src":"Unit 23 row 81","tp":3},{"id":"T23-81","u":"23","q":"Which keyword is used in Java to send a value back from a function (method)?","o":["break","return","exit","send"],"a":1,"e":"In Java, return sends a value back from a method.","s":"bank","src":"Unit 23 row 82","tp":3},{"id":"T23-82","u":"23","q":"Which of the following is a pre-defined (built-in) function?","o":["displayCustomerMenu()","Math.sqrt()","calculateMyBonus()","checkStudentGrade()"],"a":1,"e":"Math.sqrt() is built into Java. The others are functions a programmer would write.","s":"bank","src":"Unit 23 row 83","tp":3},{"id":"T23-83","u":"23","q":"What is an advantage of using pre-defined functions?","o":["They are already written and tested, saving development time","They must be rewritten in every program","They cannot be used with parameters","They always run slower than user-written functions"],"a":0,"e":"Pre-defined functions are already written and tested, which saves development time.","s":"bank","src":"Unit 23 row 84","tp":3},{"id":"T23-85","u":"23","q":"What happens to a local variable when the function it was declared in finishes?","o":["It is saved to a file automatically","It keeps its value for the next program run","It is destroyed and its memory is released","It becomes a global variable"],"a":2,"e":"A local variable is destroyed when its function finishes, and its memory is released.","s":"bank","src":"Unit 23 row 86","tp":3},{"id":"T23-86","u":"23","q":"A global variable is:","o":["A variable that holds only numbers","Only accessible inside one function","Declared outside all procedures and accessible throughout the program","A constant that cannot be changed"],"a":2,"e":"A global variable is declared outside all procedures and can be used anywhere in the program.","s":"bank","src":"Unit 23 row 87","tp":3},{"id":"T23-87","u":"23","q":"Why should the use of global variables be kept to a minimum?","o":["They are deleted after each function call","They cannot store text","They can be changed from anywhere, making errors harder to trace","They make the program impossible to compile"],"a":2,"e":"Global variables can be changed from anywhere, which makes errors harder to trace.","s":"bank","src":"Unit 23 row 88","tp":3},{"id":"T23-88","u":"23","q":"Passing a parameter BY VALUE means:","o":["A copy of the data is passed, so the original variable is not changed","No data is passed","The memory address is passed so the original can be changed","The variable becomes global"],"a":0,"e":"Passing by value sends a copy, so the original variable doesn't change.","s":"bank","src":"Unit 23 row 89","tp":3},{"id":"T23-89","u":"23","q":"Passing a parameter BY REFERENCE means:","o":["Only a copy of the value is passed","The parameter is ignored","The address of the original variable is passed, so changes affect the original","The parameter must be a constant"],"a":2,"e":"Passing by reference sends the original variable's address, so changes affect the original.","s":"bank","src":"Unit 23 row 90","tp":0},{"id":"T23-90","u":"23","q":"In the call calculateArea(5, 8), the values 5 and 8 are known as:","o":["Arguments (actual parameters)","Global constants","Local variables","Return values"],"a":0,"e":"The values passed in a call are the arguments (actual parameters).","s":"bank","src":"Unit 23 row 91","tp":3},{"id":"T23-91","u":"23","q":"In procedural programming, modularity means:","o":["Writing the whole program as a single block","Avoiding the use of loops","Using only global variables","Breaking a program into smaller procedures and functions"],"a":3,"e":"Procedural modularity breaks a program into smaller procedures and functions.","s":"bank","src":"Unit 23 row 92","tp":1},{"id":"T23-92","u":"23","q":"Which is NOT a benefit of modular programming?","o":["The program is easier to maintain","Modules can be tested separately","It guarantees the program has no errors","Modules can be reused"],"a":2,"e":"Modular programs are easier to maintain, test and reuse, but they can still contain errors.","s":"bank","src":"Unit 23 row 93","tp":1},{"id":"T23-93","u":"23","q":"Which control structure repeats a set number of times that is known in advance?","o":["Break-point","Pre-check loop with unknown condition","Fixed loop (FOR loop)","Conditional command"],"a":2,"e":"A fixed (FOR) loop repeats a number of times known in advance.","s":"bank","src":"Unit 23 row 94","tp":3},{"id":"T23-94","u":"23","q":"How many times will this loop run?","o":["1","5","6","4"],"a":1,"e":"FOR i = 1 TO 5 runs once for each value 1, 2, 3, 4 and 5, so 5 times.","s":"bank","src":"Unit 23 row 95","c":"FOR i = 1 TO 5\n    display i\nNEXT i","tp":3},{"id":"T23-96","u":"23","q":"Which of the following is an example of a pre-check loop?","o":["DO ... WHILE","IF ... THEN","REPEAT ... UNTIL","WHILE ... DO"],"a":3,"e":"WHILE…DO checks its condition first, so it is a pre-check loop.","s":"bank","src":"Unit 23 row 97","tp":3},{"id":"T23-98","u":"23","q":"In Java, which loop is a post-check loop?","o":["do ... while","switch","while","for"],"a":0,"e":"Java's do…while tests the condition after the body, so it is a post-check loop.","s":"bank","src":"Unit 23 row 99","tp":3},{"id":"T23-100","u":"23","q":"When the program stops at a break-point, the developer can:","o":["Change the operating system","Inspect the current values of variables","Compile the program into machine code","Delete the class library"],"a":1,"e":"At a break-point, the developer can inspect the current values of variables.","s":"bank","src":"Unit 23 row 101","tp":0},{"id":"T23-101","u":"23","q":"Which of the following is a conditional command?","o":["FOR ... NEXT","Method","IF ... THEN ... ELSE","Global variable"],"a":2,"e":"IF…THEN…ELSE is a conditional command: it chooses what to do based on a condition.","s":"bank","src":"Unit 23 row 102","tp":0},{"id":"T23-103","u":"23","q":"Which Boolean operator returns TRUE only when BOTH conditions are true?","o":["AND","OR","XOR","NOT"],"a":0,"e":"AND returns TRUE only when both conditions are true.","s":"bank","src":"Unit 23 row 104","tp":0},{"id":"T23-104","u":"23","q":"If A = TRUE and B = FALSE, what is the result of (A OR B)?","o":["TRUE","NULL","FALSE","Error"],"a":0,"e":"OR returns TRUE if at least one side is true, and A is TRUE.","s":"bank","src":"Unit 23 row 105","tp":0},{"id":"T23-105","u":"23","q":"What is the result of NOT (5 > 3)?","o":["TRUE","5","3","FALSE"],"a":3,"e":"5 > 3 is TRUE, so NOT (5 > 3) is FALSE.","s":"bank","src":"Unit 23 row 106","tp":0},{"id":"T24-1","u":"24","q":"What is the main purpose of a code editor in Java development?","o":["To run the program on the JVM","To convert byte code into machine code","To write and modify the Java source code","To package the program into a JAR"],"a":2,"e":"A code editor is where you write and change the Java source code.","s":"bank","src":"Unit 24 row 2","tp":0},{"id":"T24-2","u":"24","q":"Which of the following is an example of an editor/IDE used to write Java code?","o":["javac","JAR","IntelliJ IDEA","JVM"],"a":2,"e":"IntelliJ IDEA is an IDE for writing Java. javac compiles, the JVM runs, and a JAR is a package file.","s":"bank","src":"Unit 24 row 3","tp":0},{"id":"T24-3","u":"24","q":"Which editor feature highlights keywords, strings and comments in different colors?","o":["Syntax highlighting","Code completion","Code folding","Refactoring"],"a":0,"e":"Syntax highlighting colors keywords, strings and comments so code is easier to read.","s":"bank","src":"Unit 24 row 4","tp":0},{"id":"T24-4","u":"24","q":"Java source code written in an editor is saved in a file with which extension?","o":[".jar",".java",".jav",".class"],"a":1,"e":"Java source files are saved with the .java extension. Compiled files use .class.","s":"bank","src":"Unit 24 row 5","tp":0},{"id":"T24-5","u":"24","q":"In Java, which component interprets byte code so the program can run?","o":["The javadoc tool","The javac compiler","The Java Virtual Machine (JVM)","The JAR tool"],"a":2,"e":"The Java Virtual Machine (JVM) runs the byte code.","s":"bank","src":"Unit 24 row 6","tp":0},{"id":"T24-6","u":"24","q":"Which command is used to run a compiled Java program?","o":["javadoc","java","jar -c","javac"],"a":1,"e":"The java command runs a compiled program. javac compiles it.","s":"bank","src":"Unit 24 row 7","tp":0},{"id":"T24-7","u":"24","q":"An interpreter differs from a compiler because it:","o":["Translates and executes code one instruction at a time","Only checks spelling in comments","Translates the whole program into one file before running","Is used only to edit code"],"a":0,"e":"An interpreter translates and runs code one instruction at a time. A compiler translates the whole program first.","s":"bank","src":"Unit 24 row 8","tp":0},{"id":"T24-8","u":"24","q":"Which part of the JVM improves performance by converting frequently used byte code into native machine code while the program runs?","o":["Just-In-Time (JIT) compiler","Text editor","Class library","Debugger break-point"],"a":0,"e":"The Just-In-Time (JIT) compiler turns frequently used byte code into native machine code while the program runs, which makes it faster.","s":"bank","src":"Unit 24 row 9","tp":0},{"id":"T24-9","u":"24","q":"Which command compiles a Java source file?","o":["javaw","java","jar","javac"],"a":3,"e":"javac is the Java compiler command.","s":"bank","src":"Unit 24 row 10","tp":0},{"id":"T24-10","u":"24","q":"The Java compiler converts .java source files into:","o":[".class files containing byte code",".html files",".txt files",".exe files containing machine code"],"a":0,"e":"The compiler turns .java source files into .class files that contain byte code.","s":"bank","src":"Unit 24 row 11","tp":0},{"id":"T24-11","u":"24","q":"When are syntax errors in a Java program detected?","o":["When the program is saved","When the program is packaged into a JAR","At compile time, by the compiler","At run time, by the JVM"],"a":2,"e":"The compiler checks syntax, so syntax errors are found at compile time.","s":"bank","src":"Unit 24 row 12","tp":0},{"id":"T24-12","u":"24","q":"Which software package must be installed to compile Java programs?","o":["JRE only","JDK (Java Development Kit)","A web browser","A word processor"],"a":1,"e":"The JDK contains the compiler (javac). The JRE can only run programs.","s":"bank","src":"Unit 24 row 13","tp":0},{"id":"T24-13","u":"24","q":"Which OOP principle hides an object's data and allows access only through its methods?","o":["Iteration","Selection","Encapsulation","Compilation"],"a":2,"e":"Encapsulation hides an object's data and lets other code reach it only through its methods.","s":"bank","src":"Unit 24 row 14","tp":1},{"id":"T24-14","u":"24","q":"Polymorphism in OOP means:","o":["A class can inherit from only one parent","An object's data is hidden from other classes","A class is a template for objects","One method name can behave differently depending on the object that uses it"],"a":3,"e":"Polymorphism lets the same method name do different things depending on the object.","s":"bank","src":"Unit 24 row 15","tp":0},{"id":"T24-15","u":"24","q":"In Java, which access modifier is used to keep a class attribute hidden from other classes?","o":["static","public","final","private"],"a":3,"e":"The private modifier hides an attribute from other classes.","s":"bank","src":"Unit 24 row 16","tp":0},{"id":"T24-16","u":"24","q":"Methods used to read and update private attributes are called:","o":["Constructors and destructors","Interfaces and packages","Static and final methods","Getters and setters"],"a":3,"e":"Getters read private attributes and setters update them.","s":"bank","src":"Unit 24 row 17","tp":1},{"id":"T24-17","u":"24","q":"Which is the correct order of the main stages of the software development lifecycle (SDLC)?","o":["Design, Testing, Analysis, Maintenance, Implementation","Testing, Implementation, Design, Analysis","Analysis, Design, Implementation, Testing, Deployment, Maintenance","Deployment, Analysis, Testing, Design"],"a":2,"e":"The SDLC runs from analysis and design, through implementation and testing, to deployment and maintenance.","s":"bank","src":"Unit 24 row 18","tp":0},{"id":"T24-18","u":"24","q":"In which SDLC stage are the user's requirements gathered?","o":["Implementation","Analysis (requirements)","Maintenance","Testing"],"a":1,"e":"User requirements are gathered in the analysis (requirements) stage.","s":"bank","src":"Unit 24 row 19","tp":3},{"id":"T24-19","u":"24","q":"Fixing bugs and adding small enhancements after the software is released happens in which stage?","o":["Design","Maintenance","Feasibility","Analysis"],"a":1,"e":"Fixing bugs and making small improvements after release is maintenance.","s":"bank","src":"Unit 24 row 20","tp":0},{"id":"T24-20","u":"24","q":"In which SDLC stage is the actual program code written?","o":["Implementation (coding)","Maintenance","Analysis","Evaluation"],"a":0,"e":"The program code is written in the implementation (coding) stage.","s":"bank","src":"Unit 24 row 21","tp":1},{"id":"T24-21","u":"24","q":"Which development methodology delivers software in short iterations called sprints?","o":["V-Model","Waterfall","Big Bang","Agile (Scrum)"],"a":3,"e":"Agile (Scrum) delivers working software in short iterations called sprints.","s":"bank","src":"Unit 24 row 22","tp":1},{"id":"T24-22","u":"24","q":"In the Waterfall methodology:","o":["Requirements change in every iteration","Each stage must be completed before the next begins","Testing happens before design","All stages happen at the same time"],"a":1,"e":"In Waterfall, each stage is finished before the next one starts.","s":"bank","src":"Unit 24 row 23","tp":1},{"id":"T24-23","u":"24","q":"Which practice combines development and operations to automate building, testing and deployment?","o":["Agile","DevOps","Waterfall","Rapid Application Dev
