<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diploma CBT Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: test-centre console. Steel chrome bar on top, workspace card below; unit "blueprint" rail on the dashboard. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --chrome:#1f3349; --chrome-fg:#e8eef5;
  --fg:#18222e; --muted:#5b6878; --line:#d5dbe3; --soft:#f5f7fa;
  --accent:#2563a8; --accent-soft:#e3edf8; --flag:#c98a0b; --flag-soft:#fbf1dc;
  --good:#1d7a4c; --good-soft:#e2f3ea; --bad:#b93a32; --bad-soft:#fbe7e5; --draft:#7a4fb0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);color:var(--chrome-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand small{font-weight:500;opacity:.7;margin-left:8px;font-size:.85rem}
.bar .sp{flex:1}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);color:#fff}
main{max-width:1100px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;font-weight:600;color:var(--muted)}
.panel>*{min-width:0}
.kf{margin-top:6px;font-size:.9rem}
.kf summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.kf ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:4px}
.week{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;background:var(--panel)}
.week.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.week.past{opacity:.75}
.week.brk{background:var(--soft);border-style:dashed}
.task{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.task label{flex:1;min-width:180px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.task .task-done{text-decoration:line-through;color:var(--muted)}
.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px 18px}
details summary{list-style-position:outside}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mode{display:grid;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;color:var(--fg);font:inherit}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode .t{font-family:var(--f-display);font-size:1.15rem;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mode .t span{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.mode.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode.primary .t span,.mode.primary .muted{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .mode.primary,.dk .mode.primary{color:#0f151c}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.flag.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blueprint */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-mono);font-size:.88rem}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.g{background:var(--good)} .meter i.w{background:var(--flag)} .meter i.b{background:var(--bad)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;font-family:var(--f-body)}
.chip.draft{color:var(--draft)} .chip.booklet{color:var(--good)} .chip.sample{color:var(--accent)} .chip.fix{color:var(--good)} .chip.warn{color:var(--flag)} .chip.none{color:var(--muted)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
@media (max-width:820px){.exam{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.qnum{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.qtext{font-size:1.12rem;font-weight:500;white-space:pre-wrap;margin-bottom:18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.85rem}
.opt .x{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .l{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .l{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt:disabled{cursor:default}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.nav button{font-family:var(--f-mono);font-size:.8rem;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;position:relative;padding:0}
.nav button.a{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--fg);outline-offset:1px}
.nav button.f::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.nav button.ok{background:var(--good-soft);border-color:var(--good)} .nav button.no{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.feedback{margin-top:16px;border-radius:6px;padding:14px 16px;border:1px solid var(--line);background:var(--soft)}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:.92rem}
.conf button{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.conf button.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.score{font-family:var(--f-display);font-weight:700;font-size:3.4rem;line-height:1}
.kv{display:flex;gap:28px;flex-wrap:wrap}
.kv div{display:grid}
.kv b{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.review-item{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
.review-item .opt{padding:7px 12px}
.svgbox{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:10px}
.modal{position:fixed;inset:0;background:rgba(10,16,23,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:440px;width:100%;display:grid;gap:14px}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.75rem;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
select,input[type=number]{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
label.ck{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--soft)}
.hint{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.6rem}.score{font-size:2.6rem}.panel{padding:16px}}
@media (prefers-reduced-motion:no-preference){.opt,.mode,.btn{transition:border-color .12s,background .12s}}

body{margin:0}
main>*{min-width:0}
.mode:disabled{pointer-events:none}
.week{scroll-margin-top:72px}
.ar{font-family:'Noto Sans Arabic',Tahoma,sans-serif;text-align:right;color:var(--muted)}
.ar b{color:var(--fg)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
td.c-e{white-space:nowrap}
@media (hover:none) and (pointer:coarse){.kh{display:none}}
@media (max-width:900px){.brand small{display:none} .bp thead{display:none} .bp,.bp tbody{display:block} .bp tr{display:grid;grid-template-columns:auto auto auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center} .bp td{border:0;padding:0;text-align:left} .bp td.c-u{grid-column:1/-1} .bp td.c-b{grid-column:1/-1;white-space:normal!important} .bp td.c-e,.bp td.c-q,.bp td.c-s{font-size:.82rem;color:var(--muted)} .bp td.c-e .muted{display:none} .bp td.c-e::before{content:'Exam Qs: '} .bp td.c-q::before{content:'Bank: '} .bp td.c-s::before{content:'Seen: '} .bp td.c-a{justify-self:end} .bp td.c-a .meter{display:none} .bp td.c-b .btn{margin-top:2px}}
@media (max-width:640px){.kh{display:none} .brand small{display:none} th.mcol,td.mcol{display:none} .tw td .meter{display:none} .tw td,.tw th{padding:8px 6px}}
</style></head><body>

<script>
const BANK=[{"id":"18-1","u":"18","q":"Which one of the following roles works closely with the developer to look after the creative aspects of a project?","o":["The designer.","The information architect.","The project manager.","The content author."],"a":0,"e":"The designer owns the creative side (layout, look, branding) and works alongside the developer, who owns the technical side.","s":"bank","tp":0},{"id":"18-2","u":"18","q":"What is an example of a visual metaphor?","o":["The text size on the document screen page.","The font style of the text in a manual.","The volume icon on a desktop toolbar.","The ‘close’ button during desktop shut down."],"a":2,"e":"A visual metaphor uses a familiar picture to stand for an action or idea. A speaker icon stands for volume.","s":"bank","tp":2},{"id":"18-3","u":"18","q":"Which one of the following creates the 'look and feel' of an interactive media product?","o":["The content author.","The designer.","The developer.","The project manager."],"a":1,"e":"The designer is responsible for visual layout and aesthetics, which together make the 'look and feel'.","s":"sample","p":1,"tp":0},{"id":"18-4","u":"18","q":"Which one of the following roles works closely with the designer to look after the technical aspects of a project?","o":["The content author.","The information architect.","The developer.","The project manager."],"a":2,"e":"The developer writes the code, integrates media and makes it work. That is the technical partner to the designer.","s":"sample","p":2,"tp":0},{"id":"18-5","u":"18","q":"Which one of the following is the main problem when creating interactive media projects?","o":["Misunderstanding the user requirements.","Having a large number of users.","Misunderstanding the team roles.","Having structured project management."],"a":0,"e":"Most interactive media projects fail because the team builds the wrong thing: the user requirements were misunderstood.","s":"sample","p":3,"tp":0},{"id":"18-6","u":"18","q":"Which one of the following is a visual metaphor?","o":["The text on the document screen page.","The printer icon on a software toolbar.","Paragraphs with wider spaces.","The font style of the main text."],"a":1,"e":"A printer icon is a picture of a real object that stands for the Print action, which makes it a visual metaphor.","s":"sample","p":4,"tp":2},{"id":"18-7","u":"18","q":"Which one of the following adjustments to the user interface are necessary for a visually impaired user?","o":["Increase the screen brightness.","Decrease the screen size.","Decrease the screen contrast.","Increase the screen resolution."],"a":0,"e":"A brighter screen makes content easier to see for users with low vision. Increasing the resolution makes text and icons smaller, which makes them harder to read.","s":"sample","f":"Other helpful adjustments for visual impairment: larger fonts, high-contrast themes and screen readers.","p":5,"tp":3},{"id":"18-8","u":"18","q":"Which is the best method to test the function of an interface design?","o":["Survey.","Questionnaire.","User acceptance test.","User observation."],"a":3,"e":"Watching real users perform tasks with the interface (user observation) shows directly whether its functions work for them.","s":"sample","p":6,"tp":4},{"id":"18-9","u":"18","q":"Who works to a brief agreed with the client and creative director?","o":["Designers","Content authors","Developers","Information architects"],"a":0,"e":"Designers work to a creative brief agreed with the client and the creative director.","s":"bank","tp":0},{"id":"18-10","u":"18","q":"Who works with the information architect to ensure that design templates, standards and style sheets are used correctly in an interactive media project?","o":["Content author","Project manager","Designer","Developer"],"a":3,"e":"The developer applies the templates, standards and style sheets in the build, working with the information architect.","s":"bank","tp":0},{"id":"18-11","u":"18","q":"What could delay the feasibility stage of an interactive media product?","o":["User feedback","Developer report","Project vacancies","System downtime"],"a":2,"e":"The feasibility stage needs the right people. Unfilled project vacancies hold it up.","s":"bank","tp":0},{"id":"18-12","u":"18","q":"Who would benefit most from larger keys and fonts on a user interface?","o":["Mobility impaired user","Speech impaired user","Visually impaired user","Hearing loss impaired user"],"a":2,"e":"Larger keys and fonts help users who have trouble seeing, i.e. visually impaired users.","s":"bank","tp":3},{"id":"18-13","u":"18","q":"What is the purpose of usability testing when designing an interactive product?","o":["It is a way to create the product for a user.","It is an opportunity to check that the design works.","It is an opportunity to understand the user of the product.","It is a way to get the product ready for the user."],"a":1,"e":"Usability testing checks that the design actually works for users before it is finalized.","s":"bank","tp":0},{"id":"18-14","u":"18","q":"Whose role is it to translate user behavior into media structure when designing a user interface?","o":["A designer","A content author","A developer","A product manager"],"a":0,"e":"The designer translates how users behave into the structure and layout of the interface.","s":"bank","tp":0},{"id":"18-15","u":"18","q":"Who works with the information architect to maintain the correct branding in an interactive media project?","o":["Developer","Project manager","Designer","Product manager"],"a":2,"e":"Branding (logos, colors, fonts) is the designer's responsibility.","s":"bank","tp":0},{"id":"18-16","u":"18","q":"What is the most important issue to consider when designing a user interface?","o":["Environment","Tools","Usability","Task"],"a":2,"e":"Usability, meaning how easily users can reach their goals, is the most important consideration in UI design.","s":"bank","tp":2},{"id":"18-17","u":"18","q":"What is visual metaphor?","o":["Use of messages in a design","Use of text in a design","Use of color to convey style","Use of images to convey a message"],"a":3,"e":"A visual metaphor is the use of images to convey a message, e.g. a trash can for delete.","s":"bank","tp":2},{"id":"18-18","u":"18","q":"What alternative controls can be used by a visually impaired user to access text from an interface?","o":["Video","Animation","Screen reader","Onscreen keyboard"],"a":2,"e":"A screen reader reads on-screen text aloud, so visually impaired users can access it.","s":"bank","tp":3},{"id":"18-20","u":"18","q":"Usually, before diving into the development phase of a program or application, it is important to take note of who is going to be using the specific product. These people are known as?","o":["Gender","Education Level","Target Audience","Goals"],"a":2,"e":"The people a product is designed for are its target audience.","s":"bank","tp":0},{"id":"18-21","u":"18","q":"Keyboard and mouse are an example of what kind of devices that the operating system manages?","o":["Output","Input","System","Application"],"a":1,"e":"Keyboard and mouse send data into the computer, so they are input devices.","s":"bank","tp":1},{"id":"18-22","u":"18","q":"Which of these are the standard interface for inputting data into the computer?","o":["Keyboard","Mouse","Screen","Speech"],"a":0,"e":"The keyboard is the standard device for entering data.","s":"bank","tp":1},{"id":"18-23","u":"18","q":"Which of the following is a FEATURE of a tablet device?","o":["Has an emulator to display apps.","Small enough to fit in your hand but large enough to display a lot of information.","Does not include any app store but helps you use Microsoft Word.","Difficult to display any information."],"a":1,"e":"Tablets sit between phones and laptops: hand-held, yet with a screen big enough to show a lot of information.","s":"bank","tp":1},{"id":"18-24","u":"18","q":"Which part of the code allows you to change what text should appear?","o":["android:layout_marginTop","android:text","android:layout_marginBottom","android:layout_width"],"a":1,"e":"In an Android layout, android:text sets the text a view displays.","s":"bank","tp":0},{"id":"18-25","u":"18","q":"To help you achieve a consistent look and feel, for a document, what is most useful function of a document?","o":["Speed","Format","Navigation","Style"],"a":3,"e":"Styles apply the same formatting everywhere, which gives a consistent look and feel.","s":"bank","tp":2},{"id":"18-26","u":"18","q":"When you want to change the color of your box to green, in a document, or you feel the need to change the size, alignment, or other attributes – it is known as?","o":["Formatting","Speed","Consistency","Navigation"],"a":0,"e":"Changing color, size or alignment is formatting.","s":"bank","tp":2},{"id":"18-27","u":"18","q":"In order to change a user interface of an application, what should you take into consideration apart from the change management process?","o":["Nothing","Use-Case Narrative","Risk Analysis","No Budgeting"],"a":2,"e":"Any UI change carries risk to users and the project, so a risk analysis is needed alongside change management.","s":"bank","tp":4},{"id":"18-28","u":"18","q":"What is the likelihood of a risk if you want to simply change the look and feel of the user interface without disturbing the arrangement of the buttons/navigation controls?","o":["Low","High","Medium","No risk at all"],"a":0,"e":"Changing only the look, without moving buttons or navigation, has a low likelihood of causing problems.","s":"bank","tp":0},{"id":"18-29","u":"18","q":"Which term is used to describe the fact that software should be able to be used by ALL types of users?","o":["Accessibility","Usability","Optimization","None of the answers"],"a":0,"e":"Accessibility means the software can be used by all users, including people with disabilities.","s":"bank","tp":3},{"id":"18-30","u":"18","q":"You are to build a website that improves Search Engine Optimization (SEO) to make your site more findable. Which of the following would help you achieve that goal?","o":["Targets","Accessibility","Risk Analysis","Readability"],"a":1,"e":"Accessible pages (alt text, headings, semantic markup) are also easier for search engines to read, which improves SEO.","s":"bank","tp":3},{"id":"18-31","u":"18","q":"What type of interface would only suit an expert user?","o":["Menu Driven","WIMP - Windows Icon Menu Pointer","GUI - Graphical User Interface","Command Driven"],"a":3,"e":"Command-driven interfaces need memorized commands and syntax, so they suit expert users only.","s":"bank","tp":1},{"id":"18-32","u":"18","q":"In the process of developing a website or application, there are numerous times or instances when you have to hold meetings or conferences that allow users to pitch-in ideas, ask questions about the central idea, and practice a new innovation being introduced in the middle of the development process. What kind of meeting is this?","o":["Tutorial","Manual","Survey","Workshop"],"a":3,"e":"A workshop is an interactive session where users contribute ideas, ask questions and try things out.","s":"bank","tp":4},{"id":"18-33","u":"18","q":"When you use surveys to determine who you want your data to be represented to, what are you referring to?","o":["Identifying a Sample Frame","Choosing a Data Collection Mode","None of the mentioned options","Specifying the Population of Interest"],"a":3,"e":"Deciding who the data should represent means specifying the population of interest.","s":"bank","tp":4},{"id":"18-34","u":"18","q":"Which one of the following collects all the material and data for an interactive media product?","o":["The content author.","The designer.","The developer.","The project manager."],"a":0,"e":"The content author creates and collects the text and media content.","s":"bank","tp":0},{"id":"18-35","u":"18","q":"Which one of the following is the main challenge when creating interactive media projects?","o":["Having a structured project management.","Having a large number of users.","Lack of in-house development skills.","Delivery across multiple platforms."],"a":3,"e":"Making the product work across many devices and platforms is the main challenge.","s":"bank","tp":0},{"id":"18-36","u":"18","q":"What is most important when implementing a new IT system?","o":["To gather requirements from all departments.","To ensure the solution is feasible.","To identify the people who will use the new system.","To record and arrange the requirements into groups."],"a":2,"e":"Identify who will use the new system first. Their needs drive the requirements and the training.","s":"bank"},{"id":"18-37","u":"18","q":"What makes it easier for partially-sighted users to read from a computer screen?","o":["Changing the contrast text.","Changing the font size.","Changing the HTML tags.","Changing the reverse text."],"a":1,"e":"A larger font size makes text easier to read for partially-sighted users.","s":"bank","tp":3},{"id":"18-38","u":"18","q":"Which one of the following contributes to the readability of a technical document?","o":["Number of sections.","Line length.","Bookmarks.","Text boxes."],"a":1,"e":"Line length affects readability: lines that are too long are hard to follow.","s":"bank"},{"id":"18-40","u":"18","q":"Which is the most important feature to include in a User Manual?","o":["Standards for data security.","Program performance statistics.","Images to illustrate screen displays.","Results from User Acceptance Testing."],"a":2,"e":"Screenshots that show what the user will see make a user manual much easier to follow.","s":"bank","tp":3},{"id":"18-41","u":"18","q":"Why is a workshop most effective for gathering user feedback for a website design?","o":["To collect data from lots of users at the same time.","To link comments to the person making them.","To prevent bias in the responses from users.","To gather quantitative data for further analysis."],"a":0,"e":"A workshop gathers feedback from many users at the same time.","s":"bank","tp":4},{"id":"18-42","u":"18","q":"Why is it important to select test subjects that match the target audience?","o":["To get information on how actual users use the system.","To assess the skills of the actual users on the system.","To ensure the interactive media is tested well.","To promote the system that is being tested."],"a":0,"e":"Test subjects who match the target audience show how real users will actually use the system.","s":"bank","tp":4},{"id":"18-43","u":"18","q":"What best relates to Quality Assurance in software development?","o":["Process output.","Failure testing.","Statistical control.","Fit for purpose."],"a":3,"e":"Quality assurance aims to make the product fit for purpose.","s":"bank"},{"id":"18-44","u":"18","q":"What is the purpose of a Feasibility Study of a system?","o":["To specify the design.","A solution to a specific problem.","To specify performance criteria.","A solution for developing a system."],"a":3,"e":"A feasibility study assesses whether a proposed approach to developing a system is practical.","s":"bank"},{"id":"18-45","u":"18","q":"What is the main purpose of a risk analysis of software systems?","o":["To identify problems that might affect the project.","To maintain a safe working environment.","To determine the user demographic.","To minimize the financial cost of the project."],"a":0,"e":"Risk analysis identifies problems that might affect the project so they can be planned for.","s":"bank","tp":0},{"id":"18-46","u":"18","q":"Why is the 802.11 standard important?","o":["To ensure a common framework for public key cryptography.","To ensure a common framework for software development.","To ensure effective wireless connectivity between devices.","To ensure effective integration of voice and data."],"a":2,"e":"IEEE 802.11 is the Wi-Fi standard that lets devices connect wirelessly and reliably.","s":"bank"},{"id":"18-48","u":"18","q":"At what stage in a software project is it best to use a survey?","o":["Encryption","Coding","Software testing","Evaluation"],"a":3,"e":"Surveys collect user opinions, which is most useful when evaluating a product.","s":"bank","tp":4},{"id":"18-49","u":"18","q":"When in the interface design process are the needs of users defined?","o":["Task analysis","Usability testing","Prototyping design","Functional requirement"],"a":3,"e":"User needs are defined as functional requirements: what the system must do for them.","s":"bank","f":"Task analysis studies how users carry out their tasks. The results are written up as functional requirements.","tp":4},{"id":"18-50","u":"18","q":"What best describes the purpose of the validation and verification process?","o":["To ensure the software is completely free of defects.","To evaluate the software development process.","To evaluate the program structure.","To ensure the software is fit for purpose."],"a":3,"e":"Verification checks that the software is built right (it meets its specification). Validation checks that it is the right software (it meets users' needs). Together they confirm it is fit for purpose.","s":"bank"},{"id":"19-1","u":"19","q":"In UML sequence diagrams, which symbol represents asynchronous messages?","o":["Solid arrow head.","Dashed line.","Open arrow head.","Solid line."],"a":2,"e":"In UML sequence diagrams, an open arrowhead shows an asynchronous message and a filled arrowhead a synchronous one.","s":"bank","tp":0},{"id":"19-2","u":"19","q":"Which is a text-based alternative to UML diagrams?","o":["System-specific code.","Machine code.","Pseudocode.","Formal code."],"a":2,"e":"Pseudocode is a text-based alternative to UML diagrams: it describes the same logic in structured plain language instead of pictures.","s":"bank","tp":0},{"id":"19-3","u":"19","q":"Which document includes the technical, economical, operational and social implications of a software development?","o":["A feasibility report.","A technical manual.","An operations manual.","An installation guide."],"a":0,"e":"A feasibility report weighs the technical, economic, operational and social aspects of a project.","s":"bank","tp":1},{"id":"19-4","u":"19","q":"What is a reason why technical manuals are important in software development?","o":["To document project feasibility.","To document end-user information.","To document planning information.","To document program interfaces."],"a":3,"e":"Technical manuals document the internal detail, such as program interfaces, that developers and maintainers need.","s":"bank","tp":1},{"id":"19-5","u":"19","q":"Why is risk analysis important in software development?","o":["To ensure software complies with health and safety regulations.","To ensure software complies with security regulations.","To identify the operational feasibility of the project.","To identify issues that impact on project schedule and quality."],"a":3,"e":"Risk analysis finds issues that could threaten the schedule or quality so they can be managed early.","s":"bank","tp":1},{"id":"19-6","u":"19","q":"What best describes when associations are used in UML modeling?","o":["When modeling the group behavior of actors in the system.","When modeling the behavior of use cases.","When modeling an actor's interaction described by a use case.","When modeling the inheritance in a system."],"a":2,"e":"An association line links an actor to the use case it interacts with.","s":"bank","tp":0},{"id":"19-7","u":"19","q":"What best describes pseudocode?","o":["A programming language in software development.","An image-based detail algorithmic design tool.","A language to help programmers develop algorithms.","A formal language to create structure in a program."],"a":2,"e":"Pseudocode is an informal language that helps programmers develop and express algorithms before coding.","s":"bank","tp":0},{"id":"19-8","u":"19","q":"What best describes a complete solution design?","o":["A solution that is feasible under the circumstances.","A solution that meets the technical requirements.","A solution that meets the functional requirements.","A solution that matches specified business requirements."],"a":3,"e":"A complete solution design matches all the specified business requirements.","s":"bank","tp":1},{"id":"19-10","u":"19","q":"What is a main purpose of configuration management?","o":["To record the rationale for changes made on implementation.","To record evaluation of change, impact, cost and recommendations.","To incorporate changes forced on the system by errors discovered.","To maintain the consistency of product performance."],"a":3,"e":"Configuration management keeps the product consistent as changes are made over time.","s":"bank","tp":1},{"id":"19-11","u":"19","q":"What best describes the purpose of a Use-case diagram?","o":["To capture the dynamic aspect of a system.","To capture the static behavior of a system.","To identify external factors that influence a system.","To identify internal factors that influence a system."],"a":0,"e":"Use-case diagrams show how actors interact with the system, i.e. its dynamic behavior.","s":"sample","p":7,"tp":0},{"id":"19-12","u":"19","q":"Pseudocode is used for which purpose?","o":["To find syntax errors.","To use as an interpreter.","To develop a program outline.","To describe complex algorithms."],"a":2,"e":"Pseudocode is used to outline a program's logic in plain, structured language before it is written in a real programming language.","s":"sample","p":8,"tp":0},{"id":"19-13","u":"19","q":"Which is the best way to describe the feasibility of a software solution?","o":["A solution that is reasonable under the circumstances.","A solution that does not consider the constraints.","A solution to define a specific problem.","A solution to a possible problem."],"a":0,"e":"A feasible solution is one that is reasonable given the constraints (time, cost, technology).","s":"sample","p":9,"tp":1},{"id":"19-14","u":"19","q":"Why is it important to carry out a risk analysis of software systems?","o":["To evaluate the quality of the requirements.","To maintain a safe working environment.","To establish the feasibility of the software system.","To identify technical and management problems."],"a":3,"e":"Risk analysis identifies technical and management problems before they happen.","s":"sample","p":10,"tp":1},{"id":"19-15","u":"19","q":"What is an accepted standard for quality assurance in software development?","o":["That products are delivered on time and under budget.","That products have complete process documentation.","That products have measurable specifications for process outputs.","That products are thoroughly tested before delivery to the customer."],"a":2,"e":"QA standards require measurable specifications for the outputs of each process.","s":"sample","p":11,"tp":1},{"id":"19-16","u":"19","q":"The use case diagram ...","o":["Specifies the functional decomposition of a system","Comprises classes and objects","Specifies who performs which tasks with a system that is going to be developed","Models the time flow within a system"],"a":2,"e":"A use case diagram shows which actors perform which tasks with the system.","s":"bank","tp":0},{"id":"19-17","u":"19","q":"What are the two broad categories of diagrams in UML 2.0?","o":["Structural and Use Case","Behavioral and Logical","Structural and Behavioral","Logical and Physical"],"a":2,"e":"UML 2.0 diagrams are either structural (classes, components) or behavioral (use case, sequence, activity).","s":"bank","tp":0},{"id":"19-18","u":"19","q":"The main purpose of the use case narrative is to:","o":["Describe a use case from a use case diagram","Select the involved actors only","specify the required functions in the project","create a plan B for use case"],"a":0,"e":"A use case narrative describes one use case from the diagram step by step in text.","s":"bank","tp":0},{"id":"19-19","u":"19","q":"Which of the following questions are useful when identifying the involved actors of a use case diagram?","o":["Who needs the system's support for their everyday work?","Which hardware is available for the users of the system?","What are the functional and non-functional requirements?","Who will design and implement the system?"],"a":0,"e":"Actors are the people or systems that need the system's support for their work.","s":"bank","tp":0},{"id":"19-20","u":"19","q":"Actors in a use case diagram :","o":["Interact with the system in the form of <<include>>-relationships.","Communicate with use cases and other actors.","Represent roles of the users of the described system.","Are always located within the described system."],"a":2,"e":"Actors represent the roles users play. They sit outside the system boundary.","s":"bank","tp":0},{"id":"19-21","u":"19","q":"What is the purpose of sequence diagrams in UML modeling?","o":["To describe the behaviors of objects and the attributes.","To document the static structure between objects.","To show the sequence of interactions between objects.","To show the control flow in an execution of the system."],"a":2,"e":"Sequence diagrams show the order of messages exchanged between objects over time.","s":"bank","tp":0},{"id":"19-22","u":"19","q":"Which of these is used for pseudocode?","o":["Syntax rules.","Complex language.","Natural language.","Machine language."],"a":2,"e":"Pseudocode is written in natural language with programming-like structure.","s":"bank","tp":0},{"id":"19-23","u":"19","q":"Which tool can be used to design the program and create diagrams of its modules?","o":["Data flow diagram.","Flowchart.","Algorithm.","Pseudocode."],"a":1,"e":"A flowchart is a diagram used to design program logic and its modules.","s":"bank","tp":0},{"id":"19-24","u":"19","q":"Which of these is a representation of a type of object?","o":["Data.","Class.","Method.","Associate."],"a":1,"e":"A class represents a type of object: a template for creating objects.","s":"bank","tp":0},{"id":"19-26","u":"A01","q":"Which one of the following is used to transform a software design into code?","o":["Prototyping.","JavaScript.","Pseudocode.","Modeling."],"a":2,"e":"Pseudocode bridges design and code: it sets out the program's logic step by step, and each step can then be written in a programming language.","s":"sample","p":51,"tp":3},{"id":"19-28","u":"19","q":"What best describes the purpose of an Activity Diagram?","o":["To capture a flow of activity and maps.","To specify the points at which a computer system is used.","To specify the behavior of use cases.","To capture the dynamic aspect of a system."],"a":2,"e":"Activity diagrams show the flow of actions, often the behavior inside a use case.","s":"bank","tp":0},{"id":"19-29","u":"19","q":"Pseudocode is used for which one of the following purposes?","o":["To use the syntax rules of a language.","To use a systematic standard form.","To use as an informal description.","To use as an executable program."],"a":2,"e":"Pseudocode is an informal description of logic. It does not follow any language's syntax and cannot be executed.","s":"bank","tp":0},{"id":"19-31","u":"19","q":"Develop program and apps; Install and test the new system; Train users; Convert to the new system are activities involved in which phase?","o":["Design","Maintenance","Implementation/Development","Testing"],"a":2,"e":"Building, installing, testing, training and converting all happen in the Implementation/Development phase.","s":"bank","tp":2},{"id":"19-32","u":"19","q":"Which phase of the SDLC defines the scope and purpose of an application?","o":["Development","Design","Planning","Deployment"],"a":2,"e":"The Planning phase sets the scope and purpose of the project.","s":"bank","tp":2},{"id":"20-1","u":"20","q":"What is the main benefit of 4G networks to meet current technology needs?","o":["It allows developers to use more open source software.","It provides more sophisticated data analytics.","It reduces the time lag between an action and a response.","It allows users to use devices with different operating systems."],"a":2,"e":"4G's main gain is lower latency, which shortens the delay between an action and its response.","s":"bank","tp":0},{"id":"20-2","u":"20","q":"What is the benefit of upgrading a mobile device from 3G to 4G?","o":["It improves the device sensitivity.","It improves image resolution.","It improves bandwidth connectivity.","It improves the battery life."],"a":2,"e":"4G gives much more bandwidth (faster data) than 3G.","s":"bank","tp":0},{"id":"20-3","u":"20","q":"What technology is used to produce a real physical model?","o":["3D printing.","Cloud computing.","Mobile networks.","4G networks."],"a":0,"e":"3D printing builds real physical objects from digital models.","s":"bank","tp":0},{"id":"20-4","u":"20","q":"Which one of the following technologies is changing the way data is stored?","o":["3D printing.","Cloud computing.","Mobile networks.","4G networks."],"a":1,"e":"Cloud computing moves storage from local devices to online services.","s":"sample","p":12,"tp":0},{"id":"20-6","u":"20","q":"What is the main purpose of test pages in software development?","o":["To provide a plan of the source.","To check the source performance.","To solve problems with the source.","To provide details about the source."],"a":3,"e":"Test pages are an information source: they give details about a product or technology so you can see how it works and evaluate it.","s":"bank","tp":2},{"id":"20-7","u":"20","q":"When is it best to perform a truncation search?","o":["When searching for concepts linked in a certain way.","When refining the relevance of a search.","When searching for singular and plural forms of a word.","When replacing one or more letters within a word."],"a":2,"e":"Truncation (e.g. comput*) finds word variants such as singular and plural forms.","s":"bank","tp":2},{"id":"20-8","u":"20","q":"When planning to search for information on the web, which one of the following gives the best results?","o":["To optimize the internet search engine.","To use correct syntax in the search string.","To use a large number of keywords.","To list the keywords alphabetically."],"a":1,"e":"Correct search syntax (quotes, operators) gives the most relevant results.","s":"sample","p":13,"tp":2},{"id":"20-9","u":"20","q":"When specific words or descriptions are indexed to create the searchable index fields, the information is referred to as?","o":["Raw data","Index data","Metadata","Formatted data"],"a":2,"e":"Metadata is data about data, such as the indexed keywords that describe content.","s":"bank","tp":2},{"id":"20-10","u":"20","q":"What in-process metric leads to possible actions for quality improvement?","o":["Error rate.","Cost/earned value.","Requirements delivered.","Time to project completion."],"a":0,"e":"Tracking error rate during the process points to where quality can be improved.","s":"bank","tp":4},{"id":"20-11","u":"20","q":"What best describes software metrics in software engineering?","o":["A range of activities concerned with measurement.","The tools used to test for errors in a range of design activities.","The tools used to describe users' feedback about a system.","The activities used to provide feedback when testing a design specification."],"a":0,"e":"Software metrics are the range of activities concerned with measuring software and its development.","s":"bank","tp":4},{"id":"20-12","u":"20","q":"What is the purpose of Software Metrics?","o":["To check if software is working properly.","To describe activities for measurement.","To collect information about a software project.","To plan the development of software projects."],"a":2,"e":"Software metrics collect quantitative information about a software project.","s":"bank","tp":4},{"id":"20-13","u":"20","q":"Which software metric is a key usability standard?","o":["Program execution time.","Program load time.","Number of lines of code.","Number of software bugs."],"a":1,"e":"Load time is a key usability metric because users notice and dislike slow-loading programs.","s":"sample","p":14,"tp":4},{"id":"20-14","u":"20","q":"What is an example of a project metric?","o":["A count of attributes and operations.","The project costs and time spent to date.","A log of project outcomes and estimates.","The number of classes in an analysis class diagram."],"a":1,"e":"Project metrics track the project itself, such as costs and time spent so far.","s":"bank","tp":4},{"id":"20-15","u":"20","q":"During configuration management, which is a potential central point of failure when identifying and storing assets?","o":["The baseline.","The milestone.","The repository.","The workspace."],"a":2,"e":"The repository holds all assets, so if it fails, everything is affected: a central point of failure.","s":"bank","tp":5},{"id":"20-16","u":"20","q":"What best describes software configuration management?","o":["The process of tracking and controlling changes in software.","The process used to design and develop a software product.","The process of evaluating users' feedback from a prototype design.","The process of investigating requirements to create use case scenarios."],"a":0,"e":"Software configuration management tracks and controls changes to software.","s":"bank","tp":5},{"id":"20-17","u":"20","q":"Which procedure tracks the changes that lead to each new version of software?","o":["Configuration Authentication.","Configuration Control.","Configuration Identification.","Configuration Status Accounting."],"a":3,"e":"Configuration status accounting records and reports the changes leading to each version.","s":"sample","p":15,"tp":5},{"id":"20-18","u":"20","q":"In software development, processes are used to improve the quality and reliability of the software project. Which process organizes the different versions of the software?","o":["Control and audit changes to the software components.","File new software versions at each project milestone.","Identify and store software components in a secure location.","Set access controls to the external software library."],"a":1,"e":"Saving a new, clearly labeled version at each milestone keeps versions organized, so the team can always go back to a known good version.","s":"bank","tp":5},{"id":"20-19","u":"20","q":"Which ISO standard is part of quality management that ensures and instills confidence that quality requirements will be fulfilled?","o":["ISO 8001","ISO 9001","ISO 5040","ISO 9000"],"a":1,"e":"ISO 9001 sets the requirements for a quality management system that gives confidence quality will be met.","s":"bank","tp":3},{"id":"20-20","u":"20","q":"What is the main feature of an accessible website?","o":["Pages download quickly.","Information is easy to retrieve.","The site is easy to navigate.","The site can operate on all browsers."],"a":2,"e":"An accessible website is easy for everyone to navigate, including keyboard and screen-reader users.","s":"bank","tp":3},{"id":"21-1","u":"21","q":"According to SDLC phases, which Documentation is a result of Planning phase?","o":["SRS.","SDP","STD","SDD"],"a":1,"e":"The Planning phase produces the Software Development Plan (SDP). The SRS comes from Analysis, the SDD from Design and the STD from Testing.","s":"bank","tp":0},{"id":"21-2","u":"21","q":"SRS Document is:","o":["Software Resources Specification.","Software Rules Specification.","Software Requirement Specification.","Software Role Specification."],"a":2,"e":"SRS stands for Software Requirements Specification.","s":"bank","tp":0},{"id":"21-3","u":"21","q":"One of the main functions of Software documentation is:","o":["Flexibility.","Reliability.","Metadata capture and use.","Accessibility."],"a":2,"e":"Documentation records information about the software (its metadata), such as what it does and how it was built, so others can use it later.","s":"bank","tp":0},{"id":"21-4","u":"21","q":"The main two categories of software documentation are:","o":["Project documentation and product documentation.","Product documentation and process documentation.","Process documentation and technical documentation.","Planning documentation and end user documentation."],"a":1,"e":"Software documentation splits into product documentation (about the software) and process documentation (about how it was built).","s":"bank","tp":0},{"id":"21-5","u":"21","q":"Code comments and Class diagrams are considered what type of documentation?","o":["System/Technical documentation.","User documentation.","Requirement documentation.","Design documentation."],"a":0,"e":"Code comments and class diagrams describe the system's internals, so they are system/technical documentation.","s":"bank","tp":0},{"id":"21-6","u":"21","q":"Software Design documentation provides information about:","o":["What the system should do.","How the system should do what it's made for.","Guiding users through the system.","Codes."],"a":1,"e":"Design documentation explains HOW the system will do what it is meant to do. Requirements say WHAT.","s":"bank","tp":0},{"id":"21-7","u":"21","q":"User manual is a/an:","o":["Project documentation","User documentation","Product documentation","Project plan documentation."],"a":1,"e":"A user manual is written for end users, so it is user documentation.","s":"bank","tp":0},{"id":"21-8","u":"21","q":"The main purpose of the Final report or system documentation is:","o":["Help with planning.","Help with handover","Help user.","Help testing."],"a":1,"e":"The final report or system documentation supports handover to the client or maintenance team.","s":"bank","tp":3},{"id":"21-9","u":"21","q":"STD (Software Testing Documentation) is a product of which SDLC phase?","o":["Planning.","Analysis.","Developing.","Testing."],"a":3,"e":"The Software Test Documentation is produced in the Testing phase.","s":"bank","tp":0},{"id":"21-10","u":"21","q":"The main purpose of Online help is:","o":["Explain system design.","Explain code.","Assist in the use of the system.","Demonstrate system architecture."],"a":2,"e":"Online help assists users while they are using the system.","s":"bank","tp":1},{"id":"21-11","u":"21","q":"The main purpose of Product documentation is:","o":["Describing the delivered software.","Managing development of the software.","Plan Software development process.","Design software."],"a":0,"e":"Product documentation describes the software that was delivered.","s":"bank","tp":0},{"id":"21-12","u":"21","q":"Javadoc is a:","o":["Java Code.","Tool that generates java documentation.","Java document.","Tool that edits java code."],"a":1,"e":"Javadoc is the JDK tool that generates documentation from comments in Java source code.","s":"bank","tp":2},{"id":"21-13","u":"21","q":"@Param is a comment that:","o":["Adds a method with name and description","Adds a parameter with the specified parameter-name followed by the specified description to the \"Parameters\" section.","Adds a \"Returns\" section with the description text.","Adds an Exception name with description."],"a":1,"e":"@param adds a parameter's name and description to the 'Parameters' section.","s":"bank","tp":2},{"id":"21-14","u":"21","q":"@throw is a synonym of which comment?","o":["@Param.","@Author.","@exception.","@since."],"a":2,"e":"@throws and @exception are synonyms. Both document an exception a method may throw.","s":"bank","tp":2},{"id":"21-15","u":"21","q":"Javadoc generates java comment in which language?","o":["Basic.","HTML","PHP","C#"],"a":1,"e":"Javadoc produces its output as HTML pages.","s":"bank","tp":2},{"id":"21-16","u":"21","q":"To display JavaHelp the main thing you need is:","o":["Compatible platform.","Compatible browser.","Internet.","Code."],"a":0,"e":"JavaHelp runs on the Java platform, so you need a compatible (Java) platform.","s":"bank","tp":2},{"id":"21-17","u":"21","q":"JavaHelp is written in which language?","o":["Java","C#","HTML","COBOL."],"a":0,"e":"JavaHelp is written entirely in Java.","s":"bank","tp":2},{"id":"21-18","u":"21","q":"RoboHelp, Doc-To-Help, ForeHelp, and WebWorks are examples of:","o":["Javahelp documents.","Help documents related to other languages.","JavaHelp creating tool.","Language used in writing JavaHelp"],"a":1,"e":"RoboHelp, Doc-To-Help, ForeHelp and WebWorks are help-authoring tools that are not specific to Java, unlike JavaHelp.","s":"bank","tp":1},{"id":"21-19","u":"21","q":"In order to view a JavaHelp system, users must have the __________ installed.","o":["Java Development Kit (JDK)","Java Runtime Environment (JRE)","Java Archive (JAR)","Application Programming Interface (API)"],"a":1,"e":"Viewing JavaHelp only needs the Java Runtime Environment. The JDK is for developers.","s":"bank","tp":2},{"id":"21-20","u":"21","q":"When features are designed to help people with disabilities use technology more easily, this is referred to as:","o":["Flexibility.","Usability.","Readability.","Accessibility."],"a":3,"e":"Designing so that people with disabilities can use technology is accessibility.","s":"bank","tp":3},{"id":"21-21","u":"21","q":"One of the main concepts of Readability is:","o":["Use good looking designs for digital content.","Provide text material in digital content.","Making digital content clear and easy to understand.","Use advanced and uncommon vocabulary to target highly educated audience."],"a":2,"e":"Readability means the content is clear and easy to understand.","s":"bank","tp":3},{"id":"21-22","u":"21","q":"Target Audience refers to:","o":["People living around you.","Your family.","Individuals or groups who would be interested in using the system or product.","Team members developing the system or product."],"a":2,"e":"The target audience is the people likely to use or be interested in the product.","s":"bank","tp":3},{"id":"21-23","u":"21","q":"Very low response rate is a con of which feedback gathering technique?","o":["Workshops.","Forms.","Surveys.","Comments."],"a":2,"e":"Surveys often get a low response rate because people ignore them.","s":"bank","tp":4},{"id":"21-24","u":"21","q":"Ideas and feedback could be bounced and shared from multiple people or groups in:","o":["Workshops.","Forms.","Surveys.","Comments."],"a":0,"e":"Workshops bring groups together so ideas can be shared and bounced around.","s":"bank","tp":4},{"id":"21-25","u":"21","q":"An intensive, structured meeting led by an impartial facilitator is referred to as a:","o":["Workshop.","Form.","Survey.","Comment."],"a":0,"e":"A workshop is an intensive, structured meeting run by an impartial facilitator.","s":"bank","tp":4},{"id":"21-26","u":"21","q":"A note or annotation that an author or reviewer can add to a document is referred to as a:","o":["Workshop.","Form.","Survey.","Comment."],"a":3,"e":"A comment is a note added to a document by an author or reviewer.","s":"bank","tp":4},{"id":"21-27","u":"21","q":"An effective way to gather data which is used to collect, analyze and understand the perceptions and opinions of a group of people is referred to as a:","o":["Workshop.","Form.","Survey.","Comment."],"a":2,"e":"Surveys collect and analyze the opinions of a group of people.","s":"bank","tp":4},{"id":"21-28","u":"21","q":"A manual or a guide that shows how the system could be used is a type of documentation targeted to:","o":["Developers.","Designers.","Analysis.","End user."],"a":3,"e":"Manuals and guides on how to use the system are written for end users.","s":"bank","tp":0},{"id":"21-29","u":"21","q":"In software documentation, IEEE is best known for providing a:","o":["Standard for User Documentation.","Programming Language.","Platform.","Operating system."],"a":0,"e":"IEEE is an organization that publishes technical standards. In documentation it is known for its standard for software user documentation (IEEE 1063).","s":"bank","tp":0},{"id":"21-30","u":"21","q":"Which of these documentation types describes the algorithms used in a piece of software?","o":["Technical documentation.","Software tutorial.","Online help.","Requirements documentation."],"a":0,"e":"Technical documentation describes internal details such as the algorithms used.","s":"bank","tp":0},{"id":"21-31","u":"21","q":"Which tags are used to delimit the beginning of a JavaDoc comment?","o":["/*","//**","/**","//"],"a":2,"e":"A Javadoc comment starts with /** (two asterisks) and ends with */.","s":"bank","tp":2},{"id":"21-32","u":"21","q":"Why should a developer tailor user documentation for their target audience?","o":["To take account of the vocabulary and experience of the user.","To focus on the actual concepts expressed in the code.","To technically explain the algorithms used to the user.","To ensure the code is efficient and easy to follow."],"a":0,"e":"User documentation should match the vocabulary and experience of its readers.","s":"bank","tp":3},{"id":"21-33","u":"21","q":"When is a survey the most appropriate tool to gather feedback on a new IT system?","o":["When qualitative data is needed to support system design.","When there are small numbers of people involved.","When the system is highly complex.","When there are large numbers of people involved."],"a":3,"e":"Surveys are best for collecting feedback from large numbers of people.","s":"bank","tp":4},{"id":"21-34","u":"21","q":"What is a key advantage of an online document compared to a printed version?","o":["It is faster to read.","It is more portable.","It ensures language is understood.","It allows faster cross-referencing."],"a":3,"e":"Hyperlinks and search make cross-referencing faster in online documents.","s":"bank","tp":0},{"id":"21-35","u":"21","q":"What is shown by the @throw tag in java?","o":["Possible exceptions.","Structural parameters.","Return values.","User authentication."],"a":0,"e":"@throws lists the exceptions a method may throw.","s":"bank","tp":2},{"id":"21-36","u":"21","q":"Which event trigger supports accessible web navigation?","o":["Onmouseup.","Onkeydown.","Onfocus.","Onclick."],"a":2,"e":"onfocus fires when an element gets focus by any means, including the Tab key, so it supports keyboard navigation.","s":"bank","tp":3},{"id":"21-38","u":"21","q":"Which one of the following file formats is generated by the JavaDoc program?","o":["PDF","DOC","HTML","JAVA"],"a":2,"e":"Javadoc generates HTML pages.","s":"sample","p":16,"tp":2},{"id":"21-39","u":"21","q":"Which one of the following tags will generate a Throws subheading in the Java documentation generator?","o":["@return","@param","@exception","@class"],"a":2,"e":"@exception (or @throws) creates the 'Throws' subheading in the generated documentation.","s":"sample","p":17,"tp":2},{"id":"21-40","u":"21","q":"Which one of the following is a measure of the readability of a document?","o":["Number of paragraphs in the document.","Average number of syllables in each word.","Average number of spelling and grammar errors.","Number of pages in the document."],"a":1,"e":"Readability formulas such as Flesch use average syllables per word and words per sentence.","s":"sample","p":18,"tp":3},{"id":"21-41","u":"21","q":"Which is the best way to gather feedback from the programming team in order to finalize a user manual?","o":["Document comments.","Online surveys.","Workshops.","Focus groups."],"a":0,"e":"Programmers can add comments straight into the draft manual, so document comments are the best way to gather their feedback.","s":"sample","p":19,"tp":4},{"id":"21-42","u":"22","q":"Where can a user find the definition of Information Technology (IT) terms used in a reference manual?","o":["Index.","Dictionary.","Contents.","Glossary."],"a":3,"e":"A glossary defines the specialist terms used in a document.","s":"sample","p":20,"tp":2},{"id":"21-43","u":"22","q":"Which one of the following is an external component of program documentation?","o":["Test results.","Reference manual.","Requirements specification.","Program comments."],"a":1,"e":"A reference manual is separate from the code, so it is external documentation. Comments are internal.","s":"sample","p":22,"tp":2},{"id":"21-45","u":"21","q":"Besides .java source files, which of these files can the Javadoc tool also read?","o":["Button.classes","Button.win","Button-template.java","package.html"],"a":3,"e":"Javadoc reads .java source files and also package.html, which holds the comments for a whole package.","s":"bank","tp":2},{"id":"21-46","u":"21","q":"The JavaHelp system allows Java developers to provide online help for which one of the following?","o":["ODBC links.","J2SE.","SQL databases.","Applets in HTML."],"a":3,"e":"JavaHelp provides online help for Java applications and applets.","s":"bank","tp":2},{"id":"21-50","u":"21","q":"Which one of the following is an internal component of program documentation?","o":["Debugging log.","Context-sensitive help.","Quick reference card.","User manual."],"a":0,"e":"A debugging log is kept by the developers inside the project, so it is internal documentation. The others are for users.","s":"bank","tp":0},{"id":"22-1","u":"22","q":"What is the primary purpose of using RAID storage?","o":["To increase storage capacity.","To improve overall performance.","To prevent data corruption.","To reduce power consumption."],"a":1,"e":"RAID (especially striping) spreads data across disks to improve performance. Mirroring adds redundancy.","s":"bank","tp":0},{"id":"22-2","u":"22","q":"What is the advantage of linking an audio file rather than embedding it in a presentation?","o":["The presentation file size will be smaller.","The audio cannot be accidentally deleted.","The audio will play at the correct speed.","The audio file can be compressed."],"a":0,"e":"A linked audio file is not stored inside the presentation, so the file stays smaller.","s":"bank","tp":1},{"id":"22-3","u":"22","q":"What best describes the use of active listening in a training session?","o":["Listening in order to evaluate, criticize or otherwise pass judgment on what someone else says.","Listening in a way that demonstrates interest and encourages continued speaking.","Listening, then reflecting back to the other person what they have said.","Listening for something specific that the listener seeks to understand."],"a":1,"e":"Active listening shows interest and encourages the speaker to keep talking.","s":"bank","tp":3},{"id":"22-4","u":"22","q":"Which method is best used to provide out-of-hours IT support to end users?","o":["On-site instruction.","Chat.","Email.","Telephone."],"a":1,"e":"Chat (often automated or with on-call staff) is the practical channel for out-of-hours support.","s":"bank","tp":4},{"id":"22-5","u":"22","q":"What type of software is a word processing package?","o":["Utility software.","Application software.","Operating software.","System software."],"a":1,"e":"A word processor helps users do a task, so it is application software.","s":"bank","tp":0},{"id":"22-6","u":"22","q":"When is it best to use embedded rather than linked audio files in a presentation?","o":["When the source audio file is likely to change.","When the presentation needs to be ‘packaged’ for CD.","When the source audio file is not likely to change.","When the audio files are greater than 100Kb in size."],"a":2,"e":"Embed audio when the source will not change. A copy is stored inside the presentation.","s":"bank","tp":1},{"id":"22-7","u":"22","q":"What best shows that a trainee has engaged with the content delivered in a technical training session?","o":["They complete an evaluation form.","They sign an attendance register.","They discuss a different topic.","They ask appropriate questions."],"a":3,"e":"Asking relevant questions shows the trainee is actively engaging with the content.","s":"bank","tp":3},{"id":"22-8","u":"22","q":"What is the most efficient method of instruction for a user experiencing problems when logging on to a system?","o":["Online support.","Email instruction.","Telephone instruction.","Technical manual."],"a":2,"e":"For a log-on problem, the user cannot get into the system for online help, so telephone instruction is fastest.","s":"bank","tp":4},{"id":"22-9","u":"22","q":"When preparing a slide show presentation, which feature would the author use to simulate the turning of a page?","o":["Transition.","Animation.","Timing.","Layout."],"a":0,"e":"A transition is the effect between slides, such as a page-turn.","s":"sample","p":21,"tp":1},{"id":"22-10","u":"22","q":"What is a trouble-shooting guide an example of?","o":["Classroom training.","A job aid.","E-learning.","A webinar."],"a":1,"e":"A troubleshooting guide is a job aid: a quick reference used while doing the task.","s":"sample","p":23,"tp":2},{"id":"22-11","u":"22","q":"How do we identify that training needs to take place?","o":["When you think that the training should take place","If this is the training month","When the performance standards is low","When a new employee join the company"],"a":2,"e":"Training is needed when performance falls below the required standard.","s":"bank","tp":3},{"id":"22-12","u":"22","q":"By telephone, what is the best way to instruct a user to install a piece of software?","o":["To provide a link to a guidance website.","To ask the user to read out the manual instructions.","To take the user through a step by step process.","To prepare a fact sheet with frequently asked questions."],"a":2,"e":"Over the phone, guide the user through the installation one step at a time.","s":"bank","tp":4},{"id":"22-13","u":"22","q":"Which one of the following features of slideshow software is used to modify timing between slides?","o":["Animations.","Handouts.","Templates.","Transitions."],"a":3,"e":"Transitions control the move between slides, including timing.","s":"bank","tp":1},{"id":"22-14","u":"22","q":"Which type of instruction would be used to support asynchronous communication between learner and tutor?","o":["Online instruction.","On-site instruction.","Telephone instruction.","Email instruction."],"a":3,"e":"Email is asynchronous: learner and tutor do not need to be online at the same time.","s":"bank","tp":4},{"id":"22-15","u":"22","q":"What type of listening helps the listener to understand another’s point of view?","o":["Appreciative.","Critical.","Selective.","Empathetic."],"a":3,"e":"Empathetic listening tries to understand the other person's point of view and feelings.","s":"bank","tp":3},{"id":"22-16","u":"22","q":"What happens when embedded code is inserted from an online video into a slide presentation?","o":["The video is shown in the slide","The video is saved on the server","The video is linked to the website","A copy of the video is embedded in the slide"],"a":0,"e":"An embed code plays the online video inside the slide. It is streamed, not copied.","s":"bank","tp":1},{"id":"23-1","u":"23","q":"What are conditional commands used for?","o":["To make the program run continuously.","To test the validity of the program codes.","To stop the program from running.","To help the program make decisions."],"a":3,"e":"Conditional commands (if/else) let a program choose between paths, i.e. make decisions.","s":"bank","tp":0},{"id":"23-2","u":"23","q":"What best describes Simple API for XML?","o":["A lexical, event driven interface.","A handler object.","An iterator design pattern.","A procedural interface."],"a":0,"e":"SAX (Simple API for XML) is a lexical, event-driven parser that raises events as it reads the document.","s":"bank","tp":1},{"id":"23-3","u":"23","q":"What best describes mock objects in object-oriented programming?","o":["Simulated objects that copy real objects.","Objects that are written in a program.","Objects that are re-used in a program.","Real objects that interact with other objects."],"a":0,"e":"Mock objects are simulated stand-ins that mimic real objects, mostly used in testing.","s":"bank","tp":2},{"id":"23-7","u":"23","q":"Which one of the following is an example of an event driven program?","o":["Natural language programming.","Service-oriented computing.","Real-time computing.","Functional programming."],"a":2,"e":"Real-time systems respond to events (inputs, sensors) as they happen.","s":"sample","p":24,"tp":1},{"id":"23-8","u":"23","q":"In Object Oriented Programming, which feature is a collection of objects of similar type?","o":["Modules.","Classes.","Inheritances.","Methods."],"a":1,"e":"A class defines a group of objects of the same type.","s":"sample","p":25,"tp":2},{"id":"23-9","u":"24","q":"Which best describes the purpose of Object oriented programming?","o":["To create software design driven by an emphasis on actions.","To allow subprograms to process and return calculations.","To create re-usable modules.","To allow easier management of graphics."],"a":2,"e":"OOP aims to create reusable modules (classes and objects).","s":"sample","p":28,"tp":0},{"id":"23-10","u":"A01","q":"What should a real world object consist of in Object Oriented Programming?","o":["Fields and attributes.","State and behavior.","Keywords and data.","Parts and labels."],"a":1,"e":"An object has state (its data) and behavior (its methods).","s":"sample","p":47,"tp":1},{"id":"23-11","u":"23","q":"Which procedural programming feature is used to return a value?","o":["Function.","Global variable.","Local variable.","Parameter."],"a":0,"e":"A function returns a value to the code that called it.","s":"sample","p":26,"tp":3},{"id":"23-14","u":"23","q":"What best describes time driven programming?","o":["A program where events are triggered by data.","A program where events are triggered by a clock.","A program where events are triggered by an expression.","A program where events are triggered by an object."],"a":1,"e":"In time-driven programs, a clock or timer triggers the events.","s":"bank","tp":1},{"id":"23-16","u":"23","q":"What are pre-defined functions?","o":["A collection of source codes that allow users to generate their own function.","Functions that have been built into software language to perform standard operations.","Functions that are created by allowing variable values to be passed through the program.","Grouping of different tasks to form a function where each group had a task of its own to carry out."],"a":1,"e":"Pre-defined (built-in) functions come with the language for standard operations, e.g. Math.sqrt().","s":"bank","tp":3},{"id":"23-17","u":"23","q":"What is used to test the condition after the block of code is executed?","o":["Fixed loop.","Break point.","Pre-check loop.","Post-check loop."],"a":3,"e":"A post-check loop (do...while) tests its condition after the body runs, so the body runs at least once.","s":"bank","tp":3},{"id":"23-19","u":"23","q":"Which object-oriented programming feature enables new classes to receive the properties and methods of existing classes?","o":["Polymorphism.","Abstraction.","Encapsulation.","Inheritance."],"a":3,"e":"Inheritance lets a new class receive the properties and methods of an existing class.","s":"bank","tp":2},{"id":"23-20","u":"23","q":"What best describes a local variable?","o":["It is declared at the start of the program.","It is declared inside a function or procedure.","It is declared outside all functions or procedures.","It is declared for use within any function of a wider program."],"a":1,"e":"A local variable is declared inside a function and exists only there.","s":"bank","tp":3},{"id":"23-21","u":"23","q":"Why does a programmer use a fixed loop?","o":["To terminate the program at a chosen point.","To know how many loops are in the program.","To know at the start how many times the loop has to run.","To temporarily suspend execution of the program."],"a":2,"e":"A fixed loop (for loop) is used when you know at the start how many times it must run.","s":"bank","tp":3},{"id":"23-22","u":"23","q":"A statement that helps alter and change the flow of the execution of statements in a program as desired is referred to by:","o":["Print statement.","Control Flow statement.","Object creating statement.","Import statement."],"a":1,"e":"Control flow statements (if, loops, switch) change the order in which statements execute.","s":"bank","tp":0},{"id":"23-23","u":"23","q":"The value of the if statement expression is of what type:","o":["Int.","Float.","Boolean.","String."],"a":2,"e":"An if condition evaluates to a Boolean: true or false.","s":"bank","tp":0},{"id":"23-24","u":"23","q":"Switch statement is a:","o":["Conditional statement.","Iterative statement.","Post checked statement.","Pre checked statement."],"a":0,"e":"switch picks a branch based on a value, so it is a conditional statement.","s":"bank","tp":0},{"id":"23-25","u":"23","q":"In order to avoid implementing all cases in a switch statement, we use the instruction _________at the end of each case.","o":["Stop;","End;","break;","finish;"],"a":2,"e":"break ends a case so execution does not fall through into the next one.","s":"bank","tp":0},{"id":"23-26","u":"23","q":"Which one of the following is the process where an object of one class receives the properties of objects of another class?","o":["Encapsulation.","Inheritance.","Polymorphism.","Modularity."],"a":1,"e":"Inheritance passes properties from one class to another.","s":"bank","tp":2},{"id":"23-27","u":"23","q":"Which one of the following is declared within subroutines?","o":["Global variables.","Local variables.","Pre-defined functions.","Procedures."],"a":1,"e":"Local variables are declared inside subroutines.","s":"bank","tp":3},{"id":"23-28","u":"23","q":"Which one of the control structures fits the format below?","o":["Break-point loop.","Fixed loop.","Post-check loop.","Pre-check loop."],"a":3,"e":"The condition is tested BEFORE the loop body runs, so this is a pre-check loop (while).","s":"bank","c":"WHILE count < 10\n    OUTPUT count\n    count = count + 1\nEND WHILE","tp":3},{"id":"23-29","u":"23","q":"What is the purpose of a Trigger Function?","o":["To create a set of values.","To store values for later use.","To run automatically when its event occurs and return a result.","To ensure values are accurate."],"a":2,"e":"A trigger function runs automatically when its event or condition occurs and can return a result to the code that triggered it.","s":"bank","tp":1},{"id":"23-30","u":"23","q":"What is the main goal of Object oriented programming?","o":["Ease of evolution.","Monitoring maintenance.","Encapsulating code.","Information hiding."],"a":0,"e":"OOP's main goal is ease of evolution: software that is easier to extend and maintain over time.","s":"bank","tp":2},{"id":"23-32","u":"23","q":"What is the main advantage of object reuse in object oriented programming?","o":["To reduce cost and risks.","To reduce planning time.","Many objects can share the same name.","One object can have multiple names."],"a":0,"e":"Reusing tested objects reduces development cost and risk.","s":"bank","tp":2},{"id":"23-33","u":"23","q":"What is a method to activate an event?","o":["Incident handlers.","Data abstraction.","Reusable unit.","Trigger function."],"a":3,"e":"A trigger function activates (fires) an event.","s":"bank","tp":1},{"id":"23-34","u":"23","q":"What kind of element would a \"button\" be in event driven programming?","o":["Command","Control","User Interface","None of the answers."],"a":1,"e":"A button is a control, a UI element that raises events.","s":"bank","tp":1},{"id":"23-35","u":"23","q":"When pressed, what will a button immediately cause in an event driven language?","o":["Code to be run","Changes to the environment","The user will make a choice and interact with the application","An event to be triggered"],"a":3,"e":"Pressing a button triggers an event. Its handler code then runs.","s":"bank","tp":1},{"id":"23-36","u":"23","q":"Which of the following serve as a benefit to developing an application as Event Driven?","o":["Event Driven code is easier to write and is less complex","Event driven languages are easier to develop in modular sections","Event Driven languages are cheaper than other languages to develop","All programmers can program in Event Driven languages easily"],"a":1,"e":"Each event handler is a separate piece of code, so event-driven programs are easy to build in modular sections.","s":"bank","tp":1},{"id":"23-37","u":"23","q":"Which of these are types of triggers?","o":["Mouse Move","Mouse Click","Drag and Drop","All of the answers."],"a":3,"e":"Mouse move, mouse click and drag-and-drop can all trigger events.","s":"bank","tp":1},{"id":"23-38","u":"23","q":"Which of these describe an event driven language?","o":["Time driven and service oriented","Only service oriented","Only event driven","Procedural"],"a":0,"e":"In the student book, service-oriented and time-driven programming are both types of event-driven programming.","s":"bank","tp":1},{"id":"23-39","u":"23","q":"Which of these is not a control?","o":["Keyboard press","Mouse click","Mouse Move","'if' statement"],"a":3,"e":"An 'if' statement is program logic, not a user control that raises events.","s":"bank","tp":1},{"id":"24-1","u":"24","q":"Which one of the following best defines a software library?","o":["A repository for specific data.","A repository for compiled languages.","A collection of code used to develop programs.","A collection of guidance for behavior and languages."],"a":2,"e":"A software library is a collection of pre-written code (classes, functions) used to build programs.","s":"sample","p":29,"tp":1},{"id":"24-4","u":"24","q":"What name is given to high-level abstractions that document successful design solutions?","o":["Idioms.","Metrics.","Design patterns.","Design frameworks."],"a":2,"e":"Design patterns are high-level abstractions that record proven solutions to common design problems.","s":"bank","tp":2},{"id":"24-6","u":"24","q":"What best describes code-generation libraries?","o":["High level languages for code.","Repository of programming code.","Suite of data and programming code to develop programs.","High level APIs that create or transform byte code for Java."],"a":3,"e":"Code-generation libraries are high-level APIs that create or transform Java byte code.","s":"bank","tp":1},{"id":"24-7","u":"24","q":"Another expression for Java API is :","o":["Syntax.","Editor."
