o speed up inserts","Using appropriate keys, constraints, transactions and validation checks","Storing all data as text to simplify the schema","Disabling foreign keys during normal use"],"a":1,"e":"Keys, constraints, transactions and validation checks together keep data consistent and accurate.","s":"bank","src":"Unit 26 row 54","tp":0},{"id":"T27-1","u":"27","q":"What is a multi-layer application?","o":["A program written in a single source file","An application with separate layers for the UI, business logic and data access","An application that uses several databases","An application that runs on several servers"],"a":1,"e":"A multi-layer application separates the user interface, business logic and data access into layers.","s":"bank","src":"Unit 27 row 2","tp":0},{"id":"T27-2","u":"27","q":"Which layer contains user-facing screens?","o":["Data-access layer","Business logic layer","User interface layer","Database layer"],"a":2,"e":"The user interface (presentation) layer contains the screens users see and use.","s":"bank","src":"Unit 27 row 3","tp":0},{"id":"T27-3","u":"27","q":"Which layer executes SQL queries?","o":["User interface layer","Business logic layer","Data-access layer","Presentation layer"],"a":2,"e":"The data-access layer talks to the database, including running SQL queries.","s":"bank","src":"Unit 27 row 4","tp":1},{"id":"T27-4","u":"27","q":"Where should business rules be implemented?","o":["Presentation layer","Business logic layer","Data-access layer","Database server"],"a":1,"e":"Business rules belong in the business logic layer, between the user interface and the data access.","s":"bank","src":"Unit 27 row 5","tp":0},{"id":"T27-6","u":"27","q":"What does JDBC stand for?","o":["Java Desktop Connector","Java Database Connectivity","Java Data Compiler","Java Data Controller"],"a":1,"e":"JDBC stands for Java Database Connectivity.","s":"bank","src":"Unit 27 row 7","tp":1},{"id":"T27-7","u":"27","q":"What is ADO.NET used for?","o":["Building web page layouts","Data access in .NET applications","Writing queries in Java","Validating XML documents"],"a":1,"e":"ADO.NET is Microsoft's library for accessing data in .NET applications.","s":"bank","src":"Unit 27 row 8","tp":1},{"id":"T27-8","u":"27","q":"What is LINQ used for?","o":["Connecting Java applications to databases","Writing queries inside .NET code","Describing web services","Validating XML documents"],"a":1,"e":"LINQ lets you write queries directly inside .NET code such as C#.","s":"bank","src":"Unit 27 row 9","tp":1},{"id":"T27-10","u":"27","q":"Which constraint enforces unique rows?","o":["FOREIGN KEY","CHECK","PRIMARY KEY","DEFAULT"],"a":2,"e":"A primary key must be unique for every row, so it enforces unique rows.","s":"bank","src":"Unit 27 row 11","tp":4},{"id":"T27-12","u":"27","q":"What is disconnected data model in .NET?","o":["Data that is never saved","Data loaded into memory and used without a live database connection","Data stored only on a remote server","Data read row by row from an open connection"],"a":1,"e":"In the disconnected model, data is loaded into memory and used without keeping the database connection open.","s":"bank","src":"Unit 27 row 13","tp":3},{"id":"T27-13","u":"27","q":"Which ADO.NET object holds multiple tables?","o":["DataRow","DataTable","DataSet","DataReader"],"a":2,"e":"A DataSet holds several tables (DataTables) and their relationships in memory.","s":"bank","src":"Unit 27 row 14","tp":1},{"id":"T27-14","u":"27","q":"Which ADO.NET object represents one table?","o":["DataSet","DataRow","DataTable","DataReader"],"a":2,"e":"A DataTable represents a single table of data in memory.","s":"bank","src":"Unit 27 row 15","tp":2},{"id":"T27-15","u":"27","q":"What is a Service Data Object (SDO)?","o":["A Microsoft object for reading database rows","A model to represent data and services across different systems","A Java API for connecting to databases","An XML schema language"],"a":1,"e":"Service Data Objects give one consistent way to represent and access data across different systems.","s":"bank","src":"Unit 27 row 16","tp":2},{"id":"T27-16","u":"27","q":"Which of these is an internal (in-application) data source?","o":["A remote web API","An in-memory list or array","Cloud storage","An external database server"],"a":1,"e":"An in-memory list or array is data held inside the application itself, so it is an internal data source.","s":"bank","src":"Unit 27 row 17","tp":1},{"id":"T27-17","u":"27","q":"Which is a relational database?","o":["MongoDB","Microsoft SQL Server","Redis","Cassandra"],"a":1,"e":"Microsoft SQL Server is a relational database. MongoDB, Redis and Cassandra are NoSQL databases.","s":"bank","src":"Unit 27 row 18","tp":3},{"id":"T27-18","u":"27","q":"Which is a NoSQL database?","o":["Oracle","MySQL","MongoDB","SQL Server"],"a":2,"e":"MongoDB is a NoSQL (document) database. Oracle, MySQL and SQL Server are relational.","s":"bank","src":"Unit 27 row 19","tp":3},{"id":"T27-19","u":"27","q":"What is a benefit of NoSQL?","o":["A fixed schema for every record","Flexible data models","Built-in support for SQL joins","Strict normalization"],"a":1,"e":"NoSQL databases have flexible data models, without a fixed schema for every record.","s":"bank","src":"Unit 27 row 20","tp":3},{"id":"T27-20","u":"27","q":"What is a flat-file (fat-file) database?","o":["A database made of many small linked tables on a server","A database stored as local files without a database server","A cloud-only database","An XML database"],"a":1,"e":"A flat-file database keeps data in simple local files, without a database server.","s":"bank","src":"Unit 27 row 21","tp":3},{"id":"T27-21","u":"27","q":"Which of these is an example of a flat-file database?","o":["A .csv file of customer records","A Microsoft SQL Server database","An Oracle database","A MongoDB collection"],"a":0,"e":"A .csv file stores records as plain text with no database server, so it is a flat-file database. The others are database management systems.","s":"bank","src":"Unit 27 row 22","tp":3},{"id":"T27-22","u":"27","q":"What is ODBC?","o":["A database engine","Open Database Connectivity, a standard API for accessing databases","A query language for .NET","A Java library for XML"],"a":1,"e":"ODBC (Open Database Connectivity) is a standard API for accessing different databases.","s":"bank","src":"Unit 27 row 23","tp":3},{"id":"T27-24","u":"27","q":"What does JSON stand for?","o":["JavaScript Object Notation","Java Standard Object Notation","JavaScript Online Network","Java Serialized Object Name"],"a":0,"e":"JSON stands for JavaScript Object Notation.","s":"bank","src":"Unit 27 row 25","tp":0},{"id":"T27-25","u":"27","q":"Why use JSON?","o":["It supports comments and schemas by default","It is a lightweight, readable data-exchange format","It can only be used with JavaScript","It is faster to validate than any other format"],"a":1,"e":"JSON is lightweight and easy to read, which makes it good for exchanging data.","s":"bank","src":"Unit 27 row 26","tp":3},{"id":"T27-26","u":"27","q":"Which is not allowed in JSON?","o":["Arrays","Comments","Objects","Strings"],"a":1,"e":"Standard JSON does not allow comments.","s":"bank","src":"Unit 27 row 27","tp":3},{"id":"T27-27","u":"27","q":"How can you check that a JSON document is valid?","o":["Use a JSON parser or schema validator","Open it in a web browser","Check the file extension","Convert it to XML first"],"a":0,"e":"A JSON parser or schema validator checks that the JSON is correctly formed and has the expected structure.","s":"bank","src":"Unit 27 row 28","tp":4},{"id":"T27-29","u":"27","q":"What is DTD?","o":["An older language for defining and validating XML structure","A newer replacement for XSD","A database engine","A web service description language"],"a":0,"e":"A DTD (Document Type Definition) is an older way to define and validate the structure of XML. XSD is the newer one.","s":"bank","src":"Unit 27 row 30","tp":4},{"id":"T27-30","u":"27","q":"What is a validating XML parser?","o":["A parser that checks XML against a DTD or XSD","A parser that only checks that tags are closed","A tool that converts XML to JSON","A tool that styles XML for display"],"a":0,"e":"A validating parser checks an XML document against its DTD or XSD.","s":"bank","src":"Unit 27 row 31","tp":4},{"id":"T27-31","u":"27","q":"What does SOAP use often for messages?","o":["JSON only","XML","CSV","HTML"],"a":1,"e":"SOAP messages are written in XML.","s":"bank","src":"Unit 27 row 32","tp":4},{"id":"T27-33","u":"27","q":"What is UDDI used for?","o":["Describing the operations a web service offers","Registering and discovering web services","Sending messages between services","Validating XML documents"],"a":1,"e":"UDDI is a directory where web services are registered and can be discovered.","s":"bank","src":"Unit 27 row 34","tp":4},{"id":"T27-34","u":"27","q":"Which is generally lighter for data transfer?","o":["XML","JSON","Both are the same size","SOAP messages"],"a":1,"e":"JSON is usually smaller than XML because it has no closing tags, so it is lighter to transfer.","s":"bank","src":"Unit 27 row 35","tp":3},{"id":"T27-35","u":"27","q":"What is serialization?","o":["Encrypting objects before storage","Converting objects to a storable or transmittable format","Sorting objects in memory","Copying objects between classes"],"a":1,"e":"Serialization converts an object into a format that can be stored or sent, such as a byte stream, JSON or XML.","s":"bank","src":"Unit 27 row 36","tp":3},{"id":"T27-36","u":"27","q":"How is a list represented in JSON?","o":["Object {}","Array []","String \"\"","Tuple ()"],"a":1,"e":"In JSON, a list is written as an array in square brackets [ ].","s":"bank","src":"Unit 27 row 37","tp":3},{"id":"T27-38","u":"27","q":"What is DataReader best for?","o":["Editing multiple in-memory tables","Fast, forward-only reading of database rows","Working with data offline","Updating several tables at once"],"a":1,"e":"A DataReader reads database rows quickly, one after another, in a forward-only direction.","s":"bank","src":"Unit 27 row 39","tp":1},{"id":"T27-39","u":"27","q":"What is data binding?","o":["Linking UI elements to data sources","Encrypting data","Joining two database tables","Converting data to XML"],"a":0,"e":"Data binding links UI elements to a data source, so changes in the data show in the interface.","s":"bank","src":"Unit 27 row 40","tp":0},{"id":"T27-40","u":"27","q":"What is normalization in databases?","o":["Adding indexes to tables","Organizing tables to reduce redundancy","Combining tables to speed up queries","Backing up tables regularly"],"a":1,"e":"Normalization organizes tables to reduce repeated (redundant) data.","s":"bank","src":"Unit 27 row 41","tp":3},{"id":"T27-41","u":"27","q":"What is an index used for?","o":["Enforcing unique values only","Speeding up data retrieval","Encrypting data","Linking two tables"],"a":1,"e":"An index helps the database find rows faster, which speeds up data retrieval.","s":"bank","src":"Unit 27 row 42","tp":1},{"id":"T27-43","u":"27","q":"What prevents SQL injection?","o":["Concatenating user input into SQL strings","Using parameterized queries or prepared statements","Hiding error messages","Using long column names"],"a":1,"e":"Parameterized queries keep user input separate from the SQL code, which prevents SQL injection.","s":"bank","src":"Unit 27 row 44","tp":0},{"id":"T27-44","u":"27","q":"What does REST use?","o":["FTP and file paths","HTTP methods and resources identified by URIs","SOAP envelopes only","WSDL files only"],"a":1,"e":"REST uses HTTP methods (GET, POST, PUT, DELETE) on resources identified by URIs.","s":"bank","src":"Unit 27 row 45","tp":0},{"id":"T28-1","u":"28","q":"What is the primary purpose of a change-management system?","o":["To store previous versions of the source code","To track and manage software change requests","To schedule developers' daily tasks","To record user login activity"],"a":1,"e":"A change-management system records each change request and tracks it through review, approval and completion.","s":"bank","src":"Unit 28 row 2","tp":2},{"id":"T28-2","u":"28","q":"Which factor is most critical when prioritizing change requests?","o":["Client preference","Impact on business continuity","Size of the code change","Developer availability"],"a":1,"e":"Changes that protect business continuity come first, because problems there affect the whole organization.","s":"bank","src":"Unit 28 row 3","tp":2},{"id":"T28-3","u":"28","q":"What does version control help manage?","o":["Bug reports from users","Software license keys","Server configurations","Change history and revisions"],"a":3,"e":"Version control keeps the history of every change and revision to a file.","s":"bank","src":"Unit 28 row 4","tp":3},{"id":"T28-4","u":"28","q":"Which tool is commonly used to compare document revisions?","o":["Compiler","Debugger","Profiler","Diff tool"],"a":3,"e":"A diff tool compares two versions of a file and highlights what changed.","s":"bank","src":"Unit 28 row 5","tp":3},{"id":"T28-5","u":"28","q":"What is the role of audit trails in change management?","o":["To store backup copies of changed files","To record and track all changes made","To approve change requests","To prioritize change requests"],"a":1,"e":"An audit trail records every change: what changed, who made it and when.","s":"bank","src":"Unit 28 row 6","tp":4},{"id":"T28-6","u":"28","q":"Which of the following is NOT a valid stakeholder for change plan review?","o":["Manager","Competitor","Client","Teacher"],"a":1,"e":"Change plans are reviewed by appropriate people, such as a manager, client or teacher. A competitor has no role in this.","s":"bank","src":"Unit 28 row 7","tp":2},{"id":"T28-7","u":"28","q":"What does SLA stand for in change request classification?","o":["Standard Logic Architecture","Software License Agreement","System Log Analysis","Service Level Agreement"],"a":3,"e":"SLA stands for Service Level Agreement: the agreed service levels used to classify and prioritize requests.","s":"bank","src":"Unit 28 row 8","tp":2},{"id":"T28-8","u":"28","q":"Which activity is part of modifying the software once a change has been approved?","o":["Writing the change request","Approving the change plan","Classifying the request by priority","Testing the changes"],"a":3,"e":"Once a change is made, it must be tested to confirm it works and has not broken anything.","s":"bank","src":"Unit 28 row 9","tp":0},{"id":"T28-9","u":"28","q":"What is the benefit of grouping similar change requests?","o":["Removes the need for stakeholder approval","Removes the need for impact analysis","Enables simultaneous development","Lowers the priority of each request"],"a":2,"e":"Similar change requests can be developed and implemented together, which saves time and cost.","s":"bank","src":"Unit 28 row 10","tp":2},{"id":"T28-10","u":"28","q":"Which document should be updated after a software change is implemented?","o":["Service level agreement","User manual","Coding standards","Project budget"],"a":1,"e":"After a change, the user manual must be updated so it matches the changed software.","s":"bank","src":"Unit 28 row 11","tp":2},{"id":"T28-11","u":"28","q":"What is the purpose of impact analysis?","o":["To prioritize the change request","To assess the consequences of a change","To approve the change","To test the changed software"],"a":1,"e":"Impact analysis looks at what a change will affect, including systems, cost and schedule.","s":"bank","src":"Unit 28 row 12","tp":2},{"id":"T28-12","u":"28","q":"Which document must be reviewed to make sure it meets system documentation standards before it is forwarded for a decision?","o":["Change log","Bug report","Change plan","Service level agreement"],"a":2,"e":"The change plan is reviewed against the documentation standards before it goes to the decision-maker.","s":"bank","src":"Unit 28 row 13","tp":2},{"id":"T28-13","u":"28","q":"What is the first step in analyzing a change request?","o":["Schedule change activities","Receive and document the request","Modify the software","Update the user manual"],"a":1,"e":"The first step is to receive the change request and record it accurately.","s":"bank","src":"Unit 28 row 14","tp":2},{"id":"T28-14","u":"28","q":"Which tool is commonly used to log and track bugs and enhancement requests?","o":["Version control system","Diff tool","Help-desk system","Project schedule"],"a":2,"e":"A help-desk system logs each bug or request with a reference and tracks it until it is closed.","s":"bank","src":"Unit 28 row 15","tp":4},{"id":"T28-15","u":"28","q":"What should be considered when determining resources for change development?","o":["Number of stakeholders","Length of the user manual","Time and cost constraints","Number of previous change requests"],"a":2,"e":"Resources for a change must fit the time and cost constraints.","s":"bank","src":"Unit 28 row 16","tp":0},{"id":"T28-16","u":"28","q":"What is the goal of reviewing proposed changes against requirements?","o":["To estimate the cost of the change","To ensure alignment with project goals","To schedule the change activities","To test the change"],"a":1,"e":"Checking proposed changes against the requirements ensures they support the project's goals.","s":"bank","src":"Unit 28 row 17","tp":2},{"id":"T28-17","u":"28","q":"Why should diagrams and tables in the documentation be updated after a change?","o":["To shorten the documentation","To meet the SLA response time","To reflect modifications accurately","To record who approved the change"],"a":2,"e":"Diagrams and tables must show the system as it now is, so they are updated after every change.","s":"bank","src":"Unit 28 row 18","tp":2},{"id":"T28-18","u":"28","q":"What is the final step after changes have been delivered to the client?","o":["Close the request without feedback","Conduct follow-up action if required","Archive the change plan","Start the next change request"],"a":1,"e":"After delivery, the team gets client feedback and follows up if the change does not fully meet the requirements.","s":"bank","src":"Unit 28 row 19","tp":2},{"id":"T28-19","u":"28","q":"What does risk assessment help identify?","o":["Opportunities for new features","Business continuity threats","Licensing costs","Coding standards to apply"],"a":1,"e":"Risk assessment identifies threats to business continuity so they can be reduced.","s":"bank","src":"Unit 28 row 20","tp":1},{"id":"T28-22","u":"28","q":"What is the role of help-desk procedures in change management?","o":["To approve change requests","To manage and log change requests","To test the changed software","To write the change plan"],"a":1,"e":"Help-desk procedures make sure every change request is logged and managed.","s":"bank","src":"Unit 28 row 23","tp":4},{"id":"T28-23","u":"28","q":"What is a bug review used for?","o":["To approve new features","To assess and classify software issues","To update the user manual","To schedule software releases"],"a":1,"e":"A bug review assesses each reported issue and classifies it, for example by severity and priority.","s":"bank","src":"Unit 28 row 24","tp":2},{"id":"T28-24","u":"28","q":"What does a change plan typically include?","o":["The source code of the change","Resource allocation and timelines","A list of help-desk calls","The client's contact details only"],"a":1,"e":"A change plan sets out the resources needed and the timeline for the change.","s":"bank","src":"Unit 28 row 25","tp":0},{"id":"T28-25","u":"28","q":"What is the benefit of using documentation standards?","o":["To reduce the length of documents","To ensure consistency and usability","To replace version control","To remove the need for reviews"],"a":1,"e":"Documentation standards make documents consistent and easy to use.","s":"bank","src":"Unit 28 row 26","tp":1}];
const NOTES={"18":[{"t":"Roles in an interactive media project","ref":"Student Book Topic 1","p":["Designer: creates the look and feel (visual layout, aesthetics, branding) and works to a brief agreed with the client and creative director.","Developer: looks after the technical side (code, media integration, functionality) and applies templates, standards and style sheets with the information architect.","Content author: creates and collects the text, images, audio and video.","Information architect: organizes the structure and navigation of the information.","Project/product manager: manages timelines, resources and goals.","The main problem in these projects is misunderstanding the user requirements. Delivery across multiple platforms is a major challenge."]},{"t":"Technical parameters that affect design","ref":"Student Book Topic 2","p":["Hardware use: the user's position (sitting, standing, hand-held) and mode of interaction (touch, stylus, keyboard, mouse, voice).","Touch targets must be big and well spaced. Keyboard users need clear focus and shortcuts.","Screen size and resolution drive layout. Use responsive design so the interface adapts to each screen.","Platforms have their own guidelines (Apple HIG, Material Design, Microsoft Fluent) and standard SDK components (buttons, sliders, menus)."]},{"t":"Visual communication","ref":"Student Book Topic 3","p":["Usability is the most important issue in UI design. User-centered design starts from the users' goals and needs.","Keep message, tone and brand (logo, colors, fonts) consistent. Styles give a consistent look and feel.","A visual metaphor uses a familiar image to convey a message: a printer icon for Print, a trash can for Delete, a speaker icon for volume.","Color carries meaning (red = error, green = success), but never rely on color alone and keep contrast high."]},{"t":"Accessibility and users with disabilities","ref":"Student Book Topic 4","p":["Accessibility means software can be used by ALL users, including people with disabilities.","Visual impairment: larger fonts and keys, higher contrast and brightness, screen readers (read text aloud).","Hearing impairment: captions and visual alerts. Motor impairment: keyboard navigation and alternative controls.","Common approaches: alternative style sheets (large font, high contrast, reversed text), logical tab order, keyboard shortcuts and voice control.","Accessible pages are also easier for search engines to read, which helps SEO."]},{"t":"End-user testing","ref":"Student Book Topic 5","p":["Choose test subjects who match the target audience, so you see how real users use the system.","User observation and usability testing (watching users do tasks) are the best ways to test interface function.","Other methods: A/B testing, heuristic evaluation, surveys and questionnaires, think-aloud, prototype testing, beta testing.","Surveys suit the evaluation stage and large groups. Workshops gather feedback from many users at the same time."]}],"19":[{"t":"Modeling tools: UML, flowcharts, pseudocode","ref":"Student Book Topic 1","p":["UML 2.0 diagrams are structural (class, component) or behavioral (use case, sequence, activity).","Use case diagram: shows actors (roles outside the system) and the tasks they perform, i.e. the dynamic behavior. Associations link an actor to a use case.","A use case narrative describes one use case step by step in text.","Sequence diagram: messages between objects in time order. An open arrowhead means an asynchronous message.","Activity diagram: the flow of actions, often the behavior inside a use case.","Flowchart: a diagram of program logic and modules. Pseudocode: an informal, plain-language outline of a program's logic that bridges design and code."]},{"t":"Requirements documentation","ref":"Student Book Topics 2–3","p":["Feasibility report: the technical, economic, operational and social implications of a project.","A feasible solution is reasonable under the circumstances (time, cost, technology).","A complete solution design matches the specified business requirements.","Technical manuals document program interfaces (APIs) for developers.","Risk analysis identifies technical and management problems that could affect schedule and quality.","QA standard: products have measurable specifications for process outputs. QA aims for fitness for purpose."]},{"t":"Gathering and analyzing requirements","ref":"Student Book Topics 4–5","p":["Confirm requirements and scope with the client, gather information, then analyze it to define the scope and problem.","Functional requirements say what the system must do. Non-functional requirements say how well it must do it (speed, security, usability).","SDLC: Planning defines scope and purpose; Analysis, Design, Implementation (build, install, test, train, convert), Testing, Maintenance."]},{"t":"Feasibility and high-level solutions","ref":"Student Book Topics 6–8","p":["Feasibility covers technical, operational, budget and schedule aspects, and fit within the organization.","Compare alternative solutions against project constraints. Document assumptions, dependencies and resources.","Produce a project risk analysis, then publish a software requirements document for approval."]}],"20":[{"t":"Current technologies and trends","ref":"Student Book Topic 1.1–1.2","p":["Cloud computing changes how data is stored: online rather than on local devices.","3D printing produces real physical models from digital designs.","4G gives more bandwidth than 3G and lower latency (less delay between action and response). 5G goes further.","Other trends: AI/ML, IoT, edge computing, blockchain, cybersecurity, VR/AR, green IT."]},{"t":"Standards, vendors and business requirements","ref":"Student Book Topic 1.3–1.6","p":["Standards make products compatible and safe. IEEE 802.11 is the Wi-Fi standard.","Vendor directions: cloud-first, AI integration, subscription licensing, security-first, open source.","When implementing a new IT system, first identify the people who will use it."]},{"t":"Information gathering and search","ref":"Student Book Topic 2","p":["Information sources: vendor documents, test pages (details about the source), web pages.","Correct search syntax gives the best results. Use Boolean operators (AND, OR, NOT) and \"exact phrases\".","Truncation (comput*) finds word variants such as singular and plural forms.","Metadata (data about data) is what search indexes use."]},{"t":"Quality, accessibility and usability standards","ref":"Student Book Topic 3.1–3.2","p":["ISO 9001 sets requirements for a quality management system. ISO 9000 covers its fundamentals and vocabulary.","ISO/IEC 25010 lists software quality characteristics (functional suitability, performance, usability, reliability, security…).","An accessible website is easy for everyone to navigate. WCAG is the main web accessibility standard."]},{"t":"Software metrics and estimation","ref":"Student Book Topic 3.3–3.4","p":["Software metrics are activities concerned with measurement. They collect information about a software project.","Project metrics track costs and time spent so far. Error rate is an in-process metric that points to quality improvements.","Program load time is a key usability metric.","Estimation: size (lines of code, function points), effort and cost (e.g. COCOMO), agile methods (Planning Poker)."]},{"t":"Configuration management","ref":"Student Book Topic 3.5","p":["Software configuration management tracks and controls changes to software.","Configuration status accounting records the changes that lead to each version.","File a new software version at each project milestone. The repository is a central point of failure."]}],"21":[{"t":"Document functions and types","ref":"Student Book Topic 1.1–1.3","p":["Two categories: product documentation (describes the delivered software) and process documentation (how it was built).","SDLC documents: Planning gives the SDP, Analysis the SRS (Software Requirements Specification), Design the SDD, Testing the STD.","Design documents say HOW the system works. Requirements say WHAT it must do.","System/technical documentation: code comments, class diagrams, algorithms, APIs. User documentation: manuals and guides for end users.","Internal documentation (comments, debugging logs) lives with the code. External documentation (reference manual, user manual) is separate.","A glossary defines terms. Online documents allow faster cross-referencing."]},{"t":"Online help","ref":"Student Book Topic 1.4","p":["Online help assists users while they use the system (context-sensitive help, FAQs, search).","Help-authoring tools include RoboHelp, Doc-To-Help, ForeHelp and WebWorks."]},{"t":"Javadoc and JavaHelp","ref":"Student Book Topic 2","p":["Javadoc generates HTML documentation from comments that start with /** and end with */.","Tags: @param (Parameters section), @return (Returns), @throws or @exception (Throws subheading), @author, @since.","JavaHelp is written in Java and provides online help for Java applications and applets. Users need the JRE and a compatible platform to view it."]},{"t":"Usability: readability, accessibility, audience","ref":"Student Book Topic 3","p":["Readability means clear and easy to understand. It is measured with formulas using syllables per word and words per sentence. Line length matters.","Accessibility: features that help people with disabilities. onfocus supports keyboard navigation.","Tailor documents to the target audience's vocabulary and experience."]},{"t":"Feedback gathering","ref":"Student Book Topic 4","p":["Comments: notes added to a document. Best for feedback from the programming team.","Surveys: opinions from large numbers of people, but often a low response rate.","Workshops: intensive, structured meetings led by an impartial facilitator, where ideas are shared."]}],"22":[{"t":"The technology to be presented","ref":"Student Book Topic 1","p":["Know the technology's features, limitations, benefits and real-world uses before presenting it.","Application software (e.g. a word processor) helps users do tasks. System software runs the computer.","RAID storage spreads data across disks to improve performance."]},{"t":"Slideshows","ref":"Student Book Topic 2.1","p":["Transitions are effects between slides, such as a page turn. They also control slide timing.","Animations move objects within a slide.","Linked audio keeps the file small. Embed audio when the source will not change.","Embed code from an online video shows the video inside the slide."]},{"t":"Documentation and manuals","ref":"Student Book Topic 2.2","p":["A job aid (e.g. a troubleshooting guide) is a quick reference used while doing the task.","Screenshots of screen displays are the most important feature of a user manual."]},{"t":"Active listening and personalization","ref":"Student Book Topic 2.3–2.4","p":["Active listening shows interest and encourages the speaker to continue.","Empathetic listening helps you understand another person's point of view.","Trainees who ask appropriate questions are engaged. Training is needed when performance falls below standard."]},{"t":"Types of advice and support","ref":"Student Book Topic 2.5","p":["Telephone: fast step-by-step guidance, e.g. log-on problems or talking a user through an install.","Email: asynchronous (learner and tutor not online at the same time).","Chat: practical for out-of-hours support. On-site: face-to-face help."]}],"23":[{"t":"Programming constructs","ref":"Student Book Topic 1","p":["Conditional commands (if, switch) let a program make decisions. An if condition is Boolean (true/false).","switch is a conditional statement. break at the end of each case stops fall-through.","Control flow statements change the order in which statements run."]},{"t":"Event-driven and time-driven programming","ref":"Student Book Topic 2","p":["Event-driven: user actions or messages (click, key press, mouse move, drag and drop) trigger code. Real-time systems are event-driven.","Controls (e.g. a button) raise events. A trigger function activates an event and an event handler runs in response.","An event loop waits for events and dispatches them.","Time-driven: a clock or timer governs the control flow.","Event-driven programs are easy to build in modular sections. SAX is an event-driven XML parser."]},{"t":"Object-oriented programming","ref":"Student Book Topic 3","p":["A class is a template for objects of the same type. Objects have state (data) and behavior (methods).","Inheritance: a new class receives the properties and methods of an existing class.","Encapsulation hides data. Polymorphism lets one interface take many forms.","Purpose: reusable modules and easy evolution. Reuse reduces cost and risk.","Mock objects simulate real objects for testing. Design patterns are templates for solving common problems."]},{"t":"Procedural programming","ref":"Student Book Topic 4","p":["A function returns a value. Pre-defined functions are built into the language.","Local variables are declared inside a function. Global variables are declared outside all functions.","Fixed loop (for): the number of repetitions is known at the start.","Pre-check loop (while): the condition is tested before the body. Post-check loop (do…while): the condition is tested after the body, so it always runs once."]}],"24":[{"t":"Java software development tools","ref":"Student Book Topic 1","p":["Editor: writes source code. Compiler (javac): turns source into byte code. Interpreter/JVM (java): runs byte code.","An IDE bundles editor, compiler, debugger and build tools.","The JDK provides development tools (compiler, debugger). Class libraries form the Java API.","OOP's purpose is to create reusable modules."]},{"t":"Software libraries and components","ref":"Student Book Topic 2.1–2.2","p":["A software library is a collection of code used to develop programs.","The Java API is the Java class library. java.util.Scanner reads input data.","Code-generation libraries are high-level APIs that create or transform Java byte code.","Development methodologies such as Agile and DevOps affect how reusable components are chosen and used."]},{"t":"Metrics, patterns and repositories","ref":"Student Book Topic 2.3–2.5","p":["Design patterns are high-level abstractions that document successful design solutions (e.g. Singleton, Factory, Observer).","Frameworks give a reusable skeleton application. Idioms are language-specific coding habits.","Repository tools (Git, Maven repositories) store code and components for re-use."]},{"t":"Choosing and using reusable components","ref":"Student Book Topics 3–6","p":["Evaluate components on functionality against requirements, cost, technical impact and licensing.","Add components incrementally, resolve dependencies, and test the final project.","Document a new component before submitting it to a library."]}],"25":[{"t":"Debugging techniques","ref":"Student Book Topic 1","p":["Logging records events. Tracing is a specialized use of logging that records information about a program's execution.","Tracing helps measure and find errors during development.","Breakpoints pause execution at a chosen line to isolate program elements. Step into, step over and watch variables.","Stack traces show the chain of method calls that led to an error."]},{"t":"Testing processes","ref":"Student Book Topic 2","p":["Unit (component) testing tests a single unit. Integration testing tests the interfaces between components. System testing checks the whole integrated system against its requirements.","Alpha testing is internal acceptance testing, starting when the software can first run. It finds errors that appear in operational use. Beta testing is done by external users.","Stubs replace missing lower modules in top-down incremental testing. Drivers are used bottom-up.","A test fixture provides a fixed, known set of data or files. Mock objects simulate real objects."]},{"t":"Testing terms: verification and validation","ref":"Student Book Topic 3","p":["Verification: \"Are we building the product right?\" Checks conformance with the specification.","Validation: \"Are we building the right product?\" Checks user needs and fitness for purpose.","Defect: a flaw in the code. Failure: the software does not do what is expected."]},{"t":"Test plans, results and performance","ref":"Student Book Topics 5–10","p":["Test early in every SDLC phase. It is cheaper to fix defects early.","A test plan sets scope, approach, resources and schedule. Record results and manage defects.","Profilers (e.g. VisualVM) measure CPU, memory and response time. Unit test frameworks include JUnit."]}],"26":[{"t":"Relational databases","ref":"Student Book Topic 1.1","p":["A relational database is multiple tables linked by key fields. Each entity in an ER diagram becomes a table.","1NF: remove repeating groups (atomic values). 2NF: remove partial dependencies. 3NF: remove attributes dependent on non-key fields.","Integrity: entity (primary key), referential (foreign keys), domain (every field declared with a type and valid values). UNIQUE is an integrity constraint.","A data dictionary holds the metadata. Storage management controls access speed."]},{"t":"SQL","ref":"Student Book Topic 1.2","p":["SQL = Structured Query Language. Statements end with a semicolon.","DDL defines structure: CREATE, ALTER, DROP. DML works with data: SELECT, INSERT, UPDATE, DELETE. GRANT and REVOKE control access permissions.","ALTER TABLE courses ADD (enddate DATE) adds a column. DROP TABLE removes a table. DELETE removes rows.","SELECT * FROM t returns all columns. SELECT DISTINCT returns different values only.","LIKE matches patterns (%, _). BETWEEN is inclusive. UNION combines results and removes duplicates.","UPDATE … SET salary = salary * 1.05 WHERE … adds 5% to the matching rows only."]},{"t":"UML and DBMS","ref":"Student Book Topics 1.3 and 2","p":["UML gives a standard way to visualize the design of a system.","A DBMS (MySQL, SQL Server, Oracle) creates and manages databases. APIs such as ODBC and JDBC give access to any compliant database."]}],"27":[{"t":"Multi-layer applications","ref":"Student Book Topic 1.1","p":["User interface (presentation) layer: where users interact.","Business logic layer: the decision-making layer that applies business rules and validation and connects the user interface with the data-access layer. It encodes how data is created, displayed, stored and changed.","Data-access layer: objects that provide access to data in storage.","Layers can be changed, tested and scaled separately."]},{"t":"Data access libraries","ref":"Student Book Topic 1.2","p":["API = Application Programming Interface.","JDBC (Java Database Connectivity): the Java API that lets Java programs connect to databases and access data. A Connection creates and executes statements.","ADO (ActiveX Data Objects, called Active Data Objects in the student book): Microsoft objects used to access data sources.","LINQ (Language Integrated Query): adds query expressions to .NET languages and enables querying of relational tables."]},{"t":"Data integrity and disconnected data","ref":"Student Book Topic 1.3–1.4","p":["Data integrity is maintaining the accuracy and consistency of data over its whole life-cycle.","Integrity rules provide guidelines for data validity. Threats include human error, transfer errors, bugs and attacks.","Disconnected data: DataSet and DataTable (ADO.NET) and Service Data Objects work with data offline."]},{"t":"Data sources","ref":"Student Book Topic 2","p":["DBMSs: Microsoft SQL Server, MySQL (relational), Oracle, and NoSQL environments (e.g. MongoDB).","Flat-file databases store data in simple files, such as CSV, without relationships between tables.","Internal data is created by the organization's own operations.","Document-oriented databases typically store XML or JSON.","ODBC (Open Database Connectivity) is a standard API for accessing DBMSs."]},{"t":"XML","ref":"Student Book Topic 3","p":["Every XML document has one root element that contains all other elements.","XSD (XML Schema Definition) defines the elements and validates XML. DTD is the older alternative.","WSDL is an XML language that describes web services. SOAP is an XML messaging protocol. UDDI is a service directory."]}],"28":[{"t":"Quality assurance practices and standards","ref":"Student Book Topic 1.1","p":["Software QA runs alongside development. It improves the process so problems are prevented early, as an umbrella activity across the whole project.","SQA activities: a QA management plan, checkpoints, a multi-testing strategy, and measuring change impact (a fix can introduce new errors).","ISO 9000 is a family of quality management standards: ISO 9000 covers fundamentals and vocabulary, ISO 9001 the requirements, ISO 9004 sustained success, ISO 19011 auditing."]},{"t":"Document design and risk assessment","ref":"Student Book Topic 1.2–1.3","p":["Use templates and style guides so change documents are consistent and easy to use.","Risk assessment combines the impact of a risk and its likelihood.","Risk management process: identify, classify and prioritize, plan, monitor, take mitigating action, communicate.","Prioritize changes that reduce risks to business continuity."]},{"t":"Change management practices","ref":"Student Book Topic 2.1","p":["Change management is the formal process for introducing and approving changes (e.g. to a project's scope).","Process: create a Request for Change, review and assess it, create a change proposal, implement, review the change's performance.","First record each request accurately in a change-management system.","Classify and prioritize requests using business guidelines and service level agreements (SLAs).","Impact analysis finds the affected files, tasks, schedule and cost. Cost-benefit analysis weighs cost against value.","A change board or appropriate person (client, manager) approves the change plan. Notify stakeholders of the reason for the change.","After the change: test it, update the documentation, deliver it, get client feedback and follow up."]},{"t":"Version control","ref":"Student Book Topic 2.2","p":["Version control tracks every version of each file, so changes can be compared, merged or rolled back (e.g. Git).","Version management manages codelines (sequences of versions) and baselines (agreed versions that later changes are measured against).","Configuration status accounting records the changes that lead to each version."]},{"t":"Audit trails and help-desk procedures","ref":"Student Book Topic 2.3–2.4","p":["An audit trail is a sequential record of who accessed or changed the system, when, and what they did.","Help desk: log every call with a reference number, prioritize it, track it until it is resolved and closed."]}],"A01":[{"t":"Java programming tools","ref":"Student Book Topic 1.1","p":["Editor: writes and edits source code (.java).","Compiler (javac): converts source code into byte code (.class) and reports syntax errors.","Interpreter / JVM (java): runs byte code. Byte code is platform-independent: write once, run anywhere.","IDEs (NetBeans, Eclipse, IntelliJ) automate building and include a debugger for tracing and watching variables."]},{"t":"OOP concepts, classes and libraries","ref":"Student Book Topic 1.2–1.4","p":["Objects have state (fields) and behavior (methods). A class is the template for objects.","Inheritance (extends), encapsulation (private fields with getters and setters), polymorphism and abstraction.","Java has single class inheritance. A class can implement several interfaces, which is how Java achieves multiple inheritance.","Overloading: same method name with different parameters. Overriding: a subclass redefines an inherited method.","Class libraries: java.util (ArrayList, Scanner), java.io, javax.swing (GUI). Handle exceptions with try…catch."]},{"t":"Java theory, applets and servlets","ref":"Student Book Topic 1.5–1.6","p":["Java differs from C/C++: no pointers, automatic garbage collection, and byte code that runs on a JVM.","Applets: small programs run on the client by a Java-enabled web browser (now obsolete).","Servlets: run on a web server and respond to HTTP requests."]},{"t":"Libraries, methodologies and metrics","ref":"Student Book Topic 2","p":["Current methodologies: Rapid Application Development (RAD), Agile/Scrum and DevOps. Older approaches include Structured Systems Design, the socio-technical approach and ETHICS.","Pseudocode helps turn a software design into code.","Metrics collection: tracing and logging help measure errors. Also lines of code, defect counts and complexity.","Patterns (reusable designs), frameworks (reusable skeletons) and idioms (language habits). Repository tools: Git, Maven."]},{"t":"Event-driven programming and GUIs","ref":"Student Book Topic 3","p":["A GUI framework (Swing, JavaFX) provides components: JFrame, JButton, JLabel, JTextField.","Events (click, key press) are handled by listeners. ActionListener.actionPerformed() runs when a button is clicked.","Incorporate the UI into code by registering listeners and calling the application logic from them."]}],"A02":[{"t":"Mobile phones and tablets","ref":"Student Book Topic 1.1–1.2","p":["Key hardware: CPU, RAM, storage, battery, display, camera, sensors (GPS, accelerometer, gyroscope) and radios (Wi-Fi, Bluetooth, mobile data).","Screen size and resolution guide responsive layout. Processor and memory affect smoothness and load times.","Screen orientation (portrait or landscape) is a feature specific to mobile devices.","Tablets offer larger screens and touch or stylus input. They suit media, education and business."]},{"t":"Mobile operating systems","ref":"Student Book Topic 1.3","p":["Android (Samsung, Xiaomi and others) runs on a wide range of hardware. iOS is exclusive to Apple.","OS version fragmentation affects compatibility and how much testing is needed.","Android apps are packaged as APK files (AAB for Google Play)."]},{"t":"Wi-Fi, 3G and 4G","ref":"Student Book Topic 1.4–1.5","p":["Wi-Fi follows the IEEE 802.11 standards (b, g, n, ac, ax/Wi-Fi 6).","3G made mobile internet and video calling widely practical. 4G (LTE) gives higher speeds and lower latency. 5G is faster still.","Smartphones support both Wi-Fi and mobile-data connectivity.","Video streaming depends mostly on the strength of the network signal or Wi-Fi connection."]},{"t":"Mobile development environments","ref":"Student Book Topic 2.1","p":["Android Studio: Google's official IDE for Android (Java or Kotlin).","Eclipse: an older Java IDE that was once used with Android plug-ins.","Xcode: Apple's IDE for iOS apps (Swift or Objective-C).","Emulators and simulators run the app on a virtual device for testing."]},{"t":"Designing and building mobile apps","ref":"Skills outcomes","p":["Create views for different orientations and resolutions. Use touch gestures (tap, swipe, pinch).","Let users personalize settings: text size, color, brightness, sound effects.","Bind views to data sources. Get remote data from web services. Integrate social media.","Deploy, test against the requirements, and iterate until the tests pass."]}],"A03":[{"t":"Java deployment technologies","ref":"Student Book Topic 1.1","p":["JAR (Java ARchive): compiled classes plus resources. The first entry is the manifest (META-INF/MANIFEST.MF).","An executable JAR's manifest names the main class. Bundling into one JAR reduces applet download time.","Java WebStart (legacy) launches apps from JNLP files. Launch scripts are batch or shell sequences of OS commands that start the app."]},{"t":"Other deployment technologies","ref":"Student Book Topic 1.2","p":["ClickOnce: one-click Windows installs with automatic updates and built-in security prompts.","MSI (Microsoft Installer): enterprise installs that handle dependencies, registry updates and rollback.","Xcopy: file-copy deployment with no installer, no registry changes and no need to register assemblies.","COPY copies files only. XCOPY can also copy directories."]},{"t":"Hosting and file transfer","ref":"Student Book Topic 1.3","p":["Hosting models: on-premises, cloud and hybrid.","FTP is an application-layer protocol that uses separate control and data connections. The server listens on port 21. SFTP and FTPS are secure versions.","TCP works at the Transport layer. The first line of an HTTP response is the status line.","DNS translates domain names into IP addresses."]},{"t":"Authentication and authorization","ref":"Student Book Topic 1.5","p":["Authentication: verifying who you are (password, two-step code sent to your phone).","Authorization: what you are allowed to access. Access rights grant or deny access (like a boarding pass).","Integrity: only authorized users can modify information. Confidentiality: only authorized users can see it."]},{"t":"Installation standards and policies","ref":"Student Book Topic 2","p":["Plan the installation: check that client and server meet the requirements, choose a method, review security, then test in a test environment before production.","The Implementation phase of the SDLC covers building, installing, testing, training users and converting to the new system.","Changeover methods: direct changeover (all at once), parallel running (old and new together), phased implementation (in stages, e.g. one department first) and pilot (a small group first).","Browser-based applications give cross-platform functionality. Network speed is a major installation challenge."]}]};
const GLOSS={"18":[{"t":"Technical personnel","ar":"الموظفون التقنيون","ard":"الأشخاص الذين لديهم خبرة تقنية، مثل المطورين أو موظفي تكنولوجيا المعلومات.","d":"People with technical expertise, such as developers or IT staff."},{"t":"Non-technical personnel","ar":"الموظفون غير التقنيين","ard":"الأشخاص الذين ليس لديهم خبرة تقنية، مثل المديرين أو العملاء.","d":"People without technical expertise, such as managers or clients."},{"t":"Internal customers","ar":"العملاء الداخليون","ard":"المستخدمون داخل نفس المؤسسة الذين يعتمدون على النظام.","d":"Users within the same organization who rely on the system."},{"t":"External customers","ar":"العملاء الخارجيون","ard":"المستخدمون خارج المؤسسة، مثل العملاء أو الجمهور العام.","d":"Users outside the organization, such as clients or the general public."},{"t":"Software developers","ar":"مطورو البرمجيات","ard":"المتخصصون الذين يكتبون الشيفرة لبناء التطبيقات.","d":"Professionals who write code to build applications."},{"t":"Web developers","ar":"مطورو الويب","ard":"المتخصصون الذين يقومون بتصميم وبرمجة مواقع الويب.","d":"Professionals who design and code websites."},{"t":"Designers","ar":"المصممون","ard":"الأشخاص الذين يخططون ويصممون تخطيطات الواجهة البصرية أو الوظيفية.","d":"People who plan and create visual or functional interface layouts."},{"t":"Users","ar":"المستخدمون","ard":"المستخدمون النهائيون الذين يتفاعلون مع النظام أو الواجهة.","d":"End-users who interact with the system or interface."},{"t":"Stakeholders","ar":"أصحاب المصلحة","ard":"الأفراد أو المجموعات الذين لديهم مصلحة في نتائج المشروع.","d":"Individuals or groups with an interest in the project outcome."},{"t":"Content authors","ar":"مؤلفو المحتوى","ard":"الأشخاص الذين يقومون بإنشاء أو إدارة المحتوى النصي أو متعدد الوسائط للواجهة.","d":"People who create or manage written or multimedia content for the interface."},{"t":"Information architects","ar":"مهندسو المعلومات","ard":"المتخصصون الذين ينظمون ويهيكلون المحتوى لضمان سهولة الاستخدام والتنقل.","d":"Professionals who organize and structure content for usability and navigation."},{"t":"Project managers","ar":"مديرو المشاريع","ard":"الأشخاص المسؤولون عن تخطيط وتنفيذ وإتمام المشاريع.","d":"People responsible for planning, executing, and completing projects."},{"t":"Device / Hardware","ar":"الجهاز / العتاد","ard":"المعدات المادية المستخدمة للتفاعل مع الواجهة (كمبيوتر، جهاز لوحي، هاتف ذكي).","d":"Physical equipment used to interact with the interface (PC, tablet, smartphone)."},{"t":"Input mode","ar":"طريقة الإدخال","ard":"طرق إدخال المستخدم، بما في ذلك اللمس، القلم، الفأرة، ولوحة المفاتيح.","d":"Methods for user input, including touch, stylus, mouse, and keyboard."},{"t":"Screen size","ar":"حجم الشاشة","ard":"أبعاد الشاشة المادية أو دقة العرض.","d":"Physical dimensions or resolution of the display."},{"t":"Platform / Operating system","ar":"المنصة / نظام التشغيل","ard":"بيئة البرمجيات التي تعمل عليها الواجهة (ويندوز، ماك، أندرويد، آي أو إس).","d":"Software environment the interface runs on (Windows, macOS, Android, iOS)."},{"t":"Design guidelines / House style","ar":"إرشادات التصميم / النمط المؤسسي","ard":"قواعد لضمان تصميم متسق، وهوية بصرية واضحة، وسهولة الاستخدام.","d":"Rules for consistent design, branding, and usability."},{"t":"Resolution","ar":"دقة الشاشة","ard":"عدد البيكسلات المعروضة على الشاشة، مما يؤثر على الوضوح.","d":"Number of pixels displayed on the screen, affecting clarity."},{"t":"Refresh rate","ar":"معدل التحديث","ard":"عدد مرات تحديث الشاشة في الثانية (هرتز).","d":"How often the display updates per second (Hz)."},{"t":"Aspect ratio","ar":"نسبة العرض إلى الارتفاع","ard":"نسبة العرض إلى الارتفاع للشاشة.","d":"Width-to-height ratio of the screen."},{"t":"Demographics","ar":"الخصائص الديموغرافية","ard":"البيانات الإحصائية حول المستخدمين (العمر، الجنس، الموقع).","d":"Statistical data about users (age, gender, location)."},{"t":"Language","ar":"اللغة","ard":"اللغة الأساسية التي يستخدمها المستخدمون.","d":"Primary language(s) used by users."},{"t":"Literacy","ar":"القدرة على القراءة والكتابة","ard":"مهارات القراءة والكتابة لدى المستخدمين.","d":"Users’ reading and writing skills."},{"t":"Numeracy","ar":"المهارات الحسابية","ard":"قدرة المستخدمين على التعامل مع الأرقام.","d":"Users’ ability to work with numbers."},{"t":"Experience with technology","ar":"الخبرة التقنية","ard":"مدى إلمام المستخدمين بالأجهزة والبرمجيات والواجهات.","d":"Familiarity with devices, software, and interfaces."},{"t":"Disabilities / Specific needs","ar":"الإعاقات / الاحتياجات الخاصة","ard":"متطلبات الوصول للمستخدمين ذوي الإعاقات أو الاحتياجات الخاصة.","d":"Accessibility requirements for users with physical, cognitive, or sensory limitations."},{"t":"Cultural interests","ar":"الاهتمامات الثقافية","ard":"خلفية المستخدم الثقافية وتفضيلاته التي تؤثر على إدراكه للواجهة.","d":"User’s cultural background and preferences affecting interface perception."},{"t":"Economic interests","ar":"الاهتمامات الاقتصادية","ard":"السياق المالي للمستخدمين الذي يؤثر على تفاعلهم.","d":"Users’ financial context influencing their interactions."},{"t":"Personality","ar":"الشخصية","ard":"السمات الشخصية التي قد تؤثر على تفاعل المستخدم.","d":"Behavioral traits that may affect user interaction."},{"t":"Purpose for using the interface","ar":"الغرض من استخدام الواجهة","ard":"سبب تفاعل المستخدم مع النظام (مهام، ترفيه، تعلم).","d":"Reason why the user interacts with the system (tasks, entertainment, learning)."},{"t":"Content map","ar":"خريطة المحتوى","ard":"مخطط يوضح هيكل وتنظيم المحتوى.","d":"Diagram showing structure and organization of content."},{"t":"Storyboards","ar":"القصص المصورة","ard":"تسلسل مرئي يوضح تفاعل المستخدم أو تدفق الواجهة.","d":"Visual sequences depicting user interaction or interface flow."},{"t":"Wireframes","ar":"الإطارات الشبكية (Wireframes)","ard":"دليل بصري مبسط يوضح تخطيط وهيكل الصفحات.","d":"Simplified visual guides showing layout and structure of pages."},{"t":"Flowcharts","ar":"مخططات التدفق","ard":"مخططات توضح خطوات العمليات أو رحلة المستخدم.","d":"Diagrams showing steps in processes or user journeys."},{"t":"Diagrams","ar":"المخططات","ard":"تمثيلات مرئية للعمليات أو الأنظمة أو العلاقات.","d":"Visual representations of processes, systems, or relationships."},{"t":"Navigation chart","ar":"مخطط التنقل","ard":"خريطة توضح كيفية تنقل المستخدمين في الواجهة.","d":"Map of how users move through an interface."},{"t":"Interface goals","ar":"أهداف الواجهة","ard":"أهداف الواجهة من حيث تجربة المستخدم، التفاعل، أو تحقيق التحويلات.","d":"Objectives for user experience, engagement, or conversions."},{"t":"Conversion paths","ar":"مسارات التحويل","ard":"خطوات يتبعها المستخدم لإتمام الإجراءات المطلوبة (شراء، تسجيل، تحميل).","d":"Steps users take to complete desired actions (purchase, signup, download)."},{"t":"Sitemap","ar":"خريطة الموقع","ard":"مخطط يوضح جميع الصفحات وتسلسلها في الموقع.","d":"Outline of all pages and their hierarchy in a website."},{"t":"Task analysis","ar":"تحليل المهام","ard":"دراسة مهام المستخدم لتوجيه هيكل الواجهة.","d":"Study of user tasks to inform interface structure."},{"t":"Grids","ar":"الشبكات التنسيقية","ard":"إطار هيكلي لتنسيق المحتوى على الصفحة.","d":"Structural framework for aligning content on the page."},{"t":"Navigation / Menus","ar":"التنقل / القوائم","ard":"عناصر تسمح للمستخدمين بالتنقل بين الأقسام أو الصفحات.","d":"Elements allowing users to move between sections or pages."},{"t":"Headers / Footers","ar":"الترويسة / التذييل","ard":"المناطق العلوية والسفلية للصفحات، تحتوي على التنقل، الشعارات، أو المعلومات.","d":"Top and bottom areas of pages, containing navigation, logos, or info."},{"t":"Logos","ar":"الشعارات","ard":"رموز أو رسومات تمثل هوية المنظمة.","d":"Brand symbols or graphics representing the organization."},{"t":"Content areas","ar":"مناطق المحتوى","ard":"الأقسام الرئيسية التي يُعرض فيها المحتوى.","d":"Main sections where information is displayed."},{"t":"Banners / Advertising","ar":"اللافتات / الإعلانات","ard":"صور أو رسائل ترويجية ضمن الواجهة.","d":"Promotional visuals or messages within the interface."},{"t":"Buttons","ar":"الأزرار","ard":"عناصر قابلة للنقر لتنفيذ إجراءات المستخدم.","d":"Clickable elements for user actions."},{"t":"Forms / Form inputs","ar":"النماذج / حقول الإدخال","ard":"حقول حيث يُدخل المستخدم البيانات (نص، مربعات اختيار، قوائم منسدلة).","d":"Fields where users provide data (text, checkboxes, dropdowns)."},{"t":"Links","ar":"الروابط","ard":"نصوص أو صور قابلة للنقر للتنقل إلى صفحات أو محتوى آخر.","d":"Clickable text or images navigating to other pages or content."},{"t":"Login","ar":"تسجيل الدخول","ard":"واجهة تسمح للمستخدمين بالوصول إلى حساباتهم الشخصية.","d":"Interface allowing users to access personal accounts."},{"t":"Search","ar":"البحث","ard":"أداة تمكن المستخدمين من البحث عن محتوى أو بيانات داخل النظام.","d":"Tool enabling users to find content or data within the system."},{"t":"Breadcrumbs","ar":"مسار التنقل (Breadcrumbs)","ard":"أداة تنقل توضح موقع المستخدم داخل هيكل الواجهة.","d":"Navigation aid showing the user’s location in the interface hierarchy."},{"t":"Icons","ar":"الأيقونات","ard":"رسومات صغيرة تمثل الإجراءات أو الملفات أو الوظائف.","d":"Small graphics representing actions, files, or functions."},{"t":"Modals / Pop-ups","ar":"النوافذ المنبثقة","ard":"نوافذ تتراكب على المحتوى الرئيسي للإشعارات أو الإدخال.","d":"Windows that overlay the main content for notifications or input."},{"t":"Tabs","ar":"علامات التبويب","ard":"عناصر واجهة المستخدم التي تفصل المحتوى إلى أقسام.","d":"UI elements that separate content into sections."},{"t":"Sliders / Carousels","ar":"شرائح العرض / الدوّارات","ard":"عناصر لتصفح الصور أو المحتوى أفقياً.","d":"Components for browsing images or content horizontally."},{"t":"Rollovers","ar":"تأثيرات التمرير (Rollovers)","ard":"تغييرات بصرية عند مرور المؤشر فوق عنصر ما.","d":"Visual changes when the user hovers over an element."},{"t":"Accordion","ar":"القائمة القابلة للطي (Accordion)","ard":"عنصر واجهة قابل للتمدد والانكماش لتوفير المساحة.","d":"Expandable and collapsible UI element to save space."},{"t":"Cards", },{"t":"Feedback forms","ar":"نماذج الملاحظات","ard":"نماذج منظمة لجمع آراء المستخدمين واقتراحاتهم.","d":"Structured forms to gather user opinions and suggestions."},{"t":"Eye-tracking","ar":"تتبع حركة العين","ard":"تقنية لدراسة أماكن نظر المستخدمين على الواجهة.","d":"Technique to study where users look on the interface."},{"t":"User Interface (UI)","ar":"واجهة المستخدم","ard":"المساحة التي يتفاعل فيها المستخدم مع النظام من خلال العناصر المرئية مثل الأزرار والقوائم.","d":"The visual elements (buttons, menus, etc.) through which users interact with a digital product."},{"t":"User Experience (UX)","ar":"تجربة المستخدم","ard":"التجربة الكلية للمستخدم ومدى رضاه عند استخدام المنتج أو النظام.","d":"The overall feel and usability of a product, focusing on user satisfaction and efficiency."},{"t":"Prototype","ar":"النموذج الأولي","ard":"نسخة أولية تفاعلية من التصميم تُستخدم لاختبار الأفكار قبل التطوير الكامل.","d":"A working model of a product used for testing before final development."},{"t":"Responsive Design","ar":"التصميم المتجاوب","ard":"تصميم يتكيّف تلقائيًا مع أحجام الشاشات والأجهزة المختلفة.","d":"Design that adapts to different screen sizes (desktop, tablet, mobile)."},{"t":"Interaction Design","ar":"التصميم التفاعلي","ard":"تصميم طريقة تفاعل المستخدم مع المنتج وكيفية استجابة النظام لأفعاله.","d":"Crafting interactive experiences with a focus on user behavior and engagement."},{"t":"Call-to-Action (CTA)","ar":"دعوة إلى الإجراء","ard":"عنصر في الواجهة، مثل زر، يشجع المستخدم على اتخاذ إجراء معين مثل \"اشترِ الآن\".","d":"A prompt (e.g., button or link) designed to trigger a user response (e.g., \"Subscribe Now\")."},{"t":"Information Architecture","ar":"هيكلة المعلومات","ard":"تنظيم المحتوى وهيكلته وتسميته لتسهيل العثور عليه وفهمه.","d":"Organizing and structuring content for intuitive navigation."},{"t":"Mockup","ar":"النموذج المرئي (Mockup)","ard":"تصميم ثابت عالي الدقة يوضح مظهر الواجهة النهائي قبل برمجتها.","d":"A high-fidelity static representation of a product’s design."},{"t":"Figma/Adobe XD","ar":"أدوات التصميم","ard":"أدوات برمجية تُستخدم لتصميم الواجهات والنماذج الأولية والتعاون عليها.","d":"Popular software tools for UI/UX design and prototypin"}],"19":[{"t":"Requirement","ar":"متطلب","ard":"حاجة أو توقع موثَّق يجب أن يلبيه النظام.","d":"A documented need or expectation that a system must satisfy."},{"t":"Functional Requirement","ar":"متطلب وظيفي","ard":"يحدد ما يجب أن يقوم به النظام.","d":"Specifies what the system should do."},{"t":"Non-functional Requirement","ar":"متطلب غير وظيفي","ard":"يحدد خصائص جودة النظام مثل الأداء والأمان وسهولة الاستخدام.","d":"Defines system qualities such as performance, security, or usability."},{"t":"Stakeholder","ar":"صاحب المصلحة","ard":"شخص أو مجموعة لها مصلحة في النظام أو المشروع.","d":"A person or group with an interest in the system or project."},{"t":"Constraints","ar":"القيود","ard":"حدود أو قيود على تصميم النظام أو تنفيذه.","d":"Limitations or restrictions on system design or implementation."},{"t":"Model","ar":"النموذج","ard":"تمثيل مجرد لنظام أو عملية.","d":"An abstract representation of a system or process."},{"t":"Diagram","ar":"المخطط","ard":"تمثيل مرئي لمكونات النظام أو سلوكه.","d":"A visual representation of system components or behavior."},{"t":"Actor","ar":"الفاعل","ard":"كيان خارجي يتفاعل مع النظام.","d":"An external entity that interacts with the system."},{"t":"Relationship","ar":"العلاقة","ard":"رابط بين عناصر UML (مثل الارتباط والاعتمادية).","d":"A connection between UML elements (association, dependency, etc.)."},{"t":"Action","ar":"الإجراء","ard":"مهمة تُنفَّذ داخل مخطط النشاط.","d":"A task performed within an activity diagram."},{"t":"Control Flow","ar":"تدفق التحكم","ard":"الترتيب الذي تُنفَّذ به الإجراءات.","d":"The order in which actions are executed."},{"t":"Decision Node","ar":"عقدة القرار","ard":"نقطة تفرّع تعتمد على شروط.","d":"A branching point based on conditions."},{"t":"Swimlane","ar":"المسار (الحارة)","ard":"قسم يوضح الجهة المسؤولة عن الإجراءات.", ces","ar":"الواجهات","ard":"نقاط التفاعل بين المكونات.","d":"Points of interaction between components."},{"t":"Design Specification","ar":"مواصفات التصميم","ard":"وصف مفصل لتصميم الحل.","d":"Detailed description of the solution design."},{"t":"Technical Feasibility","ar":"الجدوى التقنية","ard":"مدى إمكانية بناء الحل بالتقنية المتاحة.","d":"Whether the solution can be built with existing technology."},{"t":"Economic Feasibility","ar":"الجدوى الاقتصادية","ard":"تحليل التكلفة والعائد للحل.","d":"Cost-benefit analysis of the solution."},{"t":"Operational Feasibility","ar":"الجدوى التشغيلية","ard":"أثر الحل على المستخدمين والمؤسسة.","d":"Impact on users and organization."},{"t":"Schedule Feasibility","ar":"الجدوى الزمنية","ard":"القدرة على إنجاز الحل ضمن القيود الزمنية.","d":"Ability to complete within time constraints."},{"t":"Installation Guide","ar":"دليل التثبيت","ard":"تعليمات إعداد النظام.","d":"Instructions for system setup."},{"t":"Configuration","ar":"الإعداد (التهيئة)","ard":"إعدادات النظام وتخصيصه.","d":"System settings and customization."},{"t":"Troubleshooting","ar":"استكشاف الأخطاء وإصلاحها","ard":"تشخيص المشكلات وإصلاحها.","d":"Diagnosing and fixing problems."},{"t":"Cost Estimation","ar":"تقدير التكلفة","ard":"التنبؤ بنفقات المشروع.","d":"Predicting project expenses."},{"t":"Resource Allocation","ar":"تخصيص الموارد","ard":"توزيع الأموال والأفراد.","d":"Distribution of funds and personnel."},{"t":"Capital Cost","ar":"التكلفة الرأسمالية","ard":"نفقات تُدفع مرة واحدة.","d":"One-time expenses."},{"t":"Operating Cost","ar":"تكلفة التشغيل","ard":"نفقات مستمرة.","d":"Ongoing expenses."},{"t":"Risk","ar":"المخاطرة","ard":"حدث محتمل قد يسبب ضررًا.","d":"A potential event that could cause harm."},{"t":"Risk Assessment","ar":"تقييم المخاطر","ard":"تقييم احتمال حدوث المخاطر وأثرها.","d":"Evaluating risk likelihood and impact."},{"t":"Mitigation","ar":"التخفيف","ard":"إجراءات لتقليل أثر المخاطر.","d":"Actions to reduce risk impact."},{"t":"Contingency Plan","ar":"خطة tworking, and engineering technologies."},{"t":"Compliance","ar":"الامتثال","ard":"الالتزام بالمعايير أو القوانين أو اللوائح المطلوبة.","d":"The act of following required standards, laws, or regulations."},{"t":"Protocol","ar":"بروتوكول","ard":"مجموعة قواعد تحدد كيفية إرسال البيانات واستقبالها عبر الشبكات.","d":"A set of rules that define how data is transmitted and received across networks."},{"t":"Accessibility","ar":"إمكانية الوصول","ard":"تصميم الأنظمة بحيث يستطيع الأشخاص ذوو الإعاقة استخدامها.","d":"Designing systems so they can be used by people with disabilities."},{"t":"Usability","ar":"سهولة الاستخدام","ard":"مدى سهولة النظام وكفاءته في الاستخدام.","d":"The degree to which a system is easy and efficient for users to operate."},{"t":"WCAG","ar":"إرشادات الوصول للمحتوى","ard":"إرشادات دولية لجعل محتوى الويب متاحًا لجميع المستخدمين.","d":"International guidelines for making web content accessible to all users."},{"t":"Screen Reader","ar":"قارئ الشاشة","ard":"برنامج مساعد يقرأ النص الظاهر على الشاشة بصوت مسموع للمستخدمين ذوي الإعاقة البصرية.","d":"Assistive software that reads on-screen text aloud for visually impaired users."},{"t":"Keyboard Navigation","ar":"التنقل باستخدام لوحة المفاتيح","ard":"القدرة على تشغيل النظام باستخدام لوحة المفاتيح بدلًا من الفأرة.","d":"The ability to operate a system using a keyboard instead of a mouse."},{"t":"User Interface (UI)","ar":"واجهة المستخدم","ard":"العناصر المرئية التي يتفاعل المستخدمون من خلالها مع النظام.","d":"The visual elements through which users interact with a system."},{"t":"User Experience (UX)","ar":"تجربة المستخدم","ard":"التجربة الكلية للمستخدم ومدى رضاه عند التفاعل مع النظام.","d":"The overall experience and satisfaction a user has when interacting with a system."},{"t":"Performance Metrics","ar":"مؤشرات الأداء","ard":"مقاييس كمية تُستخدم لتقييم كفاءة النظام وفعاليته.","d":"Quantitative measures used to evaluate system efficiency and effectiveness."},{"t":"Key Performance Indicator (KPI)","ar":"مؤشر الأدا
