elopment"],"a":1,"e":"DevOps combines development and operations and automates building, testing and deployment.","s":"bank","src":"Unit 24 row 24","tp":1},{"id":"T24-24","u":"24","q":"Which modeling language is widely used to design object-oriented software using class and use-case diagrams?","o":["UML (Unified Modeling Language)","BPMN","SQL","XML"],"a":0,"e":"UML is the standard modeling language for object-oriented design, including class and use-case diagrams.","s":"bank","src":"Unit 24 row 25","tp":0},{"id":"T24-26","u":"24","q":"In Java, related classes in a library are organized into:","o":["Methods","Packages","Interfaces","Folders called libraries"],"a":1,"e":"Java groups related classes into packages, such as java.util.","s":"bank","src":"Unit 24 row 27","tp":1},{"id":"T24-27","u":"24","q":"Which Java package contains collection classes such as ArrayList and HashMap?","o":["java.io","java.util","java.awt","java.net"],"a":1,"e":"java.util contains the collection classes, such as ArrayList and HashMap.","s":"bank","src":"Unit 24 row 28","tp":1},{"id":"T24-28","u":"24","q":"Java libraries are usually distributed as which type of file?","o":["JAR (Java ARchive)","EXE","CLASS file only","ZIP of the source code"],"a":0,"e":"Java libraries are usually distributed as JAR files, which bundle compiled classes.","s":"bank","src":"Unit 24 row 29","tp":0},{"id":"T24-29","u":"24","q":"Which statement makes the classes of a library package available in a Java program?","o":["include","import","extends","package"],"a":1,"e":"The import statement makes classes from a package available in your program.","s":"bank","src":"Unit 24 row 30","tp":1},{"id":"T24-30","u":"24","q":"Which software metric measures the size of a program by counting its lines of code?","o":["Cyclomatic complexity","Code coverage","LOC (lines of code)","Defect density"],"a":2,"e":"LOC (lines of code) measures program size by counting lines.","s":"bank","src":"Unit 24 row 31","tp":1},{"id":"T24-31","u":"24","q":"Code coverage is a metric that shows:","o":["The number of independent paths through the code","The number of lines of code","The number of defects found per module","The percentage of code executed by the tests"],"a":3,"e":"Code coverage shows what percentage of the code runs during the tests.","s":"bank","src":"Unit 24 row 32","tp":0},{"id":"T24-32","u":"24","q":"Cyclomatic complexity measures:","o":["The number of independent paths through the code","The number of lines of code","The percentage of code covered by tests","The number of comments"],"a":0,"e":"Cyclomatic complexity counts the independent paths through the code. More paths means more complex code.","s":"bank","src":"Unit 24 row 33","tp":0},{"id":"T24-33","u":"24","q":"Which tool can be used to collect performance metrics such as memory and CPU usage of a running Java program?","o":["A debugger","A profiler","A compiler","A code editor"],"a":1,"e":"A profiler measures how a running program uses resources such as memory and CPU.","s":"bank","src":"Unit 24 row 34","tp":1},{"id":"T24-34","u":"24","q":"A design pattern is:","o":["A reusable skeleton application that calls your code","A common way of writing a small piece of code in one language","A proven, reusable solution to a common software design problem","A collection of pre-written classes"],"a":2,"e":"A design pattern is a proven, reusable solution to a common design problem.","s":"bank","src":"Unit 24 row 35","tp":2},{"id":"T24-35","u":"24","q":"Which design pattern ensures that a class has only one instance?","o":["Observer","Factory","Adapter","Singleton"],"a":3,"e":"The Singleton pattern makes sure a class has only one instance.","s":"bank","src":"Unit 24 row 36","tp":2},{"id":"T24-36","u":"24","q":"A software framework differs from a library because:","o":["A library controls the flow of your program","A framework contains no code","The framework calls your code (inversion of control), whereas your code calls a library","A framework cannot be reused"],"a":2,"e":"With a framework, the framework calls your code (inversion of control). With a library, your code calls the library.","s":"bank","src":"Unit 24 row 37","tp":0},{"id":"T24-37","u":"24","q":"Which of the following is a popular Java framework?","o":["Javadoc","Maven","Spring","Git"],"a":2,"e":"Spring is a widely used Java framework.","s":"bank","src":"Unit 24 row 38","tp":0},{"id":"T24-38","u":"24","q":"A programming idiom is:","o":["A common, recognized way of writing a small piece of code in a particular language","A complete reusable application skeleton","A proven solution to a common design problem","A collection of library classes"],"a":0,"e":"An idiom is a common, recognized way of writing a small piece of code in a particular language.","s":"bank","src":"Unit 24 row 39","tp":1},{"id":"T24-39","u":"24","q":"Which of the following is a version control (repository) tool?","o":["Git","Eclipse","JUnit","Javadoc"],"a":0,"e":"Git is a version control system that stores code in repositories.","s":"bank","src":"Unit 24 row 40","tp":2},{"id":"T24-40","u":"24","q":"Which Git command records changes to the local repository?","o":["git commit","git push","git clone","git pull"],"a":0,"e":"git commit records your staged changes in the local repository.","s":"bank","src":"Unit 24 row 41","tp":2},{"id":"T24-41","u":"24","q":"Maven Central is an example of:","o":["A Java compiler","A version control system","A Java framework","An online repository for Java libraries"],"a":3,"e":"Maven Central is an online repository that stores Java libraries for download.","s":"bank","src":"Unit 24 row 42","tp":0},{"id":"T24-42","u":"24","q":"What is the main benefit of using a repository tool in a team?","o":["It compiles the code automatically","It measures the code quality","It generates the documentation","It tracks changes and lets several developers work on the same code safely"],"a":3,"e":"A repository tool tracks every change, so several developers can work on the same code safely.","s":"bank","src":"Unit 24 row 43","tp":0},{"id":"T24-43","u":"24","q":"Which Git command downloads a copy of a remote repository to your computer for the first time?","o":["git push","git merge","git commit","git clone"],"a":3,"e":"git clone downloads a full copy of a remote repository for the first time.","s":"bank","src":"Unit 24 row 44","tp":2},{"id":"TA01-1","u":"A01","q":"Which of the following is an Integrated Development Environment (IDE) commonly used for Java?","o":["JRE","Byte code","javac","Eclipse"],"a":3,"e":"Eclipse is an IDE commonly used for Java. The JRE, byte code and javac are not IDEs.","s":"bank","src":"Unit A01 row 2","tp":0},{"id":"TA01-2","u":"A01","q":"Which editor feature suggests method names and variables as you type?","o":["Garbage collection","Packaging","Code completion (IntelliSense)","Byte code verification"],"a":2,"e":"Code completion (IntelliSense) suggests method and variable names as you type.","s":"bank","src":"Unit A01 row 3","tp":0},{"id":"TA01-3","u":"A01","q":"Besides an editor, an IDE normally also includes:","o":["An operating system","A compiler and a debugger","A database server","A graphic design tool"],"a":1,"e":"An IDE combines an editor with a compiler and a debugger, along with other development tools.","s":"bank","src":"Unit A01 row 4","tp":0},{"id":"TA01-4","u":"A01","q":"In Java, the interpreter's job is to:","o":["Write the source code","Store the source code in a repository","Design the user interface","Read and execute the byte code on the target machine"],"a":3,"e":"The interpreter (the JVM) reads and runs the byte code on the target machine.","s":"bank","src":"Unit A01 row 5","tp":0},{"id":"TA01-5","u":"A01","q":"Which part of the Java platform contains the interpreter needed to run Java programs (but not to compile them)?","o":["Javadoc","The text editor","The source file","JRE (Java Runtime Environment)"],"a":3,"e":"The JRE (Java Runtime Environment) can run Java programs. Compiling needs the JDK.","s":"bank","src":"Unit A01 row 6","tp":0},{"id":"TA01-6","u":"A01","q":"Which statement about interpreted execution is TRUE?","o":["Errors may appear at run time when the faulty line is reached","Interpreted programs always run faster than compiled ones","All errors are found before the program runs","Interpreted code does not need a runtime environment"],"a":0,"e":"Interpreted code is checked as it runs, so an error appears only when the faulty line is reached.","s":"bank","src":"Unit A01 row 7","tp":0},{"id":"TA01-7","u":"A01","q":"What does a compiler do?","o":["Executes code line by line as it is typed","Uploads code to a repository","Draws the user interface","Translates the whole source code into another form (e.g. byte code) before execution"],"a":3,"e":"A compiler translates the whole source program into another form, such as byte code, before it runs.","s":"bank","src":"Unit A01 row 8","tp":0},{"id":"TA01-8","u":"A01","q":"After running javac Hello.java successfully, which file is produced?","o":["Hello.txt","Hello.exe","Hello.class","Hello.jar"],"a":2,"e":"javac Hello.java produces Hello.class, which contains the byte code.","s":"bank","src":"Unit A01 row 9","tp":0},{"id":"TA01-9","u":"A01","q":"Which of these errors would be reported by the Java compiler?","o":["Dividing by zero because of user input at run time","A user entering the wrong password","A missing semicolon at the end of a statement","The network being unavailable"],"a":2,"e":"A missing semicolon is a syntax error, which the compiler reports. The other options happen at run time.","s":"bank","src":"Unit A01 row 10","tp":0},{"id":"TA01-10","u":"A01","q":"Which of the following are the four main concepts of object-oriented programming?","o":["Input, Process, Output, Storage","Analysis, Design, Coding, Testing","Encapsulation, Inheritance, Polymorphism, Abstraction","Sequence, Selection, Iteration, Recursion"],"a":2,"e":"The four main OOP concepts are encapsulation, inheritance, polymorphism and abstraction.","s":"bank","src":"Unit A01 row 11","tp":1},{"id":"TA01-11","u":"A01","q":"Method overloading is an example of:","o":["Inheritance - sharing attributes","Polymorphism - same method name with different parameter lists","Encapsulation - hiding data","Iteration - repeating code"],"a":1,"e":"Overloading (same name, different parameters) is a form of polymorphism.","s":"bank","src":"Unit A01 row 12","tp":1},{"id":"TA01-12","u":"A01","q":"Bundling data and the methods that operate on that data into a single unit is called:","o":["Encapsulation","Compilation","Interpretation","Inheritance"],"a":0,"e":"Encapsulation bundles data with the methods that work on it, inside a class.","s":"bank","src":"Unit A01 row 13","tp":1},{"id":"TA01-13","u":"A01","q":"A subclass providing its own version of a method already defined in its superclass is called:","o":["Instantiation","Encapsulation","Method overloading","Method overriding"],"a":3,"e":"Overriding is when a subclass provides its own version of an inherited method.","s":"bank","src":"Unit A01 row 14","tp":1},{"id":"TA01-14","u":"A01","q":"Which of the following is the correct way to declare a class in Java?","o":["class = Student()","public class Student { }","Student class() { }","new class Student"],"a":1,"e":"A Java class is declared as: public class Student { }.","s":"bank","src":"Unit A01 row 15","tp":0},{"id":"TA01-15","u":"A01","q":"Variables declared inside a class to store an object's data are called:","o":["Attributes (fields / instance variables)","Imports","Packages","Loops"],"a":0,"e":"Attributes (fields or instance variables) store each object's data.","s":"bank","src":"Unit A01 row 16","tp":1},{"id":"TA01-16","u":"A01","q":"Which line correctly creates an object of the Student class?","o":["class s = new Student","Student s = new Student()","new s = Student()","Student s = Student"],"a":1,"e":"Objects are created with new: Student s = new Student().","s":"bank","src":"Unit A01 row 17","tp":1},{"id":"TA01-17","u":"A01","q":"A constructor in Java must:","o":["Have the same name as the class and no return type","Always return an int","Have a different name from the class","Be declared as private static"],"a":0,"e":"A constructor has the same name as its class and no return type.","s":"bank","src":"Unit A01 row 18","tp":1},{"id":"TA01-18","u":"A01","q":"The Java Class Library (Java API) is:","o":["A set of Java coding standards","A collection of sample Java programs","A single class called Library","A large set of ready-made classes supplied with the JDK"],"a":3,"e":"The Java Class Library is the large set of ready-made classes that comes with the JDK.","s":"bank","src":"Unit A01 row 19","tp":1},{"id":"TA01-19","u":"A01","q":"Which class from the Java Class Library is commonly used to read keyboard input?","o":["java.util.Scanner","java.lang.Math","javax.swing.JButton","java.io.File"],"a":0,"e":"java.util.Scanner reads input, such as text typed on the keyboard.","s":"bank","src":"Unit A01 row 20","tp":1},{"id":"TA01-20","u":"A01","q":"Which package is imported automatically into every Java program?","o":["java.io","java.lang","java.sql","java.util"],"a":1,"e":"java.lang (with classes such as String and Math) is imported automatically.","s":"bank","src":"Unit A01 row 21","tp":0},{"id":"TA01-21","u":"A01","q":"Java byte code is:","o":["Code that runs directly on the CPU without a JVM","Machine code for one specific processor only","The original source code written by the programmer","A platform-independent intermediate code executed by the JVM"],"a":3,"e":"Byte code is platform-independent intermediate code that the JVM runs.","s":"bank","src":"Unit A01 row 22","tp":0},{"id":"TA01-22","u":"A01","q":"Which phrase describes the benefit of Java byte code?","o":["Compile once, run on Windows only","Write Once, Run Anywhere","Write once, compile everywhere","One program per operating system"],"a":1,"e":"The same byte code runs on any device with a JVM: Write Once, Run Anywhere.","s":"bank","src":"Unit A01 row 23","tp":0},{"id":"TA01-24","u":"A01","q":"Which is a main difference between Java and C++?","o":["Java supports pointers directly; C++ does not","Java manages memory automatically using garbage collection; C++ requires manual memory management","Java has no classes; C++ does","Java cannot run on Windows"],"a":1,"e":"Java frees memory automatically with garbage collection. In C++ the programmer manages memory.","s":"bank","src":"Unit A01 row 25","tp":2},{"id":"TA01-25","u":"A01","q":"Unlike C++, Java does NOT support:","o":["Methods","Loops","Multiple inheritance of classes","Classes"],"a":2,"e":"A Java class can extend only one class. Multiple inheritance is possible only through interfaces.","s":"bank","src":"Unit A01 row 26","tp":1},{"id":"TA01-26","u":"A01","q":"How does Java differ from Python in terms of variable types?","o":["Both languages require types to be declared","Java has no data types","Python requires every variable type to be declared","Java is statically typed: variable types must be declared"],"a":3,"e":"Java is statically typed: you declare each variable's type. Python works out types at run time.","s":"bank","src":"Unit A01 row 27","tp":0},{"id":"TA01-27","u":"A01","q":"Compared with C, which is compiled directly to machine code, Java is compiled to:","o":["HTML","Byte code that runs on the JVM","Plain text","Assembly language for one CPU"],"a":1,"e":"C compiles to machine code. Java compiles to byte code that runs on the JVM.","s":"bank","src":"Unit A01 row 28","tp":0},{"id":"TA01-28","u":"A01","q":"A Java servlet is:","o":["A program that runs inside the user's browser","A Java desktop GUI window","A Java testing framework","A Java program that runs on a web server and handles client requests"],"a":3,"e":"A servlet is a Java program that runs on a web server and handles requests from clients.","s":"bank","src":"Unit A01 row 29","tp":2},{"id":"TA01-30","u":"A01","q":"Why are Java applets no longer used in modern web development?","o":["Browsers removed plug-in support because of security concerns","They could only run on servers","They were replaced by JAR files","They could not connect to the internet"],"a":0,"e":"Browsers dropped plug-in support for security reasons, so applets no longer run.","s":"bank","src":"Unit A01 row 31","tp":2},{"id":"TA01-31","u":"A01","q":"Servlets run inside which of the following?","o":["The Java compiler (javac)","A web browser plug-in","The JDK debugger","A web/servlet container such as Apache Tomcat"],"a":3,"e":"Servlets run inside a web (servlet) container such as Apache Tomcat.","s":"bank","src":"Unit A01 row 32","tp":2},{"id":"TA01-32","u":"A01","q":"In Scrum, the short daily meeting where team members report progress is called the:","o":["Daily stand-up (daily scrum)","Release plan","Product backlog","Sprint retrospective"],"a":0,"e":"The daily stand-up (daily scrum) is a short daily meeting where the team shares progress.","s":"bank","src":"Unit A01 row 33","tp":0},{"id":"TA01-33","u":"A01","q":"Which methodology is MOST suitable when requirements are fixed and well understood from the start?","o":["Waterfall","Extreme Programming","Rapid prototyping","Agile"],"a":0,"e":"Waterfall suits projects where requirements are fixed and clear from the start.","s":"bank","src":"Unit A01 row 34","tp":1},{"id":"TA01-34","u":"A01","q":"Test-Driven Development (TDD) means:","o":["Writing tests before writing the code that makes them pass","Testing only after the software is released","Letting users do all the testing","Writing tests only for the user interface"],"a":0,"e":"In TDD you write a test first, then write the code that makes it pass.","s":"bank","src":"Unit A01 row 35","tp":0},{"id":"TA01-35","u":"A01","q":"What does a typical Java library JAR file contain?","o":["Compiled .class files organized in package folders, plus a manifest","Only .java source files","Only images","Executable .exe files"],"a":0,"e":"A library JAR contains compiled .class files in package folders, plus a manifest.","s":"bank","src":"Unit A01 row 36","tp":0},{"id":"TA01-36","u":"A01","q":"Documentation that describes the classes and methods of a Java library is generated by:","o":["javac","Git","Javadoc","JVM"],"a":2,"e":"Javadoc generates documentation for classes and methods from comments in the code.","s":"bank","src":"Unit A01 row 37","tp":1},{"id":"TA01-37","u":"A01","q":"Package names like com.company.project follow which convention?","o":["Programmer's name","Alphabetical order","Reverse domain name","Date of creation"],"a":2,"e":"Java package names use your domain name in reverse, such as com.company.project.","s":"bank","src":"Unit A01 row 38","tp":1},{"id":"TA01-38","u":"A01","q":"Which metric shows how many defects are found per 1,000 lines of code?","o":["Code coverage","Response time","Throughput","Defect density"],"a":3,"e":"Defect density is the number of defects per 1,000 lines of code.","s":"bank","src":"Unit A01 row 39","tp":3},{"id":"TA01-39","u":"A01","q":"Which technique collects metrics automatically every time code is built?","o":["Asking users by email","Counting lines manually","Running a profiler once before release","Static code analysis built into every build (e.g. SonarQube)"],"a":3,"e":"Static code analysis tools built into every build (e.g. SonarQube) collect metrics automatically.","s":"bank","src":"Unit A01 row 40","tp":3},{"id":"TA01-40","u":"A01","q":"Why do development teams collect software metrics?","o":["To choose the programming language","To estimate the number of users","To measure and improve quality, productivity and performance","To replace testing"],"a":2,"e":"Metrics help teams measure and improve quality, productivity and performance.","s":"bank","src":"Unit A01 row 41","tp":3},{"id":"TA01-41","u":"A01","q":"Which design pattern separates an application into Model, View and Controller?","o":["Singleton","Iterator","MVC","Decorator"],"a":2,"e":"MVC separates an application into a Model (data), a View (display) and a Controller (input handling).","s":"bank","src":"Unit A01 row 42","tp":3},{"id":"TA01-42","u":"A01","q":"The Observer pattern is used when:","o":["Several objects need to be notified automatically when another object changes state","Objects must be created without specifying their exact class","A class must have only one instance","Two incompatible interfaces must work together"],"a":0,"e":"Observer automatically notifies other objects when one object changes state.","s":"bank","src":"Unit A01 row 43","tp":1},{"id":"TA01-43","u":"A01","q":"JUnit is an example of a:","o":["Java build tool","Testing framework for Java","Java GUI library","Version control system"],"a":1,"e":"JUnit is a framework for testing Java code.","s":"bank","src":"Unit A01 row 44","tp":0},{"id":"TA01-44","u":"A01","q":"Which is a common Java idiom for looping through every element of a collection?","o":["goto loopStart","repeat names until end","for (String name : names) { ... }","loop names forever"],"a":2,"e":"The enhanced for loop, for (String name : names), is the usual way to loop through a collection in Java.","s":"bank","src":"Unit A01 row 45","tp":1},{"id":"TA01-45","u":"A01","q":"Which of the following is an online hosting service for Git repositories?","o":["Maven Central","Apache Tomcat","Javadoc","GitHub"],"a":3,"e":"GitHub is an online service that hosts Git repositories.","s":"bank","src":"Unit A01 row 46","tp":3},{"id":"TA01-46","u":"A01","q":"Which command sends local commits to a remote repository?","o":["git push","git init","git pull","git status"],"a":0,"e":"git push sends your local commits to the remote repository.","s":"bank","src":"Unit A01 row 47","tp":3},{"id":"TA01-47","u":"A01","q":"A separate line of development in a repository, used to work on a feature without affecting the main code, is called a:","o":["Commit message","Class","Package","Branch"],"a":3,"e":"A branch is a separate line of development, used to work on a feature without changing the main code.","s":"bank","src":"Unit A01 row 48","tp":3},{"id":"TA01-48","u":"A01","q":"Which build tool also downloads library dependencies from a central repository?","o":["Git","Maven","javac","Javadoc"],"a":1,"e":"Maven builds projects and downloads their library dependencies from a central repository.","s":"bank","src":"Unit A01 row 49","tp":3},{"id":"TA01-49","u":"A01","q":"Which Java library is used to build desktop graphical user interfaces?","o":["Swing / JavaFX","JUnit","java.net","java.sql"],"a":0,"e":"Swing and JavaFX are Java libraries for desktop graphical interfaces.","s":"bank","src":"Unit A01 row 50","tp":1},{"id":"TA01-50","u":"A01","q":"A GUI element such as a button, label or text field is called a:","o":["Package","Servlet","Component (control / widget)","Byte code"],"a":2,"e":"Buttons, labels and text fields are GUI components (also called controls or widgets).","s":"bank","src":"Unit A01 row 51","tp":4},{"id":"TA01-51","u":"A01","q":"Which Swing component is used as the main top-level window of an application?","o":["JLabel","JFrame","JTextField","JButton"],"a":1,"e":"JFrame is the main top-level window in a Swing application.","s":"bank","src":"Unit A01 row 52","tp":4},{"id":"TA01-52","u":"A01","q":"A layout manager in Java is used to:","o":["Handle network connections","Control the position and size of components in a container","Compile the program","Store data in a database"],"a":1,"e":"A layout manager controls the position and size of components inside a container.","s":"bank","src":"Unit A01 row 53","tp":0},{"id":"TA01-53","u":"A01","q":"In Java Swing, which method must be implemented when using ActionListener?","o":["run()","toString()","actionPerformed(ActionEvent e)","main(String[] args)"],"a":2,"e":"ActionListener requires the method actionPerformed(ActionEvent e), which runs when the action happens.","s":"bank","src":"Unit A01 row 54","tp":1},{"id":"TA01-54","u":"A01","q":"Which method registers a listener with a JButton?","o":["addActionListener()","registerEvent()","setListener()","onClick()"],"a":0,"e":"addActionListener() registers a listener with a button.","s":"bank","src":"Unit A01 row 55","tp":4},{"id":"TA01-55","u":"A01","q":"The object that generates an event (for example a button that is clicked) is called the:","o":["Event handler","Event loop","Event source","Event queue"],"a":2,"e":"The object that generates an event, such as the button that was clicked, is the event source.","s":"bank","src":"Unit A01 row 56","tp":4},{"id":"TA01-56","u":"A01","q":"Which listener interface handles mouse clicks, presses and releases?","o":["WindowListener","ActionListener only","MouseListener","KeyListener"],"a":2,"e":"MouseListener handles mouse clicks, presses and releases.","s":"bank","src":"Unit A01 row 57","tp":1},{"id":"TA01-57","u":"A01","q":"Which statement adds a button called btnOK to a JFrame called frame?","o":["add.frame(btnOK)","frame.add(btnOK)","frame = btnOK","btnOK.add(frame)"],"a":1,"e":"frame.add(btnOK) adds the button to the frame.","s":"bank","src":"Unit A01 row 58","tp":4},{"id":"TA01-58","u":"A01","q":"Which method makes a JFrame window appear on the screen?","o":["show(false)","display()","open()","setVisible(true)"],"a":3,"e":"setVisible(true) makes the JFrame appear on screen.","s":"bank","src":"Unit A01 row 59","tp":1},{"id":"TA01-59","u":"A01","q":"To read the text a user typed into a JTextField called txtName, you use:","o":["txtName.setText()","txtName.getText()","txtName.read()","txtName.input()"],"a":1,"e":"getText() reads the text from a text field. setText() changes it.","s":"bank","src":"Unit A01 row 60","tp":4},{"id":"TA01-60","u":"A01","q":"Separating the user interface code from the business logic code in an application mainly improves:","o":["Program execution speed","The number of compile errors","Maintainability and reusability","Screen layout"],"a":2,"e":"Keeping the UI separate from the business logic makes the code easier to maintain and reuse.","s":"bank","src":"Unit A01 row 61","tp":3},{"id":"TA02-1","u":"A02","q":"Which component of a smartphone detects the orientation of the device (portrait or landscape)?","o":["Microphone","Battery","SIM card","Accelerometer / gyroscope"],"a":3,"e":"The accelerometer and gyroscope sense the device's movement and orientation, which is how the screen knows to rotate.","s":"bank","src":"Unit A02 row 2","tp":0},{"id":"TA02-2","u":"A02","q":"The SoC (System on a Chip) in a mobile phone combines:","o":["CPU, GPU and other components on a single chip","The SIM card and the memory card","RAM and flash storage only","The display controller and the touch sensor only"],"a":0,"e":"A System on a Chip puts the CPU, GPU and other components on one chip.","s":"bank","src":"Unit A02 row 3","tp":0},{"id":"TA02-3","u":"A02","q":"Which sensor allows a mobile app to determine the user's location?","o":["Ambient light sensor","GPS","Vibration motor","Proximity sensor"],"a":1,"e":"GPS determines the device's location.","s":"bank","src":"Unit A02 row 4","tp":0},{"id":"TA02-4","u":"A02","q":"Which sensor automatically turns the screen off when the phone is held to the ear during a call?","o":["GPS","Magnetometer","Proximity sensor","Barometer"],"a":2,"e":"The proximity sensor detects when the phone is near your face and turns the screen off.","s":"bank","src":"Unit A02 row 5","tp":0},{"id":"TA02-5","u":"A02","q":"Why must mobile app developers consider battery usage?","o":["Apps that use more battery are rejected by app stores","Background apps never use battery","Mobile devices have limited power, and heavy processing or GPS use drains the battery quickly","Battery level controls the screen resolution"],"a":2,"e":"Phones have limited battery power, and heavy processing or GPS use drains it quickly.","s":"bank","src":"Unit A02 row 6","tp":0},{"id":"TA02-6","u":"A02","q":"Compared with a mobile phone, what is the main design consideration when developing an app for a tablet?","o":["Tablets do not support portrait mode","The larger screen size allows more content and different layouts","Tablets cannot run phone apps","Tablets need a different programming language"],"a":1,"e":"Tablets have larger screens, so they can show more content and use different layouts.","s":"bank","src":"Unit A02 row 7","tp":0},{"id":"TA02-7","u":"A02","q":"Which Android feature lets developers provide different layouts for tablets and phones?","o":["Alternative resource folders (e.g. layout-sw600dp)","A separate app for each screen size","Setting a fixed screen orientation","Using only absolute pixel sizes"],"a":0,"e":"Android uses alternative resource folders (such as layout-sw600dp) to give tablets their own layouts.","s":"bank","src":"Unit A02 row 8","tp":0},{"id":"TA02-8","u":"A02","q":"Many tablets are Wi-Fi only. What should a developer consider because of this?","o":["The app should work offline or handle loss of connection gracefully","The app must use mobile data only","The app must send data by SMS","The app cannot use GPS"],"a":0,"e":"Wi-Fi-only tablets may lose connection, so the app should work offline or handle disconnection well.","s":"bank","src":"Unit A02 row 9","tp":3},{"id":"TA02-9","u":"A02","q":"Which of these is an example of a tablet device?","o":["Amazon Echo","Apple Watch","Apple TV remote","Apple iPad"],"a":3,"e":"The Apple iPad is a tablet.","s":"bank","src":"Unit A02 row 10","tp":0},{"id":"TA02-10","u":"A02","q":"Which two operating systems dominate the mobile market?","o":["Windows Phone and BlackBerry OS","Symbian and Windows Mobile","Android and iOS","HarmonyOS and KaiOS"],"a":2,"e":"Android and iOS dominate the mobile operating system market.","s":"bank","src":"Unit A02 row 11","tp":1},{"id":"TA02-11","u":"A02","q":"Android is based on which kernel?","o":["Windows NT","Darwin","Unix System V","Linux"],"a":3,"e":"Android is built on the Linux kernel.","s":"bank","src":"Unit A02 row 12","tp":1},{"id":"TA02-12","u":"A02","q":"Which programming languages are officially used to develop native iOS apps?","o":["PHP and Python","Java and Kotlin","C# and VB.NET","Swift and Objective-C"],"a":3,"e":"Native iOS apps are written in Swift or Objective-C.","s":"bank","src":"Unit A02 row 13","tp":3},{"id":"TA02-13","u":"A02","q":"Which programming languages are officially recommended for native Android development?","o":["Swift and Objective-C","Kotlin and Java","C# and Dart","JavaScript and TypeScript"],"a":1,"e":"Kotlin and Java are the official languages for native Android apps.","s":"bank","src":"Unit A02 row 14","tp":3},{"id":"TA02-14","u":"A02","q":"Android apps are distributed as which type of package?","o":["APK / AAB","IPA","MSI","EXE"],"a":0,"e":"Android apps are packaged as APK files. Google Play uses AAB (Android App Bundle).","s":"bank","src":"Unit A02 row 15","tp":1},{"id":"TA02-15","u":"A02","q":"Which is the official app store for iOS apps?","o":["Apple App Store","Google Play Store","Microsoft Store","Amazon Appstore"],"a":0,"e":"The Apple App Store is the official store for iOS apps.","s":"bank","src":"Unit A02 row 16","tp":3},{"id":"TA02-16","u":"A02","q":"Which IEEE standard family defines Wi-Fi?","o":["IEEE 802.11","IEEE 1394","IEEE 802.3","IEEE 802.15.1"],"a":0,"e":"Wi-Fi is defined by the IEEE 802.11 family of standards.","s":"bank","src":"Unit A02 row 17","tp":2},{"id":"TA02-17","u":"A02","q":"Wi-Fi 6 corresponds to which IEEE standard?","o":["802.11g","802.11ax","802.11n","802.11b"],"a":1,"e":"Wi-Fi 6 is the IEEE 802.11ax standard.","s":"bank","src":"Unit A02 row 18","tp":2},{"id":"TA02-18","u":"A02","q":"Which frequency bands are commonly used by Wi-Fi?","o":["900 MHz and 1800 MHz only","2.4 GHz and 5 GHz","60 GHz only","700 MHz and 2.6 GHz only"],"a":1,"e":"Wi-Fi commonly uses the 2.4 GHz and 5 GHz frequency bands.","s":"bank","src":"Unit A02 row 19","tp":0},{"id":"TA02-19","u":"A02","q":"Which Wi-Fi standard is also known as Wi-Fi 5?","o":["802.11ac","802.11g","802.11a","802.11ax"],"a":0,"e":"Wi-Fi 5 is the IEEE 802.11ac standard.","s":"bank","src":"Unit A02 row 20","tp":2},{"id":"TA02-20","u":"A02","q":"Which security protocol is the most secure option for protecting a Wi-Fi network?","o":["Open (no security)","WPA3","WEP","WPA (original)"],"a":1,"e":"WPA3 is the newest and most secure Wi-Fi security protocol. WEP is outdated and weak.","s":"bank","src":"Unit A02 row 21","tp":2},{"id":"TA02-21","u":"A02","q":"What does the 'G' in 3G and 4G stand for?","o":["Generation","Global","Gateway","Gigabyte"],"a":0,"e":"The G stands for Generation, as in third and fourth generation mobile networks.","s":"bank","src":"Unit A02 row 22","tp":2},{"id":"TA02-22","u":"A02","q":"Which technology is the most widely used 4G standard?","o":["LTE (Long Term Evolution)","EDGE","Bluetooth","GSM"],"a":0,"e":"LTE (Long Term Evolution) is the main 4G standard.","s":"bank","src":"Unit A02 row 23","tp":2},{"id":"TA02-23","u":"A02","q":"Which generation of mobile networks first made mobile internet and video calling widely practical?","o":["Wi-Fi 1","1G","2G","3G"],"a":3,"e":"3G was the first generation to make mobile internet and video calling widely practical.","s":"bank","src":"Unit A02 row 24","tp":2},{"id":"TA02-24","u":"A02","q":"Compared with 3G, 4G offers:","o":["Lower data speeds but better coverage","Voice calls only","The same speed with lower power use","Higher data speeds and lower latency"],"a":3,"e":"4G gives higher data speeds and lower latency than 3G.","s":"bank","src":"Unit A02 row 25","tp":2},{"id":"TA02-25","u":"A02","q":"Why should a mobile app be tested on slower mobile connections such as 3G?","o":["Because 3G is faster than Wi-Fi","To reduce the app's file size","To ensure it performs acceptably for users with limited bandwidth","Because app stores require it"],"a":2,"e":"Testing on slow connections makes sure the app still works well for users with limited bandwidth.","s":"bank","src":"Unit A02 row 26","tp":2},{"id":"TA02-26" tra features by installing:","o":["Emulators","Plug-ins","Build scripts","Device drivers"],"a":1,"e":"Eclipse is extended by installing plug-ins.","s":"bank","src":"Unit A02 row 34","tp":3},{"id":"TA02-34","u":"A02","q":"What is the current status of Eclipse for Android development?","o":["It is required to build iOS apps","It replaced Android Studio in 2020","Google ended support for the ADT plug-in; Android Studio is the official IDE","It is the only IDE Google supports"],"a":2,"e":"Google ended support for the ADT plug-in. Android Studio is now the official IDE.","s":"bank","src":"Unit A02 row 35","tp":3},{"id":"TA02-35","u":"A02","q":"Xcode is Apple's IDE used to develop apps for:","o":["Android only","iOS, iPadOS and macOS","Windows and Linux","Web browsers only"],"a":1,"e":"Xcode is used to build apps for Apple platforms, including iOS, iPadOS and macOS.","s":"bank","src":"Unit A02 row 36","tp":3},{"id":"TA02-36","u":"A02","q":"On which operating system does Xcode run?","o":["Linux","macOS","Android","Windows"],"a":1,"e":"Xcode runs only on macOS.","s":"bank","src":"Unit A02 row 37","tp":1},{"id":"TA02-37","u":"A02","q":"Which Xcode tool lets developers test an iPhone app on a Mac without a physical device?","o":["Gradle","ADB","iOS Simulator","Android Emulator"],"a":2,"e":"The iOS Simulator runs iPhone apps on a Mac without a physical device.","s":"bank","src":"Unit A02 row 38","tp":3},{"id":"TA02-38","u":"A02","q":"Which Xcode feature is used to design the user interface visually using storyboards?","o":["Interface Builder","AVD Manager","Logcat","Command Prompt"],"a":0,"e":"Interface Builder lets you design the user interface visually with storyboards.","s":"bank","src":"Unit A02 row 39","tp":0},{"id":"TA02-39","u":"A02","q":"Which framework provides a declarative way to build user interfaces in Xcode with Swift?","o":["JavaFX","Windows Forms","SwiftUI","Swing"],"a":2,"e":"SwiftUI is a declarative framework for building user interfaces in Swift.","s":"bank","src":"Unit A02 row 40","tp":3},{"id":"TA03-1","u":"A03","q":"What makes a JAR file 'executable'?","o":["Its manifest file specifies the Main-Class entry point","It contains the .java source files","It has been signed with a certificate","It contains a JNLP file"],"a":0,"e":"A JAR is executable when its manifest names the Main-Class to start.","s":"bank","src":"Unit A03 row 2","tp":0},{"id":"TA03-2","u":"A03","q":"Which command runs an executable JAR file named app.jar?","o":["run app.jar -java","jar -run app.jar","javac app.jar","java -jar app.jar"],"a":3,"e":"java -jar app.jar runs an executable JAR.","s":"bank","src":"Unit A03 row 3","tp":0},{"id":"TA03-3","u":"A03","q":"In which file inside a JAR is the Main-Class defined?","o":["setup.ini","web.xml","index.html","META-INF/MANIFEST.MF"],"a":3,"e":"The Main-Class is defined in META-INF/MANIFEST.MF inside the JAR.","s":"bank","src":"Unit A03 row 4","tp":0},{"id":"TA03-4","u":"A03","q":"A JAR file is based on which compression format?","o":["ZIP","ISO","TAR.GZ only","RAR"],"a":0,"e":"A JAR file uses the ZIP format.","s":"bank","src":"Unit A03 row 5","tp":2},{"id":"TA03-5","u":"A03","q":"Java Web Start allowed users to:","o":["Run Java applications without a JRE","Launch a Java application from a web page link using a JNLP file","Edit Java source code online","Install Java applications as MSI packages"],"a":1,"e":"Java Web Start launched applications from a web link using a JNLP file.","s":"bank","src":"Unit A03 row 6","tp":0},{"id":"TA03-6","u":"A03","q":"Which file type describes a Java Web Start application?","o":[".msi",".apk",".bat",".jnlp"],"a":3,"e":"A .jnlp file describes a Java Web Start application.","s":"bank","src":"Unit A03 row 7","tp":0},{"id":"TA03-7","u":"A03","q":"What is the current status of Java Web Start?","o":["It is required for all Java applications","It is the newest Java deployment technology","It was deprecated and removed from Java 11 onwards","It replaced the JVM"],"a":2,"e":"Java Web Start was deprecated and removed from Java 11 onwards.","s":"bank","src":"Unit A03 row 8","tp":0},{"id":"TA03-8","u":"A03","q":"One advantage of Java Web Start was that it:","o":["Automatically downloaded and updated the application from the server","Required manual copying of every file","Did not need Java installed at all","Only worked offline"],"a":0,"e":"Java Web Start downloaded the application from the server and kept it updated automatically.","s":"bank","src":"Unit A03 row 9","tp":0},{"id":"TA03-9","u":"A03","q":"A launch script for a Java application is:","o":["A Java class with a main() method","A Windows Installer package","A JNLP file that describes the application","A batch (.bat) or shell (.sh) file that runs the java command with the required options"],"a":3,"e":"A launch script is a batch or shell file that runs the java command with the right options.","s":"bank","src":"Unit A03 row 10","tp":0},{"id":"TA03-10","u":"A03","q":"Which file extension is typically used for a launch script on Windows?","o":[".bat / .cmd",".sh",".class",".jar"],"a":0,"e":"Windows launch scripts use the .bat or .cmd extension. Linux uses .sh.","s":"bank","src":"Unit A03 row 11","tp":0},{"id":"TA03-11","u":"A03","q":"Why are launch scripts useful when deploying Java applications?","o":["They encrypt the source code","They set the classpath, memory options and arguments so users don't have to type long commands","They compile the application","They register the application in the Windows registry"],"a":1,"e":"Launch scripts set the classpath, memory and arguments, so users don't type long commands.","s":"bank","src":"Unit A03 row 12","tp":0},{"id":"TA03-12","u":"A03","q":"Which line could appear in a Linux launch script to start a Java app with 512 MB of memory?","o":["start app.exe 512","msiexec /i app.jar","javac -memory 512 app.java","java -Xmx512m -jar app.jar"],"a":3,"e":"-Xmx512m sets a maximum memory of 512 MB, and -jar runs the JAR.","s":"bank","src":"Unit A03 row 13","tp":0},{"id":"TA03-13","u":"A03","q":"ClickOnce is a Microsoft deployment technology for:","o":["Linux shell scripts","Android apps","Windows .NET applications that install and update from a web page or network share","Java applets"],"a":2,"e":"ClickOnce installs and updates Windows .NET applications from a web page or network share.","s":"bank","src":"Unit A03 row 14","tp":1},{"id":"TA03-14","u":"A03","q":"A key feature of ClickOnce deployment is:","o":["It requires administrator rights for every install","It copies files using FTP only","It only works for websites","Applications can check for and install updates automatically"],"a":3,"e":"ClickOnce applications can check for updates and install them automatically.","s":"bank","src":"Unit A03 row 15","tp":1},{"id":"TA03-15","u":"A03","q":"ClickOnce applications are installed:","o":["Per user, without needing administrator privileges","Only from a CD","Only on servers","Only by system administrators"],"a":0,"e":"ClickOnce installs per user, so administrator rights are not needed.","s":"bank","src":"Unit A03 row 16","tp":1},{"id":"TA03-16","u":"A03","q":"Which tool is commonly used to publish a ClickOnce application?","o":["Xcode","Android Studio","Visual Studio","Eclipse"],"a":2,"e":"ClickOnce applications are published from Visual Studio.","s":"bank","src":"Unit A03 row 17","tp":1},{"id":"TA03-17","u":"A03","q":"An MSI file is:","o":["A Windows Installer package used to install, repair and remove software","A self-updating .NET deployment from a web page","A compressed archive of Java classes","An iOS app package"],"a":0,"e":"An MSI file is a Windows Installer package for installing, repairing and removing software.","s":"bank","src":"Unit A03 row 18","tp":1},{"id":"TA03-18","u":"A03","q":"Which command-line tool installs an MSI package on Windows?","o":["javac","msiexec","chmod","git"],"a":1,"e":"msiexec is the command-line tool that installs MSI packages.","s":"bank","src":"Unit A03 row 19","tp":1},{"id":"TA03-19","u":"A03","q":"Why are MSI packages popular in organizations?","o":["They do not need administrator rights","They support silent installs and can be deployed to many PCs using Group Policy","They update themselves automatically from a web page","They work on Windows, macOS and Linux"],"a":1,"e":"MSI packages can be installed silently and pushed to many PCs through Group Policy.","s":"bank","src":"Unit A03 row 20","tp":1},{"id":"TA03-20","u":"A03","q":"Which switch performs a silent (no user interface) MSI installation?","o":["msiexec /help","msiexec /open","msiexec /x app.msi /show","msiexec /i app.msi /qn"],"a":3,"e":"/qn means quiet with no user interface, so /i app.msi /qn installs silently.","s":"bank","src":"Unit A03 row 21","tp":1},{"id":"TA03-21","u":"A03","q":"Xcopy deployment means:","o":["Installing from an app store","Compiling the app on the target PC","Using a Windows Installer package","Simply copying the application files to the target folder with no installer"],"a":3,"e":"Xcopy deployment simply copies the application's files to the target folder, with no installer.","s":"bank","src":"Unit A03 row 22","tp":1},{"id":"TA03-22","u":"A03","q":"Which is a limitation of Xcopy deployment?","o":["It only works for Java applications","It requires a database","It always needs Internet access","It cannot easily register components, create shortcuts or handle uninstall"],"a":3,"e":"Xcopy only copies files, so it cannot register components, create shortcuts or handle uninstalling.","s":"bank","src":"Unit A03 row 23","tp":1},{"id":"TA03-23","u":"A03","q":"Xcopy deployment is most suitable for:","o":["Hardware drivers","Simple self-contained applications with no registry or system dependencies","Operating system upgrades","Large enterprise software with many system components"],"a":1,"e":"Xcopy suits simple, self-contained applications that need no registry or system changes.","s":"bank","src":"Unit A03 row 24","tp":1},{"id":"TA03-24","u":"A03","q":"Which Xcopy switch copies directories and subdirectories, including empty ones?","o":["/E","/P","/Q","/W"],"a":0,"e":"/E copies all directories and subdirectories, including empty ones.","s":"bank","src":"Unit A03 row 25","tp":1},{"id":"TA03-26","u":"A03","q":"Which is the secure alternative to FTP that runs over SSH?","o":["HTTP","Telnet","SMTP","SFTP"],"a":3,"e":"SFTP transfers files securely over SSH.","s":"bank","src":"Unit A03 row 27","tp":2},{"id":"TA03-28","u":"A03","q":"Which type of hosting gives one customer an entire physical server?","o":["Dedicated hosting","Peer-to-peer hosting","Free hosting","Shared hosting"],"a":0,"e":"Dedicated hosting gives one customer a whole physical server.","s":"bank","src":"Unit A03 row 29","tp":2},{"id":"TA03-29","u":"A03","q":"Which of the following is an example of cloud hosting for deploying applications?","o":["Amazon Web Services (AWS)","An on-premises file server","A developer's local PC","A USB drive"],"a":0,"e":"Amazon Web Services (AWS) is a cloud hosting platform.","s":"bank","src":"Unit A03 row 30","tp":2},{"id":"TA03-30","u":"A03","q":"Which FTP client application is commonly used to upload website files to a server?","o":["FileZilla","Postman","Maven","Docker"],"a":0,"e":"FileZilla is a common FTP client for uploading files to a server.","s":"bank","src":"Unit A03 row 31","tp":2},{"id":"TA03-31","u":"A03","q":"Which tool can be used to write scripts that build and package a Java application automatically?","o":["FileZilla","Apache Maven / Gradle","Javadoc","JUnit"],"a":1,"e":"Maven and Gradle use build scripts to compile, test and package Java applications automatically.","s":"bank","src":"Unit A03 row 32","tp":0},{"id":"TA03-32","u":"A03","q":"Which of the following tools is used to create Windows installer packages by writing a script?","o":["Git","JUnit","Inno Setup / WiX Toolset","Postman"],"a":2,"e":"Inno Setup and the WiX Toolset create Windows installers from scripts.","s":"bank","src":"Unit A03 row 33","tp":1},{"id":"TA03-33","u":"A03","q":"Which Java tool (JDK 14+) creates native installers such as .msi, .dmg or .deb for Java applications?","o":["jpackage","jshell","javap","javadoc"],"a":0,"e":"jpackage (JDK 14 and later) creates native installers such as .msi, .dmg and .deb.","s":"bank","src":"Unit A03 row 34","tp":1},{"id":"TA03-34","u":"A03","q":"Automatically building, testing and deploying code each time changes are committed is called:","o":["Manual deployment","Waterfall","CI/CD (Continuous Integration / Continuous Deployment)","Xcopy"],"a":2,"e":"CI/CD automatically builds, tests and deploys code whenever changes are committed.","s":"bank","src":"Unit A03 row 35","tp":1},{"id":"TA03-35","u":"A03","q":"Which tool packages an application with all its dependencies into a portable container?","o":["Maven","Git","Docker","FileZilla"],"a":2,"e":"Docker packages an application and everything it needs into a portable container.","s":"bank","src":"Unit A03 row 36","tp":1},{"id":"TA03-36","u":"A03","q":"What is the difference between authentication and authorization?","o":["Authentication verifies who the user is; authorization decides what the user is allowed to do","Authentication decides permissions; authorization checks identity","They mean exactly the same thing","Authorization always happens before authentication"],"a":0,"e":"Authentication checks who you are. Authorization decides what you are allowed to do.","s":"bank","src":"Unit A03 row 37","tp":3},{"id":"TA03-38","u":"A03","q":"Granting users access based on their job role (e.g. admin, editor, viewer) is called:","o":["Role-Based Access Control (RBAC)","Two-factor authentication","Hashing","Encryption"],"a":0,"e":"Role-Based Access Control (RBAC) gives access according to each user's job role.","s":"bank","src":"Unit A03 row 39","tp":3},{"id":"TA03-39","u":"A03","q":"Why is code signing used when deploying applications?","o":["To translate the code into another language","To prove the publisher's identity and that the code has not been altered","To make the application run faster","To compress the application"],"a":1,"e":"Code signing proves who published the code and that it has not been changed.","s":"bank","src":"Unit A03 row 40","tp":1},{"id":"TA03-40","u":"A03","q":"Which account privilege is normally required to install software for all users on a Windows PC?","o":["Guest","Standard user","Administrator","Anonymous"],"a":2,"e":"Installing software for all users normally needs an administrator account.","s":"bank","src":"Unit A03 row 41","tp":4},{"id":"TA03-41","u":"A03","q":"What should be checked BEFORE installing an application on a production server?","o":["The number of user accounts on the server","The server's brand and model","That the server meets the system requirements (OS, memory, disk space, dependencies)","The size of the installation guide"],"a":2,"e":"Before installing, check that the server meets the system requirements (OS, memory, disk space and dependencies).","s":"bank","src":"Unit A03 row 42","tp":4},{"id":"TA03-42","u":"A03","q":"Why should a backup be taken before deploying a new version to production?","o":["To free up disk space","To make the installation faster","So that users can keep working during the installation","So the system can be rolled back if the deployment fails"],"a":3,"e":"A backup lets you roll the system back if the deployment fails.","s":"bank","src":"Unit A03 row 43","tp":4},{"id":"TA03-43","u":"A03","q":"A document that lists step-by-step installation and configuration instructions is called a:","o":["Installation guide / deployment plan","Source code file","Class diagram","Test case"],"a":0,"e":"An installation guide (deployment plan) lists the installation and configuration steps.","s":"bank","src":"Unit A03 row 44","tp":1},{"id":"TA03-44","u":"A03","q":"After installing an application in production, which activity confirms it works correctly?","o":["Writing the release notes","Writing new requirements","Post-installation (smoke) testing","Archiving the log files"],"a":2,"e":"A smoke test after installation quickly confirms that the main functions work.","s":"bank","src":"Unit A03 row 45","tp":4},{"id":"TA03-45","u":"A03","q":"Which environment should a new release normally be tested in before production?","o":["The developer's own PC","A copy of last year's system","A staging / test environment that mirrors production","Directly on the live server"],"a":2,"e":"New releases are tested in a staging environment that mirrors production.","s":"bank","src":"Unit A03 row 46","tp":4},{"id":"TA03-46","u":"A03","q":"In the SDLC, deployment of the application to the production environment takes place:","o":["During the design stage","After testing has been completed and approved","Before integration testing","During coding"],"a":1,"e":"Deployment to production happens after testing is completed and approved.","s":"bank","src":"Unit A03 row 47","tp":4},{"id":"TA03-47","u":"A03","q":"User Acceptance Testing (UAT) is carried out by:","o":["The development team","End users or the client, to confirm the system meets their needs","The testing team only","An external auditor"],"a":1,"e":"UAT is done by end users or the client to confirm the system meets their needs.","s":"bank","src":"Unit A03 row 48","tp":4},{"id":"TA03-48","u":"A03","q":"Which SDLC stage follows deployment?","o":["Testing","Maintenance / support","Design","Analysis"],"a":1,"e":"After deployment comes maintenance and support.","s":"bank","src":"Unit A03 row 49","tp":0},{"id":"TA03-49","u":"A03","q":"Which deployment approach runs the old and new systems at the same time for a period?","o":["Parallel deployment","Direct (big bang) deployment","Xcopy deployment","Pilot only"],"a":0,"e":"Parallel deployment runs the old and new systems together for a period.","s":"bank","src":"Unit A03 row 50","tp":4},{"id":"TA03-50","u":"A03","q":"Releasing a new system to a small group of users before the whole organization is called:","o":["Rollback","Pilot deployment","Parallel deployment","Direct changeover"],"a":1,"e":"A pilot deployment releases the system to a small group first.","s":"bank","src":"Unit A03 row 51","tp":4},{"id":"TA03-51","u":"A03","q":"Which protocol secures web traffic between the browser and the server?","o":["Telnet","HTTP","HTTPS (TLS/SSL)","FTP"],"a":2,"e":"HTTPS encrypts web traffic using TLS/SSL.","s":"bank","src":"Unit A03 row 52","tp":2},{"id":"TA03-52","u":"A03","q":"Which protocol is used to log in securely to a remote server's command line?","o":["SNMP v1","Telnet","FTP","SSH"],"a":3,"e":"SSH gives secure, encrypted command-line access to a remote server.","s":"bank","src":"Unit A03 row 53","tp":2},{"id":"TA03-53","u":"A03","q":"Which default port does HTTPS use?","o":["80","21","23","443"],"a":3,"e":"HTTPS uses port 443 by default. HTTP uses port 80.","s":"bank","src":"Unit A03 row 54","tp":2},{"id":"TA03-54","u":"A03","q":"A digital certificate used for HTTPS is issued by a:","o":["Router","Certificate Authority (CA)","Compiler","Web browser"],"a":1,"e":"HTTPS certificates are issued by a Certificate Authority (CA).","s":"bank","src":"Unit A03 row 55","tp":3},{"id":"TA03-55","u":"A03","q":"Why should unencrypted protocols such as FTP and Telnet be avoided when deploying to production?","o":["They cannot transfer large files","Usernames, passwords and data are sent in plain text and can be intercepted","They are slower than HTTP","They need special hardware"],"a":1,"e":"FTP and Telnet send usernames, passwords and data as plain text, which can be intercepted.","s":"bank","src":"Unit A03 row 56","tp":2},{"id":"TA03-56","u":"A03","q":"Which international standard covers information security management systems?","o":["ISO 9001 only","ISO/IEC 27001","HTML5","IEEE 802.11"],"a":1,"e":"ISO/IEC 27001 is the standard for information security management systems.","s":"bank","src":"Unit A03 row 57","tp":4},{"id":"TA03-57","u":"A03","q":"Which standard focuses on quality management systems?","o":["IEEE 802.3","ISO/IEC 27001","PCI DSS","ISO 9001"],"a":3,"e":"ISO 9001 is the standard for quality management systems.","s":"bank","src":"Unit A03 row 58","tp":4},{"id":"TA03-58","u":"A03","q":"The OWASP Top 10 is a widely used standard reference for:","o":["The most critical web application security risks","Software quality management requirements","Project management best practice","Accessibility guidelines for websites"],"a":0,"e":"The OWASP Top 10 lists the most critical web application security risks.","s":"bank","src":"Unit A03 row 59","tp":4},{"id":"TA03-59","u":"A03","q":"Following a version numbering standard such as 2.1.3 (major.minor.patch) is known as:","o":["Encryption","Hashing","Semantic versioning","Compression"],"a":2,"e":"Semantic versioning numbers releases as major.minor.patch.","s":"bank","src":"Unit A03 row 60","tp":4},{"id":"TA03-60","u":"A03","q":"Why should deployments follow agreed standards?","o":["To speed up each deployment","To reduce the amount of documentation","To remove the need for testing","To ensure consistency, quality and compliance across the organization"],"a":3,"e":"Following agreed standards keeps deployments consistent, high-quality and compliant.","s":"bank","src":"Unit A03 row 61","tp":0},{"id":"TA03-61","u":"A03","q":"A change management policy requires that:","o":["Developers deploy changes as soon as they are written","Changes to production are requested, reviewed and approved before they are deployed","Users approve their own changes","Changes are only recorded after deployment"],"a":1,"e":"Under a change management policy, production changes are requested, reviewed and approved before deployment.","s":"bank","src":"Unit A03 row 62","tp":4},{"id":"TA03-62","u":"A03","q":"Scheduling deployments outside working hours to reduce disruption to users is an example of a:","o":["Rollback plan","Coding standard","Maintenance window policy","Acceptable use policy"],"a":2,"e":"A maintenance window policy schedules deployments at quiet times to reduce disruption.","s":"bank","src":"Unit A03 row 63","tp":0},{"id":"TA03-63","u":"A03","q":"Which organizational policy controls which software staff may install on company computers?","o":["Data protection policy","Password policy","Acceptable use / software installation policy","Backup policy"],"a":2,"e":"The acceptable use (software installation) policy controls what software staff may install.","s":"bank","src":"Unit A03 row 64","tp":1},{"id":"TA03-64","u":"A03","q":"An organization's data protection policy mainly ensures that:","o":["Only developers can view the data","Data is backed up every day","Personal and sensitive data is stored and processed securely and legally","Data is kept for as long as possible"],"a":2,"e":"A data protection policy makes sure personal and sensitive data is handled securely and legally.","s":"bank","src":"Unit A03 row 65","tp":2},{"id":"TA03-65","u":"A03","q":"Before deploying licensed third-party software, the organization's licensing policy requires that:","o":["A valid license is held for every installation","The software is installed on test machines first","The vendor installs the software","The license is renewed every month"],"a":0,"e":"Every installation of licensed software must be covered by a valid license.","s":"bank","src":"Unit A03 row 66","tp":4},{"id":"T18-1","u":"18","q":"A good interface design should be ________-centered.","o":["Developer","Stakeholder","User","Technology"],"a":2,"e":"User-centered design starts from the users' goals and needs, so a good interface is built around the user.","s":"bank","src":"Unit 18 row 3","tp":2},{"id":"T18-2","u":"18","q":"Which of these helps users with a visual disability in user interface design?","o":["Animated backgrounds","Options to change the font size","Thin, light-gray text","Icons with no text labels"],"a":1,"e":"Letting users enlarge the text makes content easier to read for people with low vision.","s":"bank","src":"Unit 18 row 5","tp":3},{"id":"T18-4","u":"18","q":"Which team member is responsible for developing the project plan?","o":["Developer","Information architect","Project manager","Content author"],"a":2,"e":"The project manager plans the project: its timeline, resources and goals.","s":"bank","src":"Unit 18 row 8","tp":0},{"id":"T18-5","u":"18","q":"What is the first thing to define in an interactive media project?","o":["The target audience","The product to be developed (e.g. a website)","The functional requirements","The design requirements"],"a":1,"e":"You first decide what product you are making (for example a website). The other decisions depend on it.","s":"bank","src":"Unit 18 row 10","tp":0},{"id":"T18-6","u":"18","q":"What is one of the main responsibilities of a developer?","o":["Writing the content","Writing the code","Designing the visual layout","Creating storyboards"],"a":1,"e":"Developers handle the technical side: they write the code and make the product work.","s":"bank","src":"Unit 18 row 11","tp":0},{"id":"T18-7","u":"18","q":"What is the technical aspect of a requirement related to?","o":["The idea behind the product","The practical skills and methods used to apply the requirements","The visual style and branding","The storyboard and sketches"],"a":1,"e":"The technical aspect is about how requirements are actually built: the practical skills, methods and tools.","s":"bank","src":"Unit 18 row 23","tp":0},{"id":"T18-8","u":"18","q":"What is the creative aspect of a requirement related to?","o":["The programming language to use","The hardware and platform constraints","Using imagination to present the requirements","The performance targets"],"a":2,"e":"The creative aspect uses imagination to present the requirements: visual design, content and style.","s":"bank","src":"Unit 18 row 24","tp":0},{"id":"T18-9","u":"18","q":"In which SDLC phase does the project manager play the major role?","o":["Planning","Development","Deployment","Testing"],"a":0,"e":"The project manager's main work is in planning: setting the scope, schedule and resources.","s":"bank","src":"Unit 18 row 25","tp":0},{"id":"T18-10","u":"18","q":"What is a mockup in software development?","o":["A set of requirements","A visual model of the system's design, made before development","A programming language","A hierarchy of information"],"a":1,"e":"A mockup is a visual model of how the system will look, made before any code is written.","s":"bank","src":"Unit 18 row 26","tp":0},{"id":"T18-11","u":"18","q":"What is one way to avoid misunderstanding between creative designers and technical developers?","o":["Explain the design verbally","Teach designers how to program","Provide design mockups","Let developers decide the design"],"a":2,"e":"Mockups show developers exactly what the designer intends, which avoids misunderstanding.","s":"bank","src":"Unit 18 row 27","tp":0},{"id":"T18-12","u":"18","q":"What is one of the main issues facing interactive media team members?","o":["Adaptability","Miscommunication","Creativity","Too much documentation"],"a":1,"e":"Designers, developers and content authors work closely together, so miscommunication is a common problem.","s":"bank","src":"Unit 18 row 28","tp":0},{"id":"T18-14","u":"18","q":"Which of the following is NOT a platform?","o":["Windows","iOS","Microsoft Word","Linux"],"a":2,"e":"Windows, iOS and Linux are platforms (operating systems). Microsoft Word is an application that runs on a platform.","s":"bank","src":"Unit 18 row 31","tp":1},{"id":"T18-15","u":"18","q":"Which of the following is NOT considered a design constraint?","o":["Requirements.","Integration.","Human resources.","Usability."],"a":2,"e":"Requirements, integration and usability limit the design itself. Staffing (human resources) is a project management matter.","s":"bank","src":"Unit 18 row 32","tp":0},{"id":"T18-16","u":"18","q":"Which stage comes first when planning a new system?","o":["Design the test data","Choose the programming language","Configure the software interface","Analyze the users' needs"],"a":3,"e":"Planning starts by analyzing what the users need. Design, configuration and test data come later.","s":"bank","src":"Unit 18 row 33","tp":2},{"id":"T18-17","u":"18","q":"Which of the following best defines a platform?","o":["An application that helps create and design websites","A program that manages all user requirements","Any hardware or software used to host an application or service","A programming language editor"],"a":2,"e":"A platform is the hardware or software that an application or service runs on, such as Windows or Android.","s":"bank","src":"Unit 18 row 34","tp":1},{"id":"T18-18","u":"18","q":"Which of the following is NOT a good user interface guideline?","o":["Give the user control and freedom","Use as many colors and fonts as possible to attract attention","Help users recognize, diagnose and recover from errors","Prevent errors before they happen"],"a":1,"e":"Too many colors and fonts make an interface cluttered and hard to use. The other options are good guidelines.","s":"bank","src":"Unit 18 row 35","tp":4},{"id":"T18-19","u":"18","q":"Readable text, subtitles and closed captions for videos and audio clips support users with which disability?","o":["Visual impairment","Hearing impairment","Color blindness","Motor impairment"],"a":1,"e":"Subtitles and closed captions show spoken content as text, which helps people with hearing impairments.","s":"bank","src":"Unit 18 row 37","tp":3},{"id":"T18-20","u":"18","q":"How do metaphors help users of an interface?","o":["They help users recognize and remember functions","They reduce the file size of the interface","They replace the need for text labels completely","They make the code easier to write"],"a":0,"e":"Metaphors use familiar images (such as a trash can for delete), so users recognize and remember functions easily.","s":"bank","src":"Unit 18 row 38","tp":2},{"id":"T18-21","u":"18","q":"What allows an interface to display correctly on screens of all sizes?","o":["Using a specific programming language","Using the latest hardware","Designing for the largest screen only","Responsive design that adapts the layout to the screen size"],"a":3,"e":"Responsive design adapts the layout to the screen, so the interface works on phones, tablets and desktops.","s":"bank","src":"Unit 18 row 39","tp":1},{"id":"T18-22","u":"18","q":"Which two roles work out what content an interactive media product needs and how that content should be organized?","o":["Developer and designer","Content author and information architect","Designer and project manager","Developer and project manager"],"a":1,"e":"The content author works out what content is needed, and the information architect decides how it is organized.","s":"bank","src":"Unit 18 row 40","tp":0},{"id":"T18-23","u":"18","q":"Which method is most widely used to make videos accessible to people with hearing impairments?","o":["Closed captioning","Audio description","A screen reader","High-contrast mode"],"a":0,"e":"Closed captions show the spoken words and sounds of a video as text, which is the main aid for hearing-impaired viewers.","s":"bank","src":"Unit 18 row 45","tp":3},{"id":"T18-24","u":"18","q":"How should color be used on a website?","o":["To distinguish content or convey meaning, with enough contrast","Avoid color completely so the site is accessible","As the only way to show errors","With low contrast for a softer look"],"a":0,"e":"Color should help users tell content apart or understand meaning, with enough contrast to be readable.","s":"bank","src":"Unit 18 row 46","tp":2},{"id":"T18-25","u":"18","q":"What is a screen reader?","o":["A person who translates spoken word to sign language.","Software that uses synthesized speech to read text on a computer screen.","Software that translates spoken word to text.","Software that magnifies the computer screen."],"a":1,"e":"A screen reader is software that reads on-screen text aloud using synthesized speech.","s":"bank","src":"Unit 18 row 47","tp":3},{"id":"T18-27","u":"18","q":"Who creates the visual style and design standards (the look and feel) of an interactive media project?","o":["Content author","Project manager","Designer","Developer"],"a":2,"e":"The designer creates the visual style and design standards: the look and feel.","s":"bank","src":"Unit 18 row 49","tp":0},{"id":"T18-28","u":"18","q":"Who organizes the structure and navigation of the information in an interactive media project?","o":["Information architect","Developer","Designer","Content author"],"a":0,"e":"The information architect organizes the structure and navigation of the information.","s":"bank","src":"Unit 18 row 50","tp":0},{"id":"T18-29","u":"18","q":"What identifies a product and makes it different from other products?","o":["Message","Brand","Metaphor","Tone"],"a":1,"e":"A brand (name, logo, colors) identifies a product and sets it apart from others.","s":"bank","src":"Unit 18 row 51","tp":2},{"id":"T19-1","u":"19","q":"In UML, which diagram shows the sequence of activities and decision points in a process?","o":["Class diagram","Use-case diagram","Activity diagram","Sequence diagram"],"a":2,"e":"An activity diagram shows the flow of activities, including decision points, in a process.","s":"bank","src":"Unit 19 row 7","tp":0},{"id":"T19-2","u":"19","q":"Which UML diagram models the static structure of classes and their relationships?","o":["Activity diagram","Class diagram","Sequence diagram","Use-case diagram"],"a":1,"e":"A class diagram shows the static structure: classes, their attributes and methods, and how they relate.","s":"bank","src":"Unit 19 row 8","tp":0},{"id":"T19-3","u":"19","q":"A use-case diagram primarily captures which of the following?","o":["Data flow between system components","System actors and their interactions with use cases","Internal class hierarchies","Step-by-step execution logic"],"a":1,"e":"A use-case diagram shows the actors and the use cases they interact with.","s":"bank","src":"Unit 19 row 9","tp":0},{"id":"T19-4","u":"19","q":"Which diagram illustrates object interactions arranged in time sequence?","o":["Statechart diagram","Activity diagram","Sequence diagram","Class diagram"],"a":2,"e":"A sequence diagram shows objects exchanging messages in time order, from top to bottom.","s":"bank","src":"Unit 19 row 10","tp":0},{"id":"T19-5","u":"19","q":"Which element in an activity diagram synchronizes parallel (concurrent) flows back into one flow?","o":["Fork node","Join node","Decision node","Initial node"],"a":1,"e":"A join node waits for parallel flows to finish and combines them back into one flow. A fork node splits them.","s":"bank","src":"Unit 19 row 11","tp":0},{"id":"T19-6","u":"19","q":"In a use-case narrative, the “preconditions” section describes what?","o":["The steps the actor takes","The system state before the use case begins","Alternate flows","Post-execution results"],"a":1,"e":"Preconditions describe what must already be true before the use case can start.","s":"bank","src":"Unit 19 row 12","tp":0},{"id":"T19-7","u":"19","q":"Which UML diagram would you use to document how objects change state in response to events?","o":["Sequence diagram","Class diagram","Statechart diagram","Activity diagram"],"a":2,"e":"A statechart (state machine) diagram shows the states an object passes through in response to events.","s":"bank","src":"Unit 19 row 13","tp":0},{"id":"T19-8","u":"19","q":"A swimlane in an activity diagram is used to:","o":["Show decision points","Organize activities by actor or department","Indicate loop behavior","Represent data stores"],"a":1,"e":"Swimlanes divide an activity diagram into lanes that show which actor or department does each activity.","s":"bank","src":"Unit 19 row 14","tp":0},{"id":"T19-9","u":"19","q":"Which relationship in a class diagram indicates that one class is a specialized version of another?","o":["Association","Dependency","Generalization","Aggregation"],"a":2,"e":"Generalization shows inheritance: a specialized class (subclass) inherits from a general class (superclass).","s":"bank","src":"Unit 19 row 15","tp":0},{"id":"T19-10","u":"19","q":"In a sequence diagram, a dashed arrow typically denotes:","o":["Synchronous message","Asynchronous message","Return message","Object creation"],"a":2,"e":"In a sequence diagram, a dashed arrow shows a message returning to the caller.","s":"bank","src":"Unit 19 row 16","tp":0},{"id":"T19-11","u":"19","q":"Which section of a use-case narrative details alternative paths when exceptions occur?","o":["Main success scenario","Preconditions","Alternate flows","Postconditions"],"a":2,"e":"Alternate flows describe the other paths a use case can take, for example when an error or exception happens.","s":"bank","src":"Unit 19 row 17","tp":0},{"id":"T19-12","u":"19","q":"What symbol represents the start of an activity flow in a UML activity diagram?","o":["Filled circle","Hollow circle","Diamond","Rectangle"],"a":0,"e":"An activity diagram starts at a filled (solid) black circle, the initial node.","s":"bank","src":"Unit 19 row 18","tp":0},{"id":"T19-13","u":"19","q":"In a class diagram, an association with a multiplicity of “1..*” means:","o":["Zero or one instances","Exactly one instance","One or many instances","Many optional instances"],"a":2,"e":"The multiplicity 1..* means at least one and possibly many instances.","s":"bank","src":"Unit 19 row 19","tp":0},{"id":"T19-14","u":"19","q":"Which UML diagram would best capture the detailed steps for a checkout process, including loops and decisions?","o":["Use-case diagram","Activity diagram","Class diagram","Sequence diagram"],"a":1,"e":"Activity diagrams show step-by-step processes, including loops and decisions, so they suit a checkout process.","s":"bank","src":"Unit 19 row 20","tp":0},{"id":"T19-15","u":"19","q":"In a sequence diagram, a lifeline represents:","o":["An instance of a class over time","A data store","A process decision point","A class definition"],"a":0,"e":"A lifeline is the dashed vertical line that represents one object (an instance of a class) over time.","s":"bank","src":"Unit 19 row 21","tp":0},{"id":"T19-16","u":"19","q":"A use-case actor is defined as:","o":["A system component","A user or external system that interacts with the system","A specialized class","A detailed flowchart element"],"a":1,"e":"An actor is a user or external system that interacts with the system. Actors are outside the system boundary.","s":"bank","src":"Unit 19 row 22","tp":0},{"id":"T19-17","u":"19","q":"In UML, which diagram would you choose to model the high‐level functionalities without implementation details?","o":["Class diagram","Component diagram","Use-case diagram","Sequence diagram"],"a":2,"e":"Use-case diagrams show what the system does at a high level, without implementation details.","s":"bank","src":"Unit 19 row 23","tp":0},{"id":"T19-18","u":"19","q":"What does an “include” relationship between use cases specify?","o":["One use case extends another","One use case comments on another","One use case always invokes the behavior of another","The actor includes both use cases"],"a":2,"e":"An include relationship means one use case always uses the behavior of another.","s":"bank","src":"Unit 19 row 24","tp":0},{"id":"T19-19","u":"19","q":"Which artifact captures step-by-step user and system interactions in text form?","o":["Flowchart","Use-case narrative","Class diagram","Sequence diagram"],"a":1,"e":"A use-case narrative describes, in text, the step-by-step interaction between the user and the system.","s":"bank","src":"Unit 19 row 25","tp":0},{"id":"T19-20","u":"19","q":"In activity diagrams, a decision node is represented by:","o":["Circle","Filled circle","Diamond","Rectangle"],"a":2,"e":"A decision node in an activity diagram is drawn as a diamond.","s":"bank","src":"Unit 19 row 26","tp":0},{"id":"T19-21","u":"19","q":"Which technique is used to break down a process into a series of symbols and arrows?","o":["UML class diagram","Pseudocode","Flowchart","Use-case narrative"],"a":2,"e":"A flowchart breaks a process into steps shown as symbols connected by arrows.","s":"bank","src":"Unit 19 row 27","tp":1},{"id":"T19-22","u":"19","q":"What symbol in a flowchart denotes a decision point?","o":["Oval","Rectangle","Diamond","Parallelogram"],"a":2,"e":"In a flowchart, a diamond shows a decision point with yes/no branches.","s":"bank","src":"Unit 19 row 28","tp":0},{"id":"T19-23","u":"19","q":"In a flowchart, the parallelogram symbol represents:","o":["Process step","Decision","Input/output operation","Start/end"],"a":2,"e":"In a flowchart, a parallelogram shows input or output, such as reading data or displaying a result.","s":"bank","src":"Unit 19 row 29","tp":0},{"id":"T19-24","u":"19","q":"Which flowchart symbol indicates the start or end of a process?","o":["Oval","Diamond","Rectangle","Arrow"],"a":0,"e":"In a flowchart, an oval (terminator) marks the start or end of a process.","s":"bank","src":"Unit 19 row 30","tp":0},{"id":"T19-25","u":"19","q":"Pseudocode is best described as:","o":["Executable code in a programming language","A visual diagram of control flow","A structured, informal language resembling programming constructs","A use-case narrative format"],"a":2,"e":"Pseudocode is informal, structured text that looks like code but doesn't follow any language's strict syntax.","s":"bank","src":"Unit 19 row 31","tp":0},{"id":"T19-26","u":"19","q":"Which line in pseudocode would correctly represent a loop that iterates while x is less than 10?","o":["WHILE x < 10 DO","LOOP UNTIL x = 10","FOR x in 1..10","IF x < 10 THEN"],"a":0,"e":"WHILE x < 10 DO repeats the loop as long as x is less than 10.","s":"bank","src":"Unit 19 row 32","tp":0},{"id":"T19-27","u":"19","q":"In pseudocode, how would you denote a function call to calculateTax?","o":["tax = calculateTax()","call/calculateTax","-> calculateTax","begin calculateTax"],"a":0,"e":"A function call is written by name with brackets, and the result can be stored, as in tax = calculateTax().","s":"bank","src":"Unit 19 row 33","tp":0},{"id":"T19-28","u":"19","q":"What is the main advantage of using pseudocode before coding?","o":["It executes faster than code","It eliminates all errors","It helps clarify logic without syntax constraints","It replaces the need for testing"],"a":2,"e":"Pseudocode lets you work out the logic first, without worrying about a language's syntax rules.","s":"bank","src":"Unit 19 row 34","tp":0},{"id":"T19-29","u":"19","q":"Which document outlines the step-by-step operation of a system from the user’s perspective?","o":["Technical manual","Operational procedure","Risk analysis report","Budget plan"],"a":1,"e":"An operational procedure describes, step by step, how the system is operated from the user's point of view.","s":"bank","src":"Unit 19 row 35","tp":0},{"id":"T19-30","u":"19","q":"A feasibility study evaluates:","o":["System performance metrics","The practicality and viability of a proposed solution","User interface design","Project staffing levels"],"a":1,"e":"A feasibility study checks whether a proposed solution is practical and worth doing.","s":"bank","src":"Unit 19 row 36","tp":1},{"id":"T19-31","u":"19","q":"Solution design documentation should include all EXCEPT:","o":["Hardware specifications","Class diagrams","Budget approvals from finance","Data flow descriptions"],"a":2,"e":"Solution design covers technical details such as hardware, diagrams and data flows. Budget approval is a separate management step.","s":"bank","src":"Unit 19 row 37","tp":3},{"id":"T19-32","u":"19","q":"Which section of requirements documentation details cost estimates and resource allocation?","o":["Solution feasibility","Budgeting","Technical manuals","Risk analysis"],"a":1,"e":"The budgeting section covers cost estimates and how resources are allocated.","s":"bank","src":"Unit 19 row 38","tp":3},{"id":"T19-33","u":"19","q":"What is the main purpose of a technical manual?","o":["To guide end users through everyday tasks","To document the system's technical details, such as interfaces, for developers and support staff","To define the project scope","To list the organization's style guidelines"],"a":1,"e":"A technical manual records the system's technical details, such as interfaces, for developers and support staff.","s":"bank","src":"Unit 19 row 39","tp":1},{"id":"T19-34","u":"19","q":"Risk analysis in requirements focuses on identifying:","o":["Coding standards","Potential events that could negatively impact the project","User interface colors","Test coverage metrics"],"a":1,"e":"Risk analysis identifies events that could harm the project so they can be planned for.","s":"bank","src":"Unit 19 row 40","tp":1},{"id":"T19-35","u":"19","q":"Organizational standards for requirements documentation typically include:","o":["Company logos and colors only","Templates, processes and naming conventions","Test cases","Source code listings"],"a":1,"e":"Organizational standards set common templates, processes and naming conventions for documents.","s":"bank","src":"Unit 19 row 41","tp":1},{"id":"T19-36","u":"19","q":"An operational procedure document should be reviewed by:","o":["End users and operations staff","Only the project manager","Graphic designers","Finance auditors"],"a":0,"e":"Operational procedures describe how the system is used, so end users and operations staff should review them.","s":"bank","src":"Unit 19 row 42","tp":0},{"id":"T19-37","u":"19","q":"In solution feasibility analysis, “technical feasibility” addresses:","o":["Return on investment","Availability of the required technology and expertise","How the project fits the organization's culture","The project schedule"],"a":1,"e":"Technical feasibility asks whether the required technology and expertise are available.","s":"bank","src":"Unit 19 row 43","tp":1},{"id":"T19-38","u":"19","q":"Which of these is a cost item that belongs in a project budget?","o":["User acceptance criteri
