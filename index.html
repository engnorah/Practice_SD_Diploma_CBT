a","Training room rental fees","Class inheritance hierarchy","Swimlane assignments"],"a":1,"e":"Renting a room for user training is a project cost, so it belongs in the budget. The other options are requirements and design items, not costs.","s":"bank","src":"Unit 19 row 44","tp":1},{"id":"T19-39","u":"19","q":"A risk mitigation plan follows from risk analysis by specifying:","o":["Budget allocations","Steps to reduce or eliminate identified risks","New use-case diagrams","User training schedules"],"a":1,"e":"A mitigation plan lists the steps that will reduce or remove each identified risk.","s":"bank","src":"Unit 19 row 45","tp":1},{"id":"T19-40","u":"19","q":"Company-specific templates help ensure that:","o":["All documents are reviewed by the client","Reports follow a consistent structure and branding","Documents are shorter","Diagrams are no longer needed"],"a":1,"e":"Company templates give every report the same structure and branding.","s":"bank","src":"Unit 19 row 46","tp":1},{"id":"T19-41","u":"19","q":"Which tool is most appropriate for creating UML diagrams?","o":["Word processor","Spreadsheet","Dedicated UML modeling software","Code editor"],"a":2,"e":"Dedicated UML tools provide the correct symbols and connectors for UML diagrams.","s":"bank","src":"Unit 19 row 47","tp":0},{"id":"T19-42","u":"19","q":"When creating a flowchart, you should use which tool for easy editing of symbols and connectors?","o":["Text editor","Graphic diagramming tool","Email client","PDF reader"],"a":1,"e":"Graphic diagramming tools make it easy to add and edit flowchart symbols and connectors.","s":"bank","src":"Unit 19 row 48","tp":0},{"id":"T19-43","u":"19","q":"In word processing, a style guide ensures:","o":["That fonts and headings are applied consistently","Logical flow in pseudocode","Valid UML syntax","Sequence diagram lifelines"],"a":0,"e":"A style guide makes sure fonts and headings are used the same way throughout a document.","s":"bank","src":"Unit 19 row 49","tp":1},{"id":"T19-44","u":"19","q":"Which feature of a word processor helps automate section numbering and table of contents?","o":["Track changes","Styles and headings","Spell check","Word art"],"a":1,"e":"Using heading styles lets the word processor number sections and build the table of contents automatically.","s":"bank","src":"Unit 19 row 50","tp":1},{"id":"T19-45","u":"19","q":"Templates in word processing help teams by:","o":["Allowing each writer to choose their own format","Providing a predefined structure for common document types","Automatically checking the content for errors","Converting documents to PDF"],"a":1,"e":"Templates give a ready-made structure for common documents, so the team doesn't start from scratch.","s":"bank","src":"Unit 19 row 51","tp":1},{"id":"T19-46","u":"19","q":"Evaluating a solution’s economic feasibility involves analyzing:","o":["Object lifelines","Cost-benefit ratio and ROI","Alternate flow in use cases","Decision nodes in activity diagrams"],"a":1,"e":"Economic feasibility compares costs with benefits, for example the cost-benefit ratio and return on investment (ROI).","s":"bank","src":"Unit 19 row 52","tp":1},{"id":"T19-47","u":"19","q":"A class diagram’s association with a filled diamond represents:","o":["Dependency","Composition","Aggregation","Inheritance"],"a":1,"e":"A filled diamond shows composition: a strong whole-part relationship where the part cannot exist without the whole.","s":"bank","src":"Unit 19 row 53","tp":0},{"id":"T19-48","u":"19","q":"Pseudocode IF…ELSE statements correspond to which flowchart symbol?","o":["Parallelogram","Decision diamond","Terminal oval","Process rectangle"],"a":1,"e":"An IF…ELSE is a decision, which a flowchart draws as a diamond.","s":"bank","src":"Unit 19 row 54","tp":0},{"id":"T19-49","u":"19","q":"What’s the primary goal of a use-case diagram?","o":["Show data persistence","Capture functional requirements at a high level","Define database schemas","Detail algorithmic flows"],"a":1,"e":"A use-case diagram captures the functional requirements: what the system must do for its users.","s":"bank","src":"Unit 19 row 55","tp":2},{"id":"T19-50","u":"19","q":"In requirements modeling, traceability matrices are used to:","o":["Link requirements to design, code, and tests","Define class attributes","Document flowchart symbols","Create swimlanes"],"a":0,"e":"A traceability matrix links each requirement to the design, code and tests that cover it.","s":"bank","src":"Unit 19 row 56","tp":0},{"id":"T19-51","u":"19","q":"A sequence diagram message from one object to itself is called:","o":["Reflexive call","Return message","Self-call or recursive message","Creation message"],"a":2,"e":"When an object sends a message to itself, it is a self-call (recursive message).","s":"bank","src":"Unit 19 row 57","tp":0},{"id":"T19-52","u":"19","q":"Which pseudocode construct handles multiple exclusive conditions?","o":["WHILE loop","SWITCH or CASE statement","FUNCTION definition","RETURN statement"],"a":1,"e":"SWITCH or CASE chooses one of several exclusive options based on a value.","s":"bank","src":"Unit 19 row 58","tp":0},{"id":"T19-53","u":"19","q":"During risk analysis, a risk with high likelihood and high impact should be:","o":["Monitored only","Accepted without action","Prioritized for mitigation","Transferred to the client"],"a":2,"e":"A risk that is both likely and serious should be dealt with first, so it is prioritized for mitigation.","s":"bank","src":"Unit 19 row 59","tp":3},{"id":"T19-54","u":"19","q":"An operational procedure should be updated when:","o":["System functionality changes","Budgets are approved","UML tools are installed","Templates are renamed"],"a":0,"e":"Operational procedures must be updated when the system's functionality changes, so they stay accurate.","s":"bank","src":"Unit 19 row 60","tp":2},{"id":"T19-55","u":"19","q":"A solution design document often includes which UML artifact?","o":["Use-case narrative","Class and sequence diagrams","Flowchart symbols legend","Pseudocode listings"],"a":1,"e":"Solution design documents often include class diagrams (structure) and sequence diagrams (interactions).","s":"bank","src":"Unit 19 row 61","tp":0},{"id":"T19-56","u":"19","q":"Which flowchart element would you use to show manual data entry?","o":["Manual input symbol (a rectangle with a slanted top edge)","Predefined process symbol","Document symbol","Connector circle"],"a":0,"e":"Manual input (data typed in by hand) is shown by a rectangle with a slanted top edge.","s":"bank","src":"Unit 19 row 62","tp":0},{"id":"T19-57","u":"19","q":"The “postconditions” section in a use-case narrative describes:","o":["System state after successful completion","Steps the user takes next","Budget adjustments","Risk register updates"],"a":0,"e":"Postconditions describe the state of the system after the use case completes successfully.","s":"bank","src":"Unit 19 row 63","tp":0},{"id":"T19-58","u":"19","q":"Which tool feature helps track revisions in a requirements document?","o":["AutoCorrect","Track Changes","Styles pane","Word count"],"a":1,"e":"Track Changes records every edit, so revisions to the document can be reviewed.","s":"bank","src":"Unit 19 row 64","tp":1},{"id":"T19-59","u":"19","q":"Aggregation in class diagrams indicates:","o":["A whole-part relationship with independent lifecycles","A strong ownership","Class inheritance","Message passing"],"a":0,"e":"Aggregation (hollow diamond) is a whole-part relationship where the parts can exist on their own.","s":"bank","src":"Unit 19 row 65","tp":0},{"id":"T19-60","u":"19","q":"In UML, which element is not commonly used in a use-case diagram?","o":["Actor","Include relationship","Sequence lifeline","Use case"],"a":2,"e":"Lifelines belong to sequence diagrams, not use-case diagrams.","s":"bank","src":"Unit 19 row 66","tp":0},{"id":"T20-1","u":"20","q":"Which of these is a current technology trend in IT?","o":["Cloud computing","Dial-up networking","Mainframe batch processing","Optical disc storage"],"a":0,"e":"Cloud computing is a current trend: services and storage are delivered over the internet.","s":"bank","src":"Unit 20 row 2","tp":0},{"id":"T20-2","u":"20","q":"Which of these describes a future direction in IT?","o":["Fewer software updates","AI integration","Replacing cloud services with local-only storage","Replacing automation with manual processes"],"a":1,"e":"Integrating AI into products and services is a key future direction in IT.","s":"bank","src":"Unit 20 row 3","tp":1},{"id":"T20-3","u":"20","q":"Which of the following is an industry standard?","o":["ISO standards","A vendor's product brochure","A company's internal style choice","A developer's coding preference"],"a":0,"e":"ISO standards are internationally agreed industry standards.","s":"bank","src":"Unit 20 row 4","tp":3},{"id":"T20-4","u":"20","q":"What do technology vendors mainly provide?","o":["Hardware and software products","Industry standards","Business requirements","Accessibility guidelines"],"a":0,"e":"Vendors are the companies that supply hardware and software products.","s":"bank","src":"Unit 20 row 5","tp":0},{"id":"T20-5","u":"20","q":"What do business requirements describe?","o":["What users and the organization need from the system","How the source code is structured","Which programming language to use","The server hardware specification"],"a":0,"e":"Business requirements describe what users and the organization need the system to achieve.","s":"bank","src":"Unit 20 row 6","tp":1},{"id":"T20-6","u":"20","q":"Which of these is an example of hardware?","o":["CPU","Software license","Mobile app","Operating system"],"a":0,"e":"The CPU is a physical component, so it is hardware. Licenses, apps and operating systems are software.","s":"bank","src":"Unit 20 row 7","tp":1},{"id":"T20-7","u":"20","q":"Which of these is a vendor document?","o":["User manual","Online forum post","Personal blog","Chat message"],"a":0,"e":"A user manual is an official document from the vendor about its product.","s":"bank","src":"Unit 20 row 8","tp":2},{"id":"T20-8","u":"20","q":"Which information source lets you try a product's features before you buy it?","o":["Demo site (test page)","Final product release","Printed manual","Source code"],"a":0,"e":"A demo site (test page) lets you try out a product's features before deciding to buy it.","s":"bank","src":"Unit 20 row 9","tp":2},{"id":"T20-9","u":"20","q":"Which is a web-based information source?","o":["Website","Printed textbook","DVD","Printed vendor brochure"],"a":0,"e":"A website is an information source you access over the web.","s":"bank","src":"Unit 20 row 10","tp":2},{"id":"T20-10","u":"20","q":"Which of these is a search technique?","o":["Keyword search","Bookmarking pages","Clearing the browser history","Increasing the screen resolution"],"a":0,"e":"Keyword search, using words related to the topic, is a basic search technique.","s":"bank","src":"Unit 20 row 11","tp":2},{"id":"T20-11","u":"20","q":"What helps ensure product quality?","o":["QA standards","Shorter testing time","Fewer code reviews","Less documentation"],"a":0,"e":"QA standards set the processes and checks that keep product quality high.","s":"bank","src":"Unit 20 row 12","tp":1},{"id":"T20-12","u":"20","q":"Which of these helps improve usability?","o":["Accessibility standards","Longer menus","Hidden navigation","Technical error messages"],"a":0,"e":"Following accessibility standards makes a product easier for everyone to use.","s":"bank","src":"Unit 20 row 13","tp":3},{"id":"T20-14","u":"20","q":"What is a software estimation methodology used for?","o":["Predicting the cost and effort of a project","Measuring user satisfaction after release","Tracking changes to source code","Testing the user interface"],"a":0,"e":"Estimation methods predict how much effort, time and money a project will need.","s":"bank","src":"Unit 20 row 15","tp":4},{"id":"T20-15","u":"20","q":"What is configuration management?","o":["Tracking and controlling changes to software versions","Designing the user interface","Estimating project costs","Writing user documentation"],"a":0,"e":"Configuration management tracks and controls changes to software and its versions.","s":"bank","src":"Unit 20 row 16","tp":5},{"id":"T20-16","u":"20","q":"Which of these is an example of modern software delivery?","o":["SaaS (Software as a Service)","Software shipped on floppy disks","Ordering software by fax","Typewritten installation manuals"],"a":0,"e":"SaaS delivers software over the internet as a service, a modern alternative to installing it from disks.","s":"bank","src":"Unit 20 row 17","tp":3},{"id":"T20-17","u":"20","q":"Which of these improves the accuracy of a web search?","o":["Using filters such as date or file type","Using fewer keywords","Using very general terms","Removing quotation marks"],"a":0,"e":"Filters such as date or file type narrow the results, which makes a search more accurate.","s":"bank","src":"Unit 20 row 18","tp":2},{"id":"T20-18","u":"20","q":"What helps ensure consistency across IT products?","o":["Standards","Personal preferences","Ad-hoc decisions","Vendor marketing"],"a":0,"e":"Standards are agreed rules, so products that follow them are consistent.","s":"bank","src":"Unit 20 row 19","tp":1},{"id":"T20-19","u":"20","q":"What is used to measure software performance?","o":["Metrics","User opinions only","Marketing reports","Project vision statements"],"a":0,"e":"Metrics are measurements, such as response time, used to measure performance.","s":"bank","src":"Unit 20 row 20","tp":4},{"id":"T20-20","u":"20","q":"Which activity aligns IT with business needs?","o":["Requirements analysis","Code compilation","Hardware maintenance","Software installation"],"a":0,"e":"Requirements analysis finds out what the business needs, so the IT solution matches those needs.","s":"bank","src":"Unit 20 row 21","tp":1},{"id":"T21-1","u":"21","q":"What function in a document editor allows you to track changes made by multiple users?","o":["Save","Track Changes","Print Preview","Format Painter"],"a":1,"e":"Track Changes records each user's edits so they can be reviewed, then accepted or rejected.","s":"bank","src":"Unit 21 row 2","tp":0},{"id":"T21-2","u":"21","q":"Which document function is primarily used to merge content from multiple sources efficiently?","o":["Mail Merge","AutoCorrect","Hyperlink","Word Count"],"a":0,"e":"Mail Merge combines one document with data from another source, such as a list of names and addresses.","s":"bank","src":"Unit 21 row 3","tp":0},{"id":"T21-3","u":"21","q":"What is the primary purpose of a template in document editing?","o":["To store images","To provide a predefined structure","To track changes","To check spelling"],"a":1,"e":"A template provides a ready-made structure and formatting, so new documents start consistent.","s":"bank","src":"Unit 21 row 4","tp":2},{"id":"T21-4","u":"21","q":"Which document type is ideal for formal reports with structured headings and references?","o":["Memo","Newsletter","Report","Blog post"],"a":2,"e":"Reports are formal documents with structured headings and references.","s":"bank","src":"Unit 21 row 5","tp":0},{"id":"T21-5","u":"21","q":"What document type is designed for collaborative, real-time editing over the internet?","o":["Spreadsheet","Shared online document","PDF","E-book"],"a":1,"e":"Shared online documents let several people edit the same document at the same time over the internet.","s":"bank","src":"Unit 21 row 6","tp":0},{"id":"T21-6","u":"21","q":"Which format preserves document layout across different devices and platforms?","o":["DOCX","PDF","TXT","RTF"],"a":1,"e":"PDF keeps the layout exactly the same on any device or platform.","s":"bank","src":"Unit 21 row 7","tp":2},{"id":"T21-7","u":"21","q":"What format is most suitable for lightweight plain text storage without styling?","o":["DOCX","TXT","PDF","HTML"],"a":1,"e":"TXT stores plain text only, with no formatting, so files are small and simple.","s":"bank","src":"Unit 21 row 8","tp":0},{"id":"T21-8","u":"21","q":"Which feature in document software provides step-by-step instructions for complex tasks?","o":["Spell Check","Online Help","Header/Footer","Track Changes"],"a":1,"e":"Online help gives step-by-step guidance inside the software while you work.","s":"bank","src":"Unit 21 row 9","tp":0},{"id":"T21-9","u":"21","q":"What online help tool allows searching for keywords and accessing tutorials inside the software?","o":["Manual","Toolbar","Help Menu","Print Preview"],"a":2,"e":"The Help menu lets users search by keyword and open tutorials without leaving the software.","s":"bank","src":"Unit 21 row 10","tp":1},{"id":"T21-10","u":"21","q":"Which online help resource provides troubleshooting tips and user forums maintained by the software vendor?","o":["User Guide","FAQ","Online Community","Print Manual"],"a":2,"e":"An online community run by the vendor offers troubleshooting tips and user forums.","s":"bank","src":"Unit 21 row 11","tp":0},{"id":"T21-11","u":"21","q":"What JavaDoc tag specifies the input parameters of a method?","o":["@return","@throws","@param","@author"],"a":2,"e":"@param documents each input parameter of a method.","s":"bank","src":"Unit 21 row 12","tp":2},{"id":"T21-12","u":"21","q":"Which JavaDoc tag describes the value returned by a method?","o":["@param","@return","@throws","@version"],"a":1,"e":"@return documents the value a method returns.","s":"bank","src":"Unit 21 row 13","tp":2},{"id":"T21-14","u":"21","q":"Which JavaDoc tag provides version information for a class or interface?","o":["@throws","@version","@param","@return"],"a":1,"e":"@version records the version of a class or interface.","s":"bank","src":"Unit 21 row 15","tp":2},{"id":"T21-15","u":"21","q":"What JavaHelp feature allows linking topics hierarchically for easy navigation?","o":["TOC","Index","Search","Print"],"a":0,"e":"The table of contents (TOC) arranges help topics in a hierarchy for easy navigation.","s":"bank","src":"Unit 21 row 16","tp":3},{"id":"T21-16","u":"21","q":"Which JavaHelp component enables users to search keywords in the help content?","o":["Index","Search","TOC","Footer"],"a":1,"e":"The Search component lets users find help topics by keyword.","s":"bank","src":"Unit 21 row 17","tp":1},{"id":"T21-17","u":"21","q":"What is the purpose of JavaHelp’s index?","o":["List of topics in alphabetical order","Track changes","Merge documents","Auto-save content"],"a":0,"e":"The index lists help topics in alphabetical order for quick access.","s":"bank","src":"Unit 21 row 18","tp":2},{"id":"T21-22","u":"21","q":"What usability feature helps users quickly scan and comprehend information in documents?","o":["Footnotes","Headings and bullet points","Track changes","Templates"],"a":1,"e":"Headings and bullet points break text into parts that are quick to scan.","s":"bank","src":"Unit 21 row 23","tp":3},{"id":"T21-24","u":"21","q":"Which audience-focused approach tailors content according to user knowledge and needs?","o":["Font selection","Target audience analysis","Print formatting","Adding hyperlinks"],"a":1,"e":"Target audience analysis finds out what readers already know and need, so the content can match them.","s":"bank","src":"Unit 21 row 25","tp":3},{"id":"T21-25","u":"21","q":"Which technique gathers feedback by hosting interactive discussions among stakeholders?","o":["Survey","Workshop","Online form","Comments"],"a":1,"e":"A workshop brings stakeholders together for an interactive discussion.","s":"bank","src":"Unit 21 row 26","tp":4},{"id":"T21-26","u":"21","q":"What method collects structured responses from users remotely via the internet?","o":["Workshop","Survey","Online form","Review meeting"],"a":2,"e":"An online form collects structured answers from users over the internet.","s":"bank","src":"Unit 21 row 27","tp":0},{"id":"T21-28","u":"21","q":"Which feedback approach allows collecting both quantitative and qualitative opinions?","o":["Workshop","Survey","Online form","Comments in documents"],"a":1,"e":"Surveys can include rating questions (quantitative) and open questions (qualitative).","s":"bank","src":"Unit 21 row 29","tp":4},{"id":"T21-30","u":"21","q":"Which feedback technique is best for remote teams with participants in different locations?","o":["Workshop","Survey","Comments","In-person interview"],"a":1,"e":"Surveys can be completed online from anywhere, which suits teams in different locations.","s":"bank","src":"Unit 21 row 31","tp":0},{"id":"T21-31","u":"21","q":"Which feedback gathering method allows multiple users to provide contextual notes in a document?","o":["Comments","Online forms","Survey","Workshop"],"a":0,"e":"Comments let several reviewers add notes directly next to the relevant text.","s":"bank","src":"Unit 21 row 32","tp":4},{"id":"T21-32","u":"21","q":"What is the purpose of consolidating feedback from multiple techniques?","o":["To speed up publishing","To enhance usability and accuracy","To reduce the number of reviewers","To replace the need for testing"],"a":1,"e":"Combining feedback from several methods gives a fuller picture, which improves usability and accuracy.","s":"bank","src":"Unit 21 row 33","tp":0},{"id":"T21-33","u":"21","q":"What document function allows automatic updating of references such as tables of contents?","o":["AutoCorrect","Update Fields","Track Changes","Format Painter"],"a":1,"e":"Update Fields refreshes automatic content such as the table of contents and page references.","s":"bank","src":"Unit 21 row 34","tp":0},{"id":"T21-34","u":"21","q":"Which function helps detect and correct repeated spelling and grammar errors in documents?","o":["Thesaurus","AutoCorrect","Track Changes","Page Layout"],"a":1,"e":"AutoCorrect fixes common spelling and typing mistakes automatically as you type.","s":"bank","src":"Unit 21 row 35","tp":0},{"id":"T21-35","u":"21","q":"What feature enables inserting predefined blocks like headers, footers, or cover pages?","o":["Styles","Templates","Mail Merge","Comments"],"a":1,"e":"Templates can include predefined parts such as headers, footers and cover pages.","s":"bank","src":"Unit 21 row 36","tp":1},{"id":"T21-36","u":"21","q":"What document type is specifically designed for quick informal communication within an organization?","o":["Report","Memo","Research Paper","Thesis"],"a":1,"e":"A memo is a short, informal message used for communication inside an organization.","s":"bank","src":"Unit 21 row 37","tp":0},{"id":"T21-37","u":"21","q":"Which format is used to publish digital articles that are viewed in a web browser?","o":["PDF","Word document","HTML document","Spreadsheet"],"a":2,"e":"HTML is the format web browsers display, so it is used for digital articles on the web.","s":"bank","src":"Unit 21 row 38","tp":2},{"id":"T21-38","u":"21","q":"What format is best for editable documents that maintain rich text features like tables and images?","o":["TXT","DOCX","PDF","CSV"],"a":1,"e":"DOCX is an editable format that keeps rich features such as tables and images.","s":"bank","src":"Unit 21 row 39","tp":3},{"id":"T21-40","u":"21","q":"What online help feature provides stepwise solutions with screenshots and examples?","o":["Tutorials","Tooltips","Help Menu","Status Bar"],"a":0,"e":"Tutorials walk users through a task step by step, often with screenshots and examples.","s":"bank","src":"Unit 21 row 41","tp":2},{"id":"T21-41","u":"21","q":"Which online help method allows users to submit questions to software support teams?","o":["Search","FAQ","Support Ticket","Table of Contents"],"a":2,"e":"A support ticket sends a user's question to the support team and tracks it until it is answered.","s":"bank","src":"Unit 21 row 42","tp":0},{"id":"T21-43","u":"21","q":"What JavaDoc tag is used to describe exceptions a method may throw?","o":["@return","@param","@throws","@see"],"a":2,"e":"@throws documents the exceptions a method may throw.","s":"bank","src":"Unit 21 row 44","tp":2},{"id":"T21-46","u":"21","q":"Which tag links the current Java class or method to related classes or methods?","o":["@link","@throws","@param","@return"],"a":0,"e":"@link inserts a link to a related class or method in the documentation.","s":"bank","src":"Unit 21 row 47","tp":0},{"id":"T21-55","u":"21","q":"What accessibility practice provides textual descriptions for non-text elements in a document?","o":["Readability","Alt text","Target audience","Templates"],"a":1,"e":"Alt text describes images and other non-text elements so screen readers can read them out.","s":"bank","src":"Unit 21 row 56","tp":0},{"id":"T21-58","u":"21","q":"Which technique collects structured data via questionnaires from a larger audience?","o":["Workshop","Survey","Comments","Peer review"],"a":1,"e":"Surveys use questionnaires to collect structured data from many people.","s":"bank","src":"Unit 21 row 59","tp":4},{"id":"T21-61","u":"21","q":"What is the main benefit of using workshops to review documents?","o":["Anonymous feedback","Real-time discussion and brainstorming","Feedback collected automatically","Responses from very large groups"],"a":1,"e":"Workshops allow real-time discussion and brainstorming among reviewers.","s":"bank","src":"Unit 21 row 62","tp":0},{"id":"T21-77","u":"21","q":"What is the purpose of JavaHelp?","o":["To compile Java code","To provide online help documentation for Java applications","To generate API documentation from comments","To design user interfaces"],"a":1,"e":"JavaHelp is a system for providing online help in Java applications.","s":"bank","src":"Unit 21 row 78","tp":2},{"id":"T21-78","u":"21","q":"What does readability mean in documentation?","o":["Use of images","Ease of understanding content","File size","Number of pages"],"a":1,"e":"Readability is how easy the content is to read and understand.","s":"bank","src":"Unit 21 row 79","tp":3},{"id":"T21-79","u":"21","q":"What is accessibility in documentation?","o":["Protecting content with passwords","Making content usable by all users, including people with disabilities","Making content shorter","Making content available offline"],"a":1,"e":"Accessibility means everyone can use the content, including people with disabilities.","s":"bank","src":"Unit 21 row 80","tp":3},{"id":"T21-80","u":"21","q":"Why is identifying the target audience important?","o":["To decide the file format","To match the content to the users' needs","To reduce the number of pages","To choose the print layout"],"a":1,"e":"Knowing the target audience lets you match the content to their knowledge and needs.","s":"bank","src":"Unit 21 row 81","tp":3},{"id":"T22-1","u":"22","q":"What hardware feature enables simultaneous processing of multiple tasks?","o":["Multi-core CPU","Cache memory","Power supply","Bus speed"],"a":0,"e":"A multi-core CPU has several processing cores, so it can work on several tasks at the same time.","s":"bank","src":"Unit 22 row 2","tp":0},{"id":"T22-2","u":"22","q":"Which software capability allows tracking and restoring previous file versions?","o":["Formatting","Version control","Printing","Scanning"],"a":1,"e":"Version control keeps earlier versions of files so they can be tracked and restored.","s":"bank","src":"Unit 22 row 3","tp":1},{"id":"T22-3","u":"22","q":"What determines the speed of communication between internal hardware components?","o":["RAM size","Storage type","Bus width","Clock battery"],"a":2,"e":"The bus carries data between internal components. A wider bus moves more data at once.","s":"bank","src":"Unit 22 row 4","tp":0},{"id":"T22-4","u":"22","q":"Which feature allows software to interact with external applications?","o":["Graphical user interface","File system","Compiler","API support"],"a":3,"e":"An API lets software exchange data and features with other applications.","s":"bank","src":"Unit 22 row 5","tp":0},{"id":"T22-5","u":"22","q":"What technology significantly improves data access speed in storage devices?","o":["Disk defragmentation","Hard disk drive (HDD)","Solid-state drive (SSD)","File compression"],"a":2,"e":"SSDs store data on flash chips with no moving parts, so they are much faster than hard disks.","s":"bank","src":"Unit 22 row 6","tp":0},{"id":"T22-6","u":"22","q":"What factor determines whether hardware is supported in an organization?","o":["Purchase cost","Compatibility with existing systems","Brand name","Warranty length"],"a":1,"e":"Organizations support hardware that is compatible with their existing systems.","s":"bank","src":"Unit 22 row 7","tp":0},{"id":"T22-7","u":"22","q":"Which factor mainly influences software approval in organizations?","o":["Number of features","License compatibility","Popularity of the product","Size of the installation file"],"a":1,"e":"Software is approved when its license fits the organization's needs and rules.","s":"bank","src":"Unit 22 row 8","tp":0},{"id":"T22-8","u":"22","q":"What defines officially approved hardware and software usage?","o":["Security policy","IT support policy","Training manual","User guide"],"a":1,"e":"The IT support policy defines which hardware and software are officially approved.","s":"bank","src":"Unit 22 row 9","tp":0},{"id":"T22-10","u":"22","q":"Why do organizations restrict unsupported software usage?","o":["To reduce license costs","To enhance security","To save disk space","To make training easier"],"a":1,"e":"Unsupported software may have security weaknesses, so restricting it improves security.","s":"bank","src":"Unit 22 row 11","tp":0},{"id":"T22-11","u":"22","q":"What term refers to a group of interconnected computers?","o":["Protocol","Server","Network","Interface"],"a":2,"e":"A network is a group of connected computers that can share data and resources.","s":"bank","src":"Unit 22 row 12","tp":0},{"id":"T22-12","u":"22","q":"Which term describes unauthorized access to systems?","o":["Encryption","Backup","Firewall","Hacking"],"a":3,"e":"Hacking means gaining unauthorized access to a system.","s":"bank","src":"Unit 22 row 13","tp":0},{"id":"T22-13","u":"22","q":"What does latency measure in networking?","o":["Storage","Delay","Speed","Capacity"],"a":1,"e":"Latency is the delay before data arrives across a network.","s":"bank","src":"Unit 22 row 14","tp":0},{"id":"T22-14","u":"22","q":"Which term defines communication rules between devices?","o":["Interface","Protocol","Topology","Hardware"],"a":1,"e":"A protocol is a set of rules for how devices communicate.","s":"bank","src":"Unit 22 row 15","tp":1},{"id":"T22-15","u":"22","q":"What term refers to saving copies of data for recovery?","o":["Cache","Upload","Backup","Sync"],"a":2,"e":"A backup is a saved copy of data that can be used to recover it.","s":"bank","src":"Unit 22 row 16","tp":0},{"id":"T22-16","u":"22","q":"What source provides official and reliable technical documentation?","o":["Blogs","Forums","Vendor websites","Video-sharing sites"],"a":2,"e":"Vendor websites provide official, reliable documentation for their products.","s":"bank","src":"Unit 22 row 17","tp":1},{"id":"T22-17","u":"22","q":"Which source is best for troubleshooting real-world issues?","o":["Printed manuals","User forums","Vendor price lists","Product brochures"],"a":1,"e":"User forums share solutions to real problems that other users have already faced.","s":"bank","src":"Unit 22 row 18","tp":0},{"id":"T22-18","u":"22","q":"What source offers structured learning through guided lessons?","o":["Forums","Online courses","Email newsletters","System logs"],"a":1,"e":"Online courses teach through structured, guided lessons.","s":"bank","src":"Unit 22 row 19","tp":1},{"id":"T22-20","u":"22","q":"What factor affects access to online technical information?","o":["Screen resolution","Internet access","Browser theme","Keyboard layout"],"a":1,"e":"Online technical information can only be reached with internet access.","s":"bank","src":"Unit 22 row 21","tp":1},{"id":"T22-22","u":"22","q":"Which format is commonly used for embedded video?","o":["TXT","MP4","DOCX","CSV"],"a":1,"e":"MP4 is the common format for video embedded in presentations.","s":"bank","src":"Unit 22 row 23","tp":0},{"id":"T22-23","u":"22","q":"What issue may arise with embedded media?","o":["Slower slide transitions","Compatibility problems on other computers","Loss of slide notes","Lower image resolution"],"a":1,"e":"Embedded media may not play on another computer that lacks the right format support.","s":"bank","src":"Unit 22 row 24","tp":4},{"id":"T22-24","u":"22","q":"Which feature enables automatic playback of media?","o":["Animation","Auto-play","Transition","Layout"],"a":1,"e":"Auto-play starts media automatically when the slide appears.","s":"bank","src":"Unit 22 row 25","tp":0},{"id":"T22-25","u":"22","q":"What is the benefit of embedding media instead of linking?","o":["A smaller presentation file","The media plays without an internet connection","The media file updates automatically","Lower memory use"],"a":1,"e":"Embedded media is stored inside the presentation, so it plays without an internet connection.","s":"bank","src":"Unit 22 row 26","tp":0},{"id":"T22-27","u":"22","q":"Which animation type controls how objects appear?","o":["Exit","Entrance","Motion","Emphasis"],"a":1,"e":"Entrance animations control how objects appear on a slide.","s":"bank","src":"Unit 22 row 28","tp":1},{"id":"T22-28","u":"22","q":"What is a risk of excessive animations?","o":["Shorter presentations","Distraction from the content","Smaller file size","Better slide numbering"],"a":1,"e":"Too many animations distract the audience from the content.","s":"bank","src":"Unit 22 row 29","tp":1},{"id":"T22-29","u":"22","q":"Which feature controls animation order?","o":["Layout","Animation pane","Theme","Notes"],"a":1,"e":"The animation pane lists the animations on a slide and controls their order.","s":"bank","src":"Unit 22 row 30","tp":1},{"id":"T22-30","u":"22","q":"What determines animation speed?","o":["Timing","Font","Theme","Layout"],"a":0,"e":"Timing settings control how fast an animation runs.","s":"bank","src":"Unit 22 row 31","tp":1},{"id":"T22-32","u":"22","q":"Which feature controls transition duration?","o":["Timing","Animation","Layout","Theme"],"a":0,"e":"Timing settings control how long a transition takes.","s":"bank","src":"Unit 22 row 33","tp":1},{"id":"T22-33","u":"22","q":"What issue occurs with overuse of transitions?","o":["Slides change too slowly","Distraction from the message","The file cannot be saved","Animations stop working"],"a":1,"e":"Too many transitions distract from the message.","s":"bank","src":"Unit 22 row 34","tp":1},{"id":"T22-34","u":"22","q":"Which transition setting applies effects to all slides?","o":["Apply to all","Slide sorter","Notes","Layout"],"a":0,"e":"Apply to All gives every slide the same transition.","s":"bank","src":"Unit 22 row 35","tp":1},{"id":"T22-35","u":"22","q":"What type of transition effect fades one slide into another?","o":["Push","Fade","Split","Zoom"],"a":1,"e":"A Fade transition gradually fades one slide into the next.","s":"bank","src":"Unit 22 row 36","tp":1},{"id":"T22-36","u":"22","q":"What feature allows software to automatically update itself over the internet?","o":["Auto-update","Backup","Compression","Encryption"],"a":0,"e":"Auto-update downloads and installs updates over the internet automatically.","s":"bank","src":"Unit 22 row 37","tp":0},{"id":"T22-38","u":"22","q":"What determines the graphical performance of a computer system?","o":["CPU speed","RAM size","GPU capability","Storage type"],"a":2,"e":"The GPU (graphics processing unit) determines graphics performance.","s":"bank","src":"Unit 22 row 39","tp":0},{"id":"T22-39","u":"22","q":"Which feature enables cloud-based access to software applications?","o":["Local storage","Offline mode","Standalone installation","Cloud integration"],"a":3,"e":"Cloud integration lets users reach applications over the internet.","s":"bank","src":"Unit 22 row 40","tp":0},{"id":"T22-40","u":"22","q":"What capability allows devices to connect wirelessly to networks?","o":["Ethernet","Wi-Fi support","USB port","HDMI"],"a":1,"e":"Wi-Fi support lets devices connect to networks wirelessly.","s":"bank","src":"Unit 22 row 41","tp":4},{"id":"T22-41","u":"22","q":"What policy ensures only approved devices are used in an organization?","o":["Backup policy","IT asset policy","Password policy","Printing policy"],"a":1,"e":"An IT asset policy controls which devices are approved for use.","s":"bank","src":"Unit 22 row 42","tp":1},{"id":"T22-42","u":"22","q":"Which factor determines software compatibility in organizations?","o":["Screen size","Operating system support","Vendor's location","Number of users"],"a":1,"e":"Software must support the organization's operating system to be compatible.","s":"bank","src":"Unit 22 row 43","tp":0},{"id":"T22-43","u":"22","q":"What defines whether software receives updates and maintenance support?","o":["Installation guide","Vendor website design","License agreement","User manual"],"a":2,"e":"The license agreement states whether the software gets updates and maintenance support.","s":"bank","src":"Unit 22 row 44","tp":0},{"id":"T22-44","u":"22","q":"Which type of hardware is usually restricted in secure organizations?","o":["Approved servers","Personal USB devices","Network switches","Printers"],"a":1,"e":"Personal USB devices can carry malware or leak data, so secure organizations restrict them.","s":"bank","src":"Unit 22 row 45","tp":0},{"id":"T22-45","u":"22","q":"What is the main purpose of standardizing software in organizations?","o":["To offer users more choice","To ensure compatibility and security","To reduce the number of updates","To avoid training costs"],"a":1,"e":"Using standard software across the organization keeps systems compatible and secure.","s":"bank","src":"Unit 22 row 46","tp":0},{"id":"T22-46","u":"22","q":"What term describes converting data into a secure format?","o":["Backup","Encryption","Upload","Cache"],"a":1,"e":"Encryption converts data into a coded form that only authorized users can read.","s":"bank","src":"Unit 22 row 47","tp":0},{"id":"T22-47","u":"22","q":"Which term refers to a device that manages network traffic?","o":["Router","Monitor","Keyboard","Scanner"],"a":0,"e":"A router directs traffic between networks.","s":"bank","src":"Unit 22 row 48","tp":1},{"id":"T22-48","u":"22","q":"What is the meaning of bandwidth in networking?","o":["Data delay","Storage size","Data transfer capacity","CPU speed"],"a":2,"e":"Bandwidth is how much data a connection can carry per second.","s":"bank","src":"Unit 22 row 49","tp":0},{"id":"T22-49","u":"22","q":"Which term refers to malicious software designed to harm systems?","o":["Firewall","Antivirus","Malware","Protocol"],"a":2,"e":"Malware is software designed to harm systems, such as viruses and ransomware.","s":"bank","src":"Unit 22 row 50","tp":0},{"id":"T22-50","u":"22","q":"What term defines temporary storage for quick access?","o":["Backup","Cache","Archive","Upload"],"a":1,"e":"A cache is temporary storage that keeps data close at hand for quick access.","s":"bank","src":"Unit 22 row 51","tp":0},{"id":"T22-51","u":"22","q":"What source provides peer-reviewed technical research articles?","o":["Vendor brochures","Academic journals","User forums","Technology blogs"],"a":1,"e":"Academic journals publish peer-reviewed research articles.","s":"bank","src":"Unit 22 row 52","tp":1},{"id":"T22-52","u":"22","q":"Which source is most useful for step-by-step troubleshooting guides?","o":["Manuals","Product reviews","Vendor price lists","Press releases"],"a":0,"e":"Manuals give official step-by-step troubleshooting instructions.","s":"bank","src":"Unit 22 row 53","tp":2},{"id":"T22-54","u":"22","q":"Which source is best for official software updates and patches?","o":["Vendor website","Technology blogs","User forums","Online reviews"],"a":0,"e":"The vendor's website is the official source for updates and patches.","s":"bank","src":"Unit 22 row 55","tp":0},{"id":"T22-56","u":"22","q":"What is the role of embedded video in presentations?","o":["Replace text","Demonstrate concepts visually","Reduce slides","Increase file size"],"a":1,"e":"Embedded video shows concepts visually, such as a demonstration.","s":"bank","src":"Unit 22 row 57","tp":1},{"id":"T22-57","u":"22","q":"Which issue may occur when embedding large video files?","o":["Faster performance","Increased file size","Better clarity","Reduced storage"],"a":1,"e":"A large embedded video makes the presentation file much bigger.","s":"bank","src":"Unit 22 row 58","tp":1},{"id":"T22-58","u":"22","q":"What format supports high-quality audio embedding?","o":["TXT","MP3","CSV","DOCX"],"a":1,"e":"MP3 is a common audio format for embedding sound.","s":"bank","src":"Unit 22 row 59","tp":1},{"id":"T22-59","u":"22","q":"Which control allows manual start of embedded media?","o":["Auto-play","Click-to-play","Transition","Layout"],"a":1,"e":"Click-to-play means the media starts only when the presenter clicks it.","s":"bank","src":"Unit 22 row 60","tp":0},{"id":"T22-61","u":"22","q":"What is the function of emphasis animations?","o":["Remove objects","Highlight objects","Move slides","Add text"],"a":1,"e":"Emphasis animations draw attention to an object that is already on the slide.","s":"bank","src":"Unit 22 row 62","tp":1},{"id":"T22-62","u":"22","q":"Which animation type removes objects from a slide?","o":["Entrance","Exit","Motion","Emphasis"],"a":1,"e":"Exit animations remove objects from the slide.","s":"bank","src":"Unit 22 row 63","tp":1},{"id":"T22-64","u":"22","q":"Which feature allows previewing animation effects?","o":["Slide sorter","Preview","Notes","Layout"],"a":1,"e":"Preview plays the animation effects so you can check them.","s":"bank","src":"Unit 22 row 65","tp":1},{"id":"T22-67","u":"22","q":"Which transition type moves slides horizontally?","o":["Fade","Push","Zoom","Split"],"a":1,"e":"A Push transition moves the next slide in horizontally, pushing the current one out.","s":"bank","src":"Unit 22 row 68","tp":1},{"id":"T22-72","u":"22","q":"Which type of manual provides step-by-step operational instructions?","o":["Reference manual","User manual","Technical manual","Installation manual"],"a":1,"e":"A user manual gives step-by-step instructions for operating the system.","s":"bank","src":"Unit 22 row 73","tp":2},{"id":"T22-73","u":"22","q":"What ensures documentation remains accurate over time?","o":["Printing it in color","Converting it to PDF","Regular updates","Adding more images"],"a":2,"e":"Documentation stays accurate only if it is updated regularly when the system changes.","s":"bank","src":"Unit 22 row 74","tp":0},{"id":"T22-74","u":"22","q":"Which documentation type is intended for developers rather than end users?","o":["User guide","FAQ","Installation guide","Technical manual"],"a":3,"e":"Technical manuals are written for developers and technical staff, not end users.","s":"bank","src":"Unit 22 row 75","tp":2},{"id":"T22-75","u":"22","q":"What feature improves navigation within digital manuals?","o":["Page numbers only","Hyperlinks","Long paragraphs","Larger fonts"],"a":1,"e":"Hyperlinks let readers jump straight to related sections in a digital manual.","s":"bank","src":"Unit 22 row 76","tp":0},{"id":"T22-76","u":"22","q":"What is the key purpose of active listening in communication?","o":["To reply as quickly as possible","To understand the message fully","To prepare your own answer while the speaker talks","To keep the conversation short"],"a":1,"e":"Active listening aims to understand the speaker's message fully.","s":"bank","src":"Unit 22 row 77","tp":3},{"id":"T22-77","u":"22","q":"Which behavior demonstrates active listening effectively?","o":["Taking notes on your phone while they speak","Finishing the speaker's sentences","Maintaining eye contact","Planning your reply while they talk"],"a":2,"e":"Eye contact shows you are paying attention, which is part of active listening.","s":"bank","src":"Unit 22 row 78","tp":3},{"id":"T22-78","u":"22","q":"What technique helps confirm understanding during active listening?","o":["Agreeing with everything","Summarizing your own view","Changing the subject","Paraphrasing what the speaker said"],"a":3,"e":"Paraphrasing the speaker's words back to them confirms you have understood.","s":"bank","src":"Unit 22 row 79","tp":3},{"id":"T22-79","u":"22","q":"Which factor can negatively affect active listening?","o":["Distractions","Note-taking","Eye contact","Asking questions"],"a":0,"e":"Distractions break concentration and weaken active listening.","s":"bank","src":"Unit 22 row 80","tp":3},{"id":"T22-80","u":"22","q":"What is the role of feedback in active listening?","o":["To end the conversation politely","To clarify understanding","To show you are an expert","To give your own opinion"],"a":1,"e":"Giving feedback, such as asking or summarizing, checks that you have understood.","s":"bank","src":"Unit 22 row 81","tp":3},{"id":"T22-81","u":"22","q":"What is the purpose of personalization in user instructions?","o":["To standardize the content for everyone","To make the content more detailed","To tailor the content to the user's needs","To shorten the training session"],"a":2,"e":"Personalization tailors instructions to each user's needs.","s":"bank","src":"Unit 22 row 82","tp":2},{"id":"T22-82","u":"22","q":"Which factor is considered when personalizing content?","o":["The trainer's preferred style","The user's experience level","The length of the manual","The software version only"],"a":1,"e":"A user's experience level decides how much detail and support they need.","s":"bank","src":"Unit 22 row 83","tp":4},{"id":"T22-83","u":"22","q":"What method adapts instructions for different audiences?","o":["User profiling","Writing one version for all users","Using the vendor's default manual","Using a fixed template"],"a":0,"e":"User profiling identifies different types of user, so instructions can be adapted for each.","s":"bank","src":"Unit 22 row 84","tp":4},{"id":"T22-84","u":"22","q":"Which benefit results from effective personalization?","o":["Shorter documentation","Better user engagement","Fewer support requests from experts only","Lower training cost for the trainer"],"a":1,"e":"Personalized content is more relevant, so users engage with it more.","s":"bank","src":"Unit 22 row 85","tp":0},{"id":"T22-85","u":"22","q":"What approach customizes instructions based on user preferences?","o":["Static content","A fixed page layout","Dynamic personalization","A printed manual"],"a":2,"e":"Dynamic personalization changes the content automatically based on user preferences.","s":"bank","src":"Unit 22 row 86","tp":1},{"id":"T22-87","u":"22","q":"Which scenario best suits on-site instruction?","o":["Remote troubleshooting","Complex hardware setup","Email query","Online survey"],"a":1,"e":"Complex hardware setup needs hands-on help, so it suits on-site instruction.","s":"bank","src":"Unit 22 row 88","tp":4},{"id":"T22-88","u":"22","q":"What limitation is associated with on-site instruction?","o":["High cost and travel time","Little interaction with the learner","No chance for feedback","Unclear explanations"],"a":0,"e":"On-site instruction costs more and takes travel time.","s":"bank","src":"Unit 22 row 89","tp":4},{"id":"T22-90","u":"22","q":"What skill is essential for delivering on-site instruction?","o":["Writing skills only","Presentation software skills","Marketing skills","Technical expertise"],"a":3,"e":"An on-site instructor needs technical expertise to solve problems in person.","s":"bank","src":"Unit 22 row 91","tp":4},{"id":"T22-92","u":"22","q":"Which challenge is common in telephone instruction?","o":["Easy explanation","Lack of visual cues","Immediate feedback","Clear visuals"],"a":1,"e":"On the telephone the trainer can't see the user's screen, so there are no visual cues.","s":"bank","src":"Unit 22 row 93","tp":2},{"id":"T22-93","u":"22","q":"What skill improves effectiveness of telephone support?","o":["Clear communication","Speaking quickly","Using technical terms","Reading from a script only"],"a":0,"e":"Without visuals, clear verbal communication is essential on the phone.","s":"bank","src":"Unit 22 row 94","tp":4},{"id":"T22-94","u":"22","q":"Which situation suits telephone instruction best?","o":["Quick troubleshooting guidance","Hardware repair","Software installation","System design"],"a":0,"e":"The telephone suits quick troubleshooting that can be talked through.","s":"bank","src":"Unit 22 row 95","tp":4},{"id":"T22-96","u":"22","q":"What is the main benefit of online instruction?","o":["Physical presence of the trainer","Hands-on help with hardware","Learning from any location","No need for equipment"],"a":2,"e":"Online instruction lets learners join from any location.","s":"bank","src":"Unit 22 row 97","tp":4},{"id":"T22-97","u":"22","q":"Which tool is commonly used for online instruction?","o":["Printed manual","Video conferencing","Telephone","Fax"],"a":1,"e":"Video conferencing tools, such as Zoom or Teams, are used for online instruction.","s":"bank","src":"Unit 22 row 98","tp":1},{"id":"T22-98","u":"22","q":"What challenge occurs in online instruction?","o":["Accessibility for remote learners","Dependence on a reliable internet connection","Lack of a written record","Too much flexibility"],"a":1,"e":"Online instruction depends on a reliable internet connection.","s":"bank","src":"Unit 22 row 99","tp":1},{"id":"T22-100","u":"22","q":"What makes online instruction scalable?","o":["Physical presence","Digital platforms","Printed manuals","Telephone calls"],"a":1,"e":"Digital platforms can reach many learners at once, so online instruction scales easily.","s":"bank","src":"Unit 22 row 101","tp":4},{"id":"T22-102","u":"22","q":"Which limitation is associated with email support?","o":["It leaves a written record","Replies may be delayed","Messages can be detailed","It can be sent at any time"],"a":1,"e":"Email is not instant, so replies may be delayed.","s":"bank","src":"Unit 22 row 103","tp":4},{"id":"T22-103","u":"22","q":"What skill improves email communication effectiveness?","o":["Using technical terms","Clear and concise writing","Writing long, detailed messages","Replying only during office hours"],"a":1,"e":"Clear, concise writing makes email support easy to follow.","s":"bank","src":"Unit 22 row 104","tp":4},{"id":"T22-104","u":"22","q":"Which situation is best suited to email support?","o":["An urgent system outage","A detailed explanation the user can keep and refer to","A hardware repair","Live real-time training"],"a":1,"e":"Email suits detailed explanations the user can keep and refer back to.","s":"bank","src":"Unit 22 row 105","tp":4},{"id":"T22-107","u":"22","q":"Which method is used in Q&A sessions?","o":["One-way presentation","Interactive questioning","Silent reading","Written tests"],"a":1,"e":"Q&A sessions use interactive questioning between learners and the trainer.","s":"bank","src":"Unit 22 row 108","tp":3},{"id":"T22-109","u":"22","q":"Which skill is essential for effective Q&A sessions?","o":["Speaking quickly","Clear explanation","Reading from the manual","Avoiding technical terms completely"],"a":1,"e":"Clear explanations make the answers in a Q&A session useful.","s":"bank","src":"Unit 22 row 110","tp":1},{"id":"T22-111","u":"22","q":"Which feature of slideshows allows users to play multimedia within a presentation?","o":["Animations","Embedded audio and video","Transitions","Slide numbering"],"a":1,"e":"Embedded audio and video play multimedia inside the presentation.","s":"bank","src":"Unit 22 row 112","tp":1},{"id":"T22-112","u":"22","q":"Which slideshow feature adds motion effects to objects on a slide?","o":["Animations","Slide numbering","Transitions","Audio settings"],"a":0,"e":"Animations add motion effects to objects on a slide.","s":"bank","src":"Unit 22 row 113","tp":1},{"id":"T22-113","u":"22","q":"Which slideshow feature controls how one slide changes to the next?","o":["Audio embedding","Animations","Transitions","Templates"],"a":2,"e":"Transitions control how one slide changes to the next.","s":"bank","src":"Unit 22 row 114","tp":1},{"id":"T22-114","u":"22","q":"What is the main purpose of providing documentation and manuals in instruction?","o":["To replace the trainer","To guide users in performing tasks accurately","To advertise the product","To record user feedback"],"a":1,"e":"Documentation and manuals guide users to carry out tasks correctly.","s":"bank","src":"Unit 22 row 115","tp":0},{"id":"T22-117","u":"22","q":"What is the main advantage of on-site instruction?","o":["Hands-on support and immediate guidance","Automated responses","Remote access","Written-only guidance"],"a":0,"e":"On-site instruction gives hands-on support and immediate guidance.","s":"bank","src":"Unit 22 row 118","tp":4},{"id":"T22-118","u":"22","q":"Which is a primary benefit of telephone instruction?","o":["Visual demonstration","Immediate verbal communication and guidance","Physical presence","Interactive workshops"],"a":1,"e":"The telephone allows immediate spoken guidance.","s":"bank","src":"Unit 22 row 119","tp":4},{"id":"T22-119","u":"22","q":"Which feature makes online instruction effective?","o":["Use of interactive digital platforms","Paper-based manuals","Pre-recorded audio only","Email follow-ups only"],"a":0,"e":"Interactive digital platforms keep online learners engaged.","s":"bank","src":"Unit 22 row 120","tp":1},{"id":"T22-120","u":"22","q":"What is the key advantage of email as a support method?","o":["It gives an immediate response","It provides a written record for reference","It allows hands-on demonstration","It replaces training sessions"],"a":1,"e":"Email leaves a written record that the user can refer back to.","s":"bank","src":"Unit 22 row 121","tp":4},{"id":"T22-121","u":"22","q":"What is the main purpose of Q&A sessions in instruction?","o":["To deliver pre-recorded lectures","To clarify learner doubts and encourage interaction","To replace the manuals","To test the learners"],"a":1,"e":"Q&A sessions clear up learners' doubts and encourage interaction.","s":"bank","src":"Unit 22 row 122","tp":3},{"id":"T22-123","u":"22","q":"What is a key benefit of embedding audio and video in slideshows?","o":["It reduces the file size","It enhances learner engagement","It replaces the presenter","It makes slides load faster"],"a":1,"e":"Audio and video make presentations more engaging for learners.","s":"bank","src":"Unit 22 row 124","tp":1},{"id":"T22-125","u":"22","q":"How can embedded audio improve a slideshow presentation?","o":["By providing step-by-step narration","By changing slide transitions automatically","By formatting text","By compressing files"],"a":0,"e":"Embedded audio can add narration that explains each step.","s":"bank","src":"Unit 22 row 126","tp":0},{"id":"T22-126","u":"22","q":"What consideration is important when adding multimedia to slideshows?","o":["File size and compatibility","Font type","Slide layout only","Using only static images"],"a":0,"e":"Multimedia increases file size and may not play on every computer, so check both.","s":"bank","src":"Unit 22 row 127","tp":1},{"id":"T22-128","u":"22","q":"How can animations improve content delivery in presentations?","o":["By changing the file format","By drawing attention to key points","By reducing the number of slides","By adding speaker notes"],"a":1,"e":"Animations can draw attention to key points as they appear.","s":"bank","src":"Unit 22 row 129","tp":0},{"id":"T22-129","u":"22","q":"Which type of animation moves an object along a path?","o":["Entrance effect","Motion path","Transition effect","Audio effect"],"a":1,"e":"A motion path animation moves an object along a set path.","s":"bank","src":"Unit 22 row 130","tp":1},{"id":"T22-130","u":"22","q":"What is the purpose of exit animations?","o":["To make an object appear","To show an object leaving the slide","To move between slides","To add sound to an object"],"a":1,"e":"Exit animations show an object leaving the slide.","s":"bank","src":"Unit 22 row 131","tp":1},{"id":"T22-131","u":"22","q":"What should you consider when applying animations?","o":["The slide number","Whether it helps or distracts from the content","The file name","The printer settings"],"a":1,"e":"Use an animation only if it helps the content rather than distracting from it.","s":"bank","src":"Unit 22 row 132","tp":3},{"id":"T22-133","u":"22","q":"What is the main purpose of slide transitions?","o":["Smoothly guide the viewer between slides","Insert multimedia","Create motion effects on objects","Change file format"],"a":0,"e":"Transitions guide the viewer smoothly from one slide to the next.","s":"bank","src":"Unit 22 row 134","tp":1},{"id":"T22-136","u":"22","q":"Which factor should be considered when selecting transitions?","o":["Consistency and relevance","Slide number only","Font size","File compression"],"a":0,"e":"Transitions should be consistent and suit the content.","s":"bank","src":"Unit 22 row 137","tp":1},{"id":"T22-137","u":"22","q":"Which feature allows adding sound or narration directly into a presentation slide?","o":["Transitions","Embedded audio","Slide layout","Themes"],"a":1,"e":"Embedded audio adds sound or narration directly to a slide.","s":"bank","src":"Unit 22 row 138","tp":0},{"id":"T22-139","u":"22","q":"Which of the following is an example of active listening?","o":["Planning your answer while the speaker talks","Interrupting to correct mistakes","Asking clarifying questions","Changing the topic to your own experience"],"a":2,"e":"Asking clarifying questions shows you are listening and checks your understanding.","s":"bank","src":"Unit 22 row 140","tp":3},{"id":"T22-140","u":"22","q":"Which method provides instruction directly at the user's location?","o":["Email support","Telephone support","On-site instruction","Online forum"],"a":2,"e":"On-site instruction is delivered in person at the user's location.","s":"bank","src":"Unit 22 row 141","tp":4},{"id":"T22-141","u":"22","q":"What type of support involves real-time verbal communication without physical presence?","o":["Email","Telephone instruction","Manual","FAQ"],"a":1,"e":"Telephone instruction is spoken and real-time, without being there in person.","s":"bank","src":"Unit 22 row 142","tp":4},{"id":"T22-144","u":"22","q":"Which term refers to tailoring a presentation to audience needs?","o":["Standardization","Personalization","Automation","Encryption"],"a":1,"e":"Personalization means tailoring a presentation to the audience's needs.","s":"bank","src":"Unit 22 row 145","tp":0},{"id":"T22-146","u":"22","q":"Which of these describes a hardware capability?","o":["Software license","Processing speed","Number of user accounts","File format"],"a":1,"e":"Processing speed is a capability of the hardware.","s":"bank","src":"Unit 22 row 147","tp":0},{"id":"T22-147","u":"22","q":"Which system is typically supported by organizations?","o":["Unsupported legacy tools","Officially licensed software","Free trial versions","Personal software from home"],"a":1,"e":"Organizations support officially licensed software that is legal and maintained.","s":"bank","src":"Unit 22 row 148","tp":0},{"id":"T22-148","u":"22","q":"What does 'RAM' stand for?","o":["Read Access Memory","Random Access Memory","Rapid Action Module","Run Access Mode"],"a":1,"e":"RAM stands for Random Access Memory.","s":"bank","src":"Unit 22 row 149","tp":0},{"id":"T22-149","u":"22","q":"Which support type uses written communication asynchronously?","o":["Phone","Email","On-site","Meeting"],"a":1,"e":"Email is written and asynchronous: sender and reader don't need to be online at the same time.","s":"bank","src":"Unit 22 row 150","tp":4},{"id":"T22-151","u":"22","q":"Which support involves web-based help systems?","o":["Telephone","Online instruction","Manual","On-site"],"a":1,"e":"Online instruction includes web-based help systems.","s":"bank","src":"Unit 22 row 152","tp":4},{"id":"T22-155","u":"22","q":"Which support type allows users to ask questions directly?","o":["FAQ","Q&A session","Manual","Email"],"a":1,"e":"In a Q&A session users can ask their questions directly.","s":"bank","src":"Unit 22 row 156","tp":3},{"id":"T25-1","u":"25","q":"Which SDLC phase is most critical for identifying testable business rules?","o":["Design","Requirements Analysis","Deployment","Maintenance"],"a":1,"e":"Testable business rules come from the requirements, so they are identified during requirements analysis.","s":"bank","src":"Unit 25 row 2","tp":3},{"id":"T25-2","u":"25","q":"What type of testing is most relevant during the Design phase?","o":["UI Testing","Integration Testing","Static Testing","Regression Testing"],"a":2,"e":"In the design phase there is no code to run yet, so designs are checked by static testing, such as reviews.","s":"bank","src":"Unit 25 row 3","tp":1},{"id":"T25-3","u":"25","q":"Which phase focuses on validating system behavior against user expectations?","o":["Implementation","Testing","Maintenance","Requirements Analysis"],"a":1,"e":"The testing phase checks that the system behaves as users expect.","s":"bank","src":"Unit 25 row 4","tp":1},{"id":"T25-4","u":"25","q":"During which phase is test planning typically finalized?","o":["Design","Testing","Deployment","Requirements Analysis"],"a":0,"e":"Test planning is finalized during design, once it is clear what will be built.","s":"bank","src":"Unit 25 row 5","tp":3},{"id":"T25-5","u":"25","q":"Which phase benefits most from regression testing?","o":["Maintenance","Design","Requirements Analysis","Implementation"],"a":0,"e":"During maintenance, changes are made to working software, so regression tests check nothing has broken.","s":"bank","src":"Unit 25 row 6","tp":1},{"id":"T25-6","u":"25","q":"Which testing type checks individual functions or methods?","o":["Integration Testing","Unit Testing","System Testing","Acceptance Testing"],"a":1,"e":"Unit testing checks individual functions or methods on their own.","s":"bank","src":"Unit 25 row 7","tp":1},{"id":"T25-7","u":"25","q":"Which testing type ensures modules work together correctly?","o":["Unit Testing","UI Testing","Integration Testing","Smoke Testing"],"a":2,"e":"Integration testing checks that modules work correctly together.","s":"bank","src":"Unit 25 row 8","tp":1},{"id":"T25-8","u":"25","q":"Which testing type is most useful for validating user workflows?","o":["UI Testing","Unit Testing","Load Testing","Static Testing"],"a":0,"e":"UI testing follows the screens and steps users take, so it validates user workflows.","s":"bank","src":"Unit 25 row 9","tp":2},{"id":"T25-9","u":"25","q":"Which testing type is performed without executing code?","o":["Dynamic Testing","Static Testing","Unit Testing","Integration Testing"],"a":1,"e":"Static testing checks code or documents without running the program, for example code reviews.","s":"bank","src":"Unit 25 row 10","tp":2},{"id":"T25-10","u":"25","q":"Which testing type is best for catching performance bottlenecks?","o":["Regression Testing","Load Testing","UI Testing","Unit Testing"],"a":1,"e":"Load testing puts the system under heavy use to find performance bottlenecks.","s":"bank","src":"Unit 25 row 11","tp":1},{"id":"T25-11","u":"25","q":"Which tool is best for API testing?","o":["Selenium","JUnit","Postman","Git"],"a":2,"e":"Postman is a tool for sending requests to APIs and checking their responses.","s":"bank","src":"Unit 25 row 12","tp":1},{"id":"T25-12","u":"25","q":"Which tool is commonly used for automated UI testing?","o":["Postman","Selenium","JMeter","JUnit"],"a":1,"e":"Selenium automates a web browser to test user interfaces.","s":"bank","src":"Unit 25 row 13","tp":1},{"id":"T25-13","u":"25","q":"Which tool is used for unit testing in Java?","o":["JUnit","Postman","Selenium","GitHub"],"a":0,"e":"JUnit is the standard unit-testing framework for Java.","s":"bank","src":"Unit 25 row 14","tp":3},{"id":"T25-14","u":"25","q":"Which tool helps simulate heavy user traffic?","o":["JUnit","JMeter","Postman","Selenium"],"a":1,"e":"JMeter simulates many users at once to test performance under heavy traffic.","s":"bank","src":"Unit 25 row 15","tp":1},{"id":"T25-16","u":"25","q":"Which benefit of testing helps reduce future maintenance costs?","o":["Faster deployment","Early bug detection","More detailed UI design","Larger test teams"],"a":1,"e":"Finding bugs early is cheaper than fixing them later, which lowers maintenance costs.","s":"bank","src":"Unit 25 row 17","tp":3},{"id":"T25-17","u":"25","q":"Which term describes testing done by end users before release?","o":["Unit Testing","Acceptance Testing","Integration Testing","Regression Testing"],"a":1,"e":"Acceptance testing is done by end users or the client to confirm the software meets their needs before release.","s":"bank","src":"Unit 25 row 18","tp":1},{"id":"T25-18","u":"25","q":"Which standard defines software testing vocabulary and practices?","o":["ISO 9001","IEEE 829","UML","GDPR"],"a":1,"e":"IEEE 829 is the standard for software test documentation, covering test plans, cases and reports.","s":"bank","src":"Unit 25 row 19","tp":1},{"id":"T25-19","u":"25","q":"Which benefit of testing ensures software meets business goals?","o":["Code coverage","Requirement validation","UI responsiveness","Load balancing"],"a":1,"e":"Validating against the requirements confirms the software meets the business goals.","s":"bank","src":"Unit 25 row 20","tp":1},{"id":"T25-20","u":"25","q":"Which term refers to re-running tests after code changes?","o":["Regression Testing","Smoke Testing","Static Testing","Unit Testing"],"a":0,"e":"Regression testing re-runs earlier tests after changes to make sure nothing that worked before is broken.","s":"bank","src":"Unit 25 row 21","tp":1},{"id":"T26-1","u":"26","q":"Which SQL statement creates a new table named Students with columns ID and Name?","o":["NEW TABLE…","CREATE TABLE…","MAKE TABLE…","INSERT TABLE…"],"a":1,"e":"CREATE TABLE creates a new table and defines its columns.","s":"bank","src":"Unit 26 row 2","tp":1},{"id":"T26-2","u":"26","q":"Which key uniquely identifies each row in a table?","o":["Foreign key","Primary key","Candidate key","Composite key"],"a":1,"e":"A primary key uniquely identifies each row in a table.","s":"bank","src":"Unit 26 row 3","tp":0},{"id":"T26-3","u":"26","q":"Which normal form removes partial dependency for tables with composite keys?","o":["First NF","Second NF","Third NF","BCNF"],"a":1,"e":"Second normal form removes partial dependencies, where a column depends on only part of a composite key.","s":"bank","src":"Unit 26 row 4","tp":0},{"id":"T26-4","u":"26","q":"Which SQL clause filters rows returned by a SELECT?","o":["ORDER BY","GROUP BY","WHERE","HAVING"],"a":2,"e":"WHERE filters the rows a SELECT returns.","s":"bank","src":"Unit 26 row 5","tp":1},{"id":"T26-6","u":"26","q":"To sort results descending by Date column which clause is used?","o":["ORDER BY Date ASC","ORDER BY Date DESC","SORT BY Date DESC","GROUP BY Date DESC"],"a":1,"e":"ORDER BY Date DESC sorts the results by date in descending order. ASC is ascending.","s":"bank","src":"Unit 26 row 7","tp":1},{"id":"T26-7","u":"26","q":"Which aggregate function returns the number of non-null values?","o":["SUM()","COUNT(column)","COUNT(*)","AVG()"],"a":1,"e":"COUNT(column) counts only the non-null values in that column. COUNT(*) counts all rows.","s":"bank","src":"Unit 26 row 8","tp":1},{"id":"T26-9","u":"26","q":"Which join returns only rows with matching keys in both tables?","o":["LEFT OUTER JOIN","RIGHT OUTER JOIN","FULL OUTER JOIN","INNER JOIN"],"a":3,"e":"An INNER JOIN returns only the rows that have matching keys in both tables.","s":"bank","src":"Unit 26 row 10","tp":1},{"id":"T26-10","u":"26","q":"Which join returns all rows from the left table and matching rows from the right?","o":["INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN","CROSS JOIN"],"a":1,"e":"A LEFT OUTER JOIN returns all rows from the left table, plus any matching rows from the right table.","s":"bank","src":"Unit 26 row 11","tp":1},{"id":"T26-12","u":"26","q":"Which clause limits grouped rows returned by an aggregate?","o":["WHERE","HAVING","ORDER BY","GROUP BY"],"a":1,"e":"HAVING filters groups after GROUP BY. WHERE filters individual rows before grouping.","s":"bank","src":"Unit 26 row 13","tp":1},{"id":"T26-13","u":"26","q":"Which constraint prevents nulls in a column?","o":["UNIQUE","NOT NULL","DEFAULT","CHECK"],"a":1,"e":"A NOT NULL constraint stops a column from containing empty (null) values.","s":"bank","src":"Unit 26 row 14","tp":0},{"id":"T26-14","u":"26","q":"Which index type is best for equality searches on many distinct values?","o":["B-tree","Bitmap","Clustered","Full-text"],"a":0,"e":"B-tree indexes suit equality and range searches on columns with many distinct values.","s":"bank","src":"Unit 26 row 15","tp":1},{"id":"T26-15","u":"26","q":"Which SQL statement quickly removes all rows from a table but keeps the table structure?","o":["DELETE TABLE…","DROP TABLE…","TRUNCATE TABLE…","REMOVE FROM…"],"a":2,"e":"TRUNCATE TABLE quickly removes all rows but keeps the table structure. DROP TABLE removes the table itself.","s":"bank","src":"Unit 26 row 16","tp":1},{"id":"T26-17","u":"26","q":"Which is true about a foreign key?","o":["Uniquely identifies own row","References another table","Enforces uniqueness","Same as composite key"],"a":1,"e":"A foreign key refers to the primary key of another table, which links the two tables.","s":"bank","src":"Unit 26 row 18","tp":0},{"id":"T26-18","u":"26","q":"Which SQL retrieves rows where Salary is between 1000 and 2000?","o":["WHERE Salary > 1000 AND < 2000","WHERE Salary BETWEEN…","WHERE Salary IN…","WHERE Salary LIKE…"],"a":1,"e":"BETWEEN selects values within a range, including both end values.","s":"bank","src":"Unit 26 row 19","tp":1},{"id":"T26-19","u":"26","q":"Which SQL finds rows where Name starts with 'A'?","o":["LIKE 'A%'","LIKE '%A'","LIKE '_A'","LIKE '%A%'"],"a":0,"e":"In LIKE, % matches any characters, so 'A%' finds names starting with A.","s":"bank","src":"Unit 26 row 20","tp":1},{"id":"T26-20","u":"26","q":"Which boolean operator has highest precedence in SQL?","o":["OR","AND","NOT","XOR"],"a":2,"e":"NOT is applied first, then AND, then OR.","s":"bank","src":"Unit 26 row 21","tp":1},{"id":"T26-22","u":"26","q":"Which function returns the length of a string in many SQL dialects?","o":["LEN()","LENGTH()","STRLEN()","SIZE()"],"a":1,"e":"LENGTH() returns the length of a string in many SQL dialects. SQL Server uses LEN().","s":"bank","src":"Unit 26 row 23","tp":1},{"id":"T26-23","u":"26","q":"Which SQL returns the sum of Amount for each Category?","o":["SELECT Category, SUM(Amount) FROM Sales GROUP BY Category","SELECT Category, TOTAL(Amount) FROM Sales GROUP BY Category","SELECT Category, COUNT(Amount) FROM Sales GROUP BY Category","SELECT SUM(Amount) FROM Sales"],"a":0,"e":"SUM(Amount) with GROUP BY Category totals the amount for each category.","s":"bank","src":"Unit 26 row 24","tp":1},{"id":"T26-24","u":"26","q":"What characterizes a correlated subquery?","o":["It runs once, independently of the outer query","It refers to columns of the outer query","It always returns a single value","It cannot use aggregate functions"],"a":1,"e":"A correlated subquery uses values from the outer query, so it runs once for each outer row.","s":"bank","src":"Unit 26 row 25","tp":1},{"id":"T26-25","u":"26","q":"Which subquery form returns multiple rows to be used with IN?","o":["Scalar subquery","Single-row subquery","Multi-row subquery","Correlated scalar subquery"],"a":2,"e":"A multi-row subquery returns several rows, so it is used with IN.","s":"bank","src":"Unit 26 row 26","tp":1},{"id":"T26-28","u":"26","q":"Which T-SQL object encapsulates reusable SQL logic and can accept parameters?","o":["View","Trigger","Stored procedure","Function"],"a":2,"e":"A stored procedure is saved, reusable SQL logic that can accept parameters.","s":"bank","src":"Unit 26 row 29","tp":1},{"id":"T26-29","u":"26","q":"Which database object presents a virtual table built from a query?","o":["Index","View","Procedure","Trigger"],"a":1,"e":"A view is a virtual table built from a query. It stores no data of its own.","s":"bank","src":"Unit 26 row 30","tp":0},{"id":"T26-30","u":"26","q":"Which operation updates existing rows in a table?","o":["INSERT","MODIFY","UPDATE","ALTER"],"a":2,"e":"UPDATE changes existing rows. INSERT adds new rows.","s":"bank","src":"Unit 26 row 31","tp":1},{"id":"T26-31","u":"26","q":"Which SQL checks data before insertion or update and can reject invalid rows?","o":["INDEX","CHECK","PRIMARY KEY","TRIGGER"],"a":1,"e":"A CHECK constraint tests data before it is saved and rejects values that break the rule.","s":"bank","src":"Unit 26 row 32","tp":1},{"id":"T26-32","u":"26","q":"Which mechanism automatically executes on table events like INSERT or UPDATE?","o":["Procedure","Trigger","View","Index"],"a":1,"e":"A trigger runs automatically when an event such as INSERT or UPDATE happens on a table.","s":"bank","src":"Unit 26 row 33","tp":1},{"id":"T26-33","u":"26","q":"Which SQL function extracts year from a date column in many SQL dialects?","o":["YEAR()","EXTRACT()","DATEPART()","All of the above"],"a":3,"e":"Different SQL dialects use YEAR(), EXTRACT() or DATEPART() to get the year from a date.","s":"bank","src":"Unit 26 row 34","tp":1},{"id":"T26-34","u":"26","q":"Which NoSQL type is best for relationships and traversals?","o":["Document","Key-value","Graph","Column-family"],"a":2,"e":"Graph databases store relationships directly, so they are best for following connections.","s":"bank","src":"Unit 26 row 35","tp":0},{"id":"T26-35","u":"26","q":"In normalization, which anomaly is reduced by splitting tables to remove redundancy?","o":["Read","Update","Performance","Connection"],"a":1,"e":"Splitting tables removes repeated data, so a change only has to be made in one place. This prevents update anomalies.","s":"bank","src":"Unit 26 row 36","tp":0},{"id":"T26-36","u":"26","q":"Which constraint prevents a row being inserted when the parent row it refers to does not exist?","o":["PRIMARY KEY","UNIQUE","CHECK","FOREIGN KEY"],"a":3,"e":"A FOREIGN KEY constraint stops a row being added if the parent row it refers to doesn't exist.","s":"bank","src":"Unit 26 row 37","tp":0},{"id":"T26-38","u":"26","q":"Which tool automates rebuilding indexes and updating stats?","o":["Running manual queries only","Scheduled maintenance jobs or scripts","Creating views","Adding more triggers"],"a":1,"e":"Scheduled maintenance jobs or scripts automatically rebuild indexes and update statistics.","s":"bank","src":"Unit 26 row 39","tp":1},{"id":"T26-39","u":"26","q":"Which SQL returns rows where Value is NULL?","o":["WHERE Value = NULL","WHERE Value IS NULL","WHERE NULL = Value","WHERE Value LIKE NULL"],"a":1,"e":"NULL can't be compared with =, so you use IS NULL.","s":"bank","src":"Unit 26 row 40","tp":1},{"id":"T26-40","u":"26","q":"How do you exclude rows with NULL in column Email?","o":["WHERE Email <> NULL","WHERE Email IS NOT NULL","WHERE NOT NULL Email","WHERE Email != NULL"],"a":1,"e":"IS NOT NULL excludes rows where the column is empty (null).","s":"bank","src":"Unit 26 row 41","tp":1},{"id":"T26-41","u":"26","q":"Which statement creates an index to speed lookup on ColumnA?","o":["CREATE INDEX idxA ON TableName(ColumnA)","ADD INDEX idxA TO TableName(ColumnA)","INDEX CREATE idxA TableName(ColumnA)","MAKE INDEX idxA ON TableName(ColumnA)"],"a":0,"e":"CREATE INDEX name ON Table(Column) creates an index to speed up lookups.","s":"bank","src":"Unit 26 row 42","tp":1},{"id":"T26-42","u":"26","q":"Which SQL returns top 10 rows in ANSI-standard form?","o":["SELECT TOP 10 * FROM Table","SELECT * FROM Table LIMIT 10","SELECT FIRST 10 * FROM Table","SELECT * FROM Table FETCH FIRST 10 ROWS ONLY"],"a":3,"e":"FETCH FIRST n ROWS ONLY is the ANSI-standard form. TOP and LIMIT are specific to certain products.","s":"bank","src":"Unit 26 row 43","tp":1},{"id":"T26-43","u":"26","q":"Which is true about ACID in relational DBMS?","o":["Atomicity, Consistency, Isolation, Durability","Accuracy, Consistency, Integrity, Durability","Applies only to NoSQL systems","Is unrelated to transactions"],"a":0,"e":"ACID stands for Atomicity, Consistency, Isolation and Durability, the properties of reliable transactions.","s":"bank","src":"Unit 26 row 44","tp":0},{"id":"T26-44","u":"26","q":"Which SQL operator tests membership in a list of values?","o":["BETWEEN","IN","EXISTS","ANY"],"a":1,"e":"IN tests whether a value is in a list of values.","s":"bank","src":"Unit 26 row 45","tp":1},{"id":"T26-45","u":"26","q":"Which WHERE clause returns rows where the salary is over 500 or the department is HR?","o":["WHERE Salary > 500 OR Department = 'HR'","WHERE Salary > 500 AND Department = 'HR'","WHERE Salary > 500 OR NOT Department = 'HR'","WHERE NOT (Salary > 500 OR Department = 'HR')"],"a":0,"e":"OR returns rows that meet either condition, so this clause returns salaries over 500 as well as everyone in HR.","s":"bank","src":"Unit 26 row 46","tp":1},{"id":"T26-46","u":"26","q":"Which is true about UNION vs UNION ALL?","o":["UNION removes duplicates; UNION ALL retains duplicates","UNION retains duplicates; UNION ALL removes duplicates","Both always remove duplicates","Both always retain duplicates"],"a":0,"e":"UNION removes duplicate rows. UNION ALL keeps them.","s":"bank","src":"Unit 26 row 47","tp":1},{"id":"T26-47","u":"26","q":"Which statement is true about a subquery compared with = in a WHERE clause?","o":["It may return many rows","It must return a single value (one row and one column)","It cannot be used in a WHERE clause","It must always be correlated"],"a":1,"e":"With =, a subquery must return a single value (one row and one column).","s":"bank","src":"Unit 26 row 48","tp":1},{"id":"T26-48","u":"26","q":"Which choice best describes metadata?","o":["Data about data such as table definitions and column types","The actual rows stored in tables","Index entries only","Binary backups of database files"],"a":0,"e":"Metadata is data about data, such as table definitions and column types.","s":"bank","src":"Unit 26 row 49","tp":0},{"id":"T26-49","u":"26","q":"When designing tables, using meaningful names is important because:","o":["It improves performance automatically","It aids maintenance and clarity for developers and DBAs","It replaces the need for comments and documentation","The DBMS requires verbose names"],"a":1,"e":"Meaningful names make tables easier to understand and maintain.","s":"bank","src":"Unit 26 row 50","tp":0},{"id":"T26-50","u":"26","q":"Which SQL statement rolls back a transaction to undo changes?","o":["COMMIT","ROLLBACK","SAVEPOINT","RELEASE"],"a":1,"e":"ROLLBACK undoes the changes made in the current transaction. COMMIT saves them.","s":"bank","src":"Unit 26 row 51","tp":1},{"id":"T26-51","u":"26","q":"Which SQL creates a view named V_Customers showing Name and City?","o":["CREATE VIEW V_Customers AS SELECT Name, City FROM Customers","NEW VIEW V_Customers AS SELECT Name, City FROM Customers","MAKE VIEW V_Customers SELECT Name, City FROM Customers","CREATE V_CUSTOMERS VIEW SELECT Name, City FROM Customers"],"a":0,"e":"CREATE VIEW name AS SELECT … creates a view from a query.","s":"bank","src":"Unit 26 row 52","tp":1},{"id":"T26-52","u":"26","q":"Which storage model is characteristic of column-family NoSQL databases?","o":["Rows stored with all columns together","Columns grouped into families optimized for wide tables and sparse data","Strict fixed schema per row","Only supports key-value pairs with no columns"],"a":1,"e":"Column-family databases group columns into families, which suits wide tables with many empty values.","s":"bank","src":"Unit 26 row 53","tp":0},{"id":"T26-53","u":"26","q":"Which practice helps ensure data consistency and integrity?","o":["Avoiding constraints t
