علومات ذات الصلة بكفاءة.","d":"Methods used to locate relevant information efficiently."},{"t":"Keyword Search","ar":"البحث بالكلمات المفتاحية","ard":"البحث باستخدام كلمات محددة تتعلق بالموضوع.","d":"Searching using specific words related to the topic."},{"t":"Boolean Search","ar":"البحث المنطقي","ard":"طريقة بحث تستخدم عوامل مثل AND و OR و NOT.","d":"A search method using operators such as AND, OR, and NOT."},{"t":"Advanced Search","ar":"البحث المتقدم","ard":"استخدام عوامل التصفية والعوامل المنطقية لتدقيق نتائج البحث.","d":"Using filters and operators to refine search results."},{"t":"Reliable Source","ar":"مصدر موثوق","ard":"مصدر موثوق يقدم معلومات دقيقة وذات مصداقية.","d":"A trusted source that provides accurate and credible information."},{"t":"Quality Assurance (QA)","ar":"ضمان الجودة","ard":"عمليات تُستخدم لضمان استيفاء البرمجيات لمعايير الجودة.","d":"Processes used to ensure software meets quality standards."},{"t":"Software Testing","ar":"اختبار البرمجيات","ard":"عملية تحديد الأخطاء والعيوب في البرمجيات.","d":"The process of identifying errors and defects in software."},{"t":"Software Metrics","ar":"مقاييس البرمجيات","ard":"قياسات تُستخدم لتقييم جودة البرمجيات وأدائها.","d":"Measurements used to assess software quality and performance."},{"t":"Defect","ar":"خلل","ard":"خطأ أو عيب في البرنامج يسبب سلوكًا غير صحيح.","d":"An error or flaw in software that causes incorrect behavior."},{"t":"Validation","ar":"المصادقة (Validation)","ard":"التأكد من أن النظام يلبي متطلبات المستخدم والعمل.","d":"Confirming that a system meets user and business requirements."},{"t":"Verification","ar":"التحقق (Verification)","ard":"التحقق من أن النظام مبني بشكل صحيح وفق المواصفات.","d":"Checking that a system is built correctly according to specifications."},{"t":"Software Development Life Cycle (SDLC)","ar":"دورة حياة تطوير البرمجيات","ard":"عملية منظمة تحدد مراحل تطوير البرمجيات.","d":"A structured process that defines stages of software development."},{"t":"Version Control","ar":"التحكم في الإصدارات","ard":"نظام لتتبع التغييرات على الشيفرة وإدارتها.","d":"A system for tracking and managing changes to code."},{"t":"Configuration Management","ar":"إدارة التكوين","ard":"إدارة التغييرات على مكونات النظام والتحكم فيها.","d":"Managing and controlling changes to system components."},{"t":"Change Management","ar":"إدارة التغيير","ard":"نهج منظم للتعامل مع التغييرات في الأنظمة أو العمليات.","d":"A structured approach to handling changes in systems or processes."},{"t":"Documentation Standards","ar":"معايير التوثيق","ard":"قواعد تضمن أن يكون التوثيق متسقًا وواضحًا واحترافيًا.","d":"Rules that ensure documentation is consistent, clear, and professional."}],"21":[{"t":"Document","ar":"مستند","ard":"سجل مكتوب أو مرسوم أو مطبوع أو إلكتروني يقدّم معلومات أو دليلًا.","d":"A written, drawn, printed, or electronic record that provides information or evidence."},{"t":"Applications","ar":"التطبيقات","ard":"برامج أو أدوات برمجية تتيح للمستخدمين أداء مهام محددة مثل إنشاء المحتوى وتحريره وإدارته.","d":"Programs or software tools that allow users to perform specific tasks such as creating, editing, or managing content."},{"t":"Document Functions","ar":"وظائف  المستند","ard":"الأغراض والمهام التي صُمم المستند لتحقيقها، مثل الإعلام أو التوجيه أو التسجيل.","d":"The purposes and tasks a document is designed to fulfill, such as informing, instructing, or recording."},{"t":"Document Types","ar":"أنواع المستند","ard":"فئات مختلفة من المستندات مثل الأدلة والتقارير وأدلة المستخدم وأوراق المرجع.","d":"Various categories of documents such as manuals, reports, user guides, or reference sheets."},{"t":"Document Formats","ar":"تنسيقات المستندات","ard":"البنية وأنواع الملفات المستخدمة للمستندات، مثل .docx و .pdf و .html.","d":"The structure and file types used for documents, like .docx, .pdf, or .html."},{"t":"Online Help","ar":"المساعدة عبر الإنترنت","ard":"مساعدة أو إرشاد يُقدَّم بوسائل رقمية، وغالبًا ما يكون مدمجًا في البرامج أو المواقع.","d":"Assistance or guidance provided through digital means, often embedded in software or websites."},{"t":"JavaDoc","ar":"جافا دوك / توثيق جافا","ard":"أداة توثيق في جافا تُنشئ توثيق واجهات البرمجة بصيغة HTML من الشيفرة المصدرية.","d":"A documentation tool used in Java to generate API documentation in HTML format from source code."},{"t":"JavaHelp","ar":"نظام المساعدة في جافا","ard":"نظام لتقديم المساعدة عبر الإنترنت لمستخدمي تطبيقات جافا.","d":"A system for presenting online help to users of Java applications."},{"t":"Readability","ar":"قابلية القراءة","ard":"مدى سهولة فهم القارئ للنص المكتوب، ويتأثر بالتنسيق ووضوح اللغة.","d":"The ease with which a reader can understand written text, often influenced by layout and language clarity."},{"t":"Accessibility","ar":"سهولة الوصول","ard":"تصميم المستندات أو الواجهات بحيث يستخدمها الأشخاص بمختلف قدراتهم وإعاقاتهم.","d":"The design of documents or interfaces to be usable by people with various abilities and disabilities."},{"t":"Target Audiences","ar":"الجمهور المستهدف","ard":"المجموعة المحددة من المستخدمين الذين يُوجَّه إليهم المستند أو المنتج.","d":"The specific group of users for whom a document or product is intended."},{"t":"Feedback","ar":"التغذية الراجعة","ard":"تعليقات أو آراء أو اقتراحات تُقدَّم لتقييم مستند أو منتج أو أداء وتحسينه، وتساعد على تحديد نقاط القوة وجوانب التحسين.","d":"Comments, opinions, or suggestions provided to evaluate or improve a document, product, or performance. It helps identify strengths and areas for improvement."},{"t":"Feedback Gathering Techniques","ar":"تقنيات جمع الملاحظات","ard":"أساليب تُستخدم لجمع آراء المستخدمين واقتراحاتهم لتحسين التوثيق أو المنتجات.","d":"Methods used to collect opinions or suggestions from users to improve documentation or products."},{"t":"Workshops","ar":"ورش العمل","ard":"جلسات جماعية تفاعلية تُستخدم لجمع الملاحظات والأفكار بشكل تعاوني.","d":"Interactive group sessions used to gather feedback and ideas collaboratively."},{"t":"Surveys","ar":"الاستبيانات","ard":"نماذج منظمة تُستخدم لجمع ملاحظات الأفراد حول موضوعات محددة.","d":"Structured forms used to collect feedback from individuals on specific topics."},{"t":"Online Forms","ar":"النماذج الإلكترونية","ard":"نماذج رقمية تُستخدم لجمع مدخلات المستخدمين أو تعليقاتهم عبر الويب.","d":"Digital forms used to gather user input or comments through the web."},{"t":"Comments in Documents","ar":"التعليقات في المستندات","ard":"ملاحظات أو حواشٍ تُضاف داخل المستندات لاقتراح تغييرات أو تقديم ملاحظات.","d":"Notes or annotations added within documents to suggest changes or provide feedback."}],"22":[{"t":"Active Listening","ar":"الاستماع النشط","ard":"مهارة تواصل حيث يستمع المدرب باهتمام ويظهر الفهم ويستجيب بشكل مناسب للمتعلم.","d":"A communication skill where the instructor listens carefully, shows understanding, and responds appropriately to the learner."},{"t":"Agenda","ar":"جدول الأعمال","ard":"قائمة مختصرة بالمواضيع المجدولة لجلسة التدريب ومشاركتها مع المتعلمين مسبقًا.","d":"A brief schedule or list of topics planned for the instruction session, shared with learners in advance."},{"t":"Animation","ar":"الحركة","ard":"تأثير بصري في العروض التقديمية حيث يظهر النص أو الصور ويتحرك أو يتغير لجذب انتباه المتعلم.","d":"A visual effect in slideshow presentations where text or images appear, move, or change to attract learner attention."},{"t":"Documentation","ar":"الوثائق","ard":"مواد تعليمية مكتوبة أو رقمية مثل الأدلة الإرشادية أو أوراق المراجعة السريعة أو الأسئلة الشائعة لمساعدة المتعلمين على الفهم والمراجعة.","d":"Written or digital instructional materials like user guides, quick reference sheets, or FAQs that help learners understand and review content."},{"t":"Embedded Audio/Video","ar":"الصوت/الفيديو المدمج","ard":"ملفات وسائط متعددة يتم إدراجها مباشرة في الشريحة لتحسين شرح النقاط الرئيسية.","d":"Multimedia files inserted directly into a presentation slide to enhance the explanation of key points."},{"t":"Feedback Form","ar":"نموذج الملاحظات","ard":"استبيان يملؤه المتعلمون بعد الجلسة لتقديم آرائهم حول التدريب المقدم.","d":"A document or survey completed by learners after a session to provide their opinions on the instruction received."},{"t":"Instruction Plan","ar":"خطة التدريب","ard":"دليل تفصيلي يُعدّه المدرب يوضح الأهداف والمحتوى والموارد والتوقيتات لجلسة التدريب.","d":"A detailed guide prepared by the instructor showing the objectives, content, resources, and timings of a training session."},{"t":"Learner Needs Assessment","ar":"تقييم احتياجات المتعلم","ard":"عملية تحديد ما يريد المتعلم تحقيقه ومستوى مهاراته الحالي وأسلوب التعلم المفضل قبل بدء الجلسة.","d":"The process of identifying what the learner wants to achieve, their current skill level, and preferred learning style before the session starts."},{"t":"On-site Instruction","ar":"التدريب في الموقع","ard":"تقديم جلسة التدريب وجهًا لوجه في موقع المتعلم أو في قاعة تدريبية.","d":"Delivering the training session face-to-face at the learner's location or a classroom setting."},{"t":"Online Instruction","ar":"التدريب عبر الإنترنت","ard":"تقديم الجلسة عن بُعد باستخدام أدوات الاجتماعات الافتراضية مثل زووم أو تيمز.","d":"Conducting the training session remotely using video conferencing tools like Zoom or Teams."},{"t":"Personalization","ar":"التخصيص","ard":"تعديل طرق ومواد وسرعة التعليم لتناسب احتياجات وتفضيلات المتعلم الفردية.","d":"Adapting instructional methods, materials, and pace to suit the individual learner’s preferences and needs."},{"t":"Quick Reference Guide","ar":"دليل المرجع السريع","ard":"مستند مختصر وبسيط يبرز الخطوات الرئيسية أو الأوامر لإكمال مهمة معينة، وغالبًا يكون سهل الوصول.","d":"A short and simple document highlighting key steps or commands for completing a task, often formatted for fast access."},{"t":"Session Documentation","ar":"توثيق الجلسة","ard":"سجلات يحتفظ بها المدرب بعد الجلسة، تشمل الحضور، المواضيع المغطاة، تقدم المتعلم، وأي إحالات إضافية.","d":"Records maintained by the instructor after the session, including attendance, topics covered, learner progress, and any referrals."},{"t":"Slideshow","ar":"عرض شرائح","ard":"أداة تقديمية (مثل باوربوينت أو جوجل سلايدز) تُستخدم أثناء التدريب لعرض النقاط الرئيسية والصور والفيديوهات والحركات.","d":"A presentation tool (like PowerPoint or Google Slides) used during instruction to display key points, images, videos, and animations."},{"t":"Telephone Support","ar":"الدعم عبر الهاتف","ard":"تقديم المساعدة والإجابة على استفسارات المتعلم عبر الهاتف، وغالبًا للمساعدة السريعة والمركزة.","d":"Providing help and answering learner questions over the phone, usually for short, focused assistance."},{"t":"Transition (in slideshows)","ar":"الانتقال","ard":"التأثير البصري المستخدم عند الانتقال من شريحة إلى أخرى أثناء العرض التقديمي.","d":"The visual effect used when moving from one slide to the next during a presentation."},{"t":"User Interface (UI)","ar":"واجهة المستخدم","ard":"الجزء من البرنامج الذي يتفاعل معه المتعلم، بما في ذلك الأزرار والقوائم والشاشات.","d":"The part of a software program that the learner interacts with, including buttons, menus, and screens."},{"t":"Email Support","ar":"الدعم عبر البريد الإلكتروني","ard":"تقديم الدعم المكتوب والإرشادات اللاحقة للمتعلمين من خلال التواصل عبر البريد الإلكتروني.","d":"Providing written support and follow-up guidance to learners through email communication."},{"t":"Q&A (Questions and Answers)","ar":"الأسئلة والأجوبة","ard":"طريقة تعليمية يتم فيها تشجيع المتعلمين على طرح الأسئلة أثناء أو بعد الجلسة لتوضيح الشكوك.","d":"An instructional method where learners are encouraged to ask questions during or after a session to clarify doubts."}],"23":[{"t":"Constructs","ar":"التراكيب البرمجية","ard":"البنى والعناصر الأساسية المستخدمة في البرمجة، مثل الشروط والحلقات وأوامر التحكم، التي تحدد طريقة عمل البرنامج.","d":"The fundamental structures and elements used in programming, such as conditions, loops, and control statements, that define how a program operates."},{"t":"If Then Else","ar":"إذا ثم وإلا","ard":"بنية لاتخاذ القرار تنفّذ كتلًا مختلفة من الشيفرة بحسب كون الشرط صحيحًا أو خاطئًا.","d":"A decision-making structure in programming that executes different code blocks depending on whether a condition is true or false."},{"t":"CASE","ar":"عبارة الحالة","ard":"بنية اختيار تختار من بين عدة خيارات بناءً على قيمة متغير أو تعبير.","d":"A selection structure that chooses from multiple options based on the value of a variable or expression."},{"t":"While Do","ar":"طالما افعل","ard":"حلقة تستمر في تنفيذ كتلة من الشيفرة ما دام الشرط صحيحًا.","d":"A loop that continues to execute a block of code as long as a given condition is true."},{"t":"Repeat Until","ar":"كرر حتى","ard":"حلقة تنفّذ كتلة من الشيفرة بشكل متكرر حتى يصبح الشرط صحيحًا.","d":"A loop that executes a block of code repeatedly until a certain condition becomes true."},{"t":"Service Oriented","ar":"موجه نحو الخدمة","ard":"أسلوب برمجي تُبنى فيه التطبيقات كمجموعة من الخدمات التي تتواصل فيما بينها.","d":"A programming approach where applications are built as a set of services that communicate with each other."},{"t":"Time Driven","ar":"موجه بالوقت","ard":"أسلوب برمجي يطلق الإجراءات على فترات زمنية أو جداول محددة.","d":"A programming method that triggers actions at specific time intervals or schedules."},{"t":"Event Handlers","ar":"معالجات الأحداث","ard":"دوال أو أساليب في البرنامج تستجيب لأفعال محددة من المستخدم أو لأحداث يولّدها النظام.","d":"Functions or methods in a program that respond to specific user actions or system-generated events."},{"t":"Trigger Functions","ar":"دوال التشغيل","ard":"دوال تُنفَّذ تلقائيًا استجابةً لأحداث أو شروط محددة.","d":"Functions that are automatically executed in response to specific events or conditions."},{"t":"Mouse Event","ar":"حدث الفأرة","ard":"فعل ناتج عن نشاط الفأرة، مثل النقر أو التحريك أو التمرير.","d":"An action caused by mouse activity, such as clicking, moving, or scrolling."},{"t":"Keyboard Event","ar":"حدث لوحة المفاتيح","ard":"فعل ينتج عن ضغط مفاتيح لوحة المفاتيح أو تحريرها.","d":"An action triggered by pressing or releasing keys on the keyboard."},{"t":"HTML Object Event","ar":"حدث كائن HTML","ard":"حدث ينتج عن أفعال على عناصر HTML في صفحة الويب.","d":"An event triggered by actions on HTML elements in a web page."},{"t":"Form Event","ar":"حدث النموذج","ard":"فعل ينتج عن تفاعل المستخدم مع نموذج، مثل إرساله أو إعادة تعيينه.","d":"An action triggered when a user interacts with a form, such as submitting or resetting it."},{"t":"User Interface Event","ar":"حدث واجهة المستخدم","ard":"حدث يقع عندما يتفاعل المستخدم مع العناصر المرئية للتطبيق.","d":"An event that occurs when a user interacts with visual elements of an application."},{"t":"Event Loop","ar":"حلقة الأحداث","ard":"بنية برمجية تتحقق باستمرار من الأحداث وتعالجها في البرنامج.","d":"A programming construct that continuously checks for and processes events in a program."},{"t":"Flexibility","ar":"المرونة","ard":"قدرة الأسلوب البرمجي على التكيّف مع المواقف أو المتطلبات المختلفة.","d":"The ability of a programming method to adapt to different situations or requirements."},{"t":"Suitability for Graphical Interfaces","ar":"الملاءمة للواجهات الرسومية","ard":"مدى دعم الأسلوب البرمجي لإنشاء الواجهات الرسومية وإدارتها.","d":"How well a programming method supports the creation and management of graphical user interfaces."},{"t":"Simplicity of Programming","ar":"بساطة البرمجة","ard":"سهولة كتابة البرامج وفهمها.","d":"The ease with which programs can be written and understood."},{"t":"Ease of Development","ar":"سهولة التطوير","ard":"مدى سرعة وكفاءة إنشاء البرامج باستخدام أسلوب معين.","d":"How quickly and efficiently programs can be created using a given method."},{"t":"Discrete","ar":"منفصل","ard":"خاصية في البرمجة كائنية التوجه تكون فيها الكائنات وحدات متميزة ومستقلة.","d":"A characteristic of object-oriented programming where objects are distinct and independent units."},{"t":"Reusable Units","ar":"وحدات قابلة لإعادة الاستخدام","ard":"مكونات أو أجزاء من الشيفرة يمكن استخدامها في عدة برامج دون تعديل.","d":"Components or code segments that can be used in multiple programs without modification."},{"t":"Identification of Objects","ar":"تحديد الكائنات","ard":"عملية التعرف على الكائنات وتعريفها داخل النظام.","d":"The process of recognizing and defining objects within a system."},{"t":"Data Abstraction","ar":"تجريد البيانات","ard":"إخفاء تفاصيل التنفيذ المعقدة مع إظهار الخصائص الضرورية فقط للكائن.","d":"Hiding complex implementation details while showing only the necessary features of an object."},{"t":"Modularity","ar":"الوحداتية","ard":"تقسيم البرنامج إلى وحدات منفصلة ومستقلة.","d":"The practice of dividing a program into separate, independent modules."},{"t":"Classification","ar":"التصنيف","ard":"تجميع الكائنات بناءً على خصائص مشتركة.","d":"Grouping objects based on shared characteristics."},{"t":"Inheritance","ar":"الوراثة","ard":"آلية يكتسب فيها صنف خصائص صنف آخر وسلوكه.","d":"A mechanism where one class can acquire properties and behaviors from another class."},{"t":"Classes","ar":"الفئات","ard":"قوالب لإنشاء الكائنات في البرمجة كائنية التوجه.","d":"Blueprints for creating objects in object-oriented programming."},{"t":"Methods","ar":"الأساليب (الدوال الأعضاء)","ard":"دوال معرّفة داخل الفئات تصف سلوك الكائن.","d":"Functions defined inside classes that describe the behavior of an object."},{"t":"Message Passing","ar":"تمرير الرسائل","ard":"تواصل الكائنات فيما بينها بإرسال المعلومات واستقبالها.","d":"The process of objects communicating with each other by sending and receiving information."},{"t":"Procedures","ar":"الإجراءات","ard":"كتل من الشيفرة تؤدي مهام محددة دون إرجاع قيمة.","d":"Blocks of code that perform specific tasks without returning a value."},{"t":"Functions","ar":"الدوال","ard":"كتل من الشيفرة تؤدي مهام محددة وترجع قيمة.","d":"Blocks of code that perform specific tasks and return a value."},{"t":"Pre-defined Functions","ar":"الدوال المعرفة مسبقاً","ard":"دوال مدمجة توفرها لغة البرمجة.","d":"Built-in functions provided by a programming language."},{"t":"Local Variables","ar":"المتغيرات المحلية","ard":"متغيرات لا يمكن الوصول إليها إلا داخل الدالة أو الكتلة التي عُرّفت فيها.","d":"Variables that can only be accessed within the function or block where they are defined."},{"t":"Global Variables","ar":"المتغيرات العامة","ard":"متغيرات يمكن الوصول إليها من أي مكان في البرنامج.","d":"Variables that can be accessed from anywhere in the program."},{"t":"Parameter Passing","ar":"تمرير المعاملات","ard":"إرسال البيانات إلى الدوال أو الإجراءات عند استدعائها.","d":"Sending data to functions or procedures when they are called."},{"t":"Fixed Loop","ar":"الحلقة الثابتة","ard":"حلقة تعمل عددًا محددًا من المرات.","d":"A loop that runs a set number of times."},{"t":"Pre-check Loop","ar":"حلقة التحقق المسبق","ard":"حلقة تتحقق من الشرط قبل تنفيذ كتلة الشيفرة.","d":"A loop that checks the condition before executing the code block."},{"t":"Post-check Loop","ar":"حلقة التحقق اللاحق","ard":"حلقة تنفّذ كتلة الشيفرة أولًا ثم تتحقق من الشرط.","d":"A loop that executes the code block first and then checks the condition."},{"t":"Break-points","ar":"نقاط التوقف","ard":"علامات في الشيفرة تُستخدم لإيقاف التنفيذ مؤقتًا لأغراض تصحيح الأخطاء.","d":"Markers in code used to pause execution for debugging purposes."},{"t":"Conditional Commands","ar":"الأوامر الشرطية","ard":"أوامر تنفّذ إجراءات بناءً على كون الشرط صحيحًا أو خاطئًا.","d":"Commands that execute actions based on whether a condition is true or false."},{"t":"Boolean Operators","ar":"العوامل المنطقية","ard":"عوامل منطقية (AND و OR و NOT) تُستخدم لدمج الشروط أو تعديلها في البرمجة.","d":"Logical operators (AND, OR, NOT) used to combine or modify conditions in programming."}],"24":[{"t":"Software library","d":"A collection of pre-written, reusable code (classes and methods) that programs can use.","ar":"مكتبة البرمجيات","ard":"مجموعة من الشيفرات المكتوبة مسبقًا والقابلة لإعادة الاستخدام (فئات ودوال) يمكن للبرامج استخدامها."},{"t":"Software component","d":"A self-contained, reusable part of software with a defined function and interface.","ar":"المكوّن البرمجي","ard":"جزء برمجي مستقل وقابل لإعادة الاستخدام له وظيفة وواجهة محددتان."},{"t":"Reusable component","d":"A component that has been tested and can be used again in other projects.","ar":"المكوّن القابل لإعادة الاستخدام","ard":"مكوّن تم اختباره ويمكن استخدامه مرة أخرى في مشاريع أخرى."},{"t":"API (Application Programming Interface)","d":"A set of classes, methods and rules that lets programs use the features of a library or system.","ar":"واجهة برمجة التطبيقات","ard":"مجموعة من الفئات والدوال والقواعد تتيح للبرامج استخدام خصائص مكتبة أو نظام."},{"t":"Java API","d":"The standard library of ready-made Java classes supplied with the JDK.","ar":"واجهة برمجة جافا","ard":"المكتبة القياسية من فئات جافا الجاهزة المرفقة مع حزمة JDK."},{"t":"Package","d":"A named group of related Java classes, such as java.util.","ar":"الحزمة","ard":"مجموعة مسماة من فئات جافا المترابطة، مثل java.util."},{"t":"import statement","d":"A Java statement that makes classes from a package available in a program.","ar":"عبارة الاستيراد","ard":"عبارة في جافا تجعل فئات حزمة معينة متاحة داخل البرنامج."},{"t":"JAR (Java ARchive)","d":"A compressed file that packages compiled Java classes and resources, often used to distribute libraries.","ar":"ملف أرشيف جافا","ard":"ملف مضغوط يجمع فئات جافا المترجمة والموارد، ويُستخدم غالبًا لتوزيع المكتبات."},{"t":"Editor","d":"A tool used to write and modify source code.","ar":"المحرر","ard":"أداة تُستخدم لكتابة الشيفرة المصدرية وتعديلها."},{"t":"Compiler (javac)","d":"Translates Java source code (.java) into byte code (.class).","ar":"المترجم","ard":"يترجم شيفرة جافا المصدرية (.java) إلى شيفرة بايتية (.class)."},{"t":"Interpreter / JVM","d":"Runs Java byte code on the target machine.","ar":"المفسّر / آلة جافا الافتراضية","ard":"يشغّل شيفرة جافا البايتية على الجهاز الهدف."},{"t":"JDK (Java Development Kit)","d":"The package of tools needed to develop Java programs, including the compiler and debugger.","ar":"حزمة تطوير جافا","ard":"حزمة الأدوات اللازمة لتطوير برامج جافا، وتشمل المترجم ومصحح الأخطاء."},{"t":"IDE (Integrated Development Environment)","d":"Software that combines an editor, compiler, debugger and build tools in one place.","ar":"بيئة التطوير المتكاملة","ard":"برنامج يجمع المحرر والمترجم ومصحح الأخطاء وأدوات البناء في مكان واحد."},{"t":"Byte code","d":"Platform-independent intermediate code produced by the Java compiler and run by the JVM.","ar":"الشيفرة البايتية","ard":"شيفرة وسيطة مستقلة عن المنصة يُنتجها مترجم جافا وتشغّلها آلة جافا الافتراضية."},{"t":"Design pattern","d":"A proven, reusable solution to a common software design problem, such as Singleton or Observer.","ar":"نمط التصميم","ard":"حل مجرَّب وقابل لإعادة الاستخدام لمشكلة شائعة في تصميم البرمجيات، مثل Singleton أو Observer."},{"t":"Framework","d":"A reusable application skeleton that calls your code, such as Spring.","ar":"إطار العمل","ard":"هيكل تطبيق قابل لإعادة الاستخدام يستدعي الشيفرة التي تكتبها، مثل Spring."},{"t":"Idiom","d":"A common, recognized way of writing a small piece of code in a particular language.","ar":"التعبير البرمجي المألوف","ard":"طريقة شائعة ومعروفة لكتابة جزء صغير من الشيفرة بلغة برمجة معينة."},{"t":"Repository","d":"A central store for code and components, such as a Git repository or Maven Central.","ar":"المستودع","ard":"مخزن مركزي للشيفرة والمكونات، مثل مستودع Git أو Maven Central."},{"t":"Maven","d":"A build tool that manages a Java project and downloads its library dependencies.","ar":"مافن","ard":"أداة بناء تدير مشروع جافا وتنزّل المكتبات التي يعتمد عليها."},{"t":"Git","d":"A version control system that tracks changes to code and supports teamwork.","ar":"جِت","ard":"نظام للتحكم في الإصدارات يتتبع التغييرات على الشيفرة ويدعم العمل الجماعي."},{"t":"Dependency","d":"An external library or component that a project needs in order to work.","ar":"الاعتمادية","ard":"مكتبة أو مكوّن خارجي يحتاجه المشروع ليعمل."},{"t":"Software metrics","d":"Measurements used to evaluate code and components, such as size, complexity and defects.","ar":"مقاييس البرمجيات","ard":"قياسات تُستخدم لتقييم الشيفرة والمكونات، مثل الحجم والتعقيد والعيوب."},{"t":"Lines of code (LOC)","d":"A size metric that counts the lines in a program.","ar":"عدد أسطر الشيفرة","ard":"مقياس للحجم يحسب عدد الأسطر في البرنامج."},{"t":"Code coverage","d":"The percentage of code executed by the tests.","ar":"تغطية الشيفرة","ard":"نسبة الشيفرة التي تُنفَّذ أثناء الاختبارات."},{"t":"Cyclomatic complexity","d":"The number of independent paths through a piece of code.","ar":"التعقيد الدوري","ard":"عدد المسارات المستقلة عبر جزء من الشيفرة."},{"t":"Software license","d":"The legal terms that state how a component may be used, changed and shared.","ar":"ترخيص البرمجيات","ard":"الشروط القانونية التي تحدد كيفية استخدام المكوّن وتعديله ومشاركته."},{"t":"Open-source license","d":"A license that allows the source code to be used, studied, changed and shared.","ar":"ترخيص المصدر المفتوح","ard":"ترخيص يسمح باستخدام الشيفرة المصدرية ودراستها وتعديلها ومشاركتها."},{"t":"Agile","d":"A development methodology that delivers software in short iterations with regular feedback.","ar":"المنهجية الرشيقة (Agile)","ard":"منهجية تطوير تسلّم البرمجيات على دفعات قصيرة مع ملاحظات منتظمة."},{"t":"Waterfall","d":"A development methodology in which each stage is completed before the next begins.","ar":"منهجية الشلال","ard":"منهجية تطوير تُكمَل فيها كل مرحلة قبل بدء المرحلة التالية."}],"25":[{"t":"Debugging","d":"Finding, analyzing and fixing errors in a program.","ar":"تصحيح الأخطاء","ard":"العثور على الأخطاء في البرنامج وتحليلها وإصلاحها."},{"t":"Bug / Defect","d":"A flaw in the code that causes incorrect behavior.","ar":"الخلل / العيب","ard":"عيب في الشيفرة يسبب سلوكًا غير صحيح."},{"t":"Failure","d":"When the software does not do what is expected while running.","ar":"الإخفاق","ard":"عندما لا يؤدي البرنامج ما هو متوقع منه أثناء التشغيل."},{"t":"Logging","d":"Recording events and messages while a program runs.","ar":"التسجيل","ard":"تسجيل الأحداث والرسائل أثناء تشغيل البرنامج."},{"t":"Logging framework","d":"A library that manages log messages and levels, such as Log4j or java.util.logging.","ar":"إطار التسجيل","ard":"مكتبة تدير رسائل السجل ومستوياتها، مثل Log4j أو java.util.logging."},{"t":"Log level","d":"The importance of a log message, such as DEBUG, INFO, WARN or ERROR.","ar":"مستوى السجل","ard":"درجة أهمية رسالة السجل، مثل DEBUG أو INFO أو WARN أو ERROR."},{"t":"Event log","d":"A file or record of events that happened in an application or operating system.","ar":"سجل الأحداث","ard":"ملف أو سجل للأحداث التي وقعت في التطبيق أو نظام التشغيل."},{"t":"Tracing","d":"A specialized use of logging that records detailed information about a program's execution.","ar":"التتبّع","ard":"استخدام متخصص للتسجيل يسجّل معلومات مفصلة عن تنفيذ البرنامج."},{"t":"Breakpoint","d":"A marker that pauses execution at a chosen line so the program can be inspected.","ar":"نقطة التوقف","ard":"علامة توقف التنفيذ مؤقتًا عند سطر محدد لفحص البرنامج."},{"t":"Step into / Step over","d":"Debugger commands that run code one line at a time, entering or skipping method calls.","ar":"الدخول إلى / تخطي الخطوة","ard":"أوامر في مصحح الأخطاء تنفّذ الشيفرة سطرًا بسطر، مع الدخول إلى استدعاءات الدوال أو تخطيها."},{"t":"Watch","d":"A debugger feature that shows the value of a variable while the program runs.","ar":"المراقبة","ard":"ميزة في مصحح الأخطاء تعرض قيمة المتغير أثناء تشغيل البرنامج."},{"t":"Stack trace","d":"A list of the method calls that led to an error.","ar":"تتبع المكدس","ard":"قائمة باستدعاءات الدوال التي أدت إلى حدوث الخطأ."},{"t":"Unit testing","d":"Testing a single unit, such as a method or class, on its own.","ar":"اختبار الوحدة","ard":"اختبار وحدة واحدة، مثل دالة أو صنف، بشكل منفصل."},{"t":"Integration testing","d":"Testing the interfaces between components as they are combined.","ar":"اختبار التكامل","ard":"اختبار الواجهات بين المكونات عند دمجها."},{"t":"System testing","d":"Testing the complete, integrated system against its requirements.","ar":"اختبار النظام","ard":"اختبار النظام الكامل المتكامل مقابل متطلباته."},{"t":"Acceptance testing (UAT)","d":"Testing by users or the client to confirm the system meets their needs.","ar":"اختبار القبول","ard":"اختبار يجريه المستخدمون أو العميل للتأكد من أن النظام يلبي احتياجاتهم."},{"t":"Alpha testing","d":"Internal acceptance testing done in-house before release.","ar":"اختبار ألفا","ard":"اختبار قبول داخلي يُجرى داخل المؤسسة قبل الإصدار."},{"t":"Beta testing","d":"Testing by a group of external users before the final release.","ar":"اختبار بيتا","ard":"اختبار تجريه مجموعة من المستخدمين الخارجيين قبل الإصدار النهائي."},{"t":"Regression testing","d":"Re-running tests after changes to make sure nothing that worked before is broken.","ar":"اختبار الانحدار","ard":"إعادة تشغيل الاختبارات بعد التغييرات للتأكد من عدم تعطل ما كان يعمل سابقًا."},{"t":"Static testing","d":"Checking code or documents without running the program, such as reviews.","ar":"الاختبار الساكن","ard":"فحص الشيفرة أو المستندات دون تشغيل البرنامج، مثل المراجعات."},{"t":"Black-box testing","d":"Testing functionality without knowledge of the internal code.","ar":"اختبار الصندوق الأسود","ard":"اختبار الوظائف دون معرفة الشيفرة الداخلية."},{"t":"White-box testing","d":"Testing based on knowledge of the internal code and its paths.","ar":"اختبار الصندوق الأبيض","ard":"اختبار يعتمد على معرفة الشيفرة الداخلية ومساراتها."},{"t":"Test case","d":"A set of inputs, steps and expected results used to check one feature.","ar":"حالة الاختبار","ard":"مجموعة من المدخلات والخطوات والنتائج المتوقعة تُستخدم لفحص ميزة واحدة."},{"t":"Test plan","d":"A document that sets out the scope, approach, resources and schedule of testing.","ar":"خطة الاختبار","ard":"مستند يحدد نطاق الاختبار وأسلوبه وموارده وجدوله الزمني."},{"t":"Test fixture","d":"A fixed, known set of data or files used so that tests are repeatable.","ar":"تجهيزات الاختبار","ard":"مجموعة ثابتة ومعروفة من البيانات أو الملفات تُستخدم لجعل الاختبارات قابلة للتكرار."},{"t":"Stub","d":"A simple stand-in for a lower-level module that is not built yet (top-down testing).","ar":"البديل المؤقت (Stub)","ard":"بديل بسيط لوحدة في مستوى أدنى لم تُبنَ بعد (الاختبار من الأعلى إلى الأسفل)."},{"t":"Driver","d":"Code that calls a module under test when the higher-level module is not built yet (bottom-up testing).","ar":"المشغّل (Driver)","ard":"شيفرة تستدعي الوحدة المختبرة عندما لا تكون الوحدة الأعلى مبنية بعد (الاختبار من الأسفل إلى الأعلى)."},{"t":"Mock object","d":"A simulated object that copies the behavior of a real object for testing.","ar":"الكائن المحاكي","ard":"كائن محاكى يقلّد سلوك كائن حقيقي لأغراض الاختبار."},{"t":"Verification","d":"Checking that the product is built right, according to its specification.","ar":"التحقق (Verification)","ard":"التأكد من أن المنتج مبني بشكل صحيح وفق مواصفاته."},{"t":"Validation","d":"Checking that the right product is built, one that meets the user's needs.","ar":"المصادقة (Validation)","ard":"التأكد من بناء المنتج الصحيح الذي يلبي احتياجات المستخدم."},{"t":"Profiler","d":"A tool that measures CPU, memory and response time while a program runs, such as VisualVM.","ar":"أداة تحليل الأداء","ard":"أداة تقيس استخدام المعالج والذاكرة وزمن الاستجابة أثناء تشغيل البرنامج، مثل VisualVM."},{"t":"JUnit","d":"A widely used unit-testing framework for Java.","ar":"جي يونت (JUnit)","ard":"إطار عمل شائع لاختبار الوحدات في جافا."}],"26":[{"t":"Relational Database","ar":"قاعدة بيانات علائقية","ard":"نوع من قواعد البيانات يخزن البيانات في جداول تربطها علاقات.","d":"A type of database that stores data in tables connected by relationships."},{"t":"Table","ar":"جدول","ard":"بنية تحفظ البيانات في صفوف وأعمدة داخل قاعدة البيانات.","d":"A structure that holds data in rows and columns in a database."},{"t":"Primary Key","ar":"المفتاح الأساسي","ard":"عمود (أو مجموعة أعمدة) يحدد كل سجل في الجدول بشكل فريد.","d":"A column (or group of columns) that uniquely identifies each record in a table."},{"t":"Foreign Key","ar":"المفتاح الخارجي","ard":"عمود ينشئ رابطًا بين جدولين بالإشارة إلى المفتاح الأساسي لجدول آخر.","d":"A column that creates a link between two tables by referring to the primary key of another table."},{"t":"SQL (Structured Query Language)","ar":"لغة الاستعلامات البنيوية","ard":"لغة قياسية تُستخدم لتخزين البيانات ومعالجتها واسترجاعها في قاعدة البيانات العلائقية.","d":"A standard language used to store, manipulate, and retrieve data in a relational database."},{"t":"SELECT Statement","ar":"أمر الاستعلام","ard":"أمر في SQL يُستخدم لاسترجاع البيانات من قاعدة البيانات.","d":"An SQL command used to retrieve data from a database."},{"t":"WHERE Clause","ar":"شرط WHERE","ard":"جزء من استعلام SQL يُستخدم لتصفية النتائج وفق معايير محددة.","d":"A part of an SQL query used to filter results based on specific criteria."},{"t":"ORDER BY Clause","ar":"ترتيب النتائج","ard":"عبارة في SQL تُستخدم لترتيب نتائج الاستعلام تصاعديًا أو تنازليًا.","d":"An SQL clause used to sort query results in ascending or descending order."},{"t":"DISTINCT Keyword","ar":"الكلمة المفتاحية DISTINCT","ard":"تحذف الصفوف المكررة من نتائج الاستعلام.","d":"Removes duplicate rows from query results."},{"t":"Aggregate Functions","ar":"الدوال التجميعية","ard":"دوال في SQL مثل SUM و COUNT و AVG و MAX و MIN تعالج عدة صفوف من البيانات.","d":"SQL functions like SUM, COUNT, AVG, MAX, and MIN that process multiple rows of data."},{"t":"JOIN","ar":"الربط","ard":"يدمج صفوفًا من جدولين أو أكثر بناءً على عمود مشترك بينها.","d":"Combines rows from two or more tables based on a related column."},{"t":"INNER JOIN","ar":"الربط الداخلي","ard":"يعيد السجلات التي لها قيم متطابقة في كلا الجدولين.","d":"Returns records that have matching values in both tables."},{"t":"OUTER JOIN","ar":"الربط الخارجي","ard":"يعيد جميع السجلات من أحد الجدولين والسجلات المطابقة من الجدول الآخر.","d":"Returns all records from one table and matched records from another."},{"t":"Subquery","ar":"استعلام فرعي","ard":"استعلام داخل استعلام آخر لتحسين النتائج وتدقيقها.","d":"A query within another query to refine the results."},{"t":"View","ar":"العرض","ard":"جدول افتراضي يُنشأ من استعلام SQL، ويُستخدم لتبسيط الاستعلامات المعقدة.","d":"A virtual table created by an SQL query, used to simplify complex queries."},{"t":"Stored Procedure","ar":"الإجراء المخزن","ard":"مجموعة محفوظة من أوامر SQL تؤدي مهمة معينة عند تنفيذها.","d":"A saved collection of SQL statements that perform a task when executed."},{"t":"Trigger","ar":"المشغل","ard":"آلية في قاعدة البيانات تنفّذ إجراءات تلقائيًا عند وقوع حدث معين.","d":"A database mechanism that automatically executes actions when a specific event occurs."},{"t":"Data Definition","ar":"تعريف البيانات","ard":"عملية تعريف بنى قاعدة البيانات مثل الجداول والأعمدة والمفاتيح.","d":"The process of defining database structures such as tables, columns, and keys."},{"t":"Data Manipulation","ar":"معالجة البيانات","ard":"عملية إدخال البيانات أو تحديثها أو حذفها أو استرجاعها من قاعدة البيانات.","d":"The process of inserting, updating, deleting, or retrieving data from the database."},{"t":"Database Administration","ar":"إدارة قاعدة البيانات","ard":"المهام المتعلقة بإدارة قاعدة البيانات، مثل إدارة المستخدمين والنسخ الاحتياطي ومراقبة الأداء.","d":"The tasks involved in managing a database, such as user management, backups, and monitoring performance."},{"t":"Security","ar":"الأمان","ard":"حماية قاعدة البيانات من الوصول غير المصرّح به وضمان سرية البيانات.","d":"Protecting the database from unauthorized access and ensuring data confidentiality."},{"t":"Metadata","ar":"البيانات الوصفية","ard":"بيانات تصف بنية قاعدة البيانات وخصائصها، مثل أسماء الجداول وأنواع البيانات والقيود.","d":"Data that describes the structure and properties of the database, such as table names, data types, and constraints."},{"t":"Identifier","ar":"المعرف","ard":"الاسم المعطى لكائنات قاعدة البيانات مثل الجداول أو الأعمدة أو الفهارس.","d":"The name given to database objects such as tables, columns, or indexes."},{"t":"Normalization","ar":"التطبيع","ard":"تنظيم البيانات لتقليل التكرار وتحسين سلامة البيانات.","d":"Organizing data to minimize redundancy and improve data integrity."},{"t":"UML (Unified Modeling Language)","ar":"لغة النمذجة الموحدة","ard":"لغة مرئية موحدة لنمذجة بنى قواعد البيانات والعلاقات بينها.","d":"A standardized visual language for modeling database structures and relationships."},{"t":"Class Diagram","ar":"مخطط الفئات","ard":"مخطط في UML يوضح جداول قاعدة البيانات (الفئات) والعلاقات بينها.","d":"A UML diagram that shows database tables (classes) and their relationships."},{"t":"Data Types","ar":"أنواع البيانات","ard":"نوع البيانات الذي يمكن تخزينه في العمود، مثل النصوص أو الأرقام أو التواريخ.","d":"The kind of data that can be stored in a column, such as text, numbers, or dates."},{"t":"Query","ar":"استعلام","ard":"طلب لاسترجاع البيانات من قاعدة البيانات أو معالجتها باستخدام SQL.","d":"A request to retrieve or manipulate data from the database using SQL."},{"t":"Database Management System (DBMS)","ar":"نظام إدارة قواعد البيانات","ard":"برنامج يُستخدم لتخزين البيانات واسترجاعها وإدارتها بطريقة منظمة.","d":"Software used to store, retrieve, and manage data in a structured way."},{"t":"Transaction","ar":"العملية","ard":"سلسلة من عمليات قاعدة البيانات تُعامَل كوحدة عمل منطقية واحدة.","d":"A sequence of database operations that are treated as a single logical unit of work."}],"27":[{"t":"Data-driven applications","ar":"التطبيقات القائمة على البيانات","ard":"تطبيقات تعتمد على البيانات في عملها، مثل أنظمة التجارة الإلكترونية أو أنظمة الرعاية الصحية.","d":"Applications that rely on data to function, such as e-commerce or healthcare systems."},{"t":"Multi-layer applications","ar":"التطبيقات متعددة الطبقات","ard":"تطبيقات مقسّمة إلى طبقات مثل واجهة المستخدم ومنطق الأعمال والوصول إلى البيانات لتحقيق التنظيم والفصل بين الأجزاء.","d":"Applications divided into layers like UI, business logic, and data access for modularity."},{"t":"Business logic layer (BLL)","ar":"طبقة منطق الأعمال","ard":"الطبقة التي تطبّق قواعد العمل وتعالج البيانات قبل عرضها.","d":"The layer that enforces business rules and processes data before presentation."},{"t":"Data-access layer (DAL)","ar":"طبقة الوصول إلى البيانات","ard":"الطبقة المسؤولة عن استرجاع البيانات وإدارتها من مصادر مثل قواعد البيانات.","d":"The layer responsible for retrieving and managing data from sources like databases."},{"t":"User interface layer (UI)","ar":"طبقة واجهة المستخدم","ard":"الطبقة التي يتفاعل معها المستخدم، فتعرض البيانات وتستقبل المدخلات.","d":"The layer that interacts with users, displaying data and capturing input."},{"t":"JDBC (Java Database Connectivity)","ar":"اتصال قاعدة بيانات جافا","ard":"واجهة برمجة تطبيقات في جافا للاتصال بقواعد البيانات العلائقية وتنفيذ الاستعلامات عليها.","d":"A Java API for connecting and executing queries on relational databases."},{"t":"ADO.NET (Active Data Objects)","ar":"كائنات البيانات النشطة","ard":"مكتبة من مايكروسوفت للوصول إلى مصادر البيانات مثل SQL Server في تطبيقات .NET.","d":"A Microsoft library for accessing data sources like SQL Server in .NET applications."},{"t":"LINQ (Language Integrated Query)","ar":"الاستعلام المتكامل للغة","ard":"ميزة في .NET تتيح الاستعلام عن البيانات مباشرة داخل شيفرة C# أو VB.NET.","d":"A .NET feature for querying data directly in C# or VB.NET code."},{"t":"Data integrity","ar":"سلامة البيانات","ard":"ضمان دقة البيانات واتساقها وموثوقيتها طوال دورة حياتها.","d":"Ensuring data is accurate, consistent, and reliable throughout its lifecycle."},{"t":"Disconnected data","ar":"البيانات غير المتصلة","ard":"بيانات تُسترجع من المصدر وتُستخدم دون اتصال، ثم تُزامَن مع المصدر لاحقًا.","d":"Data retrieved from a source and used offline, then synced back later."},{"t":"DataSet","ar":"مجموعة البيانات","ard":"تمثيل للبيانات العلائقية في الذاكرة يضم جداول وعلاقات.","d":"An in-memory representation of relational data with tables and relationships."},{"t":"DataTable","ar":"جدول البيانات","ard":"جدول واحد من البيانات في الذاكرة، يكون جزءًا من DataSet أو مستقلًا بذاته.","d":"A single table of in-memory data, part of a DataSet or standalone."},{"t":"Service Data Objects (SDO)","ar":"كائنات بيانات الخدمة","ard":"إطار عمل يوفّر وصولًا موحّدًا إلى البيانات من مصادر متنوعة في الأنظمة الموزعة.","d":"A framework for uniform data access across diverse sources in distributed systems."},{"t":"Relational databases","ar":"قواعد البيانات العلائقية","ard":"قواعد بيانات مثل MySQL أو Oracle تخزن البيانات في جداول منظمة تربطها علاقات.","d":"Databases like MySQL or Oracle that store data in structured tables with relationships."},{"t":"NoSQL databases","ar":"قواعد بيانات NoSQL","ard":"قواعد بيانات مصممة لتخزين البيانات بمرونة ودون مخطط ثابت (مثل MongoDB).","d":"Databases designed for flexible, schema-less data storage (e.g., MongoDB)."},{"t":"XML databases","ar":"قواعد بيانات XML","ard":"قواعد بيانات تخزن البيانات وتستعلم عنها بصيغة XML.","d":"Databases that store and query data in XML format."},{"t":"Flat-file databases","ar":"قواعد البيانات الملفية","ard":"قواعد بيانات بسيطة مخزنة في ملفات (مثل CSV) دون علاقات معقدة.","d":"Simple databases stored in files (e.g., CSV) without complex relationships."},{"t":"ODBC (Open Database Connection)","ar":"اتصال قاعدة البيانات المفتوحة","ard":"واجهة برمجة تطبيقات قياسية للوصول إلى أنظمة إدارة قواعد البيانات.","d":"A standard API for accessing database management systems (DBMS)."}],"28":[{"t":"Disruption","ar":"انقطاع / اضطراب","ard":"انقطاع أو اضطراب غير متوقع في عملية أو خدمة.","d":"An unexpected interruption or disturbance to a process or service."},{"t":"Integration","ar":"تكامل","ard":"عملية دمج أنظمة أو مكونات مختلفة لتعمل كنظام واحد.","d":"The process of combining different systems or components to function as one."},{"t":"Infrastructure","ar":"البنية التحتية","ard":"الهياكل والمرافق المادية والتنظيمية الأساسية اللازمة للتشغيل.","d":"The basic physical and organizational structures and facilities needed for operation."},{"t":"Implement","ar":"تنفيذ","ard":"وضع خطة أو قرار أو نظام موضع التنفيذ.","d":"To put a plan, decisi g considerable importance or effect."},{"t":"Likelihood","ar":"احتمال","ard":"فرصة حدوث شيء ما.","d":"The chance that something will happen."},{"t":"Probability","ar":"احتمالية","ard":"مقياس لاحتمال وقوع حدث ما.","d":"A measure of the likelihood that an event will occur."},{"t":"Follow-up","ar":"متابعة","ard":"إجراء لاحق يُتخذ بعد حدث أو نشاط.","d":"Subsequent action taken after an event or activity."},{"t":"Change management","ar":"إدارة التغيير","ard":"عملية التعامل مع التغييرات بطريقة منظمة ومنهجية.","d":"The process of handling changes in a structured and systematic way."},{"t":"Backout plan","ar":"خطة تراجع","ard":"خطة لإعادة النظام إلى حالته السابقة إذا فشل التغيير.","d":"A plan to revert a system to its previous state if a change fails."},{"t":"Assignee","ar":"المكلّف","ard":"الشخص المكلّف بإنجاز مهمة أو مسؤولية.","d":"A person assigned to complete a task or responsibility."},{"t":"Quality assurance","ar":"ضمان الجودة","ard":"عمليات تضمن أن المنتجات تستوفي معايير الجودة المحددة.","d":"Processes to ensure products meet defined quality standards."},{"t":"Help-desk","ar":"مكتب المساعدة","ard":"خدمة تقدم المعلومات والدعم للمستخدمين.","d":"A service providing information and support to users."},{"t":"Version control","ar":"التحكم في الإصدارات","ard":"نظام يسجل التغييرات على الملفات بمرور الوقت.","d":"A system that records changes to files over time."},{"t":"Audit trails","ar":"سجلات التدقيق","ard":"سجلات توضح تسلسل الأنشطة أو التغييرات في النظام.","d":"Records that show the sequence of activities or changes in a system."},{"t":"Implementing","ar":"تنفيذ","ard":"عملية تنفيذ خطة أو تغيير.","d":"The act of carrying out a plan or change."},{"t":"Procedure","ar":"إجراء","ard":"سلسلة من الإجراءات تُنفَّذ بترتيب معين.","d":"A series of actions conducted in a certain order."},{"t":"Requirements","ar":"متطلبات","ard":"الاحتياجات أو الشروط التي يجب أن يستوفيها المنتج أو العملية.","d":"The needs or conditions that a product or process must satisfy."}],"A01":[{"t":"Java Programming","ar":"برمجة جافا","ard":"لغة برمجة عالية المستوى كائنية التوجه، تُستخدم على نطاق واسع في تطوير التطبيقات.","d":"A high-level, object-oriented programming language widely used for application development."},{"t":"Editor","ar":"محرر","ard":"أداة برمجية تُستخدم لكتابة الشيفرة وتحريرها، مثل Notepad++ أو Eclipse أو IntelliJ.","d":"A software tool used to write and edit code, such as Notepad++, Eclipse, or IntelliJ."},{"t":"Compiler","ar":"المُصرّف","ard":"برنامج يترجم شيفرة جافا عالية المستوى إلى شيفرة بايتية (Bytecode) قابلة للتنفيذ.","d":"A program that translates high-level Java code into bytecode for execution."},{"t":"Interpreter","ar":"المُفسّر","ard":"ينفّذ شيفرة جافا البايتية سطرًا بسطر باستخدام آلة جافا الافتراضية (JVM).","d":"Executes Java bytecode line by line using the Java Virtual Machine (JVM)."},{"t":"Bytecode","ar":"الشيفرة البايتية","ard":"شيفرة وسيطة يُنتجها مترجم جافا وتنفّذها آلة جافا الافتراضية.","d":"Intermediate code generated by the Java compiler, executed by the JVM."},{"t":"Java Virtual Machine (JVM)","ar":"الآلة الافتراضية لجافا","ard":"محرك افتراضي ينفّذ شيفرة جافا البايتية، ويضمن عمل البرنامج على مختلف المنصات.","d":"A virtual engine that executes Java bytecode, ensuring cross-platform compatibility."},{"t":"Class","ar":"الصنف","ard":"مخطط أو قالب في جافا يُستخدم لإنشاء الكائنات وتحديد بنية البيانات والسلوك.","d":"A blueprint in Java used to create objects and define data structures and behavior."},{"t":"Object-Oriented Programming (OOP)","ar":"البرمجة كائنية التوجه","ard":"نموذج برمجي ينظّم البرمجيات باستخدام الفئات والكائنات والوراثة والتغليف وتعدد الأشكال.","d":"A paradigm that structures software using classes, objects, inheritance, encapsulation, and polymorphism."},{"t":"Class Library","ar":"مكتبة الصفوف","ard":"مجموعة من الفئات والدوال المكتوبة مسبقًا تُستخدم لتطوير تطبيقات جافا بكفاءة.","d":"A collection of pre-written classes and methods used to develop Java applications efficiently."},{"t":"Applet","ar":"تطبيق صغير","ard":"ب
